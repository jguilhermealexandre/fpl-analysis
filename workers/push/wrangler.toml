name = "easyfpl-push"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Hourly. The two things this sends — a deadline nudge and news on a player you
# are starting — are both things where being an hour late is fine and being
# five minutes early is worth nothing.
[triggers]
crons = ["7 * * * *"]

# One namespace, one record per browser install, keyed by a hash of the push
# endpoint. Create it with:
#   npx wrangler kv namespace create PUSH_SUBS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT are secrets, not vars.
# See README.md — never commit them.
