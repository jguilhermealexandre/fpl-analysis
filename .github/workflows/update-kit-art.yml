name: Check Outfield Kits

# What FPL's own shirt art says each club plays in, next to the table the site
# draws from. It reports; it does not write.
#
# It was meant to write. Reading twenty kits off the game's sprites and
# retiring a hand-written table is the obvious move, and tools/fetch-kit-art.mjs
# does the reading — but twelve of twenty agreed and of the eight that did not,
# the sprite was right about one. A two-colour model of a shaded, sponsored,
# hem-faded drawing of a shirt is not the shirt.
#
# So this is the watchdog instead: monthly, and on demand, it prints both
# readings side by side and marks the disagreements. It is the only thing here
# that will ever notice a club changing kit. Adopting a row is a decision
# someone makes by looking at the log.
on:
  schedule:
    - cron: '41 5 2 * *'
  workflow_dispatch:
    inputs:
      map:
        description: 'Also print the sprites themselves'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-kit-art:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install image tooling
        run: npm install --no-save sharp@^0.35.4

      - name: Read the outfield kits
        run: node tools/fetch-kit-art.mjs --debug ${{ inputs.map && '--map' || '' }}
