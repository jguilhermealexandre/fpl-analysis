name: Rebuild minified assets

# `npm run build`, run here and committed back.
#
# The .min files are committed artifacts on purpose — Cloudflare Pages serves
# this repo with no build step, so the bytes the browser gets are the bytes in
# git. tools/minify.mjs regenerates them and CI's check:min fails if any is
# stale, which is the right shape: nothing ships that was not built from the
# source beside it.
#
# The gap this fills is a contributor who cannot run the build. It needs esbuild
# and lightningcss — both native — so a machine without a working Node toolchain
# can edit a stylesheet or a script and have no way to produce the .min twin,
# which means a red CI and, worse, a deploy where the HTML moved and the
# JavaScript did not. Dispatch this against the branch instead.
#
# Deliberately manual. Running it automatically on push would race check:min and
# make "the artifacts match their source" a thing CI repairs rather than a thing
# CI enforces.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to rebuild and commit to'
        type: string
        required: true
        default: 'main'

permissions:
  contents: write

concurrency:
  group: rebuild-min-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The real dependencies, not --no-save: esbuild and lightningcss both ship
      # platform binaries and a partial install produces a partial build.
      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      # Proves the thing it just wrote is what the checker will ask for, so a
      # green run here means a green check:min on the next push rather than a
      # second round trip.
      - name: Verify the build is now current
        run: node tools/minify.mjs --check

      - name: Commit if anything changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          if git diff --quiet -- styles scripts; then
            echo "Minified assets were already current — nothing to commit."
            exit 0
          fi
          git add styles scripts
          git commit -m "Rebuild minified assets

          Generated by tools/minify.mjs. The sources changed and their .min
          twins had not been regenerated; this is that regeneration and nothing
          else."
          git push origin HEAD:${{ github.event.inputs.ref }}
