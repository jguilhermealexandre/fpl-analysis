name: Update FPL Player Data

on:
  schedule:
    # Run every 4 hours — 03:00 UTC catches price changes (~2:30 AM UK),
    # 15:00 UTC catches Thu/Fri press conferences
    - cron: '0 3,7,11,15,19,23 * * *'
  workflow_dispatch: # Allow manual trigger

# Writes data/ and articles/ back to main, and nothing else. Scoping the token
# limits what a compromised action or dependency could reach.
permissions:
  contents: write

# Shared with refresh-live-data.yml: both write data/ on main, so they queue
# behind one another rather than racing. Queued, not cancelled — a run that has
# already spent minutes fetching 610 players is worth letting finish.
concurrency:
  group: fpl-data-write
  cancel-in-progress: false

jobs:
  update-player-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and process player data
        run: |
          # Create data directory if it doesn't exist
          mkdir -p data
          
          # Fetched to temp files and validated before replacing anything.
          # `curl -s URL > file` exits 0 on an HTTP error and writes the error page
          # into the file, so an FPL outage would commit an HTML document over good
          # data and break JSON.parse across the whole site.
          echo "Fetching bootstrap data..."
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            "https://fantasy.premierleague.com/api/bootstrap-static/" -o /tmp/bootstrap.json
          echo "Fetching fixtures data..."
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 60 \
            "https://fantasy.premierleague.com/api/fixtures/" -o /tmp/fixtures.json

          node -e '
            const fs = require("fs");
            const read = (p, name) => {
              try { return JSON.parse(fs.readFileSync(p, "utf8")); }
              catch (e) {
                console.error(`::error::${name} is not valid JSON — refusing to overwrite good data`);
                process.exit(1);
              }
            };
            const boot = read("/tmp/bootstrap.json", "bootstrap-static");
            const fx = read("/tmp/fixtures.json", "fixtures");
            if (!Array.isArray(boot.elements) || boot.elements.length < 100) {
              console.error("::error::bootstrap-static has no usable player list"); process.exit(1);
            }
            if (!Array.isArray(fx) || fx.length < 100) {
              console.error("::error::fixtures list looks truncated"); process.exit(1);
            }
          '

          cp /tmp/bootstrap.json data/bootstrap-static.json
          cp /tmp/fixtures.json data/fixtures.json
          
          # Extract player IDs
          echo "Processing player data..."
          node << 'EOF'
          const fs = require('fs');
          
          // Read bootstrap data
          const bootstrap = JSON.parse(fs.readFileSync('data/bootstrap-static.json', 'utf8'));
          
          // EVERY player, not just those who have already featured.
          //
          // This used to filter on `minutes > 0`. One gameweek into a season that
          // excluded 300 of 610 players — half the game — and not the irrelevant
          // half: Watkins (GBP8.0m, 9.5% owned), Gyokeres (7.9%) and Dubravka
          // (19.1%) were all missing simply because they did not feature in GW1.
          // 190 of the 300 were fully fit.
          //
          // It also defeated the point of the lastSeason prior below, which exists
          // precisely to say something useful about a player who has no
          // current-season record yet — the exact players the filter removed.
          const activePlayers = bootstrap.elements;
          console.log(`Fetching detail for all ${activePlayers.length} players`);

          // The feed as last committed, so a player whose detail fetch fails
          // keeps the history we already had rather than being published with an
          // empty one. Losing freshness for one player is a nuisance; losing his
          // record breaks every per-gameweek view on the site until the next run.
          const previous = new Map();
          try {
            const old = JSON.parse(fs.readFileSync('data/players-data.json', 'utf8'));
            (old.players || []).forEach(p => previous.set(p.id, p));
            console.log(`Previous feed: ${previous.size} players available for carry-forward`);
          } catch (error) {
            console.log('No usable previous feed — nothing to carry forward');
          }
          
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          // 610 sequential calls from a shared runner IP is exactly the traffic
          // shape FPL rate-limits, and the previous version treated any non-2xx
          // as permanent for that player: one attempt, no backoff, no
          // User-Agent. On 2026-09-04 every single request failed and the run
          // still produced a committable file. Retry what is worth retrying, and
          // leave 404 alone — a player who does not exist will not start
          // existing on the third ask.
          const UA = 'easyfpl-data-bot (+https://easyfpl.com)';
          async function fetchPlayerDetails(playerId) {
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(
                  `https://fantasy.premierleague.com/api/element-summary/${playerId}/`,
                  { headers: { 'User-Agent': UA, 'Accept': 'application/json' } }
                );
                if (response.ok) return await response.json();
                if (response.status === 404) return null;
                console.log(`Player ${playerId}: HTTP ${response.status} (attempt ${attempt}/3)`);
              } catch (error) {
                console.log(`Player ${playerId}: ${error.message} (attempt ${attempt}/3)`);
              }
              if (attempt < 3) await sleep(attempt * 2000);
            }
            return null;
          }
          
          // The fields every player gets, with or without a successful detail fetch.
          function baseEntry(player) {
            return {
              id: player.id,
              name: player.web_name,
              fullName: player.first_name + ' ' + player.second_name,
              position: player.element_type,
              team: player.team,
              price: player.now_cost,
              form: player.form,
              ownership: player.selected_by_percent,
              totalPoints: player.total_points,
              minutes: player.minutes,
              // Bootstrap fields above are always fresh. The history and the
              // last-season prior come from the previous feed, because this
              // entry exists precisely because the detail fetch failed.
              lastSeason: previous.get(player.id)?.lastSeason ?? null,
              history: previous.get(player.id)?.history ?? [],
              historyStale: true
            };
          }

          async function processAllPlayers() {
            const playerData = [];
            let processed = 0;
            let failed = 0;
            
            for (const player of activePlayers) {
              // Nothing is coming back at all. Ten more minutes of the same will
              // not change that, and running the loop to completion is what let
              // an empty feed reach the commit step in the first place.
              if (processed === 0 && failed >= 40) {
                console.error('::error::First 40 detail fetches all failed — abandoning rather than publishing an empty feed');
                break;
              }
              try {
                // Add delay to avoid rate limiting (20 players per batch)
                if (processed > 0 && processed % 20 === 0) {
                  await new Promise(resolve => setTimeout(resolve, 1000));
                  console.log(`Processed ${processed}/${activePlayers.length} players...`);
                }
                
                const details = await fetchPlayerDetails(player.id);
                if (details) {
                  playerData.push({
                    id: player.id,   // keep in sync with baseEntry() below
                    name: player.web_name,
                    fullName: player.first_name + ' ' + player.second_name,
                    position: player.element_type,
                    team: player.team,
                    price: player.now_cost,
                    form: player.form,
                    ownership: player.selected_by_percent,
                    totalPoints: player.total_points,
                    minutes: player.minutes,
                    // Last completed season, kept compact. element-summary was
                    // already being fetched for every player and this field thrown
                    // away — without it the site has no idea who a player is until
                    // the new season has built its own sample, and one bad opening
                    // Saturday reads as a collapse.
                    lastSeason: (() => {
                      const past = details.history_past || [];
                      const prev = past[past.length - 1];
                      if (!prev) return null;
                      return {
                        season: prev.season_name,
                        totalPoints: prev.total_points,
                        minutes: prev.minutes,
                        starts: prev.starts,
                        goals: prev.goals_scored,
                        assists: prev.assists,
                        cleanSheets: prev.clean_sheets,
                        bonus: prev.bonus,
                        saves: prev.saves,
                        yellowCards: prev.yellow_cards,
                        xG: prev.expected_goals,
                        xA: prev.expected_assists,
                        defCon: prev.defensive_contribution
                      };
                    })(),
                    // details.fixtures is deliberately NOT stored. It is a team's
                    // upcoming fixture list repeated once per player: 10.5 KB each,
                    // 3.2 MB of the 5.4 MB file, and nothing reads it — every
                    // consumer of this feed uses .history (and .team/.id). The
                    // pages build fixtures from data/fixtures.json instead.
                    history: details.history || []
                  });
                  processed++;
                } else {
                  // Detail fetch failed. Emit the player anyway from bootstrap, with
                  // an empty history — a transient API hiccup must not silently drop
                  // a player out of the feed entirely, which is how IDs go missing
                  // without anyone noticing.
                  playerData.push(baseEntry(player));
                  failed++;
                }
              } catch (error) {
                console.error(`Error processing player ${player.id}:`, error.message);
                playerData.push(baseEntry(player));
                failed++;
              }
            }
            
            console.log(`\nComplete: ${processed} players processed, ${failed} failed`);
            console.log(`Coverage: ${playerData.length}/${activePlayers.length} player IDs in the feed`);
            if (playerData.length !== activePlayers.length) {
              // Flagged loudly, but NOT fatal. A non-zero exit here failed the step
              // and skipped every step after it — article build, timestamp and the
              // commit — so one missing player threw away an otherwise complete
              // refresh, including the fresh bootstrap and fixtures above.
              console.error(`::warning::COVERAGE SHORTFALL: ${activePlayers.length - playerData.length} players missing from the feed`);
            }
            
            /* Refuse to publish a feed whose histories collapsed.

               The coverage check above counts player IDs, and it passed on
               2026-09-04 while the run was at its worst: every detail fetch
               failed, every player fell through to baseEntry(), and 652 of 652
               IDs were present with zero histories between them. ID coverage was
               never the thing that made the file usable.

               Deliberately not a non-zero exit. That skips every step after this
               one — article build, timestamp, commit — and throws away the
               bootstrap and fixtures fetched above, which are fine and which the
               whole site reads. Leave the previous feed in place, keep the rest
               of the refresh, and fail the job at the end so the run is red
               rather than quietly wrong. */
            const MIN_DETAIL_COVERAGE = 0.8;
            const floor = Math.floor(activePlayers.length * MIN_DETAIL_COVERAGE);
            if (processed < floor) {
              console.error(`::error::DETAIL FETCH COLLAPSED: ${processed}/${activePlayers.length} succeeded, need ${floor}. Keeping the previous players-data.json.`);
              fs.writeFileSync('/tmp/player-data-rejected', `${processed}/${activePlayers.length}`);
              return;
            }

            // Save combined data
            const output = {
              metadata: {
                lastUpdated: new Date().toISOString(),
                playerCount: processed,
                gameweek: bootstrap.events.find(e => e.is_current)?.id || null
              },
              teams: bootstrap.teams,
              elementTypes: bootstrap.element_types,
              players: playerData
            };
            
            fs.writeFileSync('data/players-data.json', JSON.stringify(output, null, 2));
            console.log(`Saved ${processed} players to data/players-data.json`);
            console.log(`File size: ${(fs.statSync('data/players-data.json').size / 1024 / 1024).toFixed(2)} MB`);
          }
          
          // Was `.catch(console.error)`, which printed the failure and exited 0:
          // the step went green and the commit step ran regardless.
          processAllPlayers().catch(error => {
            console.error(`::error::Player data run threw: ${error.message}`);
            fs.writeFileSync('/tmp/player-data-rejected', 'threw');
          });
          EOF

      - name: Build article archive
        # Runs the same generators the browser uses, writing each article once,
        # keyed by the gameweek it describes. Existing files are never rewritten,
        # so a gameweek's debrief stays as it was published.
        run: node scripts/build-articles.js

      - name: Write last-updated timestamp
        run: |
          echo "{\"lastUpdated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/last-updated.json

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          # A plain `git push` silently threw away entire refreshes: this job runs
          # for several minutes, and anyone pushing to main inside that window
          # rejected the push, failed the step and left the data untouched. These
          # are regenerated whole files, so re-apply them on top of wherever main
          # has moved to and retry. No merge, so no conflict is possible.
          mkdir -p /tmp/out
          cp -R data /tmp/out/
          cp -R articles /tmp/out/ 2>/dev/null || true
          cp sitemap.xml robots.txt /tmp/out/ 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -R /tmp/out/data .
            cp -R /tmp/out/articles . 2>/dev/null || true
            cp /tmp/out/sitemap.xml /tmp/out/robots.txt . 2>/dev/null || true
            git add data/players-data.json data/bootstrap-static.json data/fixtures.json data/last-updated.json
            git add data/articles articles sitemap.xml robots.txt
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Update FPL data - $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — main moved, re-applying."
            sleep 5
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Fail if the player feed was rejected
        # Last, so the bootstrap, fixtures and articles from this run are already
        # committed. The job still goes red: a refresh that could not rebuild
        # players-data.json is not a success, and the only reason the last one
        # went unnoticed for hours is that it reported itself as one.
        if: always()
        run: |
          if [ -f /tmp/player-data-rejected ]; then
            echo "::error::players-data.json was NOT updated this run — detail coverage $(cat /tmp/player-data-rejected). The previous feed is still in place."
            exit 1
          fi
          echo "Player feed updated normally."
