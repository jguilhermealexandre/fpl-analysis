name: Update FPL Teams Data

on:
  schedule:
    # Run at 3 AM UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-teams-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch FPL data
        run: |
          # Create data directory if it doesn't exist
          mkdir -p data
          
          # Fetch bootstrap-static (teams, gameweeks, player data, strength ratings)
          echo "Fetching bootstrap-static data..."
          curl -sf "https://fantasy.premierleague.com/api/bootstrap-static/" > data/bootstrap-static.json
          
          # Fetch fixtures (includes full stats array: goals, assists, cards, saves, bonus, bps)
          echo "Fetching fixtures data..."
          curl -sf "https://fantasy.premierleague.com/api/fixtures/" > data/fixtures.json
          
          # Validate and log
          echo "Validating data..."
          node << 'EOF'
          const fs = require('fs');
          
          const bootstrap = JSON.parse(fs.readFileSync('data/bootstrap-static.json', 'utf8'));
          const fixtures = JSON.parse(fs.readFileSync('data/fixtures.json', 'utf8'));
          
          const currentGW = bootstrap.events.find(e => e.is_current)?.id || 
                           bootstrap.events.find(e => e.is_next)?.id || 1;
          
          const finishedWithStats = fixtures.filter(f => f.finished && f.stats && f.stats.length > 0).length;
          const finishedTotal = fixtures.filter(f => f.finished).length;
          
          // Check that stats array contains expected identifiers
          const sampleFixture = fixtures.find(f => f.finished && f.stats && f.stats.length > 0);
          const statIds = sampleFixture ? sampleFixture.stats.map(s => s.identifier) : [];
          
          console.log(`✅ Data fetched successfully!`);
          console.log(`   Current GW: ${currentGW}`);
          console.log(`   Teams: ${bootstrap.teams.length}`);
          console.log(`   Total fixtures: ${fixtures.length}`);
          console.log(`   Finished fixtures: ${finishedTotal}`);
          console.log(`   Fixtures with stats: ${finishedWithStats}`);
          console.log(`   Stats available: ${statIds.join(', ')}`);
          console.log(`   bootstrap-static.json: ${(fs.statSync('data/bootstrap-static.json').size / 1024).toFixed(1)} KB`);
          console.log(`   fixtures.json: ${(fs.statSync('data/fixtures.json').size / 1024).toFixed(1)} KB`);
          
          if (bootstrap.teams.length !== 20) {
            console.error('❌ Expected 20 teams, got ' + bootstrap.teams.length);
            process.exit(1);
          }
          if (fixtures.length < 100) {
            console.error('❌ Suspiciously few fixtures: ' + fixtures.length);
            process.exit(1);
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/bootstrap-static.json data/fixtures.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update FPL data - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
