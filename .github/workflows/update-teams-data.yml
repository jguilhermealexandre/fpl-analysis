name: Update FPL Teams Data

on:
  schedule:
    # Run at 3 AM UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-teams-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch FPL teams and fixtures data
        run: |
          # Create data directory if it doesn't exist
          mkdir -p data
          
          # Fetch bootstrap-static (teams, gameweeks, etc.)
          echo "Fetching bootstrap data..."
          curl -s "https://fantasy.premierleague.com/api/bootstrap-static/" > data/bootstrap-raw.json
          
          # Fetch fixtures
          echo "Fetching fixtures data..."
          curl -s "https://fantasy.premierleague.com/api/fixtures/" > data/fixtures-raw.json
          
          # Process and combine the data
          echo "Processing data..."
          node << 'EOF'
          const fs = require('fs');
          
          const bootstrap = JSON.parse(fs.readFileSync('data/bootstrap-raw.json', 'utf8'));
          const fixtures = JSON.parse(fs.readFileSync('data/fixtures-raw.json', 'utf8'));
          
          // Find current gameweek
          const currentGW = bootstrap.events.find(e => e.is_current)?.id || 
                           bootstrap.events.find(e => e.is_next)?.id || 1;
          
          const output = {
            metadata: {
              lastUpdated: new Date().toISOString(),
              currentGameweek: currentGW,
              totalGameweeks: bootstrap.events.length
            },
            teams: bootstrap.teams,
            events: bootstrap.events,
            fixtures: fixtures
          };
          
          fs.writeFileSync('data/teams-data.json', JSON.stringify(output, null, 2));
          
          console.log(`Data saved successfully!`);
          console.log(`- Current GW: ${currentGW}`);
          console.log(`- Teams: ${bootstrap.teams.length}`);
          console.log(`- Fixtures: ${fixtures.length}`);
          console.log(`- File size: ${(fs.statSync('data/teams-data.json').size / 1024).toFixed(1)} KB`);
          EOF
          
          # Clean up raw files
          rm data/bootstrap-raw.json data/fixtures-raw.json

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/teams-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update teams data - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
