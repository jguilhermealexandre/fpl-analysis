name: Fetch Premier League News

# premierleague.com sends no CORS headers, so the site cannot read it from the
# browser. Every attempt to work around that from the page — a feed URL through
# api.rss2json.com — has depended on two things nobody can check from a browser:
# whether that URL still serves RSS, and whether a third-party proxy maps the
# fields through. This fetches it here instead, where there is no CORS and the
# failure lands in a run log with a reason attached.
#
# tools/fetch-pl-news.mjs tries several endpoints and takes the first that
# answers with articles, so one of them going away is a fallthrough rather than
# an outage.

on:
  schedule:
    # Four times a day. Club news is not a live feed and the page also carries
    # BBC, Sky and the Guardian; this is the Premier League's own copy, which
    # moves at the pace of press releases.
    - cron: '20 6,11,16,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [fetch, inspect, probe, matrix, headers, hsweep, browser]
        default: fetch

# Writes data/ back to main, and nothing else.
permissions:
  contents: write

# Shares a lane with the other data writers so two runs cannot race the branch.
concurrency:
  group: fpl-data-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect the news page
        if: inputs.mode == 'inspect'
        run: node tools/fetch-pl-news.mjs --inspect

      # Reads the app's own bundle for the endpoint it calls, so the fetcher is
      # written against what the site actually does rather than against a guess.
      - name: Probe the app bundle for its API
        if: inputs.mode == 'probe'
        run: node tools/fetch-pl-news.mjs --probe

      # The SDP endpoints answer 400, not 404: the path is right and the query
      # is not. This fires every plausible spelling and prints each error body,
      # which is where the API says which parameter it wanted.
      - name: Try every spelling of the content query
        if: inputs.mode == 'matrix'
        run: node tools/fetch-pl-news.mjs --matrix

      # Every path answers "No configuration found for request", including the
      # bare one — the gateway is refusing to route, which is a header and
      # account-slug question rather than a query one. This resolves both out
      # of the bundle's own minified names.
      - name: Read the gateway headers out of the bundle
        if: inputs.mode == 'headers'
        run: node tools/fetch-pl-news.mjs --headers

      # The two headers alone did not open it, so sweep how they can be
      # spelled — version with and without its v, four application names,
      # both gateway hosts, and the request stripped back to nothing.
      - name: Sweep the header combinations
        if: inputs.mode == 'hsweep'
        run: node tools/fetch-pl-news.mjs --hsweep

      # Every inference from the bundle has been tried and the content path
      # still has "no configuration" at the gateway. So watch a real browser
      # load the page and write down the request it actually makes — there is
      # nothing left to deduce after that.
      # The rendered page is the source now, so the browser is part of the
      # normal run and not only of the diagnostics.
      - name: Install a browser
        if: inputs.mode != 'inspect' && inputs.mode != 'probe' && inputs.mode != 'matrix' && inputs.mode != 'headers' && inputs.mode != 'hsweep'
        # --with-deps shells out to apt and exited 100 on the runner. The
        # hosted image already carries Chromium's shared libraries, so install
        # the browser alone.
        run: npm i --no-save playwright@1 && npx playwright install chromium

      - name: Record what the news page requests
        if: inputs.mode == 'browser'
        run: node tools/pl-news-browser.mjs --dump

      - name: Fetch Premier League news
        if: inputs.mode == '' || inputs.mode == 'fetch'
        run: node tools/fetch-pl-news.mjs --out data/pl-news.json

      # BBC, Sky and the Guardian, fetched here for the same reason: the
      # rss2json proxy the page uses drops the Guardian's <media:content>, so
      # every Guardian card has been rendering a placeholder instead of the
      # picture the article actually has.
      - name: Fetch the other news feeds
        if: inputs.mode == '' || inputs.mode == 'fetch'
        continue-on-error: true
        run: node tools/fetch-news-feeds.mjs --out data/news-feeds.json

      # A valid-JSON-but-empty result would replace a good list with nothing, so
      # the shape is checked before it is allowed anywhere near a commit.
      - name: Check what was written
        if: inputs.mode == '' || inputs.mode == 'fetch'
        run: |
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("data/pl-news.json", "utf8")); }
            catch (e) { console.error("::error::pl-news.json is not valid JSON"); process.exit(1); }
            if (!Array.isArray(d.items) || d.items.length < 3) {
              console.error(`::error::only ${d.items ? d.items.length : 0} article(s) — refusing to publish that`);
              process.exit(1);
            }
            const bad = d.items.filter(i => !i.title || !/^https:\/\//.test(i.link || ""));
            if (bad.length) {
              console.error(`::error::${bad.length} article(s) have no title or no https link`);
              process.exit(1);
            }
            // Their own articles only. The page also carries a rail of stories
            // syndicated from club sites, and those must never be published
            // under a Premier League badge — so a link off their domain is a
            // failed run, not a card.
            const offsite = d.items.filter(i => !/^https:\/\/(www\.)?premierleague\.com\//.test(i.link));
            if (offsite.length) {
              console.error(`::error::${offsite.length} article(s) are not on premierleague.com — e.g. ${offsite[0].link}`);
              process.exit(1);
            }
            const withPics = d.items.filter(i => i.image).length;
            console.log(`${d.items.length} articles from ${d.source}, ${withPics} with a picture`);
          '

      - name: Commit
        if: inputs.mode == '' || inputs.mode == 'fetch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/pl-news.json data/news-feeds.json; then
            echo "no change"
            exit 0
          fi
          git add data/pl-news.json data/news-feeds.json
          git commit -m "Update Premier League news - $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The data lane is shared, so another writer may have pushed since
          # checkout. Rebase onto it rather than failing the run.
          git pull --rebase --autostash origin main
          git push
