<!DOCTYPE html>
<html lang="en" class="v2-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model accuracy | EasyFPL Admin</title>
    <meta name="description" content="How the projections have held up.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css?v=325">
    <link rel="stylesheet" href="styles/v2-design.css?v=325">
    <link rel="stylesheet" href="styles/responsive.css?v=325">
    <style>
        /* ===== Chart palette =====

           Categorical slots 1-3 of the documented data-viz palette, unchanged.
           Written as roles rather than raw hex so the two themes swap in one
           place and the chart code never names a colour.

           Validated rather than eyeballed: all-pairs CVD separation 9.2 light /
           9.4 dark, normal-vision 24.0 light / 20.9 dark, both clear of the
           floors. One finding carried through: aqua on the light surface is
           2.82:1, below the 3:1 contrast line, which obliges relief — so every
           figure here ships a table view, and that is also what makes the whole
           page readable without colour. */
        .v2-theme {
            --viz-1: #2a78d6;   /* blue   — the model */
            --viz-2: #eb6834;   /* orange — FPL's own ep_next */
            --viz-3: #1baf7a;   /* aqua   — season average */
            --viz-grid: rgba(16, 15, 15, 0.08);
            --viz-ref: rgba(16, 15, 15, 0.30);
        }
        .v2-theme[data-theme="dark"] {
            --viz-1: #3987e5;
            --viz-2: #d95926;
            --viz-3: #199e70;
            --viz-grid: rgba(242, 242, 240, 0.10);
            --viz-ref: rgba(242, 242, 240, 0.32);
        }

        /* The page gutter.

           .v2-main-content supplies the sidebar offset and the background and
           nothing else — every other page gets its horizontal padding from its
           own content wrapper (see .news-page-header in v2-design.css). Without
           one, this page sat flush against the rail with its first letters
           under it. Same tokens the rest of the site uses, so it narrows with
           them on a small screen. */
        .ma-page {
            max-width: 1440px;
            margin: 0 auto;
            padding: var(--v2-page-title-top, 32px) var(--v2-page-gutter, 32px) 56px;
        }

        .ma-head { margin-bottom: 20px; }
        .ma-crumb { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 8px; display: block; text-decoration: none; }
        .ma-crumb:hover { color: var(--text-secondary); }
        .ma-title { font-family: var(--font-display, inherit); font-size: 26px; font-weight: 700;
            letter-spacing: -0.6px; color: var(--text-primary); margin: 0 0 6px; }
        .ma-sub { font-size: 13.5px; color: var(--text-secondary); margin: 0; max-width: 66ch; line-height: 1.6; }

        .ma-banner { margin: 16px 0 22px; padding: 14px 16px; border-radius: var(--radius-lg);
            background: var(--surface-2); border-left: 3px solid var(--viz-2);
            font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
        .ma-banner strong { color: var(--text-primary); }

        .ma-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-bottom: 26px; }
        .ma-tile { padding: 14px 16px; border-radius: var(--radius-lg); background: var(--surface-1);
            border: 1px solid var(--border-default); box-shadow: var(--shadow-sm); }
        .ma-tile-v { font-family: var(--font-mono); font-size: 24px; font-weight: 700; line-height: 1.1;
            color: var(--text-primary); }
        .ma-tile-l { margin-top: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
            text-transform: uppercase; color: var(--text-muted); }
        .ma-tile-n { margin-top: 5px; font-size: 11px; color: var(--text-secondary); line-height: 1.45; }

        .ma-section-h { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-muted); margin: 30px 0 12px; }

        .ma-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
        .ma-fig { padding: 16px 18px 12px; border-radius: var(--radius-xl); background: var(--surface-1);
            border: 1px solid var(--border-default); box-shadow: var(--shadow-sm); min-width: 0; }
        .ma-fig-t { font-size: 14.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
        .ma-fig-c { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
        .ma-canvas { position: relative; height: 240px; }
        .ma-empty { display: flex; align-items: center; justify-content: center; height: 240px;
            border-radius: var(--radius-md); background: var(--surface-2);
            font-size: 12.5px; color: var(--text-muted); text-align: center; padding: 0 18px; line-height: 1.5; }

        /* The relief the contrast check asks for, and the accessible fallback
           the method asks for, in one control. */
        .ma-table-t { margin-top: 10px; font-size: 11px; color: var(--text-muted); cursor: pointer;
            user-select: none; }
        .ma-table-t:hover { color: var(--text-secondary); }
        .ma-table-w { overflow-x: auto; margin-top: 8px; }
        .ma-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
        .ma-table th, .ma-table td { text-align: right; padding: 5px 8px; white-space: nowrap;
            border-bottom: 1px solid var(--viz-grid); }
        .ma-table th:first-child, .ma-table td:first-child { text-align: left; }
        .ma-table th { font-weight: 600; color: var(--text-muted); }
        .ma-table td { font-family: var(--font-mono); color: var(--text-secondary); }
        .ma-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px;
            vertical-align: baseline; }
    </style>
</head>
<body>
    <!-- V2 sidebar is fetch-injected here by loadSidebarNav() (scripts/sidebar-nav.js) -->
    <div class="v2-main-content v2-no-tabs">
        <div class="ma-page">
        <header class="ma-head">
            <a class="ma-crumb" href="admin.html">← Admin</a>
            <h1 class="ma-title">Model accuracy</h1>
            <p class="ma-sub">What this site predicted before each deadline, against what happened. Predictions
                are read from the sealed archive; results come from FPL. Nothing on this page is computed
                from hindsight.</p>
        </header>

        <div id="maBanner" class="ma-banner" hidden></div>
        <div id="maTiles" class="ma-tiles"></div>

        <div class="ma-section-h">Expected points</div>
        <div class="ma-figs">
            <figure class="ma-fig" style="margin:0">
                <figcaption>
                    <div class="ma-fig-t">Average error by gameweek</div>
                    <div class="ma-fig-c">Mean absolute error for players the model expected to start, against
                        the two baselines it has to beat. Lower is better.</div>
                </figcaption>
                <div class="ma-canvas"><canvas id="maErrChart"></canvas></div>
                <div id="maErrEmpty" class="ma-empty" hidden></div>
                <details><summary class="ma-table-t">Show the numbers</summary>
                    <div class="ma-table-w" id="maErrTable"></div></details>
            </figure>

            <figure class="ma-fig" style="margin:0">
                <figcaption>
                    <div class="ma-fig-t">Calibration</div>
                    <div class="ma-fig-c">What was predicted against what was scored, in ten buckets. The dashed
                        line is perfect agreement; below it means the model runs hot.</div>
                </figcaption>
                <div class="ma-canvas"><canvas id="maCalChart"></canvas></div>
                <div id="maCalEmpty" class="ma-empty" hidden></div>
                <details><summary class="ma-table-t">Show the numbers</summary>
                    <div class="ma-table-w" id="maCalTable"></div></details>
            </figure>

            <figure class="ma-fig" style="margin:0">
                <figcaption>
                    <div class="ma-fig-t">Bias by position</div>
                    <div class="ma-fig-c">Predicted minus scored, averaged. Right of zero is over-prediction.
                        This is the number a correction layer would read.</div>
                </figcaption>
                <div class="ma-canvas"><canvas id="maBiasChart"></canvas></div>
                <div id="maBiasEmpty" class="ma-empty" hidden></div>
                <details><summary class="ma-table-t">Show the numbers</summary>
                    <div class="ma-table-w" id="maBiasTable"></div></details>
            </figure>
        </div>

        <div class="ma-section-h">Goals conceded, against the market</div>
        <div class="ma-figs">
            <figure class="ma-fig" style="margin:0">
                <figcaption>
                    <div class="ma-fig-t">Our expected goals against, vs the bookmakers'</div>
                    <div class="ma-fig-c">One point per team per priced fixture. The dashed line is agreement;
                        above it the market expects more goals than we do.</div>
                </figcaption>
                <div class="ma-canvas"><canvas id="maOddsChart"></canvas></div>
                <div id="maOddsEmpty" class="ma-empty" hidden></div>
                <details><summary class="ma-table-t">Show the numbers</summary>
                    <div class="ma-table-w" id="maOddsTable"></div></details>
            </figure>

            <figure class="ma-fig" style="margin:0">
                <figcaption>
                    <div class="ma-fig-t">Venue bias by round</div>
                    <div class="ma-fig-c">Market estimate divided by ours. Above 1 means we are too optimistic
                        about that side keeping goals out.</div>
                </figcaption>
                <div class="ma-canvas"><canvas id="maVenueChart"></canvas></div>
                <div id="maVenueEmpty" class="ma-empty" hidden></div>
                <details><summary class="ma-table-t">Show the numbers</summary>
                    <div class="ma-table-w" id="maVenueTable"></div></details>
            </figure>
        </div>
        </div>
    </div><!-- /.v2-main-content -->

    <script src="scripts/error-monitor.js?v=325"></script>
    <script src="scripts/auth.js?v=325"></script>
    <script src="scripts/common.js?v=325"></script>
    <script src="scripts/sidebar-nav.js?v=325"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        /* The quality dashboard.
         *
         * Two files feed it. data/model-accuracy.json is the graded archive and
         * is empty until the first sealed round has been played and checked —
         * which is the honest state, not a broken page, so every figure has an
         * empty frame that says which gameweek it is waiting for.
         * data/odds-calibration.json has been accumulating since GW3 and is the
         * one model on this site with an external reference to be measured
         * against, so that half of the page is alive today.
         *
         * Colours are read from CSS custom properties rather than written here,
         * so the two themes are defined once in the stylesheet above and the
         * charts redraw from the same source when the theme switch is thrown. */
        /* The sidebar is injected rather than markup, so it has to be asked
           for. It also puts .v2-shell-app on <html>, which is what gives the
           main column its offset — without the call the page draws over the
           rail instead of beside it. */
        loadSidebarNav();
        initIcons();

        const MA = { charts: [], data: { acc: null, odds: null } };

        const maCssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        const maEsc = (s) => (typeof escHTML === 'function' ? escHTML(s) : String(s == null ? '' : s));
        const maFmt = (v, dp) => (v == null || !isFinite(v) ? '—' : Number(v).toFixed(dp == null ? 2 : dp));

        /* An empty figure states what it is waiting for. A blank canvas and a
           blank table are indistinguishable from a page that failed to load,
           and this page will spend its first month in exactly this state. */
        function maEmptyFigure(canvasId, emptyId, message) {
            const c = document.getElementById(canvasId);
            if (c && c.parentElement) c.parentElement.style.display = 'none';
            const e = document.getElementById(emptyId);
            if (e) { e.textContent = message; e.hidden = false; }
        }

        function maRenderTable(id, head, rows) {
            const el = document.getElementById(id);
            if (!el) return;
            if (!rows.length) { el.innerHTML = ''; return; }
            el.innerHTML = '<table class="ma-table"><thead><tr>'
                + head.map(h => `<th>${maEsc(h)}</th>`).join('')
                + '</tr></thead><tbody>'
                + rows.map(r => '<tr>' + r.map(c => `<td>${maEsc(c)}</td>`).join('') + '</tr>').join('')
                + '</tbody></table>';
        }

        /* Shared chart furniture: recessive grid and axes, a crosshair-style
           shared tooltip on anything with an x of its own, and no second y
           axis anywhere on this page. Two measures of different scale get two
           figures instead, which is why error and bias are not one chart. */
        function maBaseOptions(extra) {
            const ink = maCssVar('--text-secondary') || '#666';
            const grid = maCssVar('--viz-grid') || 'rgba(0,0,0,0.08)';
            const opts = {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        display: true, position: 'bottom',
                        labels: { boxWidth: 9, boxHeight: 9, usePointStyle: true, pointStyle: 'rectRounded',
                            color: ink, font: { size: 11 }, padding: 14 }
                    },
                    tooltip: { padding: 9, cornerRadius: 6, boxPadding: 4,
                        titleFont: { size: 11.5 }, bodyFont: { size: 11.5 } }
                },
                scales: {
                    x: { grid: { color: grid, drawTicks: false }, border: { display: false },
                        ticks: { color: ink, font: { size: 10.5 } } },
                    y: { grid: { color: grid, drawTicks: false }, border: { display: false },
                        ticks: { color: ink, font: { size: 10.5 } } }
                }
            };
            return Object.assign(opts, extra || {});
        }

        function maLine(label, data, colour, dashed) {
            return {
                label, data,
                borderColor: colour,
                backgroundColor: colour,
                borderWidth: 2,
                borderDash: dashed ? [5, 4] : undefined,
                pointRadius: dashed ? 0 : 4,
                pointHoverRadius: dashed ? 0 : 6,
                pointBorderWidth: 0,
                tension: 0.25,
                fill: false
            };
        }

        // ---- expected points

        function maDrawError(acc) {
            const rounds = (acc && acc.rounds) || [];
            const usable = rounds.filter(r => r.populations && r.populations.starters);
            if (!usable.length) {
                maEmptyFigure('maErrChart', 'maErrEmpty',
                    'No round has been graded yet. The first sealed gameweek is graded once FPL marks it data-checked.');
                maRenderTable('maErrTable', [], []);
                return;
            }
            const labels = usable.map(r => 'GW' + r.gw);
            const model = usable.map(r => r.populations.starters.mae);
            const ep = usable.map(r => r.populations.starters.baselines.ep.mae);
            const ppg = usable.map(r => r.populations.starters.baselines.ppg.mae);

            MA.charts.push(new Chart(document.getElementById('maErrChart'), {
                type: 'maLine',
                data: {
                    labels,
                    datasets: [
                        maLine('EasyFPL', model, maCssVar('--viz-1')),
                        maLine('FPL ep_next', ep, maCssVar('--viz-2')),
                        maLine('Season average', ppg, maCssVar('--viz-3'))
                    ]
                },
                options: maBaseOptions()
            }));

            maRenderTable('maErrTable',
                ['Gameweek', 'Players', 'EasyFPL MAE', 'FPL ep_next', 'Season average'],
                usable.map((r, i) => ['GW' + r.gw, r.counts.starters, maFmt(model[i]), maFmt(ep[i]), maFmt(ppg[i])]));
        }

        function maDrawCalibration(acc) {
            const buckets = (acc && acc.overall && acc.overall.calibration) || [];
            if (!buckets.length) {
                maEmptyFigure('maCalChart', 'maCalEmpty',
                    'Calibration needs a graded round. It is the shape a correction layer would read, so it is worth waiting for.');
                maRenderTable('maCalTable', [], []);
                return;
            }
            const pts = buckets.map(b => ({ x: b.meanPredicted, y: b.meanActual }));
            const lo = Math.min(...pts.map(p => Math.min(p.x, p.y)));
            const hi = Math.max(...pts.map(p => Math.max(p.x, p.y)));

            MA.charts.push(new Chart(document.getElementById('maCalChart'), {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'Perfect agreement', data: [{ x: lo, y: lo }, { x: hi, y: hi }],
                            type: 'maLine', borderColor: maCssVar('--viz-ref'), borderWidth: 2,
                            borderDash: [5, 4], pointRadius: 0, fill: false },
                        { label: 'Observed', data: pts, backgroundColor: maCssVar('--viz-1'),
                            borderColor: maCssVar('--viz-1'), pointRadius: 5, pointHoverRadius: 7,
                            showLine: true, borderWidth: 2, tension: 0 }
                    ]
                },
                options: maBaseOptions({
                    interaction: { mode: 'nearest', intersect: true },
                    scales: {
                        x: { title: { display: true, text: 'predicted', color: maCssVar('--text-muted'), font: { size: 10.5 } },
                            grid: { color: maCssVar('--viz-grid'), drawTicks: false }, border: { display: false },
                            ticks: { color: maCssVar('--text-secondary'), font: { size: 10.5 } } },
                        y: { title: { display: true, text: 'scored', color: maCssVar('--text-muted'), font: { size: 10.5 } },
                            grid: { color: maCssVar('--viz-grid'), drawTicks: false }, border: { display: false },
                            ticks: { color: maCssVar('--text-secondary'), font: { size: 10.5 } } }
                    }
                })
            }));

            maRenderTable('maCalTable', ['Predicted band', 'Players', 'Mean predicted', 'Mean scored'],
                buckets.map(b => [`${maFmt(b.from, 1)}–${maFmt(b.to, 1)}`, b.n, maFmt(b.meanPredicted), maFmt(b.meanActual)]));
        }

        function maDrawBias(acc) {
            const byPos = (acc && acc.overall && acc.overall.byPosition) || {};
            const names = Object.keys(byPos);
            if (!names.length) {
                maEmptyFigure('maBiasChart', 'maBiasEmpty', 'Bias needs a graded round.');
                maRenderTable('maBiasTable', [], []);
                return;
            }
            const values = names.map(n => byPos[n].bias);
            /* Diverging, so two hues and nothing in the middle: over-prediction
               warm, under-prediction cool. Not the status palette — running hot
               on forwards is a fact about the model, not an alarm. */
            const colours = values.map(v => (v >= 0 ? maCssVar('--viz-2') : maCssVar('--viz-1')));

            MA.charts.push(new Chart(document.getElementById('maBiasChart'), {
                type: 'bar',
                data: { labels: names, datasets: [{ label: 'Predicted minus scored', data: values,
                    backgroundColor: colours, borderWidth: 0, borderRadius: 4, borderSkipped: false }] },
                options: maBaseOptions({
                    indexAxis: 'y',
                    plugins: { legend: { display: false },
                        tooltip: { padding: 9, cornerRadius: 6,
                            callbacks: { label: (c) => `${c.parsed.x >= 0 ? 'over' : 'under'} by ${maFmt(Math.abs(c.parsed.x))}` } } }
                })
            }));

            maRenderTable('maBiasTable', ['Position', 'Players', 'Bias', 'MAE', 'RMSE'],
                names.map(n => [n, byPos[n].n, maFmt(byPos[n].bias), maFmt(byPos[n].mae), maFmt(byPos[n].rmse)]));
        }

        // ---- goals against, vs the market

        function maDrawOdds(odds) {
            const rounds = (odds && odds.rounds) || [];
            const samples = rounds.reduce((all, r) => all.concat(r.samples || []), []);
            if (!samples.length) {
                maEmptyFigure('maOddsChart', 'maOddsEmpty', 'No priced rounds recorded yet.');
                maRenderTable('maOddsTable', [], []);
                return;
            }
            const home = samples.filter(s => s.isHome).map(s => ({ x: s.modelXga, y: s.marketXga }));
            const away = samples.filter(s => !s.isHome).map(s => ({ x: s.modelXga, y: s.marketXga }));
            const all = samples.map(s => Math.max(s.modelXga, s.marketXga));
            const hi = Math.max.apply(null, all);

            MA.charts.push(new Chart(document.getElementById('maOddsChart'), {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'Agreement', data: [{ x: 0, y: 0 }, { x: hi, y: hi }], type: 'maLine',
                            borderColor: maCssVar('--viz-ref'), borderWidth: 2, borderDash: [5, 4],
                            pointRadius: 0, fill: false },
                        { label: 'Home side', data: home, backgroundColor: maCssVar('--viz-1'),
                            pointRadius: 4, pointHoverRadius: 6, borderWidth: 0 },
                        { label: 'Away side', data: away, backgroundColor: maCssVar('--viz-2'),
                            pointRadius: 4, pointHoverRadius: 6, borderWidth: 0 }
                    ]
                },
                options: maBaseOptions({
                    interaction: { mode: 'nearest', intersect: true },
                    plugins: {
                        legend: { display: true, position: 'bottom',
                            labels: { boxWidth: 9, boxHeight: 9, usePointStyle: true, pointStyle: 'rectRounded',
                                color: maCssVar('--text-secondary'), font: { size: 11 }, padding: 14 } },
                        tooltip: { padding: 9, cornerRadius: 6,
                            callbacks: { label: (c) => `ours ${maFmt(c.parsed.x)} · market ${maFmt(c.parsed.y)}` } }
                    },
                    scales: {
                        x: { title: { display: true, text: 'our xGA', color: maCssVar('--text-muted'), font: { size: 10.5 } },
                            grid: { color: maCssVar('--viz-grid'), drawTicks: false }, border: { display: false },
                            ticks: { color: maCssVar('--text-secondary'), font: { size: 10.5 } } },
                        y: { title: { display: true, text: 'market xGA', color: maCssVar('--text-muted'), font: { size: 10.5 } },
                            grid: { color: maCssVar('--viz-grid'), drawTicks: false }, border: { display: false },
                            ticks: { color: maCssVar('--text-secondary'), font: { size: 10.5 } } }
                    }
                })
            }));

            maRenderTable('maOddsTable', ['Round', 'Samples', 'Mean ours', 'Mean market'],
                rounds.map(r => {
                    const s = r.samples || [];
                    const mean = (k) => s.reduce((a, x) => a + x[k], 0) / (s.length || 1);
                    return ['GW' + r.event, s.length, maFmt(mean('modelXga')), maFmt(mean('marketXga'))];
                }));
        }

        function maDrawVenue(odds) {
            const rounds = (odds && odds.rounds) || [];
            if (!rounds.length) {
                maEmptyFigure('maVenueChart', 'maVenueEmpty', 'No priced rounds recorded yet.');
                maRenderTable('maVenueTable', [], []);
                return;
            }
            const ratio = (list) => {
                const use = list.filter(s => s.modelXga > 0 && s.marketXga > 0);
                if (!use.length) return null;
                return use.reduce((a, s) => a + (s.marketXga / s.modelXga), 0) / use.length;
            };
            const labels = rounds.map(r => 'GW' + r.event);
            const homes = rounds.map(r => ratio((r.samples || []).filter(s => s.isHome)));
            const aways = rounds.map(r => ratio((r.samples || []).filter(s => !s.isHome)));

            MA.charts.push(new Chart(document.getElementById('maVenueChart'), {
                type: 'maLine',
                data: {
                    labels,
                    datasets: [
                        maLine('Home side', homes, maCssVar('--viz-1')),
                        maLine('Away side', aways, maCssVar('--viz-2')),
                        maLine('Agreement', labels.map(() => 1), maCssVar('--viz-ref'), true)
                    ]
                },
                options: maBaseOptions()
            }));

            maRenderTable('maVenueTable', ['Round', 'Home ratio', 'Away ratio'],
                rounds.map((r, i) => ['GW' + r.event, maFmt(homes[i]), maFmt(aways[i])]));
        }

        // ---- headline

        function maTile(value, label, note) {
            return `<div class="ma-maTile"><div class="ma-maTile-v">${maEsc(value)}</div>`
                + `<div class="ma-maTile-l">${maEsc(label)}</div>`
                + (note ? `<div class="ma-maTile-n">${maEsc(note)}</div>` : '') + '</div>';
        }

        function maDrawHeadline(acc, odds) {
            const graded = (acc && acc.metadata && acc.metadata.gameweeksGraded) || [];
            const s = acc && acc.overall && acc.overall.populations && acc.overall.populations.starters;
            const banner = document.getElementById('maBanner');

            if (!graded.length) {
                banner.innerHTML = '<strong>Nothing graded yet.</strong> The archive seals a prediction before '
                    + 'every deadline; the first one is marked once FPL finishes checking that gameweek. '
                    + 'Until then the expected-points figures below are empty on purpose — there is nothing '
                    + 'honest to put in them. The goals-against comparison does not depend on results and is live now.';
                banner.hidden = false;
            } else if (graded.length < 5) {
                banner.innerHTML = `<strong>${graded.length} gameweek${graded.length === 1 ? '' : 's'} graded.</strong> `
                    + 'That is a small sample. Read the direction, not the decimal — these figures start meaning '
                    + 'something around five or six rounds.';
                banner.hidden = false;
            }

            const tiles = [];
            if (s) {
                tiles.push(maTile(maFmt(s.mae), 'MAE, starters', `${s.n.toLocaleString()} player-fixtures`));
                tiles.push(maTile(maFmt(s.rmse), 'RMSE, starters', 'a perfect model is near 2.8'));
                tiles.push(maTile((s.bias >= 0 ? '+' : '') + maFmt(s.bias), 'Bias',
                    s.bias >= 0 ? 'we predict more than happens' : 'we predict less than happens'));
                tiles.push(maTile(maFmt(s.spearman), 'Rank correlation', 'ordering, not level'));
                const beat = s.baselines && s.baselines.ep && s.baselines.ep.modelBeatsBy;
                tiles.push(maTile(beat == null ? '—' : (beat * 100).toFixed(0) + '%', 'Better than FPL',
                    'RMSE against FPL’s own ep_next'));
            } else {
                tiles.push(maTile(String(graded.length), 'Gameweeks graded', 'expected-points model'));
            }
            const om = odds && odds.metadata && odds.metadata.overall;
            if (om) {
                tiles.push(maTile(maFmt(om.meanRatio), 'Market ÷ ours',
                    `${om.samples} priced samples over ${odds.metadata.rounds} rounds`));
                tiles.push(maTile(maFmt(om.venueEffectVsMarket), 'Venue effect',
                    '1.0 would match the market’s home/away split'));
            }
            document.getElementById('maTiles').innerHTML = tiles.join('');
        }

        // ---- boot

        function maDrawAll() {
            MA.charts.forEach(c => { try { c.destroy(); } catch (e) { /* already gone */ } });
            MA.charts = [];
            maDrawHeadline(MA.data.acc, MA.data.odds);
            maDrawError(MA.data.acc);
            maDrawCalibration(MA.data.acc);
            maDrawBias(MA.data.acc);
            maDrawOdds(MA.data.odds);
            maDrawVenue(MA.data.odds);
            if (typeof initIcons === 'function') initIcons();
        }

        (async function () {
            const get = async (url) => {
                try {
                    const r = await fetch(url);
                    return r.ok ? await r.json() : null;
                } catch (e) { return null; }
            };
            const [acc, odds] = await Promise.all([
                get('data/model-accuracy.json'),
                get('data/odds-calibration.json')
            ]);
            MA.data.acc = acc;
            MA.data.odds = odds;
            maDrawAll();

            /* The theme switch rewrites data-theme on <html>, and every colour
               above was read from a custom property at draw time. Redraw rather
               than leave a dark page wearing light-mode axes. */
            new MutationObserver(maDrawAll).observe(document.documentElement,
                { attributes: true, attributeFilter: ['data-theme'] });
        })();
    </script>
</body>
</html>
