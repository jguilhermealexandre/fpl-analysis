<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Join the Season Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/season-vault.css">
</head>
<body>
    <div class="sv-hero">
        <div class="sv-hero-icon"><i data-lucide="list-ordered" style="width:24px;height:24px;"></i></div>
        <h1>Join the Season Vault</h1>
        <p>Predict the final Premier League table — rank all 20 teams from 1st to last. Type or paste your list below, one team per line. Once submitted, it's locked in and scored automatically all season.</p>
    </div>

    <div class="sv-container">
        <div id="ps-skeleton"></div>

        <div class="sv-section" id="ps-form-section">
            <div class="sv-section-title"><i data-lucide="edit-3" class="icon" style="width:18px;height:18px;"></i> Your prediction</div>
            <div class="sv-section-sub">One team per line, 1st place at the top, 20th at the bottom</div>

            <div class="input-group" style="margin-bottom:16px;">
                <label for="ps-name">Your name</label>
                <input type="text" id="ps-name" class="input" placeholder="e.g. Ghost" maxlength="40">
            </div>

            <div class="ps-columns">
                <div class="input-group">
                    <label for="ps-textarea">Ranked teams</label>
                    <textarea id="ps-textarea" class="input ps-textarea" rows="20" placeholder="Arsenal
Man City
Liverpool
Chelsea
...
Sunderland"></textarea>
                </div>
                <div class="input-group">
                    <label>Preview</label>
                    <div id="ps-preview" class="ps-preview-box"></div>
                </div>
            </div>

            <div id="ps-error" style="color:var(--color-error);font-size:12px;margin-top:8px;"></div>

            <button id="ps-submit" class="btn btn-primary" style="margin-top:16px;" disabled>Save my predictions</button>
        </div>
    </div>

    <script src="scripts/common.js"></script>
    <script src="scripts/team-matching.js"></script>
    <script src="scripts/supabase-config.js"></script>
    <script src="scripts/predictions-submit.js"></script>
</body>
</html>
