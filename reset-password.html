<!DOCTYPE html>
<html lang="en" class="v2-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password | EasyFPL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="description" content="Reset your EasyFPL password.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://easyfpl.com/reset-password">
    <!-- The site's typefaces, from our own origin rather than Google's.
         Two cross-origin connections used to stand in front of the first
         glyph: one to fonts.googleapis.com for a stylesheet that names files
         on fonts.gstatic.com, then one to that. Both are gone — see the note
         at the top of tools/fetch-fonts.mjs — and with them every
         third-party request a signed-out visitor made.

         Still off the critical path via media="print", and still
         font-display: swap inside, so text paints in the fallback face and
         reflows once. Preloading the two faces above the fold instead of
         waiting for the stylesheet to name them: same-origin now, so a
         preload here costs nothing and starts them with the CSS. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin-ca11fe9ca5.woff2" crossorigin>
    <link rel="stylesheet" href="/styles/fonts.min.css?v=356">
    <link rel="stylesheet" href="/styles/common.min.css?v=356">
    <link rel="stylesheet" href="/styles/v2-design.min.css?v=356">
    <link rel="stylesheet" href="/styles/auth.min.css?v=356">
</head>
<body>
<div class="au-page">
    <main class="au-card">
        <a class="au-brand" href="/"><span class="au-brand-mark">e</span> EasyFPL</a>

        <div class="au-error" id="auError" role="alert" aria-live="polite"></div>

        <!-- One: ask for the link. -->
        <div id="auAsk">
            <h1 class="au-title">Reset your password</h1>
            <p class="au-sub">Tell us your email and we will send a link to set a new one.</p>
            <form id="auAskForm" novalidate>
                <div class="au-field">
                    <label class="au-label" for="auEmail">Email</label>
                    <input class="au-input" id="auEmail" name="email" type="email"
                           autocomplete="email" required autofocus placeholder="you@example.com">
                </div>
                <button class="au-submit" id="auAskSubmit" type="submit">Send the link</button>
            </form>
            <div class="au-alt"><a href="/login.html" id="auToLogin">Back to sign in</a></div>
        </div>

        <!-- Two: the link was clicked, so there is a session and a new password
             can be set. Chosen by the fragment, not by a query parameter. -->
        <div id="auSet" hidden>
            <h1 class="au-title">Choose a new password</h1>
            <p class="au-sub">This link works once. Pick something you will remember.</p>
            <form id="auSetForm" novalidate>
                <div class="au-field">
                    <label class="au-label" for="auPassword">New password</label>
                    <input class="au-input" id="auPassword" name="password" type="password"
                           autocomplete="new-password" required minlength="12"
                           placeholder="At least 12 characters">
                    <div class="au-hint">Twelve characters or more.</div>
                </div>
                <div class="au-field">
                    <label class="au-label" for="auConfirm">Confirm new password</label>
                    <input class="au-input" id="auConfirm" name="confirm" type="password"
                           autocomplete="new-password" required placeholder="Type it again">
                </div>
                <button class="au-submit" id="auSetSubmit" type="submit">Save the new password</button>
            </form>
        </div>

        <!-- Three: done, either way. -->
        <div class="au-done" id="auDone" hidden>
            <div class="au-done-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            </div>
            <h1 class="au-title" id="auDoneTitle"></h1>
            <p class="au-sub" id="auDoneText"></p>
            <div class="au-alt"><a href="/login.html">Go to sign in</a></div>
        </div>
    </main>
</div>

<script src="/scripts/auth.min.js?v=356"></script>
<script>
    function auNextParam() {
        try {
            const raw = new URLSearchParams(location.search).get('next');
            if (!raw) return '';
            const url = new URL(raw, location.origin);
            if (url.origin !== location.origin) return '';
            if (!url.pathname.startsWith('/')) return '';
            return url.pathname + url.search + url.hash;
        } catch (e) { return ''; }
    }
    (function carryNext() {
        const next = auNextParam();
        if (!next) return;
        const link = document.getElementById('auToLogin');
        if (link) link.href = '/login.html?next=' + encodeURIComponent(next);
    })();

    const auErrorEl = document.getElementById('auError');
    function auShowError(m) { auErrorEl.textContent = m; auErrorEl.classList.add('is-on'); }
    function auHideError() { auErrorEl.classList.remove('is-on'); auErrorEl.textContent = ''; }

    function auFinish(title, text) {
        document.getElementById('auAsk').hidden = true;
        document.getElementById('auSet').hidden = true;
        document.getElementById('auDoneTitle').textContent = title;
        document.getElementById('auDoneText').textContent = text;
        document.getElementById('auDone').hidden = false;
    }

    /* Which of the two pages this is.
     *
     * The recovery link comes back with the session in the fragment, which never
     * leaves the browser. Read it, keep it, and strip the address bar at once —
     * a recovery session left in history or in a pasted link is somebody else's
     * way into the account. */
    const auHasLink = (function sessionFromLink() {
        if (!location.hash) return false;
        const p = new URLSearchParams(location.hash.slice(1));

        /* An expired or already-used link comes back as an error in the
           fragment, not as a session. Without this the page would quietly show
           the "ask for a link" form again and leave the reader wondering what
           happened to the one they just clicked. */
        if (p.get('error')) {
            history.replaceState(null, '', location.pathname + location.search);
            auShowError(p.get('error_code') === 'otp_expired'
                ? 'That link has expired or has already been used. Ask for a new one below.'
                : 'That link did not work. Ask for a new one below.');
            return false;
        }

        if (!p.get('access_token')) return false;
        const session = auSessionFrom({
            access_token: p.get('access_token'),
            refresh_token: p.get('refresh_token'),
            expires_in: Number(p.get('expires_in')) || 3600
        }, Date.now());
        history.replaceState(null, '', location.pathname + location.search);
        if (!session) return false;
        auSaveSession(session);
        return true;
    })();

    if (auHasLink) {
        document.getElementById('auAsk').hidden = true;
        document.getElementById('auSet').hidden = false;
        document.getElementById('auPassword').focus();
    }

    // ---- one: ask for the link
    document.getElementById('auAskForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        auHideError();
        const email = document.getElementById('auEmail').value.trim();
        if (!email) { auShowError('Enter your email address.'); return; }

        const btn = document.getElementById('auAskSubmit');
        btn.disabled = true;
        btn.textContent = 'Sending…';
        try { await auResetPassword(email); } catch (e) { /* see below */ }

        /* The same answer whether or not that address has an account, and
           deliberately so: this form would otherwise be a way to test a list of
           addresses against the site. auResetPassword does not report the
           difference either — Supabase does not tell it. */
        auFinish('Check your email',
            'If ' + email + ' has an account, a link to set a new password is on its way. '
            + 'It works once and expires shortly.');
    });

    // ---- two: set the new password
    document.getElementById('auSetForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        auHideError();
        const password = document.getElementById('auPassword').value;
        const confirm = document.getElementById('auConfirm').value;
        const confirmEl = document.getElementById('auConfirm');
        confirmEl.classList.remove('is-wrong');

        if (password.length < 12) { auShowError('Your password needs at least 12 characters.'); return; }
        if (password !== confirm) {
            auShowError('Those two passwords are not the same.');
            confirmEl.classList.add('is-wrong');
            confirmEl.focus();
            return;
        }

        const btn = document.getElementById('auSetSubmit');
        btn.disabled = true;
        btn.textContent = 'Saving…';

        let result;
        try {
            result = await auUpdatePassword(password);
        } catch (e) {
            result = { ok: false, error: 'Could not reach the server. Try again.' };
        }

        if (!result.ok) {
            btn.disabled = false;
            btn.textContent = 'Save the new password';
            auShowError(result.error);
            return;
        }

        /* Signed out on purpose. The recovery link granted a session, and that
           session has now done the one job it existed for. Making someone sign
           in with the password they just chose also proves to them that it
           took. */
        try { await auSignOut(); } catch (e) { auClearSession(); }
        auFinish('Password changed', 'Sign in with your new password.');
    });
</script>
</body>
</html>
