        // ===== INIT =====
        async function renderNews() {
            const container = document.getElementById('newsDisplay');
            container.innerHTML = `<div class="news-container"><div class="news-loading"><div class="spinner"></div> Loading news...</div></div>`;

            /* data/injuries.json is written by .github/workflows/fetch-pl-injuries.yml,
               which renders the Premier League's club-by-club table and follows every
               "Details" link to the club's own article. Absent or unreadable, the page
               is the wire feed alone rather than an error: the rest does not depend
               on it. */
            async function fetchInjuries() {
                try {
                    const res = await fetch('/data/injuries.json?v=' + Math.floor(Date.now() / 300000));
                    if (!res.ok) return [];
                    const d = await res.json();
                    return d && Array.isArray(d.items) ? d.items : [];
                } catch (e) {
                    console.warn('No injury data:', e);
                    return [];
                }
            }

            

            

            
            try {
                const [bootData, rawExternal, injuryRows] = await Promise.all([
                    DataCache.fetchJSON(DATA_URLS.bootstrap),
                    fetchExternalNews(),
                    fetchInjuries()
                ]);

                buildTeamLookup(bootData.teams);
                const localTeams = {};
                bootData.teams.forEach(t => { localTeams[t.id] = t; });

                allPlayers = bootData.elements.map(p => ({
                    id: p.id, name: p.web_name,
                    /* The photo library is keyed by `code`, not by `id`, and the
                       crest by the team's own code — neither was carried
                       through, which is why a squad news card could only ever
                       draw a coloured rectangle. */
                    code: p.code,
                    teamCode: localTeams[p.team]?.code,
                    team: localTeams[p.team]?.short_name || 'N/A', teamId: p.team,
                    position: p.element_type, price: p.now_cost / 10,
                    form: parseFloat(p.form) || 0, points: p.total_points,
                    ownership: parseFloat(p.selected_by_percent) || 0,
                    status: p.status, news: p.news,
                    newsAdded: p.news_added || null,
                    chanceNextRound: p.chance_of_playing_next_round,
                    minutes: p.minutes,
                    costChangeEvent: p.cost_change_event || 0,
                    transfersIn: p.transfers_in_event || 0,
                    transfersOut: p.transfers_out_event || 0
                }));

                const savedTeamId = localStorage.getItem('fpl_team_id');
                if (savedTeamId && /^\d+$/.test(savedTeamId)) {
                    try {
                        const currEvent = bootData.events.find(e => e.is_current);
                        const currentGW = currEvent ? currEvent.id : 1;
                        const picksRes = await fetchWithProxy(`https://fantasy.premierleague.com/api/entry/${encodeURIComponent(savedTeamId)}/event/${currentGW}/picks/`);
                        if (picksRes.ok) {
                            const picksData = await picksRes.json();
                            /* The squad being planned, not the one that played:
                               between a round ending and the next deadline the
                               picks endpoint still names players who have been
                               sold, and knows nothing of the ones bought. This
                               page's whole job is flagging news about players
                               you own. No fixture list here, so
                               planningGameweek() falls back to the event's own
                               `finished` flag. See applyPendingTransfers(). */
                            const planningGW = planningGameweek(bootData, null);
                            let squadPicks = picksData;
                            if (planningGW > currentGW) {
                                const trRes = await fetchWithProxy(
                                    `https://fantasy.premierleague.com/api/entry/${encodeURIComponent(savedTeamId)}/transfers/`).catch(() => null);
                                const log = trRes ? await trRes.json().catch(() => null) : null;
                                const applied = applyPendingTransfers(picksData, log, planningGW);
                                if (applied) squadPicks = applied.picksData;
                            }
                            /* And the swaps confirmed in the wizard. Squad news
                               about a player you have decided to sell is not
                               squad news. */
                            (squadPicks.picks || []).forEach(pk => squadIds.add(pk.element));
                        }
                    } catch (e) {
                        console.warn('Could not load squad:', e);
                    }
                }

                const externalItems = rawExternal.map(a => ({
                    category: 'external', categoryLabel: a.source,
                    headline: a.headline, link: a.link,
                    thumbnail: a.thumbnail, source: a.source, badge: a.badge,
                    detail: a.detail || a.source || '',
                    isSquad: false, timestamp: a.timestamp, sortWeight: 5
                }));

                // Check external for squad mentions
                allPlayers.filter(p => squadIds.has(p.id)).forEach(sp => {
                    const nameLower = sp.name.toLowerCase();
                    externalItems.forEach(item => {
                        if (!item.isSquad && (item.headline || '').toLowerCase().includes(nameLower)) {
                            item.isSquad = true;
                            item.player = sp;
                            item.sortWeight = 60;
                        }
                    });
                });

                // Team matching for filtering
                const teamNameMap = {};
                Object.values(localTeams).forEach(t => {
                    teamNameMap[t.name.toLowerCase()] = t.id;
                    teamNameMap[t.short_name.toLowerCase()] = t.id;
                });
                externalItems.forEach(item => {
                    const text = ((item.headline || '') + ' ' + (item.detail || '')).toLowerCase();
                    item.matchedTeamIds = [];
                    for (const [name, tid] of Object.entries(teamNameMap)) {
                        if (text.includes(name) && !item.matchedTeamIds.includes(tid)) {
                            item.matchedTeamIds.push(tid);
                        }
                    }
                });

                /* Injury stories get a block of their own on the page rather than
                   being scattered through the wire copy. They are a different kind
                   of thing to read — twenty clubs each saying who is fit, against
                   reporting about the league — and a reader scanning for one is not
                   scanning for the other.

                   Sorted newest first on sortAt, which falls back to when this site
                   first saw the article: two thirds of club articles publish no
                   date we can read, and the card prints nothing where the club gave
                   none. Ten is the cap; the table itself carries forty-odd.

                   Ownership is the player id the scrape already resolved, not the
                   loose headline-substring rule the wire copy uses — the same id
                   the push Worker reads, so the badge here and the notification
                   there can never disagree. */
                const INJURY_CAP = 10;
                const injuryItems = injuryStories(injuryRows, localTeams);
                injuryItems.forEach(it => {
                    if (it.playerIds.some(id => squadIds.has(id))) {
                        it.isSquad = true;
                        it.sortWeight = 60;
                    }
                });

                const injuryFeed = injuryFeedFrom(injuryItems, INJURY_CAP);

                function getCTAForCategory(item) {
                    const posShort = posShortNames[item.player?.position] || '';
                    if (item.category === 'injury' && item.player) {
                        const maxPrice = Math.ceil(item.player.price + 0.5);
                        return { label: 'View Replacements', href: `fpl-players-analysis.html#all?pos=${posShort}&max=${maxPrice}` };
                    }
                    if (item.category === 'price') return { label: 'Price Trends', href: 'fpl-players-analysis.html#all?sort=price' };
                    if (item.category === 'transfer') return { label: 'Transfer Trends', href: 'fpl-players-analysis.html#all?sort=transfers' };
                    return null;
                }

                /* A squad news card, in the player's club colours.

                   His face, his club's crest, his position, and a mark for
                   what the news is — an injury, a price move, a transfer —
                   so the tile says who and what before you read a word of it.

                   Where a shirt number would go, the position. FPL publishes
                   a squad_number field and it is null for all 654 players, so
                   there is no real number to print. What was here before was
                   `p.id % 30 + 1` — a number invented from the player's
                   database id and shown as if it were his. A made-up fact is
                   worse than a missing one, and the position is both true and
                   the thing an FPL manager reads first. */
                /* The club's colour behind its crest, with the injury mark in the
                   corner — the same frame buildGraphic draws for a squad player,
                   with the badge where the face goes. 100px rather than the 50 the
                   crest row uses: here it is the whole picture, not a label. */
                function buildCrestGraphic(item) {
                    const colors = TEAM_COLORS[item.clubId] || ['#6366F1', '#FFFFFF'];
                    return `<div class="news-card-graphic is-crest" style="background:linear-gradient(135deg, ${colors[0]} 0%, ${colors[0]}dd 60%, ${colors[0]}99 100%);color:${colors[1]}">
                        <div class="news-card-graphic-bg" style="background:radial-gradient(circle at 30% 40%,${colors[1]} 0%,transparent 70%)"></div>
                        <img class="news-card-badge" alt="" loading="lazy"
                            src="https://resources.premierleague.com/premierleague/badges/100/t${item.clubCode}.png"
                            onerror="this.remove()">
                        <span class="news-card-graphic-mark">${CAT_ICONS.injury}</span>
                        ${item.source ? `<span class="news-card-graphic-club">${escHTML(item.source)}</span>` : ''}
                    </div>`;
                }

                function buildGraphic(item) {
                    const p = item.player;
                    const colors = TEAM_COLORS[p?.teamId] || ['#6366F1','#FFFFFF'];
                    const iconSVG = CAT_ICONS[item.category] || CAT_ICONS.external;
                    const pos = p ? (posShortNames[p.position] || '') : '';
                    const teamName = p ? escHTML(p.team) : '';
                    const photo = (p && p.code != null && typeof playerPhotoHTML === 'function')
                        ? playerPhotoHTML(p.code, 'news-card-face') : '';
                    const crest = (p && p.teamCode != null)
                        ? `<img class="news-card-crest" alt="" loading="lazy" src="https://resources.premierleague.com/premierleague/badges/50/t${p.teamCode}.png" onerror="this.remove()">`
                        : '';
                    return `<div class="news-card-graphic is-player" style="background:linear-gradient(135deg, ${colors[0]} 0%, ${colors[0]}dd 60%, ${colors[0]}99 100%);color:${colors[1]}">
                        <div class="news-card-graphic-bg" style="background:radial-gradient(circle at 30% 40%,${colors[1]} 0%,transparent 70%)"></div>
                        ${photo}
                        <span class="news-card-graphic-mark">${iconSVG}</span>
                        <div class="news-card-graphic-id">
                            ${crest}
                            ${pos ? `<span class="news-card-graphic-kit">${pos}</span>` : ''}
                            ${teamName ? `<span class="news-card-graphic-team">${teamName}</span>` : ''}
                        </div>
                    </div>`;
                }

                function buildImageOrGraphic(item) {
                    if (item.thumbnail && /^https?:\/\//i.test(item.thumbnail)) {
                        return `<img class="news-card-img" src="${escHTML(item.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
                             + `<div class="news-card-graphic" style="display:none;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#e2e8f0;">
                                <div class="news-card-graphic-icon">${CAT_ICONS.external}<span class="news-card-graphic-team">${escHTML(item.source || '')}</span></div>
                              </div>`;
                    }
                    if (item.player) return buildGraphic(item);
                    /* An injury story has no picture — the Premier League's table
                       carries none and the club article's own image is not ours to
                       lift. The crest is the honest illustration: it says whose
                       news this is before the headline is read, which is the job
                       the photo does on every other card. */
                    if (item.category === 'injury' && item.clubCode != null) return buildCrestGraphic(item);
                    return `<div class="news-card-graphic" style="background:linear-gradient(135deg,#1a1a2e,#16213e);color:#e2e8f0;">
                        <div class="news-card-graphic-icon">${CAT_ICONS[item.category] || CAT_ICONS.external}<span class="news-card-graphic-team">${escHTML(item.source || '')}</span></div>
                    </div>`;
                }

                function buildTeamTagCard(item) {
                    const p = item.player;
                    if (!p) return '';
                    const colors = TEAM_COLORS[p.teamId] || ['#6366F1','#FFFFFF'];
                    return `<span class="news-card-team-tag" style="background:${colors[0]}22;color:${colors[0]};border:1px solid ${colors[0]}33;">${escHTML(p.team)}</span>`;
                }

                function buildFooter(item) {
                    const p = item.player;
                    if (!p) {
                        if (item.link && /^https?:\/\//i.test(item.link)) {
                            return `<div class="news-card-footer">
                                <a class="news-card-cta" href="${escHTML(item.link)}" target="_blank" rel="noopener noreferrer">Read more <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
                            </div>`;
                        }
                        return '';
                    }
                    const stats = [];
                    stats.push(`<span class="news-card-stat">\u00A3<strong>${p.price.toFixed(1)}m</strong></span>`);
                    stats.push(`<span class="news-card-stat"><strong>${p.ownership}%</strong> owned</span>`);
                    const cta = getCTAForCategory(item);
                    if (cta) stats.push(`<a class="news-card-cta" href="${escHTML(cta.href)}">${escHTML(cta.label)} <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>`);
                    return `<div class="news-card-footer">${stats.join('')}</div>`;
                }

                /* Where the card goes when you click it — anywhere on it.
                   External items open their article; the ones this site
                   generates about your players go where the card's own
                   footer link already went, which for an injury is the list
                   of replacements at that price and position. Before this,
                   a card with no external URL had no link anywhere on it
                   except a small green phrase in its corner. */
                function cardTarget(item) {
                    if (item.link && /^https?:\/\//i.test(item.link)) {
                        return { href: item.link, external: true };
                    }
                    const cta = getCTAForCategory(item);
                    return cta ? { href: cta.href, external: false } : null;
                }

                /* The cover. A stretched ::after on the headline only reaches
                   as far as the box the headline sits in — on the lead that
                   is a strip along the bottom, which is why the top two
                   thirds of the biggest card on the page did nothing. This
                   is a real element, a direct child of the card, so it covers
                   the card whatever the card's internals are doing. */
                function cardCover(item) {
                    const t = cardTarget(item);
                    if (!t) return '';
                    return `<a class="news-card-cover" href="${escHTML(t.href)}"`
                        + (t.external ? ' target="_blank" rel="noopener noreferrer"' : '')
                        + ` aria-label="${escHTML(item.headline)}"></a>`;
                }

                function renderCard(item, isHero) {
                    const badgeCat = item.badge || item.category;
                    const badgeLabel = item.badge === 'bbc' ? 'BBC Sport' : item.badge === 'pl' ? 'Premier League' : item.badge === 'sky' ? 'Sky Sports' : item.badge === 'guardian' ? 'The Guardian' : escHTML(item.categoryLabel || item.category);
                    const safeHeadline = escHTML(item.headline);
                    const safeDetail = escHTML(item.detail || '');
                    const headlineHTML = safeHeadline;
                    const squadBadge = item.isSquad ? `<span class="news-card-squad-badge">${v2Icon('bolt')} Your Player</span>` : '';
                    const squadClass = item.isSquad ? ' is-squad' : '';
                    const cardClass = isHero ? `news-card-hero${squadClass}` : `news-card${squadClass}`;
                    const media = buildImageOrGraphic(item);
                    const teamTag = buildTeamTagCard(item);
                    const catIcon = CAT_ICONS[item.category] || '';
                    const footer = buildFooter(item);

                    return `<div class="${cardClass}">
                        ${cardCover(item)}
                        ${media}
                        <div class="news-card-content">
                            <div class="news-card-top">
                                <span class="news-card-category cat-${escHTML(badgeCat)}">${catIcon}${badgeLabel}</span>
                                ${teamTag}
                                ${squadBadge}
                                ${item.timestamp ? `<span class="news-card-time">${timeAgo(item.timestamp)}</span>` : ''}
                            </div>
                            <div class="news-card-headline">${headlineHTML}</div>
                            <div class="news-card-detail">${safeDetail}</div>
                            ${footer}
                        </div>
                    </div>`;
                }

                /* ---- the compact row ----
                   A headline, a thumbnail and a time. The lead story gets the
                   picture and the standfirst; the four under it do not need
                   either to be worth scanning, and giving them the same card
                   as everything else is what made this page one long ladder
                   of identical boxes. */
                /* ---- the desk row ----
                   The FPL desks are one-line facts: who, what happened, how
                   much. Six of them as picture cards is six club-coloured
                   rectangles with the same icon in the same corner — the page
                   looked repetitive because the cards were repeating a
                   picture that carried no information. As rows they carry the
                   same facts in a third of the height and read as a list of
                   news, which is what they are. */
                /* A headline and how long ago, and nothing else. The digest's
                   list column is deliberately the plainest thing on the page:
                   its whole job is to carry a lot of stories cheaply, which a
                   card cannot do. */
                function renderDigestRow(item) {
                    return `<a class="news-digest-row" href="${cardTarget(item)}" target="_blank" rel="noopener">
                        <span class="news-digest-when">${item.timestamp ? escHTML(timeAgo(item.timestamp)) : ''}</span>
                        <span class="news-digest-hl">${escHTML(item.headline || '')}</span>
                    </a>`;
                }

                function renderDeskRow(item) {
                    const p = item.player;
                    const face = (p && p.code != null && typeof playerPhotoHTML === 'function')
                        ? playerPhotoHTML(p.code, 'news-row-face') : '';
                    const colors = p ? (TEAM_COLORS[p.teamId] || ['#6366F1', '#FFF']) : ['#64748B', '#FFF'];
                    const crest = (p && p.teamCode != null)
                        ? `<img class="news-row-crest" alt="" loading="lazy" src="https://resources.premierleague.com/premierleague/badges/50/t${p.teamCode}.png" onerror="this.remove()">`
                        : '';
                    const meta = [
                        p ? escHTML(p.team) : '',
                        p ? (posShortNames[p.position] || '') : '',
                        item.timestamp ? timeAgo(item.timestamp) : ''
                    ].filter(Boolean).join(' \u00b7 ');
                    const stat = p ? `<span class="news-row-stat">\u00a3${p.price.toFixed(1)}m</span><span class="news-row-sub">${p.ownership}% owned</span>` : '';
                    return `<div class="news-row${item.isSquad ? ' is-squad' : ''}">
                        ${cardCover(item)}
                        <span class="news-row-mark" style="background:${colors[0]}">${face || crest}</span>
                        <div class="news-row-body">
                            <div class="news-row-head">${escHTML(item.headline)}</div>
                            <div class="news-row-meta">${meta}</div>
                        </div>
                        <div class="news-row-tail">${stat}</div>
                    </div>`;
                }

                function renderBrief(item, n) {
                    const inner = escHTML(item.headline);
                    return `<div class="news-brief${item.isSquad ? ' is-squad' : ''}">
                        ${cardCover(item)}
                        <span class="news-brief-n">${n}</span>
                        <div class="news-brief-body">
                            <div class="news-brief-head">${inner}</div>
                            <div class="news-brief-meta">${escHTML(item.source || item.categoryLabel || '')}${item.timestamp ? ` \u00b7 ${timeAgo(item.timestamp)}` : ''}</div>
                        </div>
                    </div>`;
                }

                /* ---- a section, in one of four shapes ----
                   'lead' is the front page's top: one hero with a column of
                   briefs beside it. 'grid' is the old two-column block, 'trio'
                   a tighter three-column one, and 'briefs' a plain list. The
                   variety is the point — a magazine tells you what matters by
                   how much room it gives it, and every block being the same
                   size said everything here matters equally. */
                function renderSection(title, items, opts) {
                    const o = opts || {};
                    const shape = o.shape || 'grid';
                    const head = title
                        ? `<div class="news-section-title">${title}${o.count && items.length ? `<span class="news-section-n">${items.length}</span>` : ''}</div>`
                        : '';
                    if (!items.length) {
                        return o.hideWhenEmpty ? '' :
                            `<div class="news-section">${head}<div class="news-empty">No news in this category</div></div>`;
                    }
                    const cls = `news-section${o.accent ? ' is-accent' : ''}`;

                    if (shape === 'lead') {
                        /* The front page's main block, as the references draw
                           it: the lead down the left at two-thirds, and a 2x2
                           of ordinary cards beside it. A hero across the full
                           width reads as a banner; a hero with four cards
                           against it reads as a front page, because the eye
                           gets the relative sizes in one look. */
                        const [first, ...rest] = items;
                        const beside = rest.slice(0, 4).map(it => renderCard(it, false)).join('');
                        return `<div class="${cls} news-lead">${head}
                            <div class="news-lead-grid">
                                <div class="news-lead-main">${renderCard(first, true)}</div>
                                ${beside ? `<div class="news-lead-beside">${beside}</div>` : ''}
                            </div>
                        </div>`;
                    }
                    if (shape === 'rows') {
                        return `<div class="${cls}">${head}
                            <div class="news-row-list">${items.map(renderDeskRow).join('')}</div>
                        </div>`;
                    }
                    if (shape === 'split') {
                        /* One wide story with its picture beside the words,
                           then a row of four under it. The third shape on the
                           page: the lead block is a hero against a 2x2, this
                           is a banner over a row, and the desks are lists.
                           Three rhythms rather than one grid repeated. */
                        const [first, ...rest] = items;
                        return `<div class="${cls} news-split">${head}
                            <div class="news-split-main">${renderCard(first, true)}</div>
                            ${rest.length ? `<div class="news-grid news-grid-quad">${rest.slice(0, 4).map(it => renderCard(it, false)).join('')}</div>` : ''}
                        </div>`;
                    }
                    if (shape === 'mosaic') {
                        /* The reference's front-page block: one story given
                           the height of four, a 2x2 of ordinary cards beside
                           it, and a row of four underneath.

                           It is the `lead` shape with a second tier, and the
                           point of the second tier is that the block stops
                           being a hero-plus-some and becomes a spread — the
                           eye reads big, medium, small in one pass instead of
                           big and then a grid that could be any length. */
                        const [first, ...rest] = items;
                        const beside = rest.slice(0, 4).map(it => renderCard(it, false)).join('');
                        /* Everything left, not a fixed four. The shape is the
                           lead against a 2x2 with a row of four under it; the
                           row simply wraps when there is more, which keeps the
                           shape and stops the block quietly dropping stories —
                           it was capped at nine, so the tenth injury never
                           appeared. */
                        const under = rest.slice(4).map(it => renderCard(it, false)).join('');
                        return `<div class="${cls} news-mosaic">${head}
                            <div class="news-mosaic-top">
                                <div class="news-mosaic-lead">${renderCard(first, true)}</div>
                                ${beside ? `<div class="news-mosaic-beside">${beside}</div>` : ''}
                            </div>
                            ${under ? `<div class="news-grid news-grid-quad news-mosaic-under">${under}</div>` : ''}
                        </div>`;
                    }
                    if (shape === 'digest') {
                        /* The reference's lower block, where a paper stops
                           leading and starts listing: a hero with two stacked
                           beside it, then a column of headlines-only against a
                           grid of cards.

                           The list column is the part that makes it work. A
                           page of nothing but cards gives every story the same
                           weight however far down it is; a plain dated list
                           says "these are the rest" without pretending each one
                           deserves a picture. */
                        const [first, ...rest] = items;
                        const stack = rest.slice(0, 2).map(it => renderCard(it, false)).join('');
                        const listed = rest.slice(2, 12);
                        const carded = rest.slice(12, 20).map(it => renderCard(it, false)).join('');
                        return `<div class="${cls} news-digest">${head}
                            <div class="news-digest-top">
                                <div class="news-digest-lead">${renderCard(first, true)}</div>
                                ${stack ? `<div class="news-digest-stack">${stack}</div>` : ''}
                            </div>
                            ${(listed.length || carded) ? `<div class="news-digest-bot">
                                ${listed.length ? `<div class="news-digest-list">
                                    <div class="news-digest-list-h">Latest</div>
                                    ${listed.map(it => renderDigestRow(it)).join('')}
                                </div>` : ''}
                                ${carded ? `<div class="news-grid news-digest-grid">${carded}</div>` : ''}
                            </div>` : ''}
                        </div>`;
                    }
                    if (shape === 'briefs') {
                        return `<div class="${cls}">${head}
                            <div class="news-brief-list">${items.map((it, i) => renderBrief(it, i + (o.from || 1))).join('')}</div>
                        </div>`;
                    }
                    const gridCls = shape === 'trio' ? 'news-grid news-grid-trio'
                        : shape === 'quad' ? 'news-grid news-grid-quad' : 'news-grid';
                    return `<div class="${cls}">${head}<div class="${gridCls}">${items.map(it => renderCard(it, false)).join('')}</div></div>`;
                }

                /* Starred clubs first, everything else behind them in the order
                   it already had. Applied per section rather than to the feed
                   as a whole, so a starred club leads each desk it appears in
                   instead of monopolising the top of the page. */
                function favFirst(list) {
                    return typeof favClubsSort === 'function'
                        ? favClubsSort(list, i => (i.player && i.player.teamId) || (i.matchedTeamIds || [])[0])
                        : list;
                }


                /* ---- the front page ----
                   This was one flat block: a hero, then everything else in an
                   identical two-column grid, however many dozen there were, in
                   whichever order they arrived. Nothing on it said what mattered
                   more than anything else, and the things most worth reading —
                   news about players you actually own — were behind a filter tab
                   rather than on the page.

                   It reads as a front page now. The lead story takes the room a
                   lead story takes, with the next five beside it as headlines.
                   Your own squad follows in its own tinted band, because on this
                   site that is the section the reader came for. Then the FPL
                   desks — availability, prices, transfers — each in a tighter
                   three-column block, and the rest of the league's news under
                   them. A section with nothing in it does not appear at all
                   rather than printing "no news in this category" six times. */

                /* The page is the wire feed now. It was three views behind a filter
                   bar - a front page, the reader's own squad, and this - with a
                   row of categories under it and every club crest under that.
                   The categories and the squad desk were both built out of the
                   FPL API's availability strings, which is not what this page is
                   for: it carries what was actually written about the league.
                   Injuries get their own view rather than a filter over that
                   same API text.

                   favFirst stays. Starring a club sorts its news to the front of
                   each section, which is a different thing from the club filter
                   that went with the crest row. */
                function renderAroundTheLeague() {
                    const ext = favFirst([...externalItems]);
                    /* The tail used to be one grid with your own players'
                       stories highlighted inside it, which asks the reader to
                       find them. Two sections instead: a story about a player
                       you own is a different errand from league news, and the
                       accent belongs to a heading rather than to four cards
                       scattered through forty. The stories above this still
                       run in news order — a big one about your player should
                       still lead the page, not be filed under your squad. */
                    const rest = ext.slice(16);
                    /* Squad stories are pulled from the whole feed, not just
                       the tail: a piece about a player you own is worth
                       gathering wherever it fell in news order, and the lead
                       block above already showed the biggest of them. */
                    const squadRest = ext.filter(i => i.isSquad);
                    return renderSection('', ext.slice(0, 5), { shape: 'lead', hideWhenEmpty: true })
                        + renderSection('Also in the news', ext.slice(5, 11), { shape: 'briefs', from: 6, hideWhenEmpty: true })
                        + renderSection(CAT_ICONS.external + ' In depth', ext.slice(11, 16),
                            { shape: 'split', count: true, hideWhenEmpty: true })
                        + renderSection(CAT_ICONS.injury + ' Injury news', injuryFeed,
                            { shape: 'mosaic', count: true, hideWhenEmpty: true })
                        /* Your own players get the same spread the injury desk
                           gets, and everything there is rather than four of it.
                           It was capped at a row of four while the league
                           section below ran to forty-odd, which put the stories
                           you actually own in the smallest block on the page. */
                        + renderSection(CAT_ICONS.squad + ' More from your players', squadRest,
                            { shape: 'mosaic', accent: true, count: true, hideWhenEmpty: true })
                        + renderSection(CAT_ICONS.all + ' More from around the league', rest.filter(i => !i.isSquad),
                            { shape: 'digest', count: true, hideWhenEmpty: true })
                        || '<div class="news-empty">No news right now.</div>';
                }

                /* Nothing between the masthead and the news. The page carries one
                   thing, so a bar to choose it is a control with no choice in
                   it. */
                container.innerHTML = `<div class="news-container">
                    <section class="v2-section news-panel">
                        <div id="newsContent">${renderAroundTheLeague()}</div>
                    </section>
                </div>`;

            } catch (err) {
                console.error('News init error:', err);
                container.innerHTML = renderErrorState(
                    'Failed to load news',
                    'We couldn\u2019t fetch the latest articles. Please try again later.',
                    'renderNews'
                );
                initIcons();
            }
        }

        renderNews();
    </script>
    <!-- Marketing footer: legal, methodology and contact links on every page -->
