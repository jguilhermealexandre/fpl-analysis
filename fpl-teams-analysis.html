<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | FPL Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Surfaces - GitHub inspired */
            --surface-bg: #0A0E14;
            --surface-0: #0D1117;
            --surface-1: #161B22;
            --surface-2: #1C2128;
            --surface-3: #21262D;
            --surface-4: #30363D;
            
            /* Text hierarchy */
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-muted: rgba(255, 255, 255, 0.45);
            
            /* Borders */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.10);
            --border-emphasis: rgba(255, 255, 255, 0.16);
            
            /* Semantic */
            --color-success: #4ADE80;
            --color-error: #F87171;
            --color-warning: #FBBF24;
            --color-info: #60A5FA;
            
            /* FDR Scale */
            --fdr-1: #4ADE80;
            --fdr-2: #86EFAC;
            --fdr-3: #A3A3A3;
            --fdr-4: #FB923C;
            --fdr-5: #EF4444;
            
            /* Position colors */
            --position-gk: #FCD34D;
            --position-def: #34D399;
            --position-mid: #60A5FA;
            --position-fwd: #F87171;
            
            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            
            /* Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            background: var(--surface-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ===== TOP NAVIGATION ===== */
        .top-nav {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-6);
            display: flex;
            align-items: center;
            height: 56px;
            gap: var(--space-8);
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .nav-logo span {
            color: var(--color-success);
        }

        .nav-links {
            display: flex;
            gap: var(--space-1);
        }

        .nav-link {
            padding: var(--space-2) var(--space-4);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all 150ms ease-out;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: var(--surface-2);
        }

        .nav-link.active {
            color: var(--color-success);
            background: rgba(74, 222, 128, 0.1);
        }

        .nav-link .icon {
            font-size: 16px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: var(--space-6);
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .gw-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-3);
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: var(--color-info);
            margin-left: var(--space-3);
        }

        /* ===== FILTER TABS ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border-subtle);
        }

        .filter-tabs {
            display: flex;
            gap: var(--space-1);
            background: var(--surface-1);
            padding: var(--space-1);
            border-radius: var(--radius-md);
        }

        .filter-tab {
            padding: var(--space-2) var(--space-4);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 150ms ease-out;
        }

        .filter-tab:hover {
            color: var(--text-primary);
        }

        .filter-tab.active {
            background: var(--surface-3);
            color: var(--text-primary);
        }

        .search-box {
            margin-left: auto;
            position: relative;
        }

        .search-input {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-4);
            padding-left: 36px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            width: 200px;
            transition: all 200ms ease-out;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-info);
            width: 260px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== TEAMS GRID ===== */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-4);
        }

        @media (max-width: 1200px) {
            .teams-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .teams-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .teams-grid { grid-template-columns: 1fr; }
        }

        /* ===== TEAM CARD ===== */
        .team-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            transition: all 200ms ease-out;
            cursor: pointer;
        }

        .team-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-emphasis);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        /* Card Header */
        .card-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .team-badge {
            width: 40px;
            height: 40px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .team-badge img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .team-meta {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }

        .rank-badge {
            width: 28px;
            height: 28px;
            background: var(--surface-3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .rank-badge.top-3 {
            background: linear-gradient(135deg, var(--color-success), #22c55e);
            color: #000;
        }

        /* Primary Metric */
        .primary-metric {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3);
            background: var(--surface-0);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
        }

        .metric-value.success { color: var(--color-success); }
        .metric-value.warning { color: var(--color-warning); }
        .metric-value.error { color: var(--color-error); }
        .metric-value.info { color: var(--color-info); }

        /* Circular Gauge */
        .gauge-container {
            position: relative;
            width: 56px;
            height: 56px;
        }

        .gauge-svg {
            transform: rotate(-90deg);
        }

        .gauge-bg {
            fill: none;
            stroke: var(--surface-3);
            stroke-width: 6;
        }

        .gauge-fill {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 500ms ease-out;
        }

        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
        }

        /* FDR Strip */
        .fdr-strip {
            display: flex;
            gap: 3px;
            margin-bottom: var(--space-3);
        }

        .fdr-badge {
            flex: 1;
            padding: var(--space-2) var(--space-1);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            color: #000;
        }

        .fdr-badge .opp { font-weight: 700; }
        .fdr-badge .venue { 
            font-size: 8px; 
            opacity: 0.8;
            display: block;
        }

        .fdr-1 { background: var(--fdr-1); }
        .fdr-2 { background: var(--fdr-2); }
        .fdr-3 { background: var(--fdr-3); }
        .fdr-4 { background: var(--fdr-4); }
        .fdr-5 { background: var(--fdr-5); }

        /* Form Dots */
        .form-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .form-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .form-dot.win { background: var(--color-success); }
        .form-dot.draw { background: var(--color-warning); }
        .form-dot.loss { background: var(--color-error); }

        /* Sparkline */
        .sparkline-container {
            height: 32px;
            position: relative;
        }

        .sparkline {
            width: 100%;
            height: 100%;
        }

        .sparkline-line {
            fill: none;
            stroke: var(--color-info);
            stroke-width: 2;
        }

        .sparkline-area {
            fill: url(#sparkGradient);
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
            margin-top: var(--space-3);
        }

        .stat-item {
            text-align: center;
            padding: var(--space-2);
            background: var(--surface-0);
            border-radius: var(--radius-sm);
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
        }

        /* Trend Indicator */
        .trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }

        .trend.improving {
            background: rgba(74, 222, 128, 0.15);
            color: var(--color-success);
        }

        .trend.worsening {
            background: rgba(248, 113, 113, 0.15);
            color: var(--color-error);
        }

        .trend.stable {
            background: rgba(163, 163, 163, 0.15);
            color: var(--text-secondary);
        }

        /* ===== NEW CARD STYLES ===== */
        
        /* Power Metrics Grid */
        .power-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .power-metric {
            background: var(--surface-0);
            border-radius: var(--radius-md);
            padding: var(--space-2);
            text-align: center;
        }

        .power-metric.attack { border-top: 2px solid var(--color-error); }
        .power-metric.defense { border-top: 2px solid var(--color-info); }
        .power-metric.fixture { border-top: 2px solid var(--color-warning); }

        .power-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .power-icon { font-size: 12px; }

        .power-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }

        .power-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .power-value.good { color: var(--color-success); }
        .power-value.bad { color: var(--color-error); }

        .power-splits {
            display: flex;
            justify-content: center;
            gap: var(--space-2);
            margin-top: 4px;
            font-size: 9px;
            color: var(--text-muted);
        }

        .power-splits span {
            padding: 1px 4px;
            background: var(--surface-2);
            border-radius: 3px;
        }

        /* xG Comparison Section */
        .xg-comparison {
            background: var(--surface-0);
            border-radius: var(--radius-md);
            padding: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .xg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .xg-diff {
            font-weight: 600;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
        }

        .xg-diff.warning { 
            background: rgba(251, 191, 36, 0.15); 
            color: var(--color-warning);
        }

        .xg-diff.success { 
            background: rgba(74, 222, 128, 0.15); 
            color: var(--color-success);
        }

        .xg-sparklines {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sparkline-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .sparkline-label {
            width: 36px;
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .sparkline {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 20px;
        }

        .spark-bar {
            flex: 1;
            border-radius: 2px;
            min-height: 2px;
            transition: height 300ms ease;
        }

        .spark-bar.goals { background: var(--color-success); }
        .spark-bar.xg { background: var(--color-info); opacity: 0.7; }

        .sparkline-value {
            width: 28px;
            font-size: 11px;
            font-weight: 600;
            text-align: right;
            color: var(--text-secondary);
        }

        .xg-insight {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-top: var(--space-2);
            padding-top: var(--space-2);
            border-top: 1px solid var(--border-subtle);
        }

        .xg-insight.warning { color: var(--color-warning); }
        .xg-insight.success { color: var(--color-success); }

        /* FDR Section */
        .fdr-section {
            margin-bottom: var(--space-3);
        }

        .fdr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2);
            font-size: 10px;
            color: var(--text-muted);
        }

        .cs-avg {
            font-weight: 600;
            color: var(--color-info);
        }

        .fdr-badge {
            position: relative;
        }

        .btts-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 6px;
            height: 6px;
            background: var(--color-warning);
            border-radius: 50%;
            border: 1px solid var(--surface-1);
        }

        /* Bully Tag */
        .bully-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
        }

        .bully-tag.bully { 
            background: rgba(251, 191, 36, 0.15); 
            color: var(--color-warning);
        }

        .bully-tag.giant-killer { 
            background: rgba(96, 165, 250, 0.15); 
            color: var(--color-info);
        }

        .bully-tag.consistent { 
            background: var(--surface-2); 
            color: var(--text-muted);
        }

        /* Venue Tag */
        .venue-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text-muted);
        }

        .venue-tag.home-fortress {
            background: rgba(74, 222, 128, 0.15);
            color: var(--color-success);
        }

        .venue-tag.road-warrior {
            background: rgba(96, 165, 250, 0.15);
            color: var(--color-info);
        }

        /* Venue Analysis Section */
        .venue-analysis {
            background: var(--surface-0);
            border-radius: var(--radius-md);
            padding: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .venue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-3);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .weighted-label {
            font-size: 10px;
            padding: 3px 8px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: help;
        }

        .venue-bars {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .venue-bar-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .venue-bar-label {
            width: 50px;
            font-size: 10px;
            color: var(--text-muted);
            text-align: right;
        }

        .venue-bar-container {
            flex: 1;
            height: 18px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .venue-bar {
            height: 100%;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            transition: width 500ms ease-out;
            min-width: 30px;
        }

        .venue-bar.home {
            background: linear-gradient(90deg, rgba(74, 222, 128, 0.3), rgba(74, 222, 128, 0.6));
        }

        .venue-bar.away {
            background: linear-gradient(90deg, rgba(96, 165, 250, 0.3), rgba(96, 165, 250, 0.6));
        }

        .venue-bar.defense.home {
            background: linear-gradient(90deg, rgba(52, 211, 153, 0.3), rgba(52, 211, 153, 0.6));
        }

        .venue-bar.defense.away {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.6));
        }

        .venue-bar-value {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .venue-bar-marker {
            width: 16px;
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .venue-insight {
            margin-top: var(--space-2);
            padding-top: var(--space-2);
            border-top: 1px solid var(--border-subtle);
            text-align: center;
        }

        .insight-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text-secondary);
        }

        .insight-tag.home {
            background: rgba(74, 222, 128, 0.15);
            color: var(--color-success);
        }

        .insight-tag.away {
            background: rgba(96, 165, 250, 0.15);
            color: var(--color-info);
        }

        .insight-tag.balanced {
            background: var(--surface-2);
            color: var(--text-muted);
        }

        /* Power splits higher indicator */
        .power-splits span.higher {
            background: rgba(74, 222, 128, 0.2);
            color: var(--color-success);
        }

        /* Card Footer */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-subtle);
        }

        .form-section {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .form-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .footer-stats {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .fdr-avg {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ===== FIXTURE SWINGS SECTION ===== */
        .swing-section {
            margin-top: var(--space-8);
        }

    <!-- SVG Definitions for Sparklines -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:rgba(96, 165, 250, 0.3)" />
                <stop offset="100%" style="stop-color:rgba(96, 165, 250, 0)" />
            </linearGradient>
            <linearGradient id="gaugeGradientGreen" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#4ADE80" />
                <stop offset="100%" style="stop-color:#22c55e" />

    <script>
        // Data URLs
        const BOOTSTRAP_URL = 'data/bootstrap-static.json';
        const FIXTURES_URL = 'data/fixtures.json';
        
        let allTeamsData = [];
        let currentView = 'overview';
        let currentGW = 1;
        window.rawFixturesData = [];

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            initSearch();
            loadTeamData();
        });

        function initFilters() {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    renderCurrentView();
                });
            });
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                filterTeams(query);
            });
        }

        function filterTeams(query) {
            const cards = document.querySelectorAll('.team-card');
            cards.forEach(card => {
                const teamName = card.dataset.team.toLowerCase();
                card.style.display = teamName.includes(query) ? '' : 'none';
            });
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        // ===== DATA LOADING =====
        async function loadTeamData() {
            try {
                showLoading(true);

                const [bootstrapRes, fixturesRes] = await Promise.all([
                    fetch(BOOTSTRAP_URL),
                    fetch(FIXTURES_URL)
                ]);

                if (!bootstrapRes.ok || !fixturesRes.ok) {
                    throw new Error('Failed to load data');
                }

                const bootstrapData = await bootstrapRes.json();
                const fixturesData = await fixturesRes.json();
                
                // Store fixtures globally for calendar view
                window.rawFixturesData = fixturesData;

                currentGW = bootstrapData.events.find(e => e.is_current)?.id || 
                                  bootstrapData.events.find(e => e.is_next)?.id || 1;
                document.getElementById('currentGW').textContent = `GW${currentGW}`;

                allTeamsData = bootstrapData.teams.map(team => 
                    analyzeTeam(team, bootstrapData.teams, fixturesData)
                );

                renderCurrentView();
                showLoading(false);

            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
            }
        }

        // ===== TEAM ANALYSIS =====
        const BIG_TEAMS = ['Arsenal', 'Chelsea', 'Liverpool', 'Man City', 'Man Utd', 'Spurs', 'Newcastle', 'Aston Villa'];

        function analyzeTeam(team, allTeams, fixtures) {
            const teamId = team.id;

            // Past fixtures (last 5)
            const pastFixtures = fixtures
                .filter(f => f.finished && (f.team_h === teamId || f.team_a === teamId))
                .sort((a, b) => a.event - b.event)
                .slice(-5);

            // Future fixtures (next 5)
            const futureFixtures = fixtures
                .filter(f => !f.finished && (f.team_h === teamId || f.team_a === teamId))
                .sort((a, b) => a.event - b.event)
                .slice(0, 5);

            // ===== HOME/AWAY SPLIT STATS =====
            const homeStats = { goals: 0, conceded: 0, games: 0, wins: 0, cleanSheets: 0 };
            const awayStats = { goals: 0, conceded: 0, games: 0, wins: 0, cleanSheets: 0 };
            
            // Stats vs Big Teams vs Others (for Flat-Track Bully)
            const vsBigTeams = { goals: 0, conceded: 0, games: 0 };
            const vsOtherTeams = { goals: 0, conceded: 0, games: 0 };

            let wins = 0, draws = 0, losses = 0;
            let totalGoalsScored = 0, totalGoalsConceded = 0;
            const pastResults = [];
            const goalsHistory = [];
            const xGHistory = [];

            pastFixtures.forEach(f => {
                const isHome = f.team_h === teamId;
                const teamScore = isHome ? f.team_h_score : f.team_a_score;
                const oppScore = isHome ? f.team_a_score : f.team_h_score;
                const oppId = isHome ? f.team_a : f.team_h;
                const opponent = allTeams.find(t => t.id === oppId);
                const isBigTeam = BIG_TEAMS.includes(opponent?.name);

                // Total stats
                totalGoalsScored += teamScore || 0;
                totalGoalsConceded += oppScore || 0;
                goalsHistory.push(teamScore || 0);

                // Home/Away splits
                if (isHome) {
                    homeStats.goals += teamScore || 0;
                    homeStats.conceded += oppScore || 0;
                    homeStats.games++;
                    if (teamScore > oppScore) homeStats.wins++;
                    if (oppScore === 0) homeStats.cleanSheets++;
                } else {
                    awayStats.goals += teamScore || 0;
                    awayStats.conceded += oppScore || 0;
                    awayStats.games++;
                    if (teamScore > oppScore) awayStats.wins++;
                    if (oppScore === 0) awayStats.cleanSheets++;
                }

                // Big Team splits (for Flat-Track Bully)
                if (isBigTeam) {
                    vsBigTeams.goals += teamScore || 0;
                    vsBigTeams.conceded += oppScore || 0;
                    vsBigTeams.games++;
                } else {
                    vsOtherTeams.goals += teamScore || 0;
                    vsOtherTeams.conceded += oppScore || 0;
                    vsOtherTeams.games++;
                }

                // W/D/L
                if (teamScore > oppScore) wins++;
                else if (teamScore === oppScore) draws++;
                else losses++;

                pastResults.push({
                    result: teamScore > oppScore ? 'W' : teamScore === oppScore ? 'D' : 'L',
                    opponent: opponent?.short_name || '?',
                    opponentName: opponent?.name || '?',
                    score: `${teamScore}-${oppScore}`,
                    isHome,
                    isBigTeam
                });

                // Calculate xG based on FPL strength ratings
                const teamAttack = isHome ? team.strength_attack_home : team.strength_attack_away;
                const oppDefense = isHome ? opponent?.strength_defence_away : opponent?.strength_defence_home;
                const xG = 0.8 + ((teamAttack - 1000) / 400) * 1.0 - ((oppDefense - 1000) / 400) * 0.5 + (isHome ? 0.25 : 0);
                xGHistory.push(Math.max(0.3, Math.min(3.5, xG)));
            });

            // ===== FUTURE FIXTURES ANALYSIS =====
            const futureDetails = [];
            let totalFdr = 0;

            futureFixtures.forEach(f => {
                const isHome = f.team_h === teamId;
                const oppId = isHome ? f.team_a : f.team_h;
                const opponent = allTeams.find(t => t.id === oppId);
                const fdr = isHome ? f.team_h_difficulty : f.team_a_difficulty;

                totalFdr += fdr || 3;

                // Calculate Clean Sheet probability for this fixture
                const teamDefStrength = isHome ? team.strength_defence_home : team.strength_defence_away;
                const oppAttStrength = isHome ? opponent?.strength_attack_away : opponent?.strength_attack_home;
                const csBaseChance = isHome ? 0.38 : 0.28; // Base CS rates
                const csChance = Math.round(Math.min(65, Math.max(10, 
                    csBaseChance * 100 * (teamDefStrength / (oppAttStrength || 1000)) * 0.95
                )));

                // BTTS likelihood
                const teamAttStrength = isHome ? team.strength_attack_home : team.strength_attack_away;
                const oppDefStrength = isHome ? opponent?.strength_defence_away : opponent?.strength_defence_home;
                const bttsLikely = (teamAttStrength > 1050 && oppAttStrength > 1050 && 
                                   teamDefStrength < 1100 && oppDefStrength < 1100);

                futureDetails.push({
                    gw: f.event,
                    opponent: opponent?.short_name || '?',
                    opponentId: oppId,
                    isHome,
                    fdr: fdr || 3,
                    csChance,
                    bttsLikely,
                    oppDefStrength: oppDefStrength || 1000,
                    oppAttStrength: oppAttStrength || 1000
                });
            });

            const avgFdr = futureDetails.length > 0 ? totalFdr / futureDetails.length : 3;
            const homeFixtureCount = futureDetails.filter(f => f.isHome).length;
            const awayFixtureCount = futureDetails.length - homeFixtureCount;

            // ===== CALCULATE PURE METRICS (NO FDR INFLUENCE) =====
            const gamesPlayed = pastFixtures.length || 1;
            const avgXG = xGHistory.length > 0 ? xGHistory.reduce((a, b) => a + b, 0) / gamesPlayed : 1.0;
            const avgGoals = totalGoalsScored / gamesPlayed;
            const avgConceded = totalGoalsConceded / gamesPlayed;
            const cleanSheets = homeStats.cleanSheets + awayStats.cleanSheets;

            // PURE ATTACK POWER (0-100) - No FDR!
            // Based on: actual goals, xG, FPL strength rating
            const fplAttackStrength = (team.strength_attack_home + team.strength_attack_away) / 2;
            const attackPower = Math.round(Math.min(100, Math.max(0,
                (avgGoals * 20) +                                    // Actual output (max ~40 for 2 goals/game)
                (avgXG * 15) +                                       // Expected output (max ~30)
                ((fplAttackStrength - 900) / 500) * 30              // FPL rating normalized (0-30)
            )));

            // PURE DEFENSE POWER (0-100) - No FDR!
            // Based on: clean sheets, goals conceded, FPL strength rating
            const fplDefenseStrength = (team.strength_defence_home + team.strength_defence_away) / 2;
            const defensePower = Math.round(Math.min(100, Math.max(0,
                ((cleanSheets / gamesPlayed) * 40) +                 // CS rate (max 40)
                ((2.5 - avgConceded) * 15) +                         // Goals conceded inverse (max ~30)
                ((fplDefenseStrength - 900) / 500) * 30             // FPL rating normalized (0-30)
            )));

            // Home/Away Attack Power
            const attackPowerHome = homeStats.games > 0 ? Math.round(Math.min(100, Math.max(0,
                ((homeStats.goals / homeStats.games) * 25) +
                ((team.strength_attack_home - 900) / 500) * 35 +
                ((homeStats.wins / homeStats.games) * 30)
            ))) : attackPower;

            const attackPowerAway = awayStats.games > 0 ? Math.round(Math.min(100, Math.max(0,
                ((awayStats.goals / awayStats.games) * 25) +
                ((team.strength_attack_away - 900) / 500) * 35 +
                ((awayStats.wins / awayStats.games) * 30)
            ))) : attackPower;

            // Home/Away Defense Power
            const defensePowerHome = homeStats.games > 0 ? Math.round(Math.min(100, Math.max(0,
                ((homeStats.cleanSheets / homeStats.games) * 45) +
                ((2 - homeStats.conceded / homeStats.games) * 20) +
                ((team.strength_defence_home - 900) / 500) * 35
            ))) : defensePower;

            const defensePowerAway = awayStats.games > 0 ? Math.round(Math.min(100, Math.max(0,
                ((awayStats.cleanSheets / awayStats.games) * 45) +
                ((2 - awayStats.conceded / awayStats.games) * 20) +
                ((team.strength_defence_away - 900) / 500) * 35
            ))) : defensePower;

            // FIXTURE SCORE (0-100) - Pure fixture opportunity
            const fixtureScore = Math.round(Math.min(100, Math.max(0,
                ((5 - avgFdr) / 4) * 70 +                            // FDR inverse (0-70)
                (homeFixtureCount / 5) * 30                          // Home fixture bonus (0-30)
            )));

            // Average CS Chance across next fixtures
            const avgCSChance = futureDetails.length > 0 
                ? Math.round(futureDetails.reduce((sum, f) => sum + f.csChance, 0) / futureDetails.length)
                : 30;

            // ===== FLAT-TRACK BULLY INDEX =====
            // Positive = scores more vs weaker teams (bully)
            // Negative = scores more vs stronger teams (giant killer)
            let bullyIndex = 0;
            let bullyLabel = 'balanced';
            
            if (vsBigTeams.games > 0 && vsOtherTeams.games > 0) {
                const goalsVsBig = vsBigTeams.goals / vsBigTeams.games;
                const goalsVsOther = vsOtherTeams.goals / vsOtherTeams.games;
                bullyIndex = goalsVsOther - goalsVsBig;
                
                if (bullyIndex > 0.8) bullyLabel = 'bully';        // Much better vs weak teams
                else if (bullyIndex < -0.5) bullyLabel = 'giant-killer'; // Better vs top teams
                else bullyLabel = 'consistent';
            }

            // ===== xG vs GOALS COMPARISON =====
            const totalXG = xGHistory.reduce((a, b) => a + b, 0);
            const xgDiff = totalGoalsScored - totalXG;
            const xgPerformance = xgDiff > 0.5 ? 'overperforming' : xgDiff < -0.5 ? 'underperforming' : 'balanced';

            // ===== FORM SCORE (combines everything for overview) =====
            const formScore = Math.round(Math.min(100, Math.max(0,
                (wins * 12) + (draws * 4) +                          // Results (max 60)
                (attackPower * 0.2) +                                // Attack power contribution
                (defensePower * 0.2)                                 // Defense power contribution
            )));

            // ===== FIXTURE SWING =====
            let fixtureSwing = 'stable';
            if (futureDetails.length >= 4) {
                const first2 = (futureDetails[0].fdr + futureDetails[1].fdr) / 2;
                const last2 = (futureDetails[futureDetails.length - 2].fdr + futureDetails[futureDetails.length - 1].fdr) / 2;
                if (last2 < first2 - 0.5) fixtureSwing = 'improving';
                else if (last2 > first2 + 0.5) fixtureSwing = 'worsening';
            }

            // ===== VENUE DEPENDENCY ANALYSIS =====
            // Calculate how different home vs away performance is
            const attackHomeDiff = attackPowerHome - attackPowerAway;
            const defenseHomeDiff = defensePowerHome - defensePowerAway;
            const avgHomeDiff = (attackHomeDiff + defenseHomeDiff) / 2;
            
            let venueLabel = 'balanced';
            let venueEmoji = '⚖️';
            if (avgHomeDiff > 15) {
                venueLabel = 'home-fortress';
                venueEmoji = '🏠';
            } else if (avgHomeDiff < -10) {
                venueLabel = 'road-warrior';
                venueEmoji = '🛣️';
            }
            
            // Calculate WEIGHTED power based on upcoming fixture venues
            // If playing 4H 1A, weight home power more heavily
            const homeWeight = homeFixtureCount / 5;
            const awayWeight = awayFixtureCount / 5;
            
            const weightedAttack = Math.round(
                (attackPowerHome * homeWeight) + (attackPowerAway * awayWeight)
            );
            const weightedDefense = Math.round(
                (defensePowerHome * homeWeight) + (defensePowerAway * awayWeight)
            );
            
            // "Relevant" rating - what matters for the NEXT 5 fixtures
            const relevantAttack = weightedAttack;
            const relevantDefense = weightedDefense;

            return {
                id: teamId,
                code: team.code,
                name: team.name,
                shortName: team.short_name,
                badgeUrl: `https://resources.premierleague.com/premierleague/badges/50/t${team.code}.png`,
                
                // Core metrics (PURE - no FDR influence)
                attackPower,
                defensePower,
                attackPowerHome,
                attackPowerAway,
                defensePowerHome,
                defensePowerAway,
                
                // Weighted metrics (based on upcoming fixtures)
                weightedAttack,
                weightedDefense,
                relevantAttack,
                relevantDefense,
                
                // Venue dependency
                venueLabel,
                venueEmoji,
                attackHomeDiff,
                defenseHomeDiff,
                
                // Fixture opportunity (SEPARATE)
                fixtureScore,
                avgFdr: avgFdr.toFixed(1),
                avgCSChance,
                
                // Form & results
                formScore,
                wins, draws, losses,
                
                // Stats
                avgGoals: avgGoals.toFixed(2),
                avgConceded: avgConceded.toFixed(2),
                avgXG: avgXG.toFixed(2),
                totalGoals: totalGoalsScored,
                totalXG: totalXG.toFixed(1),
                xgDiff: xgDiff.toFixed(1),
                xgPerformance,
                cleanSheets,
                
                // Home/Away
                homeFixtures: homeFixtureCount,
                awayFixtures: awayFixtureCount,
                homeStats,
                awayStats,
                
                // Special indices
                bullyIndex: bullyIndex.toFixed(1),
                bullyLabel,
                
                // History
                pastResults,
                futureFixtures: futureDetails,
                goalsHistory,
                xGHistory,
                fixtureSwing,
                
                // Legacy (for backward compatibility)
                attackRating: attackPower,
                defenseRating: defensePower
            };
        }

                    newGrid.innerHTML = attackSorted.map((team, i) => createTeamCard(team, i + 1, 'attack')).join('');

                    break;

        }

                .sort((a, b) => parseFloat(a.avgFdr) - parseFloat(b.avgFdr))
                .slice(0, 8);

                            const timingText = team.fixtureSwing === 'improving' ? 'Buy Now' : 'Good Fixtures';
                            
                            return `

                                <span>Very Easy (1-2)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: var(--fdr-2);"></div>
                                <span>Easy (2)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: var(--fdr-3);"></div>
                                <span>Medium (3)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: var(--fdr-4);"></div>
                                <span>Hard (4)</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background: var(--fdr-5);"></div>
                                <span>Very Hard (5)</span>
                            </div>
                        </div>
                    </div>

                    <div class="calendar-controls">
                        <button class="calendar-control-btn ${calendarViewMode === 'all' ? 'active' : ''}" onclick="setCalendarView('all')">All Season</button>
                        <button class="calendar-control-btn ${calendarViewMode === 'remaining' ? 'active' : ''}" onclick="setCalendarView('remaining')">Remaining</button>
                        <button class="calendar-control-btn ${calendarViewMode === 'next10' ? 'active' : ''}" onclick="setCalendarView('next10')">Next 10 GWs</button>
                    </div>

                    <div class="calendar-container">
                        <div class="calendar-scroll">
                            <table class="calendar-table">
                                <thead>
                                    <tr>
                                        <th class="team-header">Team</th>
                                        ${displayGWs.map(gw => `
                                            <th class="gw-header ${gw === currentGW ? 'gw-current' : ''}">${gw}</th>
                                        `).join('')}
                                        <th class="gw-header" style="background: var(--surface-3);">Avg</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${renderCalendarRows(teamFixtureMap, displayGWs, easyRuns)}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="calendar-analysis">
                        ${renderEasyRunsAnalysis(easyRuns)}
                        ${renderFixtureSwingAnalysis(fixtureSwingTeams)}
                        ${renderUpcomingGoldMines(teamFixtureMap, displayGWs)}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function setCalendarView(mode) {
            calendarViewMode = mode;
            renderCurrentView();
        }

        function buildFullSeasonMap() {
            const fixtureMap = {};
            
            // Initialize map for all teams
            allTeamsData.forEach(team => {
                fixtureMap[team.id] = {};
            });

            // Fill with fixtures from the raw data
            if (window.rawFixturesData) {
                window.rawFixturesData.forEach(f => {
                    if (!f.event) return; // Skip fixtures without a gameweek
                    
                    const homeTeam = allTeamsData.find(t => t.id === f.team_h);
                    const awayTeam = allTeamsData.find(t => t.id === f.team_a);
                    
                    if (homeTeam && fixtureMap[f.team_h]) {
                        fixtureMap[f.team_h][f.event] = fixtureMap[f.team_h][f.event] || [];
                        fixtureMap[f.team_h][f.event].push({
                            opponent: awayTeam?.shortName || '???',
                            opponentId: f.team_a,
                            isHome: true,
                            fdr: f.team_h_difficulty || 3,
                            finished: f.finished,
                            gw: f.event
                        });
                    }
                    
                    if (awayTeam && fixtureMap[f.team_a]) {
                        fixtureMap[f.team_a][f.event] = fixtureMap[f.team_a][f.event] || [];
                        fixtureMap[f.team_a][f.event].push({
                            opponent: homeTeam?.shortName || '???',
                            opponentId: f.team_h,
                            isHome: false,
                            fdr: f.team_a_difficulty || 3,
                            finished: f.finished,
                            gw: f.event
                        });
                    }
                });
            }

            return fixtureMap;
        }

        function renderCalendarRows(fixtureMap, displayGWs, easyRuns) {
            // Sort teams by average FDR (best fixtures first)
            const sortedTeams = [...allTeamsData].sort((a, b) => {
                const avgA = calculateAvgFDR(fixtureMap[a.id], displayGWs);
                const avgB = calculateAvgFDR(fixtureMap[b.id], displayGWs);
                return avgA - avgB;
            });

            return sortedTeams.map(team => {
                const teamEasyRuns = easyRuns.filter(r => r.teamId === team.id);
                const avgFdr = calculateAvgFDR(fixtureMap[team.id], displayGWs);
                const avgClass = avgFdr <= 2.5 ? 'good' : avgFdr <= 3.2 ? 'warning' : 'bad';

                return `
                    <tr>
                        <td class="team-cell">
                            <div class="calendar-team">
                                <img src="${team.badgeUrl}" alt="${team.shortName}" class="calendar-team-badge" onerror="this.style.display='none'">
                                <span class="calendar-team-name">${team.shortName}</span>
                                <span class="calendar-team-fdr ${avgClass}">${avgFdr.toFixed(1)}</span>
                            </div>
                        </td>
                        ${displayGWs.map(gw => renderFixtureCell(fixtureMap[team.id][gw], gw, teamEasyRuns)).join('')}
                        <td>
                            <span class="analysis-team-stat ${avgClass}">${avgFdr.toFixed(1)}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderFixtureCell(fixtures, gw, easyRuns) {
            if (!fixtures || fixtures.length === 0) {
                return `<td><div class="fixture-cell bgw-cell"></div></td>`;
            }

            // Check if this GW is part of an easy run
            let runClass = '';
            for (const run of easyRuns) {
                if (gw >= run.startGW && gw <= run.endGW) {
                    if (gw === run.startGW) runClass = 'easy-run-start';
                    else if (gw === run.endGW) runClass = 'easy-run-end';
                    else runClass = 'easy-run-middle';
                    break;
                }
            }

            // Handle double gameweeks
            if (fixtures.length > 1) {
                return `<td>
                    <div class="fixture-cell fdr-${Math.round(fixtures[0].fdr)} ${fixtures[0].finished ? 'past' : ''} ${runClass}" 
                         title="GW${gw}: ${fixtures.map(f => `${f.opponent} (${f.isHome ? 'H' : 'A'})`).join(' & ')}">
                        <span class="opp">${fixtures[0].opponent}</span>
                        <span class="venue">${fixtures[0].isHome ? 'H' : 'A'}</span>
                        <span class="dgw-indicator">DGW</span>
                    </div>
                </td>`;
            }

            const f = fixtures[0];
            return `<td>
                <div class="fixture-cell fdr-${Math.round(f.fdr)} ${f.finished ? 'past' : ''} ${runClass}" 
                     title="GW${gw}: ${f.opponent} (${f.isHome ? 'H' : 'A'}) - FDR ${f.fdr}">
                    <span class="opp">${f.opponent}</span>
                    <span class="venue">${f.isHome ? 'H' : 'A'}</span>
                </div>
            </td>`;
        }

        function calculateAvgFDR(teamFixtures, displayGWs) {
            if (!teamFixtures) return 3;
            
            let total = 0;
            let count = 0;
            
            displayGWs.forEach(gw => {
                const fixtures = teamFixtures[gw];
                if (fixtures && fixtures.length > 0) {
                    fixtures.forEach(f => {
                        if (!f.finished) {
                            total += f.fdr;
                            count++;
                        }
                    });
                }
            });
            
            return count > 0 ? total / count : 3;
        }

        function findEasyRuns(fixtureMap) {
            const easyRuns = [];
            const minRunLength = 3; // Minimum 3 consecutive easy fixtures
            const maxFDR = 2.5; // FDR threshold for "easy"

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                const gws = Object.keys(teamFixtures).map(Number).sort((a, b) => a - b);
                let runStart = null;
                let runLength = 0;

                gws.forEach((gw, idx) => {
                    const fixtures = teamFixtures[gw];
                    if (!fixtures || fixtures.length === 0) {
                        // End of run
                        if (runLength >= minRunLength) {
                            easyRuns.push({
                                teamId: team.id,
                                teamName: team.name,
                                teamShort: team.shortName,
                                badgeUrl: team.badgeUrl,
                                startGW: runStart,
                                endGW: gws[idx - 1],
                                length: runLength
                            });
                        }
                        runStart = null;
                        runLength = 0;
                        return;
                    }

                    const avgFdr = fixtures.reduce((sum, f) => sum + f.fdr, 0) / fixtures.length;
                    const isEasy = avgFdr <= maxFDR && !fixtures[0].finished;

                    if (isEasy) {
                        if (runStart === null) {
                            runStart = gw;
                        }
                        runLength++;
                    } else {
                        if (runLength >= minRunLength) {
                            easyRuns.push({
                                teamId: team.id,
                                teamName: team.name,
                                teamShort: team.shortName,
                                badgeUrl: team.badgeUrl,
                                startGW: runStart,
                                endGW: gws[idx - 1],
                                length: runLength
                            });
                        }
                        runStart = null;
                        runLength = 0;
                    }
                });

                // Check for run at end
                if (runLength >= minRunLength) {
                    easyRuns.push({
                        teamId: team.id,
                        teamName: team.name,
                        teamShort: team.shortName,
                        badgeUrl: team.badgeUrl,
                        startGW: runStart,
                        endGW: gws[gws.length - 1],
                        length: runLength
                    });
                }
            });

            return easyRuns.sort((a, b) => b.length - a.length);
        }

        function findFixtureSwings(fixtureMap) {
            const swings = [];

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                // Compare next 3 GWs vs GWs 4-6
                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => gw >= currentGW)
                    .sort((a, b) => a - b)
                    .slice(0, 6);

                if (futureGWs.length < 6) return;

                const first3 = futureGWs.slice(0, 3);
                const next3 = futureGWs.slice(3, 6);

                const avgFirst = first3.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? f[0].fdr : 3);
                }, 0) / 3;

                const avgNext = next3.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? f[0].fdr : 3);
                }, 0) / 3;

                const swing = avgFirst - avgNext;

                if (Math.abs(swing) > 0.5) {
                    swings.push({
                        teamId: team.id,
                        teamName: team.name,
                        teamShort: team.shortName,
                        badgeUrl: team.badgeUrl,
                        swing: swing,
                        direction: swing > 0 ? 'improving' : 'worsening',
                        currentFdr: avgFirst.toFixed(1),
                        futureFdr: avgNext.toFixed(1),
                        swingGW: futureGWs[3]
                    });
                }
            });

            return swings.sort((a, b) => b.swing - a.swing);
        }

        function renderEasyRunsAnalysis(easyRuns) {
            const topRuns = easyRuns.filter(r => r.startGW >= currentGW).slice(0, 5);
            
            if (topRuns.length === 0) {
                return `
                    <div class="analysis-card">
                        <div class="analysis-card-header">
                            <span class="analysis-card-icon">🟢</span>
                            <span class="analysis-card-title">Best Easy Fixture Runs</span>
                        </div>
                        <p style="color: var(--text-muted); font-size: 12px;">No significant easy runs found in remaining fixtures.</p>
                    </div>
                `;
            }

            return `
                <div class="analysis-card">
                    <div class="analysis-card-header">
                        <span class="analysis-card-icon">🟢</span>
                        <span class="analysis-card-title">Best Easy Fixture Runs</span>
                    </div>
                    <div class="analysis-team-list">
                        ${topRuns.map(run => `
                            <div class="analysis-team-item">
                                <img src="${run.badgeUrl}" alt="${run.teamShort}" class="analysis-team-badge" onerror="this.style.display='none'">
                                <div class="analysis-team-info">
                                    <div class="analysis-team-name">${run.teamName}</div>
                                    <div class="analysis-team-detail">
                                        <span class="gw-range-badge">GW${run.startGW} → GW${run.endGW}</span>
                                    </div>
                                </div>
                                <span class="analysis-team-stat good">${run.length} GWs</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderFixtureSwingAnalysis(swings) {
            const improving = swings.filter(s => s.direction === 'improving').slice(0, 4);
            const worsening = swings.filter(s => s.direction === 'worsening').slice(0, 4);

            return `
                <div class="analysis-card">
                    <div class="analysis-card-header">
                        <span class="analysis-card-icon">📈</span>
                        <span class="analysis-card-title">Fixture Swings</span>
                    </div>
                    <div style="margin-bottom: var(--space-3);">
                        <div style="font-size: 11px; color: var(--color-success); margin-bottom: var(--space-2); font-weight: 600;">↑ Getting Easier</div>
                        <div class="analysis-team-list">
                            ${improving.length > 0 ? improving.map(s => `
                                <div class="analysis-team-item">
                                    <img src="${s.badgeUrl}" alt="${s.teamShort}" class="analysis-team-badge" onerror="this.style.display='none'">
                                    <div class="analysis-team-info">
                                        <div class="analysis-team-name">${s.teamShort}</div>
                                        <div class="analysis-team-detail">From GW${s.swingGW}</div>
                                    </div>
                                    <span class="analysis-team-stat good">${s.currentFdr} → ${s.futureFdr}</span>
                                </div>
                            `).join('') : '<div style="font-size: 11px; color: var(--text-muted);">None found</div>'}
                        </div>
                    </div>
                    <div>
                        <div style="font-size: 11px; color: var(--color-error); margin-bottom: var(--space-2); font-weight: 600;">↓ Getting Harder</div>
                        <div class="analysis-team-list">
                            ${worsening.length > 0 ? worsening.slice(0, 3).map(s => `
                                <div class="analysis-team-item">
                                    <img src="${s.badgeUrl}" alt="${s.teamShort}" class="analysis-team-badge" onerror="this.style.display='none'">
                                    <div class="analysis-team-info">
                                        <div class="analysis-team-name">${s.teamShort}</div>
                                        <div class="analysis-team-detail">From GW${s.swingGW}</div>
                                    </div>
                                    <span class="analysis-team-stat bad">${s.currentFdr} → ${s.futureFdr}</span>
                                </div>
                            `).join('') : '<div style="font-size: 11px; color: var(--text-muted);">None found</div>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUpcomingGoldMines(fixtureMap, displayGWs) {
            // Find teams with best upcoming 5 GWs
            const upcoming5 = displayGWs.filter(gw => gw >= currentGW).slice(0, 5);
            
            const rankings = allTeamsData.map(team => {
                const avgFdr = calculateAvgFDR(fixtureMap[team.id], upcoming5);
                const homeCount = upcoming5.reduce((count, gw) => {
                    const f = fixtureMap[team.id][gw];
                    return count + (f && f[0] && f[0].isHome ? 1 : 0);
                }, 0);
                
                return {
                    ...team,
                    avgFdr,
                    homeCount
                };
            }).sort((a, b) => a.avgFdr - b.avgFdr);

            const top5 = rankings.slice(0, 5);

            return `
                <div class="analysis-card">
                    <div class="analysis-card-header">
                        <span class="analysis-card-icon">⭐</span>
                        <span class="analysis-card-title">Best Next 5 GWs</span>
                    </div>
                    <div class="analysis-team-list">
                        ${top5.map((team, i) => `
                            <div class="analysis-team-item">
                                <span style="font-size: 12px; font-weight: 700; color: ${i < 3 ? 'var(--color-warning)' : 'var(--text-muted)'}; width: 20px;">${i + 1}</span>
                                <img src="${team.badgeUrl}" alt="${team.shortName}" class="analysis-team-badge" onerror="this.style.display='none'">
                                <div class="analysis-team-info">
                                    <div class="analysis-team-name">${team.name}</div>
                                    <div class="analysis-team-detail">${team.homeCount} home games</div>
                                </div>
                                <span class="analysis-team-stat good">${team.avgFdr.toFixed(1)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
