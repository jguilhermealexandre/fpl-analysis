<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | FPL Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Surfaces - GitHub inspired */
            --surface-bg: #0A0E14;
            --surface-0: #0D1117;
            --surface-1: #161B22;
            --surface-2: #1C2128;
            --surface-3: #21262D;
            --surface-4: #30363D;
            
            /* Text hierarchy */
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-muted: rgba(255, 255, 255, 0.45);
            
            /* Borders */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.10);
            --border-emphasis: rgba(255, 255, 255, 0.16);
            
            /* Semantic */
            --color-success: #4ADE80;
            --color-error: #F87171;
            --color-warning: #FBBF24;
            --color-info: #60A5FA;
            
            /* FDR Scale */
            --fdr-1: #4ADE80;
            --fdr-2: #86EFAC;
            --fdr-3: #A3A3A3;
            --fdr-4: #FB923C;
            --fdr-5: #EF4444;
            
            /* Position colors */
            --position-gk: #FCD34D;
            --position-def: #34D399;
            --position-mid: #60A5FA;
            --position-fwd: #F87171;
            
            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            
            /* Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            background: var(--surface-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ===== TOP NAVIGATION ===== */
        .top-nav {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-6);
            display: flex;
            align-items: center;
            height: 56px;
            gap: var(--space-8);
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .nav-logo span {
            color: var(--color-success);
        }

        .nav-links {
            display: flex;
            gap: var(--space-1);
        }

        .nav-link {
            padding: var(--space-2) var(--space-4);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all 150ms ease-out;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: var(--surface-2);
        }

        .nav-link.active {
            color: var(--color-success);
            background: rgba(74, 222, 128, 0.1);
        }

        .nav-link .icon {
            font-size: 16px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: var(--space-6);
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .gw-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-3);
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: var(--color-info);
            margin-left: var(--space-3);
        }

        /* ===== FILTER TABS ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border-subtle);
        }

        .filter-tabs {
            display: flex;
            gap: var(--space-1);
            background: var(--surface-1);
            padding: var(--space-1);
            border-radius: var(--radius-md);
        }

        .filter-tab {
            padding: var(--space-2) var(--space-4);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 150ms ease-out;
        }

        .filter-tab:hover {
            color: var(--text-primary);
        }

        .filter-tab.active {
            background: var(--surface-3);
            color: var(--text-primary);
        }

        .search-box {
            margin-left: auto;
            position: relative;
        }

        .search-input {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-4);
            padding-left: 36px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            width: 200px;
            transition: all 200ms ease-out;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-info);
            width: 260px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== TEAMS GRID ===== */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-4);
        }

        @media (max-width: 1200px) {
            .teams-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .teams-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .teams-grid { grid-template-columns: 1fr; }
        }

        /* ===== TEAM CARD ===== */
        .team-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            transition: all 200ms ease-out;
            cursor: pointer;
        }

        .team-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-emphasis);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        /* Card Header */
        .card-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .team-badge {
            width: 40px;
            height: 40px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .team-badge img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .team-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .rank-badge {
            width: 28px;
            height: 28px;
            background: var(--surface-3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .rank-badge.top-3 {
            background: linear-gradient(135deg, var(--color-success), #22c55e);
            color: #000;
        }

        /* Primary Metric */
        .primary-metric {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3);
            background: var(--surface-0);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
        }

        .metric-value.success { color: var(--color-success); }
        .metric-value.warning { color: var(--color-warning); }
        .metric-value.error { color: var(--color-error); }
        .metric-value.info { color: var(--color-info); }

        /* Circular Gauge */
        .gauge-container {
            position: relative;
            width: 56px;
            height: 56px;
        }

        .gauge-svg {
            transform: rotate(-90deg);
        }

        .gauge-bg {
            fill: none;
            stroke: var(--surface-3);
            stroke-width: 6;
        }

        .gauge-fill {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 500ms ease-out;
        }

        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
        }

        /* FDR Strip */
        .fdr-strip {
            display: flex;
            gap: 3px;
            margin-bottom: var(--space-3);
        }

        .fdr-badge {
            flex: 1;
            padding: var(--space-2) var(--space-1);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            color: #000;
        }

        .fdr-badge .opp { font-weight: 700; }
        .fdr-badge .venue { 
            font-size: 8px; 
            opacity: 0.8;
            display: block;
        }

        .fdr-1 { background: var(--fdr-1); }
        .fdr-2 { background: var(--fdr-2); }
        .fdr-3 { background: var(--fdr-3); }
        .fdr-4 { background: var(--fdr-4); }
        .fdr-5 { background: var(--fdr-5); }

        /* Form Dots */
        .form-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .form-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .form-dot.win { background: var(--color-success); }
        .form-dot.draw { background: var(--color-warning); }
        .form-dot.loss { background: var(--color-error); }

        /* Sparkline */
        .sparkline-container {
            height: 32px;
            position: relative;
        }

        .sparkline {
            width: 100%;
            height: 100%;
        }

        .sparkline-line {
            fill: none;
            stroke: var(--color-info);
            stroke-width: 2;
        }

        .sparkline-area {
            fill: url(#sparkGradient);
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
            margin-top: var(--space-3);
        }

        .stat-item {
            text-align: center;
            padding: var(--space-2);
            background: var(--surface-0);
            border-radius: var(--radius-sm);
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
        }

        /* Trend Indicator */
        .trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }

        .trend.improving {
            background: rgba(74, 222, 128, 0.15);
            color: var(--color-success);
        }

        .trend.worsening {
            background: rgba(248, 113, 113, 0.15);
            color: var(--color-error);
        }

        .trend.stable {
            background: rgba(163, 163, 163, 0.15);
            color: var(--text-secondary);
        }

        /* ===== FIXTURE SWINGS SECTION ===== */
        .swing-section {
            margin-top: var(--space-8);
        }

        .swing-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .swing-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
        }

        .swing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-4);
        }

        .swing-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            border-left: 3px solid var(--color-success);
        }

        .swing-card.buy-now { border-left-color: var(--color-success); }
        .swing-card.buy-soon { border-left-color: var(--color-info); }
        .swing-card.hold { border-left-color: var(--color-warning); }

        .swing-team {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .swing-timing {
            margin-left: auto;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-sm);
        }

        .swing-timing.buy-now {
            background: rgba(74, 222, 128, 0.2);
            color: var(--color-success);
        }

        .swing-timing.buy-soon {
            background: rgba(96, 165, 250, 0.2);
            color: var(--color-info);
        }

        .swing-signals {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .signal-tag {
            font-size: 10px;
            padding: var(--space-1) var(--space-2);
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
        }

        /* ===== LOADING STATE ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 20, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease-out;
        }

        .loading-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .loader {
            text-align: center;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-3);
            border-top-color: var(--color-success);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto var(--space-4);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== SKELETON LOADING ===== */
        .skeleton {
            background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite ease-in-out;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 var(--space-4);
                gap: var(--space-4);
            }

            .nav-link span:not(.icon) {
                display: none;
            }

            .nav-link {
                padding: var(--space-2);
            }

            .page-title {
                font-size: 22px;
            }

            .filter-bar {
                flex-wrap: wrap;
            }

            .search-box {
                width: 100%;
                margin-left: 0;
                margin-top: var(--space-3);
            }

            .search-input {
                width: 100%;
            }

            .search-input:focus {
                width: 100%;
            }
        }

        /* Tooltip */
        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-4);
            color: var(--text-primary);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
            font-size: 11px;
            white-space: nowrap;
            z-index: 10;
            margin-bottom: var(--space-2);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--space-8);
            color: var(--text-muted);
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: var(--surface-3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: var(--space-2);
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 300ms ease-out;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading teams data...</div>
        </div>
    </div>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span>⚡</span> FPL Analysis
            </a>
            <div class="nav-links">
                <a href="fpl-transfer-wizard.html" class="nav-link">
                    <span class="icon">🧙</span>
                    <span>Wizard</span>
                </a>
                <a href="fpl-my-team-analysis.html" class="nav-link">
                    <span class="icon">⚽</span>
                    <span>My Team</span>
                </a>
                <a href="fpl-players-analysis.html" class="nav-link">
                    <span class="icon">👤</span>
                    <span>Players</span>
                </a>
                <a href="fpl-teams-analysis.html" class="nav-link active">
                    <span class="icon">📊</span>
                    <span>Teams</span>
                </a>
                <a href="fpl-league-rivals.html" class="nav-link">
                    <span class="icon">🏆</span>
                    <span>Rivals</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <header class="page-header">
            <h1 class="page-title">
                Teams Analysis
                <span class="gw-badge" id="currentGW">Loading...</span>
            </h1>
            <p class="page-subtitle">Fixture difficulty, form trends, and attack/defense ratings for all 20 Premier League teams</p>
        </header>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-view="overview">All Teams</button>
                <button class="filter-tab" data-view="attack">Best for Attack</button>
                <button class="filter-tab" data-view="defense">Best for Defense</button>
                <button class="filter-tab" data-view="swings">Fixture Swings</button>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="Search teams..." id="searchInput">
            </div>
        </div>

        <!-- Content Area -->
        <div id="content-area">
            <div class="teams-grid" id="teams-grid">
                <!-- Teams will be rendered here -->
            </div>
        </div>
    </main>

    <!-- SVG Definitions for Sparklines -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:rgba(96, 165, 250, 0.3)" />
                <stop offset="100%" style="stop-color:rgba(96, 165, 250, 0)" />
            </linearGradient>
            <linearGradient id="gaugeGradientGreen" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#4ADE80" />
                <stop offset="100%" style="stop-color:#22c55e" />
            </linearGradient>
        </defs>
    </svg>

    <script>
        // Data URLs
        const BOOTSTRAP_URL = 'data/bootstrap-static.json';
        const FIXTURES_URL = 'data/fixtures.json';
        
        let allTeamsData = [];
        let currentView = 'overview';

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            initSearch();
            loadTeamData();
        });

        function initFilters() {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    renderCurrentView();
                });
            });
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                filterTeams(query);
            });
        }

        function filterTeams(query) {
            const cards = document.querySelectorAll('.team-card');
            cards.forEach(card => {
                const teamName = card.dataset.team.toLowerCase();
                card.style.display = teamName.includes(query) ? '' : 'none';
            });
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        // ===== DATA LOADING =====
        async function loadTeamData() {
            try {
                showLoading(true);

                const [bootstrapRes, fixturesRes] = await Promise.all([
                    fetch(BOOTSTRAP_URL),
                    fetch(FIXTURES_URL)
                ]);

                if (!bootstrapRes.ok || !fixturesRes.ok) {
                    throw new Error('Failed to load data');
                }

                const bootstrapData = await bootstrapRes.json();
                const fixturesData = await fixturesRes.json();

                const currentGW = bootstrapData.events.find(e => e.is_current)?.id || 
                                  bootstrapData.events.find(e => e.is_next)?.id || 1;
                document.getElementById('currentGW').textContent = `GW${currentGW}`;

                allTeamsData = bootstrapData.teams.map(team => 
                    analyzeTeam(team, bootstrapData.teams, fixturesData)
                );

                renderCurrentView();
                showLoading(false);

            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
            }
        }

        // ===== TEAM ANALYSIS =====
        const BIG_SIX_NAMES = ['Arsenal', 'Chelsea', 'Liverpool', 'Man City', 'Man Utd', 'Spurs'];

        function analyzeTeam(team, allTeams, fixtures) {
            const teamId = team.id;

            // Past fixtures
            const pastFixtures = fixtures
                .filter(f => f.finished && (f.team_h === teamId || f.team_a === teamId))
                .sort((a, b) => a.event - b.event)
                .slice(-5);

            // Future fixtures
            const futureFixtures = fixtures
                .filter(f => !f.finished && (f.team_h === teamId || f.team_a === teamId))
                .sort((a, b) => a.event - b.event)
                .slice(0, 5);

            // Calculate past stats
            let wins = 0, draws = 0, losses = 0;
            let goalsScored = 0, goalsConceded = 0;
            const pastResults = [];
            const xGHistory = [];

            pastFixtures.forEach(f => {
                const isHome = f.team_h === teamId;
                const teamScore = isHome ? f.team_h_score : f.team_a_score;
                const oppScore = isHome ? f.team_a_score : f.team_h_score;
                const oppId = isHome ? f.team_a : f.team_h;
                const opponent = allTeams.find(t => t.id === oppId);

                goalsScored += teamScore || 0;
                goalsConceded += oppScore || 0;

                if (teamScore > oppScore) wins++;
                else if (teamScore === oppScore) draws++;
                else losses++;

                pastResults.push({
                    result: teamScore > oppScore ? 'W' : teamScore === oppScore ? 'D' : 'L',
                    opponent: opponent?.short_name || '?',
                    score: `${teamScore}-${oppScore}`,
                    isHome
                });

                // Approximate xG
                const teamAttack = isHome ? team.strength_attack_home : team.strength_attack_away;
                const oppDefense = isHome ? opponent?.strength_defence_away : opponent?.strength_defence_home;
                const xG = 0.8 + ((teamAttack - 900) / 500) * 1.2 - ((oppDefense - 900) / 500) * 0.6 + (isHome ? 0.3 : 0);
                xGHistory.push(Math.max(0.3, Math.min(3.5, xG)));
            });

            // Future fixtures analysis
            const futureDetails = [];
            let totalFdr = 0;

            futureFixtures.forEach(f => {
                const isHome = f.team_h === teamId;
                const oppId = isHome ? f.team_a : f.team_h;
                const opponent = allTeams.find(t => t.id === oppId);
                const fdr = isHome ? f.team_h_difficulty : f.team_a_difficulty;

                totalFdr += fdr || 3;

                futureDetails.push({
                    gw: f.event,
                    opponent: opponent?.short_name || '?',
                    isHome,
                    fdr: fdr || 3
                });
            });

            const avgFdr = futureDetails.length > 0 ? totalFdr / futureDetails.length : 3;
            const homeFixtures = futureDetails.filter(f => f.isHome).length;

            // Form score
            const gamesPlayed = pastFixtures.length || 1;
            const avgXG = xGHistory.reduce((a, b) => a + b, 0) / gamesPlayed;
            const avgXGA = goalsConceded / gamesPlayed;
            
            const formScore = Math.round(Math.min(100, Math.max(0,
                (wins * 15) + (draws * 5) + 
                (avgXG * 15) + 
                ((3 - avgXGA) * 10) +
                ((5 - avgFdr) / 4) * 20
            )));

            // Attack rating
            const attackRating = Math.round(Math.min(100, Math.max(0,
                avgXG * 25 +
                ((5 - avgFdr) / 4) * 30 +
                homeFixtures * 5 +
                (goalsScored / gamesPlayed) * 10
            )));

            // Defense rating
            const defenseRating = Math.round(Math.min(100, Math.max(0,
                (3 - avgXGA) * 20 +
                ((5 - avgFdr) / 4) * 30 +
                homeFixtures * 5 +
                ((gamesPlayed - goalsConceded) / gamesPlayed) * 20
            )));

            // Fixture swing
            let fixtureSwing = 'stable';
            if (futureDetails.length >= 4) {
                const first2 = (futureDetails[0].fdr + futureDetails[1].fdr) / 2;
                const last2 = (futureDetails[futureDetails.length - 2].fdr + futureDetails[futureDetails.length - 1].fdr) / 2;
                if (last2 < first2 - 0.5) fixtureSwing = 'improving';
                else if (last2 > first2 + 0.5) fixtureSwing = 'worsening';
            }

            return {
                id: teamId,
                code: team.code,
                name: team.name,
                shortName: team.short_name,
                badgeUrl: `https://resources.premierleague.com/premierleague/badges/50/t${team.code}.png`,
                formScore,
                attackRating,
                defenseRating,
                avgFdr: avgFdr.toFixed(1),
                avgXG: avgXG.toFixed(2),
                avgXGA: avgXGA.toFixed(2),
                wins, draws, losses,
                homeFixtures,
                awayFixtures: futureDetails.length - homeFixtures,
                pastResults,
                futureFixtures: futureDetails,
                xGHistory,
                fixtureSwing
            };
        }

        // ===== RENDERING =====
        function renderCurrentView() {
            const grid = document.getElementById('teams-grid');
            const contentArea = document.getElementById('content-area');

            // Reset content area to just the grid
            contentArea.innerHTML = '<div class="teams-grid" id="teams-grid"></div>';
            const newGrid = document.getElementById('teams-grid');

            switch (currentView) {
                case 'overview':
                    const overviewSorted = [...allTeamsData].sort((a, b) => b.formScore - a.formScore);
                    newGrid.innerHTML = overviewSorted.map((team, i) => createTeamCard(team, i + 1, 'form')).join('');
                    break;

                case 'attack':
                    const attackSorted = [...allTeamsData].sort((a, b) => b.attackRating - a.attackRating);
                    newGrid.innerHTML = attackSorted.map((team, i) => createTeamCard(team, i + 1, 'attack')).join('');
                    break;

                case 'defense':
                    const defenseSorted = [...allTeamsData].sort((a, b) => b.defenseRating - a.defenseRating);
                    newGrid.innerHTML = defenseSorted.map((team, i) => createTeamCard(team, i + 1, 'defense')).join('');
                    break;

                case 'swings':
                    renderFixtureSwings(contentArea);
                    break;
            }
        }

        function createTeamCard(team, rank, mode = 'form') {
            const primaryValue = mode === 'form' ? team.formScore : 
                                 mode === 'attack' ? team.attackRating : team.defenseRating;
            const primaryLabel = mode === 'form' ? 'Form Score' : 
                                 mode === 'attack' ? 'Attack Rating' : 'Defense Rating';
            
            const valueClass = primaryValue >= 65 ? 'success' : primaryValue >= 45 ? 'warning' : 'error';

            // Create FDR strip
            const fdrStrip = team.futureFixtures.map(f => `
                <div class="fdr-badge fdr-${f.fdr}">
                    <span class="opp">${f.opponent}</span>
                    <span class="venue">${f.isHome ? 'H' : 'A'}</span>
                </div>
            `).join('');

            // Create form dots
            const formDots = team.pastResults.map(r => `
                <div class="form-dot ${r.result.toLowerCase() === 'w' ? 'win' : r.result.toLowerCase() === 'd' ? 'draw' : 'loss'}" 
                     data-tooltip="${r.opponent} ${r.score}"></div>
            `).join('');

            // Trend badge
            const trendClass = team.fixtureSwing === 'improving' ? 'improving' : 
                               team.fixtureSwing === 'worsening' ? 'worsening' : 'stable';
            const trendText = team.fixtureSwing === 'improving' ? '↑ Easier' : 
                              team.fixtureSwing === 'worsening' ? '↓ Harder' : '→ Stable';

            // Gauge calculation
            const circumference = 2 * Math.PI * 22;
            const offset = circumference - (primaryValue / 100) * circumference;
            const gaugeColor = primaryValue >= 65 ? '#4ADE80' : primaryValue >= 45 ? '#FBBF24' : '#F87171';

            return `
                <div class="team-card" data-team="${team.name}">
                    <div class="card-header">
                        <div class="team-badge">
                            <img src="${team.badgeUrl}" alt="${team.shortName}" onerror="this.style.display='none'">
                        </div>
                        <div class="team-info">
                            <div class="team-name">${team.name}</div>
                            <div class="team-meta">${team.homeFixtures}H ${team.awayFixtures}A next 5</div>
                        </div>
                        <div class="rank-badge ${rank <= 3 ? 'top-3' : ''}">${rank}</div>
                    </div>

                    <div class="primary-metric">
                        <div>
                            <div class="metric-label">${primaryLabel}</div>
                            <div class="form-dots" style="margin-top: 4px;">
                                ${formDots}
                            </div>
                        </div>
                        <div class="gauge-container">
                            <svg class="gauge-svg" width="56" height="56" viewBox="0 0 56 56">
                                <circle class="gauge-bg" cx="28" cy="28" r="22"/>
                                <circle class="gauge-fill" cx="28" cy="28" r="22" 
                                    stroke="${gaugeColor}"
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${offset}"/>
                            </svg>
                            <span class="gauge-text metric-value ${valueClass}">${primaryValue}</span>
                        </div>
                    </div>

                    <div class="fdr-strip">
                        ${fdrStrip}
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="trend ${trendClass}">${trendText}</span>
                        <span style="font-size: 11px; color: var(--text-muted);">FDR ${team.avgFdr}</span>
                    </div>

                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-label">xG/G</div>
                            <div class="stat-value" style="color: ${parseFloat(team.avgXG) >= 1.5 ? 'var(--color-success)' : 'var(--text-primary)'}">
                                ${team.avgXG}
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">xGA/G</div>
                            <div class="stat-value" style="color: ${parseFloat(team.avgXGA) <= 1.2 ? 'var(--color-success)' : 'var(--text-primary)'}">
                                ${team.avgXGA}
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">W-D-L</div>
                            <div class="stat-value">${team.wins}-${team.draws}-${team.losses}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFixtureSwings(container) {
            // Find teams with good swing opportunities
            const swingTeams = allTeamsData
                .filter(t => t.fixtureSwing === 'improving' || parseFloat(t.avgFdr) <= 2.8)
                .sort((a, b) => parseFloat(a.avgFdr) - parseFloat(b.avgFdr))
                .slice(0, 8);

            const html = `
                <div class="swing-section">
                    <div class="swing-header">
                        <h2 class="swing-title">Teams with Favorable Fixture Swings</h2>
                    </div>
                    <div class="swing-grid">
                        ${swingTeams.map(team => {
                            const timing = team.fixtureSwing === 'improving' ? 'buy-now' : 'buy-soon';
                            const timingText = team.fixtureSwing === 'improving' ? 'Buy Now' : 'Good Fixtures';
                            
                            return `
                                <div class="swing-card ${timing}">
                                    <div class="swing-team">
                                        <div class="team-badge">
                                            <img src="${team.badgeUrl}" alt="${team.shortName}" style="width: 28px; height: 28px;">
                                        </div>
                                        <div>
                                            <div class="team-name">${team.name}</div>
                                            <div style="font-size: 11px; color: var(--text-muted);">FDR ${team.avgFdr}</div>
                                        </div>
                                        <span class="swing-timing ${timing}">${timingText}</span>
                                    </div>
                                    <div class="fdr-strip">
                                        ${team.futureFixtures.map(f => `
                                            <div class="fdr-badge fdr-${f.fdr}">
                                                <span class="opp">${f.opponent}</span>
                                                <span class="venue">${f.isHome ? 'H' : 'A'}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="swing-signals">
                                        ${parseFloat(team.avgFdr) <= 2.5 ? '<span class="signal-tag">🟢 Easy run</span>' : ''}
                                        ${team.homeFixtures >= 3 ? `<span class="signal-tag">🏠 ${team.homeFixtures} home</span>` : ''}
                                        ${parseFloat(team.avgXG) >= 1.5 ? '<span class="signal-tag">⚡ High xG</span>' : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }
    </script>
