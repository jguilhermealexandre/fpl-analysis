                const swing = avgFirst - avgNext;

                // Lowered threshold to 0.3 to capture more swings
                if (Math.abs(swing) > 0.3) {
                    const nextFixtures = getFixtures(next3);
                    const currentFixtures = getFixtures(first3);
                    const homeCountNext = nextFixtures.filter(f => f.isHome).length;
                    const homeCountCurrent = currentFixtures.filter(f => f.isHome).length;

                    // Also look at longer windows: GW1-5 vs GW6-10
                    let longSwing = null;
                    if (futureGWs.length >= 10) {
                        const first5 = futureGWs.slice(0, 5);
                        const next5 = futureGWs.slice(5, 10);
                        const avgFirst5 = getAvg(first5);
                        const avgNext5 = getAvg(next5);
                        longSwing = {
                            currentFdr: avgFirst5.toFixed(1),
                            futureFdr: avgNext5.toFixed(1),
                            swing: (avgFirst5 - avgNext5).toFixed(2),
                            fixtures: getFixtures(next5)
                        };
                    }

                    swings.push({
                        teamId: team.id,
                        teamName: team.name,
                        teamShort: team.shortName,
                        badgeUrl: team.badgeUrl,
                        swing,
                        direction: swing > 0 ? 'improving' : 'worsening',
                        currentFdr: avgFirst.toFixed(1),
                        futureFdr: avgNext.toFixed(1),
                        swingGW: futureGWs[3],
                        currentFixtures,
                        nextFixtures,
                        homeCountNext,
                        homeCountCurrent,
                        longSwing,
                        xgFor: team.xgFor,
                        xgAgainst: team.xgAgainst,
                        last5Ppg: team.last5Ppg,
                        allFutureFixtures: getFixtures(futureGWs.slice(0, 10))
                    });
                }
            });

            // Sort: improving by biggest positive swing, worsening by biggest negative
            return swings.sort((a, b) => b.swing - a.swing);
        }

        // ===== MODAL FUNCTIONS =====
        function openModal(headerHtml, bodyHtml) {
            document.getElementById('modalHeader').innerHTML = headerHtml;
            document.getElementById('modalBody').innerHTML = bodyHtml;
            document.getElementById('modalOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function getFdrColor(fdr) {
            const rounded = Math.round(fdr);
            const colors = { 1: '#4ADE80', 2: '#86EFAC', 3: '#A3A3A3', 4: '#FB923C', 5: '#EF4444' };
            return colors[rounded] || '#A3A3A3';
        }

        function getFdrTextColor(fdr) {
            return Math.round(fdr) >= 5 ? '#fff' : '#000';
        }

        function teamOrdinal(n) {
            const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        // Where a team sits across the league on one metric. A bare "62/100"
        // means nothing without knowing whether that is second or twelfth.
        function teamRankOf(team, key, higherIsBetter) {
            const vals = allTeamsData
                .map(t => ({ id: t.id, v: parseFloat(t[key]) }))
                .filter(x => !isNaN(x.v));
            if (!vals.length) return null;
            vals.sort((a, b) => higherIsBetter ? b.v - a.v : a.v - b.v);
            const i = vals.findIndex(x => x.id === team.id);
            return i < 0 ? null : { rank: i + 1, total: vals.length };
        }

        function teamRankPill(label, r, tip) {
            if (!r) return '';
            // Top third is a strength, bottom third a weakness, whichever way the
            // metric runs — the sort above has already handled direction.
            const cls = r.rank <= r.total / 3 ? 'good' : r.rank > (r.total * 2) / 3 ? 'bad' : '';
            return `<div class="report-rank ${cls}" data-tooltip="${escHTML(tip || '')}">
                <div class="report-rank-v">${teamOrdinal(r.rank)}</div>
                <div class="report-rank-l">${escHTML(label)}</div>
            </div>`;
        }

        function openTeamReport(teamId) {
            const team = allTeamsData.find(t => t.id === teamId);
            if (!team) return;

            /* Almost every counting stat on this object is a LAST FIVE MATCHES
               figure: pastFixtures is .slice(-5) before anything is summed, so
               totalGoals, totalXG, cleanSheets, wins/draws/losses, avgConceded and
               the venue splits are all five-match numbers. seasonXg is the only
               genuine season-long series. They used to be labelled "Goals", "xG"
               and "CS" side by side with season xG, which reads as a season total
               and is out by a factor of four. Every window is now stated. */
            const gp = (team.wins || 0) + (team.draws || 0) + (team.losses || 0);
            const windowLabel = gp ? `last ${gp}` : 'no games';

            const header = `
                <img src="${team.badgeUrl}" alt="${escHTML(team.shortName)}" class="modal-header-badge" onerror="this.style.display='none'">
                <div class="modal-header-info">
                    <div class="modal-title">${escHTML(team.name)}</div>
                    <div class="modal-subtitle">${team.wins}W ${team.draws}D ${team.losses}L <span class="modal-window">(${escHTML(windowLabel)})</span> &nbsp;•&nbsp; Avg <abbr title="Fixture Difficulty Rating (1=easiest, 5=hardest)">FDR</abbr> ${team.avgFdr} next 5</div>
                </div>
                <button class="modal-close" onclick="closeModal()" aria-label="Close modal">✕</button>
            `;

            /* Four quantities, each with its own unit, where there used to be
               four 0-100 indices. The bar still shows where they sit in the
               league — that is what a bar is good at — but the number beside it
               is now the thing being measured, and two of the four are better
               when they are smaller. */
            const barPct = (v, lo, hi) => Math.max(2, Math.min(100, ((v - lo) / (hi - lo)) * 100));
            const glanceBars = [
                { label: 'xG for', value: (team.xgFor ?? 0).toFixed(2), unit: 'a game',
                  pct: barPct(team.xgFor ?? 1.42, 0.55, 2.45), good: (team.xgFor ?? 0) >= 1.7, bad: (team.xgFor ?? 0) < 1.1,
                  color: 'var(--color-error)', tip: 'Goals this side is expected to score in a game. A league-average attack is about 1.4.' },
                { label: 'xG against', value: (team.xgAgainst ?? 0).toFixed(2), unit: 'a game',
                  pct: barPct(2.45 - (team.xgAgainst ?? 1.42), 0, 1.90), good: (team.xgAgainst ?? 9) <= 1.15, bad: (team.xgAgainst ?? 0) > 1.65,
                  color: 'var(--color-info)', tip: 'Goals this side is expected to concede in a game. Lower is better — the bar is filled for a good defence, not a leaky one.' },
                { label: 'Fixtures', value: (team.avgFdrNum ?? 3).toFixed(1), unit: 'avg FDR next 5',
                  pct: barPct(5 - (team.avgFdrNum ?? 3), 0, 4), good: (team.avgFdrNum ?? 5) <= 2.6, bad: (team.avgFdrNum ?? 0) >= 3.6,
                  color: 'var(--color-success)', tip: 'Average fixture difficulty over the next five. 1 is the easiest fixture, 5 the hardest.' },
                { label: 'Form', value: (team.last5Ppg ?? 0).toFixed(2), unit: `pts a game (last ${gp})`,
                  pct: barPct(team.last5Ppg ?? 0, 0, 3), good: (team.last5Ppg ?? 0) >= 2, bad: (team.last5Ppg ?? 0) < 1,
                  color: 'var(--color-warning)', tip: 'Points per game across the same window as the record above.' }
            ].map(m => {
                const cls = m.good ? 'good' : m.bad ? 'bad' : '';
                return `<div class="report-bar-row" data-tooltip="${escHTML(m.tip)}">
                    <div class="report-bar-label">${m.label}</div>
                    <div class="report-bar"><div class="report-bar-fill" style="width:${m.pct}%;background:${m.color}"></div></div>
                    <div class="report-bar-value ${cls}">${m.value}<em class="report-bar-unit">${escHTML(m.unit)}</em></div>
                </div>`;
            }).join('');

            // Key stats grid
            const statsGrid = `
                <div class="report-grid">
                    <div class="report-stat">
                        <div class="report-stat-value">${team.totalGoals}</div>
                        <div class="report-stat-label" data-tooltip="Goals scored across their last ${gp} matches, not the season.">Goals (${escHTML(windowLabel)})</div>
                    </div>
                    <div class="report-stat">
                        <div class="report-stat-value">${team.totalXG}</div>
                        <div class="report-stat-label" data-tooltip="Expected goals across the same ${gp} matches. Compare with goals beside it to see over- or under-performance.">xG (${escHTML(windowLabel)})</div>
                    </div>
                    <div class="report-stat">
                        <div class="report-stat-value">${team.cleanSheets}</div>
                        <div class="report-stat-label" data-tooltip="Clean sheets in their last ${gp} matches — ${gp ? Math.round((team.cleanSheets / gp) * 100) : 0}% of them.">CS (${escHTML(windowLabel)})</div>
                    </div>
                    <div class="report-stat">
                        <div class="report-stat-value ${parseFloat(team.bullyIndex) >= 60 ? 'good' : ''}">${team.bullyIndex}</div>
                        <div class="report-stat-label">Bully Index</div>
                    </div>
                </div>
            `;

            // Venue splits
            /* homeStats/awayStats carry raw counts only — {goals, conceded, games,
               wins, cleanSheets}. The rows below read avgGoals/avgConceded off
               them, which never existed: Home silently fell back to the team's
               overall average and Away printed a dash, so the "Venue Split"
               section showed no split on the two rows it exists for. Derived from
               the counts instead. */
            const withAvgs = s => {
                const o = Object.assign({}, s || {});
                if (o.games > 0) {
                    o.avgGoals = o.goals / o.games;
                    o.avgConceded = o.conceded / o.games;
                }
                return o;
            };
            const hs = withAvgs(team.homeStats);
            const as = withAvgs(team.awayStats);
            const venueSplit = `
                <div class="report-venue-split">
                    <div class="report-venue-card">
                        <div class="report-venue-title"><i data-lucide="home" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i> Home</div>
                        <div class="report-venue-stat"><span>xG for</span><span>${(team.xgForHome ?? 0).toFixed(2)}</span></div>
                        <div class="report-venue-stat"><span>xG against</span><span>${(team.xgAgainstHome ?? 0).toFixed(2)}</span></div>
                        <div class="report-venue-stat"><span>Avg Goals</span><span>${hs.avgGoals !== undefined ? hs.avgGoals.toFixed(2) : team.avgGoals}</span></div>
                        <div class="report-venue-stat"><span>Avg Conceded</span><span>${hs.avgConceded !== undefined ? hs.avgConceded.toFixed(2) : '-'}</span></div>
                        <div class="report-venue-stat"><span>Record</span><span>${hs.games ? `${hs.wins}W of ${hs.games}` : '—'}</span></div>
                        <div class="report-venue-stat"><span>Clean sheets</span><span>${hs.games ? `${hs.cleanSheets} of ${hs.games}` : '—'}</span></div>
                    </div>
                    <div class="report-venue-card">
                        <div class="report-venue-title"><i data-lucide="plane" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i> Away</div>
                        <div class="report-venue-stat"><span>xG for</span><span>${(team.xgForAway ?? 0).toFixed(2)}</span></div>
                        <div class="report-venue-stat"><span>xG against</span><span>${(team.xgAgainstAway ?? 0).toFixed(2)}</span></div>
                        <div class="report-venue-stat"><span>Avg Goals</span><span>${as.avgGoals !== undefined ? as.avgGoals.toFixed(2) : '-'}</span></div>
                        <div class="report-venue-stat"><span>Avg Conceded</span><span>${as.avgConceded !== undefined ? as.avgConceded.toFixed(2) : '-'}</span></div>
                        <div class="report-venue-stat"><span>Record</span><span>${as.games ? `${as.wins}W of ${as.games}` : '—'}</span></div>
                        <div class="report-venue-stat"><span>Clean sheets</span><span>${as.games ? `${as.cleanSheets} of ${as.games}` : '—'}</span></div>
                    </div>
                </div>
            `;

            // xG analysis
            let xgSection = '';
            if (team.hasRealXg && team.seasonXg) {
                const sxg = team.seasonXg;
                const diff = parseFloat(team.xgDiff);
                const diffCls = diff > 3 ? 'warn' : diff < -3 ? 'good' : '';
                const xgcDiff = parseFloat(team.xgcDiff);
                const xgcDiffCls = xgcDiff > 3 ? 'bad' : xgcDiff < -3 ? 'good' : '';
                const trendLabel = team.xgTrend === 'rising' ? '↑ Rising' : team.xgTrend === 'falling' ? '↓ Falling' : '→ Stable';
                const trendCls = team.xgTrend === 'rising' ? 'good' : team.xgTrend === 'falling' ? 'bad' : '';
                xgSection = `
                    <div class="modal-section">
                        <div class="modal-section-title">xG Analysis</div>
                        <div class="report-grid">
                            <div class="report-stat">
                                <div class="report-stat-value">${sxg.xg !== undefined ? sxg.xg.toFixed(1) : team.totalXG}</div>
                                <div class="report-stat-label">Season xG</div>
                            </div>
                            <div class="report-stat">
                                <div class="report-stat-value ${diffCls}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}</div>
                                <div class="report-stat-label">Goals - xG</div>
                            </div>
                            <div class="report-stat">
                                <div class="report-stat-value ${xgcDiffCls}">${xgcDiff > 0 ? '+' : ''}${xgcDiff.toFixed(1)}</div>
                                <div class="report-stat-label">GC - xGC</div>
                            </div>
                            <div class="report-stat">
                                <div class="report-stat-value ${trendCls}">${trendLabel}</div>
                                <div class="report-stat-label">xG Trend</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            /* ===== THE LAST FIVE, MATCH BY MATCH =====

               Season averages say what a side usually does; this says what it
               has just done, and shows the expectation beside the outcome in
               both directions. A run of games where the xG is fine and the goals
               are not is a different problem from one where neither is, and no
               average distinguishes them. */
            const recent = team.recentMatches || [];
            const recentRows = recent.map(m => {
                const opp = allTeamsData.find(t => t.id === m.opponentId);
                const gd = m.goals - m.xG, cd = m.conceded - m.xGC;
                const cell = (exp, act, lowerIsBetter) => {
                    const d = act - exp;
                    const cls = Math.abs(d) < 0.5 ? 'level' : (lowerIsBetter ? d < 0 : d > 0) ? 'over' : 'under';
                    return `<td class="l5-cell ${cls}"><span class="l5-act">${act}</span><span class="l5-exp">${exp.toFixed(2)}</span></td>`;
                };
                return `<tr>
                    <td class="l5-gw">GW${m.gw}</td>
                    <td class="l5-opp">${escHTML(opp ? opp.shortName : '???')}<span class="l5-ha">${m.isHome ? 'H' : 'A'}</span></td>
                    ${cell(m.xG, m.goals, false)}
                    ${cell(m.xGC, m.conceded, true)}
                    <td class="l5-res ${m.goals > m.conceded ? 'w' : m.goals < m.conceded ? 'l' : 'd'}">${m.goals}-${m.conceded}</td>
                </tr>`;
            }).join('');
            const l5Tot = recent.reduce((a, m) => ({
                xG: a.xG + m.xG, goals: a.goals + m.goals,
                xGC: a.xGC + m.xGC, conceded: a.conceded + m.conceded
            }), { xG: 0, goals: 0, xGC: 0, conceded: 0 });
            const lastFiveSection = !recentRows ? '' : `
                <div class="modal-section">
                    <div class="modal-section-title">Last ${recent.length} — expected against actual</div>
                    <table class="l5-table">
                        <thead><tr>
                            <th>GW</th><th>Opp</th>
                            <th data-tooltip="Goals scored, with the expected goals that produced them underneath.">Scored / xG</th>
                            <th data-tooltip="Goals conceded, with the expected goals conceded underneath.">Let in / xGC</th>
                            <th>Score</th>
                        </tr></thead>
                        <tbody>${recentRows}</tbody>
                        <tfoot><tr>
                            <td colspan="2" class="l5-gw">Total</td>
                            <td class="l5-cell ${Math.abs(l5Tot.goals - l5Tot.xG) < 1.5 ? 'level' : l5Tot.goals > l5Tot.xG ? 'over' : 'under'}">
                                <span class="l5-act">${l5Tot.goals}</span><span class="l5-exp">${l5Tot.xG.toFixed(2)}</span></td>
                            <td class="l5-cell ${Math.abs(l5Tot.conceded - l5Tot.xGC) < 1.5 ? 'level' : l5Tot.conceded < l5Tot.xGC ? 'over' : 'under'}">
                                <span class="l5-act">${l5Tot.conceded}</span><span class="l5-exp">${l5Tot.xGC.toFixed(2)}</span></td>
                            <td></td>
                        </tr></tfoot>
                    </table>
                    <div class="l5-summary">
                        ${renderXgVsActual('Scored', l5Tot.xG, l5Tot.goals, { threshold: 1.5, expectedLabel: 'xG', actualLabel: 'goals' })}
                        ${renderXgVsActual('Conceded', l5Tot.xGC, l5Tot.conceded, { threshold: 1.5, lowerIsBetter: true, expectedLabel: 'xGC', actualLabel: 'goals' })}
                    </div>
                    <p class="l5-note">Green means the outcome beat the expectation — goals above xG, or fewer conceded than xGC. Finishing and goalkeeping swing these; the expected column is the one that tends to persist.</p>
                </div>`;

            // Recent form
            const formStrip = team.pastResults.slice(0, 5).map(r => {
                const cls = r.result.toLowerCase();
                return `<div class="report-form-item">
                    <div class="report-form-result ${cls}">${r.result.toUpperCase()}</div>
                    <div class="report-form-opp">${escHTML(r.opponent)}</div>
                    <div class="report-form-score">${escHTML(r.score)}</div>
                </div>`;
            }).join('');

            // Fixture outlook (next 5)
            const fdrRow = team.futureFixtures.slice(0, 5).map(f => {
                const bg = getFdrColor(f.fdr);
                const tc = getFdrTextColor(f.fdr);
                return `<div class="report-fdr-match" style="background:${bg};color:${tc};">
                    <span class="report-fdr-opp">${escHTML(f.opponent)}</span>
                    <span class="report-fdr-venue">${f.isHome ? 'HOME' : 'AWAY'}</span>
                    ${f.csChance ? `<span class="report-fdr-cs">CS ${(f.csChance * 100).toFixed(0)}%</span>` : ''}
                </div>`;
            }).join('');

            /* One FDR number answers two different questions badly. The fixture
               map already separates them — attackFdr is set by the opponent's
               defence and defenseFdr by their attack — so a fixture can be kind
               to your striker and hostile to your defender at the same time.
               Nothing on this page was surfacing the distinction. */
            const fxMap = window._teamFixtureMap || {};
            const splitGWs = Object.keys(fxMap[teamId] || {}).map(Number)
                .filter(g => g >= currentGW).sort((a, b) => a - b).slice(0, 5);
            const splitRows = splitGWs.map(gw => (fxMap[teamId][gw] || []).map(f => `
                <tr>
                    <td class="fx-split-gw">GW${gw}</td>
                    <td class="fx-split-opp">${escHTML(f.opponent)} <span class="fx-split-ha">${f.isHome ? 'H' : 'A'}</span></td>
                    <td><span class="fx-split-chip fdr-${f.attackFdr}" data-tooltip="How kind this is to ${escHTML(team.shortName)}'s attackers — set by the opponent's defence.">${f.attackFdr}</span></td>
                    <td><span class="fx-split-chip fdr-${f.defenseFdr}" data-tooltip="How kind this is to ${escHTML(team.shortName)}'s defenders and keeper — set by the opponent's attack.">${f.defenseFdr}</span></td>
                    <td class="fx-split-cs">${f.csChance != null ? Math.round(f.csChance * 100) + '%' : '—'}</td>
                </tr>`).join('')).join('');
            const fixtureSplitSection = splitRows ? `
                <table class="fx-split-table">
                    <thead><tr><th>GW</th><th>Opponent</th>
                        <th data-tooltip="Fixture difficulty for this team's attackers.">ATT</th>
                        <th data-tooltip="Fixture difficulty for this team's defenders.">DEF</th>
                        <th data-tooltip="Estimated clean sheet chance.">CS</th></tr></thead>
                    <tbody>${splitRows}</tbody>
                </table>
                <p class="fx-split-note">Attack and defence difficulty are rated separately — a fixture can suit one and punish the other.</p>` : '';

            // ===== Where they rank across the league =====
            const rAtt = teamRankOf(team, 'xgFor', true);
            // Fewer expected goals conceded is a better defence, so this one ranks upward from the bottom.
            const rDef = teamRankOf(team, 'xgAgainst', false);
            const rForm = teamRankOf(team, 'last5Ppg', true);
            const rFix = teamRankOf(team, 'avgFdrNum', false);
            const rConc = teamRankOf(team, 'avgConceded', false);
            const rankSection = `
                <div class="modal-section">
                    <div class="modal-section-title">Where They Rank</div>
                    <div class="report-ranks">
                        ${teamRankPill('Attack', rAtt, `${(team.xgFor ?? 0).toFixed(2)} expected goals a game — ${rAtt ? teamOrdinal(rAtt.rank) + ' of ' + rAtt.total : ''}.`)}
                        ${teamRankPill('Defence', rDef, `${(team.xgAgainst ?? 0).toFixed(2)} expected goals conceded a game — ${rDef ? teamOrdinal(rDef.rank) + ' tightest of ' + rDef.total : ''}.`)}
                        ${teamRankPill('Form', rForm, `${(team.last5Ppg ?? 0).toFixed(2)} points a game — ${rForm ? teamOrdinal(rForm.rank) + ' of ' + rForm.total : ''}.`)}
                        ${teamRankPill('Fixtures', rFix, `Next five fixtures, ${rFix ? teamOrdinal(rFix.rank) + ' kindest of ' + rFix.total : ''}.`)}
                        ${teamRankPill('Tightest', rConc, `${parseFloat(team.avgConceded).toFixed(2)} conceded per game — ${rConc ? teamOrdinal(rConc.rank) + ' tightest of ' + rConc.total : ''}.`)}
                    </div>
                </div>`;

            // ===== How attackable they are — the Soft Targets read, per team =====
            const softScore = softTargetScore(team);
            const softSection = softScore === null ? '' : `
                <div class="modal-section">
                    <div class="modal-section-title">How Attackable Are They</div>
                    <div class="report-soft">
                        <div class="report-soft-score ${softScore >= 60 ? 'bad' : softScore <= 35 ? 'good' : ''}">${softScore}<span>/100</span></div>
                        <div class="report-soft-text">
                            ${softScore >= 60
                                ? `A soft target right now — ${parseFloat(team.avgConceded).toFixed(2)} conceded per game and ${gp ? Math.round((team.cleanSheets / gp) * 100) : 0}% clean sheets across their last ${gp}. Their upcoming opponents' attackers are worth a look.`
                                : softScore <= 35
                                    ? `A hard team to score against right now. Their opponents' attackers are a tougher sell, and their own defensive assets carry more value.`
                                    : `Middling — neither a free hit nor a wall. Fixture and venue matter more than the defence itself here.`}
                            ${team.xgcTrend === 'worsening' ? ' They are conceding more than their season rate lately.' : team.xgcTrend === 'improving' ? ' They have been tightening up lately, so the raw record overstates how soft they are.' : ''}
                            ${Math.abs((team.xgAgainstHome ?? 1.42) - (team.xgAgainstAway ?? 1.42)) > 0.25
                                ? ` Notably ${(team.xgAgainstHome ?? 1.42) < (team.xgAgainstAway ?? 1.42) ? 'softer away from home' : 'softer at home'}.`
                                : ''}
                        </div>
                    </div>
                </div>`;

            // ===== Best FPL assets — previously stranded in a separate modal =====
            const POS_MAP = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            const assets = (window.playerElements || [])
                .filter(e => e.team === teamId && e.status === 'a' && e.minutes > 0)
                .map(e => ({
                    name: e.web_name, pos: POS_MAP[e.element_type] || '?',
                    price: e.now_cost / 10, points: e.total_points,
                    form: parseFloat(e.form) || 0, own: parseFloat(e.selected_by_percent) || 0,
                    xGI: parseFloat(e.expected_goal_involvements) || 0
                }))
                .sort((a, b) => (b.points - a.points) || (b.form - a.form))
                .slice(0, 8);
            const assetsSection = `
                <div class="modal-section">
                    <div class="modal-section-title">Best FPL Assets</div>
                    ${assets.length ? `<table class="assets-table">
                        <thead><tr><th>Player</th><th>Pos</th><th>Price</th><th>Pts</th><th>Form</th><th>xGI</th><th>Owned</th></tr></thead>
                        <tbody>${assets.map(p => `<tr>
                            <td class="assets-name">${escHTML(p.name)}</td>
                            <td><span class="assets-pos pos-${p.pos}">${p.pos}</span></td>
                            <td>£${p.price.toFixed(1)}m</td>
                            <td><strong>${p.points}</strong></td>
                            <td>${p.form.toFixed(1)}</td>
                            <td>${p.xGI.toFixed(2)}</td>
                            <td>${p.own.toFixed(1)}%</td>
                        </tr>`).join('')}</tbody>
                    </table>
                    <p class="assets-note">Ranked on points scored this season, restricted to players with minutes.</p>`
                    : '<p class="assets-empty">No players with minutes recorded yet at this club.</p>'}
                </div>`;

            // Build verdict
            const verdictParts = [];
            const vXgF = team.xgFor ?? 1.42, vXgA = team.xgAgainst ?? 1.42;
            if (vXgF >= 1.75) verdictParts.push(`Strong attacking side — ${vXgF.toFixed(2)} expected goals a game.`);
            else if (vXgF < 1.10) verdictParts.push(`Weak in attack — ${vXgF.toFixed(2)} expected goals a game.`);
            if (vXgA <= 1.10) verdictParts.push(`Solid defence — ${vXgA.toFixed(2)} expected goals conceded a game, so target clean sheet players.`);
            else if (vXgA > 1.70) verdictParts.push(`Leaky defence — ${vXgA.toFixed(2)} expected goals conceded a game, so avoid defensive assets.`);
            if ((team.avgFdrNum ?? 3) <= 2.6) verdictParts.push(`Favourable upcoming fixtures.`);
            else if ((team.avgFdrNum ?? 3) >= 3.6) verdictParts.push(`Tough fixture run ahead.`);
            if (team.venueLabel) verdictParts.push(`${team.venueEmoji || ''} ${team.venueLabel}.`);
            const xgDiffVal = parseFloat(team.xgDiff);
            if (xgDiffVal > 3) verdictParts.push(`Overperforming xG — regression risk.`);
            else if (xgDiffVal < -3) verdictParts.push(`Underperforming xG — due a goals boost.`);
            if (verdictParts.length === 0) verdictParts.push('Mid-table profile with balanced metrics.');

            const body = `
                <div class="modal-section">
                    <div class="modal-section-title">At a Glance</div>
                    ${glanceBars}
                </div>
                ${rankSection}
                <div class="modal-section">
                    <div class="modal-section-title">Key Stats</div>
                    ${statsGrid}
                </div>
                ${softSection}
                <div class="modal-section">
                    <div class="modal-section-title">Venue Split</div>
                    ${venueSplit}
                </div>
                ${xgSection}
                ${lastFiveSection}
                <div class="modal-section">
                    <div class="modal-section-title">Recent Form <span class="modal-window">oldest to latest</span></div>
                    <div class="report-form-strip">${formStrip}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Fixture Outlook</div>
                    <div class="report-fdr-row">${fdrRow}</div>
                    ${fixtureSplitSection}
                </div>
                ${assetsSection}
                <div class="modal-section">
                    <div class="modal-section-title">Verdict</div>
                    <div class="report-verdict"><p>${verdictParts.join(' ')}</p></div>
                </div>
            `;

            openModal(header, body);
        }

        function openEasyRunModal(index) {
            const runs = window._easyRunsData.filter(r => r.startGW >= currentGW);
            const run = runs[index];
            if (!run) return;

            const team = allTeamsData.find(t => t.id === run.teamId);
            const tierMap = {
                premium: { bg: 'rgba(74, 222, 128, 0.15)', color: 'var(--color-success)', label: 'PREMIUM RUN' },
                great: { bg: 'rgba(96, 165, 250, 0.15)', color: 'var(--color-info)', label: 'GREAT RUN' },
                good: { bg: 'rgba(251, 191, 36, 0.12)', color: 'var(--color-warning)', label: 'GOOD PATCH' }
            };
            const tier = tierMap[run.tier] || tierMap.good;
            const avgFdrClass = run.avgFdr <= 2.2 ? 'good' : run.avgFdr <= 2.7 ? 'info' : 'warn';

            const header = `
                <img src="${run.badgeUrl}" alt="${escHTML(run.teamShort)}" class="modal-header-badge" onerror="this.style.display='none'">
                <div class="modal-header-info">
                    <div class="modal-title">${escHTML(run.teamName)}</div>
                    <div class="modal-subtitle" style="display:flex;align-items:center;gap:8px;">
                        <span>GW${run.startGW} → GW${run.endGW}</span>
                        <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: ${tier.bg}; color: ${tier.color}; font-weight: 700;">${tier.label}</span>
                    </div>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            `;

            const body = `
                <div class="modal-section">
                    <div class="modal-stat-grid">
                        <div class="modal-stat">
                            <div class="modal-stat-label">Run Length</div>
                            <div class="modal-stat-value good">${run.length}</div>
                            <div class="modal-stat-sub">gameweeks</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Avg <abbr title="Fixture Difficulty Rating (1=easiest, 5=hardest)">FDR</abbr></div>
                            <div class="modal-stat-value ${avgFdrClass}">${run.avgFdr}</div>
                            <div class="modal-stat-sub">difficulty</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Home Games</div>
                            <div class="modal-stat-value info">${run.homeCount}</div>
                            <div class="modal-stat-sub">of ${run.length}</div>
                        </div>
                    </div>
                    <div class="modal-stat-grid">
                        <div class="modal-stat">
                            <div class="modal-stat-label">Easy GWs</div>
                            <div class="modal-stat-value good">${run.easyCount}</div>
                            <div class="modal-stat-sub">FDR ≤ 2</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Hard GWs</div>
                            <div class="modal-stat-value ${run.hardCount === 0 ? 'good' : 'bad'}">${run.hardCount}</div>
                            <div class="modal-stat-sub">FDR ≥ 4</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label" data-tooltip="Points per game over the recent window.">Form (pts/g)</div>
                            <div class="modal-stat-value ${run.last5Ppg >= 2 ? 'good' : run.last5Ppg < 1 ? 'bad' : 'warn'}">${(run.last5Ppg ?? 0).toFixed(2)}</div>
                            <div class="modal-stat-sub">pts/game</div>
                        </div>
                    </div>
                    <div class="modal-stat-grid">
                        <div class="modal-stat">
                            <div class="modal-stat-label" data-tooltip="Expected goals a game.">xG for</div>
                            <div class="modal-stat-value ${run.xgFor >= 1.7 ? 'good' : run.xgFor < 1.1 ? 'bad' : ''}">${(run.xgFor ?? 0).toFixed(2)}</div>
                            <div class="modal-stat-sub">xG/game</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label" data-tooltip="Expected goals conceded a game — lower is better.">xG against</div>
                            <div class="modal-stat-value ${run.xgAgainst <= 1.15 ? 'good' : run.xgAgainst > 1.65 ? 'bad' : ''}">${(run.xgAgainst ?? 0).toFixed(2)}</div>
                            <div class="modal-stat-sub">xGC/game</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Home %</div>
                            <div class="modal-stat-value info">${Math.round((run.homeCount / run.length) * 100)}%</div>
                            <div class="modal-stat-sub">advantage</div>
                        </div>
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">Fixture Breakdown</div>
                    ${run.fixtures.map(f => {
                        const effFdr = getEffectiveFdr(f);
                        const barWidth = Math.max(10, (5 - effFdr) / 4 * 100);
                        const barColor = getFdrColor(effFdr);
                        return `
                            <div class="modal-fdr-row">
                                <span class="modal-fdr-gw">GW${f.gw}</span>
                                <div class="modal-fdr-dot fdr-${Math.round(effFdr)}" style="color: ${getFdrTextColor(effFdr)}">${Math.round(effFdr)}</div>
                                <span class="modal-fdr-opp">${escHTML(f.opponent)}</span>
                                <span class="modal-fdr-venue ${f.isHome ? 'home' : 'away'}">${f.isHome ? 'HOME' : 'AWAY'}</span>
                                <div class="modal-fdr-bar-container">
                                    <div class="modal-fdr-bar" style="width: ${barWidth}%; background: ${barColor};"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="modal-section">
                    <div class="modal-section-title"><abbr title="Fixture Difficulty Rating (1=easiest, 5=hardest)">FDR</abbr> Distribution</div>
                    <div style="display: flex; gap: 3px; margin-bottom: var(--space-3);">
                        ${run.fixtures.map(f => {
                            const effFdr = getEffectiveFdr(f);
                            return `
                            <div style="flex: 1; height: ${24 + effFdr * 8}px; border-radius: var(--radius-sm); background: ${getFdrColor(effFdr)}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px;">
                                <span style="font-size: 8px; font-weight: 700; color: ${getFdrTextColor(effFdr)}">${escHTML(f.opponent)}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">FPL Insight</div>
                    <div style="background: var(--surface-0); border-radius: var(--radius-md); padding: var(--space-3); font-size: 12px; color: var(--text-secondary); line-height: 1.6;">
                        ${run.tier === 'premium' ? '<strong style="color: var(--color-success)">Premium patch.</strong> One of the best stretches in the remaining calendar. ' : 
                          run.tier === 'great' ? '<strong style="color: var(--color-info)">Great patch.</strong> Very favourable fixtures to target. ' : 
                          '<strong style="color: var(--color-warning)">Good patch.</strong> Below-average difficulty worth considering. '}
                        ${run.easyCount >= run.length * 0.7 ? `${run.easyCount} of ${run.length} fixtures are FDR ≤ 2 — this is a dominant green stretch. ` : ''}
                        ${run.hardCount > 0 ? `There ${run.hardCount === 1 ? 'is 1 tougher fixture' : `are ${run.hardCount} tougher fixtures`} mixed in, but the overall average is still strong. ` : 'No difficult fixtures (FDR ≥ 4) in this entire stretch. '}
                        ${run.homeCount >= Math.ceil(run.length * 0.6) ? 'Heavy home schedule adds extra attacking value. ' : ''}
                        ${run.xgFor >= 1.7 ? `${escHTML(run.teamName)} have strong attacking output — their forwards and midfielders are premium targets here. ` : ''}
                        ${run.xgAgainst <= 1.15 ? 'Solid defensive record too — their defenders offer clean sheet potential. ' : ''}
                        ${run.length >= 5 ? `At ${run.length} gameweeks, this patch is long enough to plan multiple transfers around. ` : ''}
                        ${run.last5Ppg >= 2 ? 'Currently in good form, which adds confidence to this pick. ' : run.last5Ppg < 0.9 ? 'Form is poor though — monitor whether they can turn it around before committing. ' : ''}
                    </div>
                </div>
            `;

            openModal(header, body);
        }

        function openSwingModal(index, direction) {
            const swings = window._swingsData.filter(s => s.direction === direction);
            const s = swings[index];
            if (!s) return;

            const isImproving = direction === 'improving';
            const swingLabel = isImproving ? 'Getting Easier' : 'Getting Harder';
            const swingColor = isImproving ? 'var(--color-success)' : 'var(--color-error)';
            const swingMag = Math.abs(s.swing).toFixed(1);

            const header = `
                <img src="${s.badgeUrl}" alt="${escHTML(s.teamShort)}" class="modal-header-badge" onerror="this.style.display='none'">
                <div class="modal-header-info">
                    <div class="modal-title">${escHTML(s.teamName)}</div>
                    <div class="modal-subtitle">Fixture swing · ${swingLabel} from GW${s.swingGW}</div>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            `;

            const body = `
                <div class="modal-section">
                    <div class="modal-stat-grid">
                        <div class="modal-stat">
                            <div class="modal-stat-label">Current FDR</div>
                            <div class="modal-stat-value ${parseFloat(s.currentFdr) <= 2.5 ? 'good' : parseFloat(s.currentFdr) >= 3.5 ? 'bad' : 'warn'}">${s.currentFdr}</div>
                            <div class="modal-stat-sub">GW${currentGW}–${currentGW + 2}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Swing</div>
                            <div class="modal-stat-value" style="color: ${swingColor}">${isImproving ? '↓' : '↑'} ${swingMag}</div>
                            <div class="modal-stat-sub">${swingLabel.toLowerCase()}</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label">Future FDR</div>
                            <div class="modal-stat-value ${parseFloat(s.futureFdr) <= 2.5 ? 'good' : parseFloat(s.futureFdr) >= 3.5 ? 'bad' : 'warn'}">${s.futureFdr}</div>
                            <div class="modal-stat-sub">GW${s.swingGW}–${s.swingGW + 2}</div>
                        </div>
                    </div>
                    <div class="modal-stat-grid">
                        <div class="modal-stat">
                            <div class="modal-stat-label" data-tooltip="Expected goals a game.">xG for</div>
                            <div class="modal-stat-value ${s.xgFor >= 1.7 ? 'good' : s.xgFor < 1.1 ? 'bad' : ''}">${(s.xgFor ?? 0).toFixed(2)}</div>
                            <div class="modal-stat-sub">xG/game</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label" data-tooltip="Expected goals conceded a game — lower is better.">xG against</div>
                            <div class="modal-stat-value ${s.xgAgainst <= 1.15 ? 'good' : s.xgAgainst > 1.65 ? 'bad' : ''}">${(s.xgAgainst ?? 0).toFixed(2)}</div>
                            <div class="modal-stat-sub">xGC/game</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-label" data-tooltip="Points per game over the recent window.">Form (pts/g)</div>
                            <div class="modal-stat-value ${s.last5Ppg >= 2 ? 'good' : s.last5Ppg < 1 ? 'bad' : 'warn'}">${(s.last5Ppg ?? 0).toFixed(2)}</div>
                            <div class="modal-stat-sub">pts/game</div>
                        </div>
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">Current Fixtures (GW${currentGW}–${currentGW + 2})</div>
                    ${s.currentFixtures.map(f => {
                        const effFdr = getEffectiveFdr(f);
                        const barWidth = Math.max(10, (5 - effFdr) / 4 * 100);
                        return `
                            <div class="modal-fdr-row">
                                <span class="modal-fdr-gw">GW${f.gw}</span>
                                <div class="modal-fdr-dot fdr-${Math.round(effFdr)}" style="color: ${getFdrTextColor(effFdr)}">${Math.round(effFdr)}</div>
                                <span class="modal-fdr-opp">${escHTML(f.opponent)}</span>
                                <span class="modal-fdr-venue ${f.isHome ? 'home' : 'away'}">${f.isHome ? 'HOME' : 'AWAY'}</span>
                                <div class="modal-fdr-bar-container">
                                    <div class="modal-fdr-bar" style="width: ${barWidth}%; background: ${getFdrColor(effFdr)};"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">After Swing (GW${s.swingGW}+)</div>
                    ${s.nextFixtures.map(f => {
                        const effFdr = getEffectiveFdr(f);
                        const barWidth = Math.max(10, (5 - effFdr) / 4 * 100);
                        return `
                            <div class="modal-fdr-row">
                                <span class="modal-fdr-gw">GW${f.gw}</span>
                                <div class="modal-fdr-dot fdr-${Math.round(effFdr)}" style="color: ${getFdrTextColor(effFdr)}">${Math.round(effFdr)}</div>
                                <span class="modal-fdr-opp">${escHTML(f.opponent)}</span>
                                <span class="modal-fdr-venue ${f.isHome ? 'home' : 'away'}">${f.isHome ? 'HOME' : 'AWAY'}</span>
                                <div class="modal-fdr-bar-container">
                                    <div class="modal-fdr-bar" style="width: ${barWidth}%; background: ${getFdrColor(effFdr)};"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                ${s.longSwing ? `
                    <div class="modal-section">
                        <div class="modal-section-title">Long-term View (Next 10 GWs)</div>
                        <div style="background: var(--surface-0); border-radius: var(--radius-md); padding: var(--space-3); margin-bottom: var(--space-3);">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
                                <span style="font-size: 11px; color: var(--text-muted);">GW${currentGW}–${currentGW+4} avg</span>
                                <span style="font-size: 11px; color: var(--text-muted);">GW${currentGW+5}–${currentGW+9} avg</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: var(--space-3); justify-content: center;">
                                <span style="font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; color: ${parseFloat(s.longSwing.currentFdr) <= 2.8 ? 'var(--color-success)' : parseFloat(s.longSwing.currentFdr) >= 3.5 ? 'var(--color-error)' : 'var(--text-primary)'}">${s.longSwing.currentFdr}</span>
                                <span style="font-size: 18px; color: ${swingColor};">${isImproving ? '→' : '→'}</span>
                                <span style="font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; color: ${parseFloat(s.longSwing.futureFdr) <= 2.8 ? 'var(--color-success)' : parseFloat(s.longSwing.futureFdr) >= 3.5 ? 'var(--color-error)' : 'var(--text-primary)'}">${s.longSwing.futureFdr}</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 2px;">
                            ${s.allFutureFixtures.map((f, i) => `
                                <div style="flex: 1; padding: 4px 0; border-radius: var(--radius-sm); text-align: center; font-size: 8px; font-weight: 700; background: ${getFdrColor(getEffectiveFdr(f))}; color: ${getFdrTextColor(getEffectiveFdr(f))}; ${i === 4 ? 'border-left: 2px solid var(--surface-1); border-right: 2px solid var(--surface-1);' : ''}">
                                    ${escHTML(f.opponent)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="modal-section">
                    <div class="modal-section-title">FPL Insight</div>
                    <div style="background: var(--surface-0); border-radius: var(--radius-md); padding: var(--space-3); font-size: 12px; color: var(--text-secondary); line-height: 1.6;">
                        ${isImproving ? 
                            `<strong style="color: var(--color-success)">${escHTML(s.teamName)}'s fixtures ease significantly from GW${s.swingGW}.</strong> ` +
                            `Average FDR drops from ${s.currentFdr} to ${s.futureFdr}. ` +
                            (parseFloat(s.futureFdr) <= 2.5 ? 'The upcoming run looks very favourable — consider bringing in their assets ahead of the swing. ' : 'Worth monitoring for transfer planning. ') +
                            (s.homeCountNext >= 2 ? `${s.homeCountNext} of the next 3 are at home, adding further value. ` : '') +
                            (s.xgFor >= 1.55 ? 'Their attacking numbers support investment in forwards/midfielders. ' : '')
                        :
                            `<strong style="color: var(--color-error)">${escHTML(s.teamName)}'s fixtures get considerably harder from GW${s.swingGW}.</strong> ` +
                            `Average FDR rises from ${s.currentFdr} to ${s.futureFdr}. ` +
                            (parseFloat(s.futureFdr) >= 4.0 ? 'This is a tough run — strongly consider selling their assets before the swing hits. ' : 'Keep an eye on this and prepare alternatives. ') +
                            (s.homeCountNext <= 1 ? 'Heavy away schedule makes it even tougher. ' : '') +
                            (s.xgAgainst > 1.45 ? 'Their defensive weaknesses could be badly exposed in this stretch. ' : '')
                        }
                    </div>
                </div>
            `;

            openModal(header, body);
        }

        function renderEasyRunsAnalysis(easyRuns) {
            return '';
        }

        function renderFixtureSwingAnalysis(swings) {
            return '';
        }

// A run of upcoming fixtures as readable blocks: gameweek, opponent, venue.
// Used by the Best Next 5 cards, the swing timelines and the patch list, so the
// three views describe a fixture run the same way.
        function renderFdrRun(entries, opts) {
            const o = opts || {};
            return entries.map(e => {
                const list = e.fixtures || [];
                if (!list.length) {
                    return `<span class="fx-block fx-blank" title="Gameweek ${e.gw}: no fixture (blank)">
                        <small>GW${e.gw}</small><b>BLANK</b></span>`;
                }
                // A doubled gameweek is two chances at a return; show both.
                return list.map(f => {
                    const d = Math.round(getEffectiveFdr(f)) || 3;
                    return `<span class="fx-block fdr-${d}${o.dim ? ' fx-dim' : ''}"
                        title="GW${e.gw}: ${f.isHome ? 'home to' : 'away at'} ${escHTML(f.opponent)} — difficulty ${d}">
                        <small>GW${e.gw}</small><b>${escHTML(f.opponent)}</b><i>${f.isHome ? 'H' : 'A'}</i></span>`;
                }).join('');
            }).join('');
        }

        // The page already holds raw bootstrap elements, so the best assets at a
        // team can be answered here rather than sending the user elsewhere.
        function openTeamAssetsModal(teamId) {
            const team = allTeamsData.find(t => t.id === teamId);
            const els = (window.playerElements || []).filter(e => e.team === teamId && e.status === 'a');
            if (!team) return;

            const POS = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            const ranked = els.map(e => ({
                name: e.web_name,
                pos: POS[e.element_type] || '?',
                price: e.now_cost / 10,
                points: e.total_points,
                form: parseFloat(e.form) || 0,
                own: parseFloat(e.selected_by_percent) || 0,
                minutes: e.minutes,
                xGI: parseFloat(e.expected_goal_involvements) || 0
            }))
            // Minutes first: an asset who does not play is not an asset.
            .filter(p => p.minutes > 0)
            .sort((a, b) => (b.points - a.points) || (b.form - a.form))
            .slice(0, 10);

            const map = window._teamFixtureMap || {};
            const gws = Object.keys(map[teamId] || {}).map(Number)
                .filter(g => g >= currentGW).sort((a, b) => a - b).slice(0, 5);
            const runHtml = renderFdrRun(gws.map(gw => ({ gw, fixtures: (map[teamId] || {})[gw] || [] })));

            const header = `<div class="modal-team-header">
                <img src="${team.badgeUrl}" alt="" class="modal-team-badge" onerror="this.style.display='none'">
                <div><h2>${escHTML(team.name)}</h2>
                <p>Best assets by points scored, restricted to players with minutes</p></div>
            </div>`;

            const body = `
                <div class="assets-run"><span class="assets-run-label">Next ${gws.length} fixtures</span><div class="fx-run">${runHtml}</div></div>
                ${ranked.length ? `
                <table class="assets-table">
                    <thead><tr><th>Player</th><th>Pos</th><th>Price</th><th>Pts</th><th>Form</th><th>xGI</th><th>Owned</th></tr></thead>
                    <tbody>${ranked.map(p => `<tr>
                        <td class="assets-name">${escHTML(p.name)}</td>
                        <td><span class="assets-pos pos-${p.pos}">${p.pos}</span></td>
                        <td>£${p.price.toFixed(1)}m</td>
                        <td><strong>${p.points}</strong></td>
                        <td>${p.form.toFixed(1)}</td>
                        <td>${p.xGI.toFixed(2)}</td>
                        <td>${p.own.toFixed(1)}%</td>
                    </tr>`).join('')}</tbody>
                </table>` : '<p class="assets-empty">No players with minutes recorded yet at this club.</p>'}
                <p class="assets-note">Ranked on points scored this season so far. With ${currentGW <= 2 ? 'barely any' : 'limited'} football played, treat the order as a starting point rather than a verdict.</p>`;

            openModal(header, body);
        }

        function renderUpcomingGoldMines(fixtureMap, displayGWs) {
            // Find teams with best upcoming 5 GWs
            const upcoming5 = displayGWs.filter(gw => gw >= currentGW).slice(0, 5);
            
            const rankings = allTeamsData.map(team => {
                const avgFdr = calculateAvgFDR(fixtureMap[team.id], upcoming5);
                const homeCount = upcoming5.reduce((count, gw) => {
                    const f = fixtureMap[team.id][gw];
                    return count + (f && f[0] && f[0].isHome ? 1 : 0);
                }, 0);
                
                return {
                    ...team,
                    avgFdr,
                    homeCount
                };
            }).sort((a, b) => a.avgFdr - b.avgFdr);

            const top5 = rankings.slice(0, 5);

            return `
                <div class="analysis-card">
                    <div class="analysis-card-header">
                        <span class="analysis-card-icon"><i data-lucide="star" style="width:16px;height:16px;"></i></span>
                        <span class="analysis-card-title">Best Next 5 GWs</span>
                        <span class="gm-subtitle">GW${upcoming5[0]}–${upcoming5[upcoming5.length - 1]}</span>
                    </div>
                    <div class="gm-list">
                        ${top5.map((team, i) => {
                            const fx = upcoming5.map(gw => {
                                const arr = fixtureMap[team.id][gw];
                                return { gw, fixtures: arr || [] };
                            });
                            return `
                            <div class="gm-row">
                                <span class="gm-rank ${i < 3 ? 'top' : ''}">${i + 1}</span>
                                <img src="${team.badgeUrl}" alt="${escHTML(team.shortName)}" class="gm-badge" onerror="this.style.display='none'">
                                <div class="gm-id">
                                    <div class="gm-name">${escHTML(team.name)}</div>
                                    <div class="gm-detail">${team.homeCount} home · ${5 - team.homeCount} away</div>
                                </div>
                                <div class="gm-fixtures">${renderFdrRun(fx)}</div>
                                <span class="gm-avg ${team.avgFdr <= 2.5 ? 'good' : team.avgFdr <= 3.2 ? 'mid' : 'bad'}">${team.avgFdr.toFixed(1)}<small>avg</small></span>
                                <button class="gm-assets-btn" onclick="event.stopPropagation(); openTeamAssetsModal(${team.id})" title="Best FPL assets at ${escHTML(team.name)}">
                                    <i data-lucide="search" style="width:12px;height:12px;"></i> Assets
                                </button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1" integrity="sha384-oNtu+d18330MVFpltUTve1DatxCkkctlpA2AC3GulbVFOSqhHdDat3qHse/Lbuek" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        loadSidebarNav();
        initIcons();
    </script>
    <!-- Marketing footer: legal, methodology and contact links on every page -->
</body>
</html>
