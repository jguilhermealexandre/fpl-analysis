                if (oppDef <= 55) return 'color-3';
                if (oppDef <= 65) return 'color-4';
                return 'color-5'; // Elite defense
            } else if (calendarColorMode === 'defense') {
                // Green = weak opponent attack (safe for defenders)
                const oppAtt = fixture.oppAttackPower || 50;
                if (oppAtt <= 35) return 'color-1'; // Very weak attack
                if (oppAtt <= 45) return 'color-2';
                if (oppAtt <= 55) return 'color-3';
                if (oppAtt <= 65) return 'color-4';
                return 'color-5'; // Elite attack
            } else { // cs
                const cs = fixture.csChance || 30;
                if (cs >= 50) return 'color-1';
                if (cs >= 40) return 'color-2';
                if (cs >= 30) return 'color-3';
                if (cs >= 20) return 'color-4';
                return 'color-5';
            }
        }

        function getFixtureTooltip(fixture, gw) {
            if (!fixture) return '';
            
            const base = `GW${gw}: ${fixture.opponent} (${fixture.isHome ? 'H' : 'A'})`;
            const fdr = `FDR: ${fixture.fdr}`;
            const cs = `CS: ${fixture.csChance || '?'}%`;
            const oppDef = `Opp Def: ${fixture.oppDefensePower || '?'}`;
            const oppAtt = `Opp Att: ${fixture.oppAttackPower || '?'}`;
            const btts = fixture.bttsLikely ? '🔥 BTTS Likely' : '';
            
            return `${base}\n${fdr} | ${cs}${btts ? '\n' + btts : ''}\n${oppDef} | ${oppAtt}`;
        }

        function renderFixtureCell(fixtures, gw, easyRuns, team) {
            if (!fixtures || fixtures.length === 0) {
                return `<td><div class="fixture-cell bgw-cell"></div></td>`;
            }

            // Check if this GW is part of an easy run
            let runClass = '';
            for (const run of easyRuns) {
                if (gw >= run.startGW && gw <= run.endGW) {
                    if (gw === run.startGW) runClass = 'easy-run-start';
                    else if (gw === run.endGW) runClass = 'easy-run-end';
                    else runClass = 'easy-run-middle';
                    break;
                }
            }

            const f = fixtures[0];
            const colorClass = getColorClass(f, team);
            const tooltip = getFixtureTooltip(f, gw);
            
            // BTTS indicator
            const bttsIndicator = f.bttsLikely && !f.finished ? '<span class="btts-marker">🔥</span>' : '';
            
            // Show CS% in cell if in CS mode
            const cellContent = calendarColorMode === 'cs' ? 
                `<span class="cs-value">${f.csChance || '?'}%</span>${bttsIndicator}` :
                `<span class="opp">${f.opponent}</span><span class="venue">${f.isHome ? 'H' : 'A'}</span>${bttsIndicator}`;

            // Handle double gameweeks
            if (fixtures.length > 1) {
                return `<td>
                    <div class="fixture-cell ${colorClass} ${f.finished ? 'past' : ''} ${runClass} ${f.bttsLikely ? 'btts' : ''}" 
                         title="${fixtures.map(fix => getFixtureTooltip(fix, gw)).join('\n---\n')}">
                        ${cellContent}
                        <span class="dgw-indicator">DGW</span>
                    </div>
                </td>`;
            }

            return `<td>
                <div class="fixture-cell ${colorClass} ${f.finished ? 'past' : ''} ${runClass} ${f.bttsLikely ? 'btts' : ''}" 
                     title="${tooltip}">${cellContent}</div>
            </td>`;
        }

        function calculateAvgFDR(teamFixtures, displayGWs) {
            if (!teamFixtures) return 3;
            
            let total = 0;
            let count = 0;
            
            displayGWs.forEach(gw => {
                const fixtures = teamFixtures[gw];
                if (fixtures && fixtures.length > 0) {
                    fixtures.forEach(f => {
                        if (!f.finished) {
                            total += f.fdr;
                            count++;
                        }
                    });
                }
            });
            
            return count > 0 ? total / count : 3;
        }

        // ===== STATS TABLE =====
        let statsSort = { col: 'pts', dir: 'desc' };
        let statsView = 'season'; // 'season', 'last10', or 'last5'
        let statsCategory = 'overall'; // 'overall', 'attack', 'defense', 'discipline', 'fpl', 'homeAway'

        function createEmptyStatBucket() {
            return {
                p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0,
                cs: 0, fts: 0,
                assists: 0, ownGoals: 0,
                penScored: 0, penMissed: 0, penSaved: 0,
                yellowCards: 0, redCards: 0,
                saves: 0,
                bonus: 0, bps: 0,
                btts: 0, // both teams to score
                o25: 0,  // over 2.5 goals
                scoredFirst: 0,
                concededFirst: 0,
                comebacks: 0,
                homeP: 0, homeW: 0, homeGf: 0, homeGa: 0, homeCs: 0,
                awayP: 0, awayW: 0, awayGf: 0, awayGa: 0, awayCs: 0
            };
        }

        function extractStatCount(statsArr, identifier, side) {
            // side: 'h' or 'a'
            if (!statsArr) return 0;
            const stat = statsArr.find(s => s.identifier === identifier);
            if (!stat || !stat[side]) return 0;
            return stat[side].reduce((sum, entry) => sum + (entry.value || 0), 0);
        }

        function extractStatEntries(statsArr, identifier, side) {
            if (!statsArr) return 0;
            const stat = statsArr.find(s => s.identifier === identifier);
            if (!stat || !stat[side]) return 0;
            return stat[side].length; // number of players who got this stat
        }

        function calculateSeasonStats() {
            const fixtures = window.rawFixturesData;
            const stats = {};

            // Initialize stats for all teams
            allTeamsData.forEach(team => {
                stats[team.id] = {
                    id: team.id,
                    name: team.name,
                    shortName: team.shortName,
                    badgeUrl: team.badgeUrl,
                    season: createEmptyStatBucket(),
                    last5: createEmptyStatBucket(),
                    last10: createEmptyStatBucket(),
                    form: [],
                    attackStrength: (team.attackPowerHome + team.attackPowerAway) / 2,
                    defenseStrength: (team.defensePowerHome + team.defensePowerAway) / 2
                };
            });

            // Process all finished fixtures
            const finishedFixtures = fixtures
                .filter(f => f.finished && f.team_h_score !== null)
                .sort((a, b) => a.event - b.event);

            // Track per-team history for last 5
            const teamFixtureHistory = {};
            allTeamsData.forEach(team => {
                teamFixtureHistory[team.id] = [];
            });

            finishedFixtures.forEach(f => {
                const homeId = f.team_h;
                const awayId = f.team_a;
                const hg = f.team_h_score;
                const ag = f.team_a_score;
                const st = f.stats || [];

                const totalGoals = hg + ag;
                const btts = hg > 0 && ag > 0;
                const o25 = totalGoals > 2;

                // === Extract stats from the fixture stats array ===
                const homeAssists = extractStatCount(st, 'assists', 'h');
                const awayAssists = extractStatCount(st, 'assists', 'a');
                const homeOG = extractStatEntries(st, 'own_goals', 'h');
                const awayOG = extractStatEntries(st, 'own_goals', 'a');
                const homePenSaved = extractStatEntries(st, 'penalties_saved', 'h');
                const awayPenSaved = extractStatEntries(st, 'penalties_saved', 'a');
                const homePenMissed = extractStatEntries(st, 'penalties_missed', 'h');
                const awayPenMissed = extractStatEntries(st, 'penalties_missed', 'a');
                const homeYC = extractStatEntries(st, 'yellow_cards', 'h');
                const awayYC = extractStatEntries(st, 'yellow_cards', 'a');
                const homeRC = extractStatEntries(st, 'red_cards', 'h');
                const awayRC = extractStatEntries(st, 'red_cards', 'a');
                const homeSaves = extractStatCount(st, 'saves', 'h');
                const awaySaves = extractStatCount(st, 'saves', 'a');
                const homeBonus = extractStatCount(st, 'bonus', 'h');
                const awayBonus = extractStatCount(st, 'bonus', 'a');
                const homeBPS = extractStatCount(st, 'bps', 'h');
                const awayBPS = extractStatCount(st, 'bps', 'a');

                // Penalties scored: opponent's pen saved + pen missed = pens attempted
                // Pen scored = goals from pens. We approximate: pens attempted by team = opponent penSaved + team penMissed
                // Actually, pens scored = pens attempted - penMissed - oppPenSaved
                // Simpler: count from goals that were penalties. But API doesn't separate that.
                // We'll track penMissed per team and penSaved per team (saves made by keeper)
                
                // Build game record for both sides
                function buildRecord(teamGoals, oppGoals, isHome, assists, og, penMissed, penSaved, yc, rc, saves, bonus, bps) {
                    const result = teamGoals > oppGoals ? 'W' : teamGoals === oppGoals ? 'D' : 'L';
                    return {
                        gf: teamGoals, ga: oppGoals, result, isHome,
                        cs: oppGoals === 0, fts: teamGoals === 0,
                        assists, ownGoals: og, penMissed, penSaved, 
                        yellowCards: yc, redCards: rc,
                        saves, bonus, bps,
                        btts, o25,
                        scoredFirst: teamGoals > 0 && (isHome ? hg > 0 : ag > 0), // simplified
                        totalGoals: teamGoals + oppGoals
                    };
                }

                // Home team record
                const homeRec = buildRecord(hg, ag, true, homeAssists, homeOG, homePenMissed, homePenSaved, homeYC, homeRC, homeSaves, homeBonus, homeBPS);
                // Away team record
                const awayRec = buildRecord(ag, hg, false, awayAssists, awayOG, awayPenMissed, awayPenSaved, awayYC, awayRC, awaySaves, awayBonus, awayBPS);

                function addToBucket(bucket, rec) {
                    bucket.p++;
                    bucket.gf += rec.gf;
                    bucket.ga += rec.ga;
                    if (rec.result === 'W') bucket.w++;
                    else if (rec.result === 'D') bucket.d++;
                    else bucket.l++;
                    if (rec.cs) bucket.cs++;
                    if (rec.fts) bucket.fts++;
                    bucket.assists += rec.assists;
                    bucket.ownGoals += rec.ownGoals;
                    bucket.penMissed += rec.penMissed;
                    bucket.penSaved += rec.penSaved; // saves made by this team's keeper
                    bucket.yellowCards += rec.yellowCards;
                    bucket.redCards += rec.redCards;
                    bucket.saves += rec.saves;
                    bucket.bonus += rec.bonus;
                    bucket.bps += rec.bps;
                    if (rec.btts) bucket.btts++;
                    if (rec.o25) bucket.o25++;
                    if (rec.isHome) {
                        bucket.homeP++;
                        if (rec.result === 'W') bucket.homeW++;
                        bucket.homeGf += rec.gf;
                        bucket.homeGa += rec.ga;
                        if (rec.cs) bucket.homeCs++;
                    } else {
                        bucket.awayP++;
                        if (rec.result === 'W') bucket.awayW++;
                        bucket.awayGf += rec.gf;
                        bucket.awayGa += rec.ga;
                        if (rec.cs) bucket.awayCs++;
                    }
                }

                if (stats[homeId]) {
                    addToBucket(stats[homeId].season, homeRec);
                    teamFixtureHistory[homeId].push(homeRec);
                }
                if (stats[awayId]) {
                    addToBucket(stats[awayId].season, awayRec);
                    teamFixtureHistory[awayId].push(awayRec);
                }
            });

            // Calculate last 5, last 10 stats and form
            Object.keys(teamFixtureHistory).forEach(teamId => {
                const history = teamFixtureHistory[teamId];
                const last5Games = history.slice(-5);
                const last10Games = history.slice(-10);
                
                if (stats[teamId]) {
                    stats[teamId].form = last5Games.map(g => g.result);
                    last5Games.forEach(g => addToBucket_simple(stats[teamId].last5, g));
                    last10Games.forEach(g => addToBucket_simple(stats[teamId].last10, g));
                }
            });

            // Simple add for last5 reuse
            function addToBucket_simple(bucket, rec) {
                bucket.p++;
                bucket.gf += rec.gf;
                bucket.ga += rec.ga;
                if (rec.result === 'W') bucket.w++;
                else if (rec.result === 'D') bucket.d++;
                else bucket.l++;
                if (rec.cs) bucket.cs++;
                if (rec.fts) bucket.fts++;
                bucket.assists += rec.assists;
                bucket.ownGoals += rec.ownGoals;
                bucket.penMissed += rec.penMissed;
                bucket.penSaved += rec.penSaved;
                bucket.yellowCards += rec.yellowCards;
                bucket.redCards += rec.redCards;
                bucket.saves += rec.saves;
                bucket.bonus += rec.bonus;
                bucket.bps += rec.bps;
                if (rec.btts) bucket.btts++;
                if (rec.o25) bucket.o25++;
                if (rec.isHome) {
                    bucket.homeP++;
                    if (rec.result === 'W') bucket.homeW++;
                    bucket.homeGf += rec.gf;
                    bucket.homeGa += rec.ga;
                    if (rec.cs) bucket.homeCs++;
                } else {
                    bucket.awayP++;
                    if (rec.result === 'W') bucket.awayW++;
                    bucket.awayGf += rec.gf;
                    bucket.awayGa += rec.ga;
                    if (rec.cs) bucket.awayCs++;
                }
            }

            return stats;
        }

        function renderStatsTable(container) {
            const seasonStats = calculateSeasonStats();

        function buildStatsTableHeader(cats) {
            const thead = document.getElementById('statsHead');
            if (!thead) return;

            const cat = cats[statsCategory];
            const cols = cat.cols;

            thead.innerHTML = `
                <tr class="col-groups">

        function setStatsView(view) {
            statsView = view;
            renderCurrentView();

        function updateStatsTable(seasonStats) {
            const tbody = document.getElementById('statsBody');
            if (!tbody) return;

            const cats = getStatsColumns();
            const cat = cats[statsCategory];
            const cols = cat.cols;

            // Convert to flat array with computed values
            let teams = Object.values(seasonStats).map(team => {
                const s = statsView === 'season' ? team.season : (statsView === 'last10' ? team.last10 : team.last5);
                const games = s.p || 1;
                const pts = (s.w * 3) + s.d;
                return {
                    ...team,
                    ...s,
                    pts,
                    gd: s.gf - s.ga,
                    ppg: pts / games,
                    gpg: s.gf / games,
                    gapg: s.ga / games,
                    apg: s.assists / games,
                    csPct: (s.cs / games) * 100,
                    ftsPct: (s.fts / games) * 100,
                    svpg: s.saves / games,
                    ycpg: s.yellowCards / games,
                    bttsPct: (s.btts / games) * 100,
                    o25Pct: (s.o25 / games) * 100,
                    bnspg: s.bonus / games,
                    bpspg: s.bps / games,
                    homeGpg: s.homeP > 0 ? s.homeGf / s.homeP : 0,
                    awayGpg: s.awayP > 0 ? s.awayGf / s.awayP : 0,
                    homeCsPct: s.homeP > 0 ? (s.homeCs / s.homeP) * 100 : 0,
                    awayCsPct: s.awayP > 0 ? (s.awayCs / s.awayP) * 100 : 0,
                    gAndA: s.gf + s.assists,
                    gapg_combined: (s.gf + s.assists) / games,
                    csBonus: s.cs + s.saves,
                };
            });

            // Sort
            const sortCol = statsSort.col;
            const sortDir = statsSort.dir;
            const invertedCols = cols.filter(c => c.inverted).map(c => c.key);

            teams.sort((a, b) => {
                let aVal = a[sortCol] ?? 0;
                let bVal = b[sortCol] ?? 0;
                if (invertedCols.includes(sortCol)) {
                    return sortDir === 'desc' ? aVal - bVal : bVal - aVal;
                }
                return sortDir === 'desc' ? bVal - aVal : aVal - bVal;
            });

            // Compute ranks/percentiles for color coding
            const allVals = {};
            cols.forEach(c => {
                if (c.key === 'form') return;
                allVals[c.key] = teams.map(t => t[c.key] ?? 0);
            });

            function getValueClass(key, val, col) {
                const arr = allVals[key];
                if (!arr || arr.length === 0) return '';
                const sorted = [...arr].sort((a, b) => a - b);
                const rank = sorted.indexOf(val);
                const pct = rank / (sorted.length - 1);
                if (col.inverted) {
                    if (pct <= 0.25) return 'good';
                    if (pct >= 0.75) return 'bad';
                } else {
                    if (pct >= 0.75) return 'good';
                    if (pct <= 0.25) return 'bad';
                }
                return 'neutral';
            }

            // Update header active sort indicator
            document.querySelectorAll('#statsHead th[data-col]').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (th.dataset.col === sortCol) {
                    th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });

            // Render rows
            tbody.innerHTML = teams.map((team, idx) => {
                const rank = idx + 1;
                
                const cells = cols.map(col => {
                    if (col.key === 'form') {
                        const formDots = (team.form || []).map(r => 
                            `<span class="stats-form-dot ${r}"></span>`
                        ).join('');
                        return `<td><div style="display:flex;gap:3px;justify-content:center;">${formDots}</div></td>`;
                    }
                    
                    let val = team[col.key] ?? 0;
                    let display;
                    
                    if (col.decimals !== undefined) {
                        display = val.toFixed(col.decimals);
                    } else {
                        display = typeof val === 'number' && !Number.isInteger(val) ? val.toFixed(1) : val;
                    }
                    
                    if (col.suffix) display += col.suffix;
                    
                    const cls = getValueClass(col.key, val, col);
                    const isBold = ['pts', 'gf', 'ga', 'gd', 'bonus', 'bps'].includes(col.key);
                    
                    return `<td class="stats-value ${cls}">${isBold ? '<strong>' : ''}${display}${isBold ? '</strong>' : ''}</td>`;
                }).join('');

                return `
                    <tr>

        }

        function findEasyRuns(fixtureMap) {
            const allRuns = [];
            const MIN_WINDOW = 3;
            const MAX_WINDOW = 8;

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                // Get all remaining GWs with fixtures
                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => {
                        const fx = teamFixtures[gw];
                        return gw >= currentGW && fx && fx.length > 0 && !fx[0].finished;
                    })
                    .sort((a, b) => a - b);

                if (futureGWs.length < MIN_WINDOW) return;

                // Sliding window: scan every window of size MIN_WINDOW to MAX_WINDOW
                for (let winSize = MIN_WINDOW; winSize <= Math.min(MAX_WINDOW, futureGWs.length); winSize++) {
                    for (let start = 0; start <= futureGWs.length - winSize; start++) {
                        const windowGWs = futureGWs.slice(start, start + winSize);
                        const windowFixtures = windowGWs.map(gw => {
                            const fx = teamFixtures[gw];
                            return fx && fx[0] ? { ...fx[0], gw } : null;
                        }).filter(Boolean);

                        if (windowFixtures.length < MIN_WINDOW) continue;

                        const avgFdr = windowFixtures.reduce((s, f) => s + f.fdr, 0) / windowFixtures.length;

                        // Only include windows with avg FDR ≤ 3.0 (generous)
                        if (avgFdr > 3.0) continue;

                        // Count how many fixtures are genuinely easy (FDR ≤ 2)
                        const easyCount = windowFixtures.filter(f => f.fdr <= 2).length;
                        // Skip if none are actually easy
                        if (easyCount === 0) continue;

                        const homeCount = windowFixtures.filter(f => f.isHome).length;
                        const hardCount = windowFixtures.filter(f => f.fdr >= 4).length;

                        // Composite score: lower is better
                        // Rewards: low avg FDR, longer runs, more home games, fewer hard games
                        const score = avgFdr - (windowFixtures.length * 0.08) - (homeCount * 0.05) + (hardCount * 0.15);

                        allRuns.push({
                            teamId: team.id,
                            teamName: team.name,
                            teamShort: team.shortName,
                            badgeUrl: team.badgeUrl,
                            startGW: windowGWs[0],
                            endGW: windowGWs[windowGWs.length - 1],
                            length: windowFixtures.length,
                            fixtures: windowFixtures,
                            homeCount,
                            avgFdr: parseFloat(avgFdr.toFixed(2)),
                            easyCount,
                            hardCount,
                            score,
                            attackPower: team.attackPower,
                            defensePower: team.defensePower,
                            formRating: team.formRating
                        });
                    }
                }
            });

            // Deduplicate: for each team, keep the best non-overlapping runs
            // Sort by score first (lower = better)
            allRuns.sort((a, b) => a.score - b.score);

            const bestRuns = [];
            const usedSlots = {}; // teamId -> Set of GWs already claimed

            allRuns.forEach(run => {
                const key = run.teamId;
                if (!usedSlots[key]) usedSlots[key] = new Set();

                // Check how much this run overlaps with already-picked runs for this team
                const runGWs = run.fixtures.map(f => f.gw);
                const overlapCount = runGWs.filter(gw => usedSlots[key].has(gw)).length;

                // Allow if less than half overlaps
                if (overlapCount <= runGWs.length * 0.4) {
                    bestRuns.push(run);
                    runGWs.forEach(gw => usedSlots[key].add(gw));
                }
            });

            // Final sort: by score (best patches first)
            bestRuns.sort((a, b) => a.score - b.score);

            // Assign tier labels
            bestRuns.forEach(run => {
                if (run.avgFdr <= 2.0) run.tier = 'premium';
                else if (run.avgFdr <= 2.5) run.tier = 'great';
                else run.tier = 'good';
            });

            return bestRuns;
        }

        function findFixtureSwings(fixtureMap) {
            const swings = [];

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                // Compare next 3 GWs vs GWs 4-6
                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => gw >= currentGW)
                    .sort((a, b) => a - b)
                    .slice(0, 6);

                if (futureGWs.length < 6) return;

                const first3 = futureGWs.slice(0, 3);
                const next3 = futureGWs.slice(3, 6);

                const avgFirst = first3.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? f[0].fdr : 3);
                }, 0) / 3;

                const avgNext = next3.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? f[0].fdr : 3);
                }, 0) / 3;

                const swing = avgFirst - avgNext;

                if (Math.abs(swing) > 0.5) {
                    swings.push({
                        teamId: team.id,
                        teamName: team.name,
                        teamShort: team.shortName,
                        badgeUrl: team.badgeUrl,
                        swing: swing,
                        direction: swing > 0 ? 'improving' : 'worsening',
                        currentFdr: avgFirst.toFixed(1),
                        futureFdr: avgNext.toFixed(1),
                        swingGW: futureGWs[3]
                    });
                }
            });

            return swings.sort((a, b) => b.swing - a.swing);
        }

        function findFixtureSwingsEnhanced(fixtureMap) {
            const swings = [];

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => gw >= currentGW)
                    .sort((a, b) => a - b);

                if (futureGWs.length < 6) return;

                // Compare windows: GW1-3 vs GW4-6
                const first3 = futureGWs.slice(0, 3);
                const next3 = futureGWs.slice(3, 6);

                const getAvg = (gws) => gws.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? f[0].fdr : 3);
                }, 0) / gws.length;

                const getFixtures = (gws) => gws.map(gw => {
                    const f = teamFixtures[gw];
                    return f && f[0] ? { ...f[0], gw } : null;
                }).filter(Boolean);

                const avgFirst = getAvg(first3);
                const avgNext = getAvg(next3);
                const swing = avgFirst - avgNext;

                // Lowered threshold to 0.3 to capture more swings
                if (Math.abs(swing) > 0.3) {
                    const nextFixtures = getFixtures(next3);
                    const currentFixtures = getFixtures(first3);
                    const homeCountNext = nextFixtures.filter(f => f.isHome).length;
                    const homeCountCurrent = currentFixtures.filter(f => f.isHome).length;

                    // Also look at longer windows: GW1-5 vs GW6-10
                    let longSwing = null;
                    if (futureGWs.length >= 10) {
                        const first5 = futureGWs.slice(0, 5);
                        const next5 = futureGWs.slice(5, 10);
                        const avgFirst5 = getAvg(first5);
                        const avgNext5 = getAvg(next5);
                        longSwing = {
                            currentFdr: avgFirst5.toFixed(1),
                            futureFdr: avgNext5.toFixed(1),
                            swing: (avgFirst5 - avgNext5).toFixed(2),
                            fixtures: getFixtures(next5)
                        };
                    }

                    swings.push({
                        teamId: team.id,
                        teamName: team.name,
                        teamShort: team.shortName,
                        badgeUrl: team.badgeUrl,
                        swing,
                        direction: swing > 0 ? 'improving' : 'worsening',
                        currentFdr: avgFirst.toFixed(1),
                        futureFdr: avgNext.toFixed(1),
                        swingGW: futureGWs[3],
                        currentFixtures,
                        nextFixtures,
                        homeCountNext,
                        homeCountCurrent,
                        longSwing,
                        attackPower: team.attackPower,
                        defensePower: team.defensePower,
                        formRating: team.formRating,
                        allFutureFixtures: getFixtures(futureGWs.slice(0, 10))
                    });
                }
            });

            // Sort: improving by biggest positive swing, worsening by biggest negative
            return swings.sort((a, b) => b.swing - a.swing);
        }

                        </div>
                        <div style="display: flex; gap: 2px;">
                            ${s.allFutureFixtures.map((f, i) => `
                                <div style="flex: 1; padding: 4px 0; border-radius: var(--radius-sm); text-align: center; font-size: 8px; font-weight: 700; background: ${getFdrColor(f.fdr)}; color: ${getFdrTextColor(f.fdr)}; ${i === 4 ? 'border-left: 2px solid var(--surface-1); border-right: 2px solid var(--surface-1);' : ''}">
                                    ${f.opponent}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="modal-section">
                    <div class="modal-section-title">FPL Insight</div>
                    <div style="background: var(--surface-0); border-radius: var(--radius-md); padding: var(--space-3); font-size: 12px; color: var(--text-secondary); line-height: 1.6;">
                        ${isImproving ? 
                            `📈 <strong style="color: var(--color-success)">${s.teamName}'s fixtures ease significantly from GW${s.swingGW}.</strong> ` +
                            `Average FDR drops from ${s.currentFdr} to ${s.futureFdr}. ` +
                            (parseFloat(s.futureFdr) <= 2.5 ? 'The upcoming run looks very favourable — consider bringing in their assets ahead of the swing. ' : 'Worth monitoring for transfer planning. ') +
                            (s.homeCountNext >= 2 ? `${s.homeCountNext} of the next 3 are at home, adding further value. ` : '') +
                            (s.attackPower >= 55 ? 'Their attacking numbers support investment in forwards/midfielders. ' : '')
                        :
                            `📉 <strong style="color: var(--color-error)">${s.teamName}'s fixtures get considerably harder from GW${s.swingGW}.</strong> ` +
                            `Average FDR rises from ${s.currentFdr} to ${s.futureFdr}. ` +
                            (parseFloat(s.futureFdr) >= 4.0 ? 'This is a tough run — strongly consider selling their assets before the swing hits. ' : 'Keep an eye on this and prepare alternatives. ') +
                            (s.homeCountNext <= 1 ? 'Heavy away schedule makes it even tougher. ' : '') +
                            (s.defensePower < 50 ? 'Their defensive weaknesses could be badly exposed in this stretch. ' : '')
                        }
                    </div>
                </div>
            `;

            openModal(header, body);
        }

        function renderEasyRunsAnalysis(easyRuns) {
            return '';
        }

        function renderFixtureSwingAnalysis(swings) {
            return '';
        }

        function renderUpcomingGoldMines(fixtureMap, displayGWs) {
            // Find teams with best upcoming 5 GWs
            const upcoming5 = displayGWs.filter(gw => gw >= currentGW).slice(0, 5);
            
            const rankings = allTeamsData.map(team => {
                const avgFdr = calculateAvgFDR(fixtureMap[team.id], upcoming5);
                const homeCount = upcoming5.reduce((count, gw) => {
                    const f = fixtureMap[team.id][gw];
                    return count + (f && f[0] && f[0].isHome ? 1 : 0);
                }, 0);
                
                return {
                    ...team,
                    avgFdr,
                    homeCount
                };
            }).sort((a, b) => a.avgFdr - b.avgFdr);

            const top5 = rankings.slice(0, 5);

            return `
                <div class="analysis-card">
                    <div class="analysis-card-header">
                        <span class="analysis-card-icon">⭐</span>
                        <span class="analysis-card-title">Best Next 5 GWs</span>
                    </div>
                    <div class="analysis-team-list">
                        ${top5.map((team, i) => `
                            <div class="analysis-team-item">
                                <span style="font-size: 12px; font-weight: 700; color: ${i < 3 ? 'var(--color-warning)' : 'var(--text-muted)'}; width: 20px;">${i + 1}</span>
                                <img src="${team.badgeUrl}" alt="${team.shortName}" class="analysis-team-badge" onerror="this.style.display='none'">
                                <div class="analysis-team-info">
                                    <div class="analysis-team-name">${team.name}</div>
                                    <div class="analysis-team-detail">${team.homeCount} home games</div>
                                </div>
                                <span class="analysis-team-stat good">${team.avgFdr.toFixed(1)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
