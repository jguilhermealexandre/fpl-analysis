                <div class="soft-header">

        function setCalendarView(mode) {

        function setCalendarColor(mode) {

        }

        // Uses percentile-based bucketing: ranks all teams and assigns quintiles
        // so each FDR level gets ~4 teams, giving an even distribution
        /* Fixture difficulty from expected goals rather than from an index.

           The scale is unchanged — 1 to 5, quintiles of the league, four teams
           to a band, so a colour on the calendar means what it always meant.
           What changed is the quantity being ranked. Difficulty used to come
           off the average of two 0-100 powers, which is one ordering doing two
           jobs; it now comes off the opponent's expected goals conceded when
           the question is about scoring, and their expected goals scored when
           it is about keeping a clean sheet. Those are genuinely different
           orderings, which is what lets a fixture be kind to your forwards and
           cruel to your defenders at the same time. */
        function leagueQuintiles(key) {
            const cacheKey = `${key}:${allTeamsData.length}`;
            leagueQuintiles._cache = leagueQuintiles._cache || {};
            if (!(cacheKey in leagueQuintiles._cache)) {
                const vals = allTeamsData.map(t => t[key])
                    .filter(v => Number.isFinite(v)).sort((a, b) => a - b);
                leagueQuintiles._cache[cacheKey] = vals.length >= 5
                    ? [0.2, 0.4, 0.6, 0.8].map(p => vals[Math.floor(vals.length * p)])
                    : null;
            }
            return leagueQuintiles._cache[cacheKey];
        }

        // Which fifth of the league a value sits in, 1 (lowest) to 5 (highest).
        function leagueBand(value, cuts) {
            if (!cuts || !Number.isFinite(value)) return 3;
            let band = 1;
            for (let i = 0; i < cuts.length; i++) if (value > cuts[i]) band = i + 2;
            return Math.min(5, band);
        }

        /* How hard this opponent is to SCORE against — read off their expected
           goals conceded. A tight defence concedes few, so a low xgAgainst is a
           high difficulty and the band inverts. */
        function attackFdrVs(oppXgAgainst) {
            return 6 - leagueBand(oppXgAgainst, leagueQuintiles('xgAgainst'));
        }

        /* How hard they are to keep OUT — their expected goals scored. More
           expected goals is straightforwardly harder, so this one does not. */
        function defenceFdrVs(oppXgFor) {
            return leagueBand(oppXgFor, leagueQuintiles('xgFor'));
        }

        // One number for "how hard is this fixture overall", which is both of
        // the above at once: a side that scores freely and concedes little is
        // hard whichever end of the pitch you own.
        function overallFdrVs(oppXgFor, oppXgAgainst) {
            return Math.max(1, Math.min(5,
                Math.round((attackFdrVs(oppXgAgainst) + defenceFdrVs(oppXgFor)) / 2)));
        }

        // Get the effective FDR for a fixture based on the current calendar color mode
        function getEffectiveFdr(fixture) {
            if (calendarColorMode === 'attack') return fixture.attackFdr || fixture.fdr;
            if (calendarColorMode === 'defense') return fixture.defenseFdr || fixture.fdr;
            return fixture.fdr;
        }

        function buildFullSeasonMap() {
            const fixtureMap = {};
            
            // Initialize map for all teams
            allTeamsData.forEach(team => {
                fixtureMap[team.id] = {};
            });

            // Fill with fixtures from the raw data
            if (window.rawFixturesData) {
                window.rawFixturesData.forEach(f => {
                    if (!f.event) return; // Skip fixtures without a gameweek
                    
                    const homeTeam = allTeamsData.find(t => t.id === f.team_h);
                    const awayTeam = allTeamsData.find(t => t.id === f.team_a);
                    
                    if (homeTeam && fixtureMap[f.team_h]) {
                        fixtureMap[f.team_h][f.event] = fixtureMap[f.team_h][f.event] || [];
                        
                        // Calculate CS probability and attack/defense ratings for home team
                        const csChance = calculateCSChance(homeTeam, awayTeam, true);
                        
                        /* Both sides likely to score: each attack expected to
                           beat the other defence, in goals rather than index
                           points. 1.4 is a league-average game either way. */
                        const homeAtt = homeTeam?.xgFor ?? 1.42;
                        const awayAtt = awayTeam?.xgFor ?? 1.42;
                        const homeDef = homeTeam?.xgAgainst ?? 1.42;
                        const awayDef = awayTeam?.xgAgainst ?? 1.42;
                        const bttsLikely = (homeAtt > 1.30 && awayAtt > 1.30 && homeDef > 1.10 && awayDef > 1.10);
                        
                        // Venue-adjusted opponent strengths:
                        // Home team faces the AWAY version of the opponent
                        const oppXgAgainst = awayTeam?.xgAgainstAway ?? awayTeam?.xgAgainst ?? 1.42;
                        const oppXgFor = awayTeam?.xgForAway ?? awayTeam?.xgFor ?? 1.42;
                        
                        fixtureMap[f.team_h][f.event].push({
                            opponent: awayTeam?.shortName || '???',
                            opponentId: f.team_a,
                            isHome: true,
                            fdr: f.team_h_difficulty || 3,
                            attackFdr: attackFdrVs(oppXgAgainst),   // Attackers care about the opponent's DEFENCE
                            defenseFdr: defenceFdrVs(oppXgFor),     // Defenders care about the opponent's ATTACK
                            finished: f.finished,
                            gw: f.event,
                            csChance,
                            oppXgAgainst,
                            oppXgFor,
                            bttsLikely
                        });
                    }
                    
                    if (awayTeam && fixtureMap[f.team_a]) {
                        fixtureMap[f.team_a][f.event] = fixtureMap[f.team_a][f.event] || [];
                        
                        // Calculate CS probability and attack/defense ratings for away team
                        const csChance = calculateCSChance(awayTeam, homeTeam, false);
                        
                        /* Both sides likely to score: each attack expected to
                           beat the other defence, in goals rather than index
                           points. 1.4 is a league-average game either way. */
                        const homeAtt = homeTeam?.xgFor ?? 1.42;
                        const awayAtt = awayTeam?.xgFor ?? 1.42;
                        const homeDef = homeTeam?.xgAgainst ?? 1.42;
                        const awayDef = awayTeam?.xgAgainst ?? 1.42;
                        const bttsLikely = (homeAtt > 1.30 && awayAtt > 1.30 && homeDef > 1.10 && awayDef > 1.10);
                        
                        // Venue-adjusted opponent strengths:
                        // Away team faces the HOME version of the opponent
                        const oppXgAgainst = homeTeam?.xgAgainstHome ?? homeTeam?.xgAgainst ?? 1.42;
                        const oppXgFor = homeTeam?.xgForHome ?? homeTeam?.xgFor ?? 1.42;
                        
                        fixtureMap[f.team_a][f.event].push({
                            opponent: homeTeam?.shortName || '???',
                            opponentId: f.team_h,
                            isHome: false,
                            fdr: f.team_a_difficulty || 3,
                            attackFdr: attackFdrVs(oppXgAgainst),   // Attackers care about the opponent's DEFENCE
                            defenseFdr: defenceFdrVs(oppXgFor),     // Defenders care about the opponent's ATTACK
                            finished: f.finished,
                            gw: f.event,
                            csChance,
                            oppXgAgainst,
                            oppXgFor,
                            bttsLikely
                        });
                    }
                });
            }

            return fixtureMap;
        }

        function calculateCSChance(team, opponent, isHome) {
            if (!team || !opponent) return 30;
            
            /* In goals per game. Converted to the 0-100 footing the arithmetic
               below still works on: a defence expected to concede nothing rates
               100, one expected to concede the 2.45 top of the range rates 0,
               and an attack scales the other way. */
            const asRating = (gpg, higherIsBetter) => {
                const t = Math.max(0, Math.min(1, ((gpg ?? 1.42) - 0.55) / 1.90));
                return (higherIsBetter ? t : 1 - t) * 100;
            };
            const teamDef = asRating(isHome ? (team.xgAgainstHome ?? team.xgAgainst) : (team.xgAgainstAway ?? team.xgAgainst), false);
            const oppAtt = asRating(isHome ? (opponent.xgForAway ?? opponent.xgFor) : (opponent.xgForHome ?? opponent.xgFor), true);
            
            // Base CS probability (home teams ~35%, away ~25%)
            const baseCS = isHome ? 35 : 25;
            
            // Adjust based on team defense vs opponent attack
            const defenseBonus = (teamDef - 50) * 0.3;
            const attackPenalty = (oppAtt - 50) * 0.25;
            
            // Incorporate real xGC data if available (stronger signal than FPL ratings)
            let xgcAdjustment = 0;
            const teamXgData = window.teamXgData?.[team.id];
            const oppXgData = window.teamXgData?.[opponent.id];
            if (teamXgData?.hasPerGwData && oppXgData?.hasPerGwData) {
                const teamSeasonXg = getTeamSeasonXg(team.id);
                const oppSeasonXg = getTeamSeasonXg(opponent.id);
                if (teamSeasonXg && oppSeasonXg) {
                    // Teams conceding less xG than average get a CS boost
                    // Average PL xGC/game is roughly 1.3
                    const avgLeagueXgcPg = 1.3;
                    const teamXgcQuality = avgLeagueXgcPg - teamSeasonXg.xGCpg;  // positive = better than avg
                    const oppXgQuality = oppSeasonXg.xGpg - avgLeagueXgcPg;       // positive = opponent scores more than avg
                    xgcAdjustment = (teamXgcQuality * 8) - (oppXgQuality * 6);    // scale to ~percentage points
                }
            }
            
            const csChance = Math.round(Math.min(65, Math.max(8, baseCS + defenseBonus - attackPenalty + xgcAdjustment)));
            return csChance;
        }

        function renderCalendarRows(fixtureMap, displayGWs, easyRuns) {
            // Sort teams by average FDR for the current mode (best fixtures first)
            const sortedTeams = [...allTeamsData].sort((a, b) => {
                const avgA = calculateAvgFDR(fixtureMap[a.id], displayGWs);
                const avgB = calculateAvgFDR(fixtureMap[b.id], displayGWs);
                return avgA - avgB;
            });

            return sortedTeams.map(team => {
                const teamEasyRuns = easyRuns.filter(r => r.teamId === team.id);
                const avgFdr = calculateAvgFDR(fixtureMap[team.id], displayGWs);
                const avgClass = avgFdr <= 2.5 ? 'good' : avgFdr <= 3.2 ? 'warning' : 'bad';

                return `
                    <tr>
                        <td class="team-cell">
                            <div class="calendar-team">
                                <img src="${team.badgeUrl}" alt="${escHTML(team.shortName)}" class="calendar-team-badge" onerror="this.style.display='none'">
                                <span class="calendar-team-name">${escHTML(team.shortName)}</span>
                                <span class="calendar-team-fdr ${avgClass}">${avgFdr.toFixed(1)}</span>
                            </div>
                        </td>
                        ${displayGWs.map(gw => renderFixtureCell(fixtureMap[team.id][gw], gw, teamEasyRuns, team)).join('')}
                        <td>
                            <span class="analysis-team-stat ${avgClass}">${avgFdr.toFixed(1)}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getColorClass(fixture, team) {
            if (!fixture) return 'bgw-cell';
            
            if (calendarColorMode === 'fdr') {
                return `fdr-${Math.round(fixture.fdr)}`;
            } else if (calendarColorMode === 'attack') {
                // Attack FDR: based on opponent's defensive strength (venue-adjusted)
                // Lower opponent defense = easier for your attackers = lower FDR
                return `fdr-${Math.round(fixture.attackFdr || fixture.fdr)}`;
            } else if (calendarColorMode === 'defense') {
                // Defense FDR: based on opponent's attacking strength (venue-adjusted)
                // Lower opponent attack = safer for your defenders = lower FDR
                return `fdr-${Math.round(fixture.defenseFdr || fixture.fdr)}`;
            } else { // cs
                const cs = fixture.csChance || 30;
                if (cs >= 50) return 'color-1';
                if (cs >= 40) return 'color-2';
                if (cs >= 30) return 'color-3';
                if (cs >= 20) return 'color-4';
                return 'color-5';
            }
        }

        function getFixtureTooltip(fixture, gw) {
            if (!fixture) return '';
            
            const base = `GW${gw}: ${escHTML(fixture.opponent)} (${fixture.isHome ? 'H' : 'A'})`;
            const fdr = `FDR: ${fixture.fdr}`;
            const atkFdr = `Att FDR: ${fixture.attackFdr || '?'}`;
            const defFdr = `Def FDR: ${fixture.defenseFdr || '?'}`;
            const cs = `CS: ${fixture.csChance || '?'}%`;
            // The opponent's expected goals, both ways, in the units the rest of
            // the page now speaks. These read oppDefensePower/oppAttackPower until
            // the fixture map stopped carrying them, at which point every tooltip
            // in the calendar said "Opp Def: undefined".
            const oppXgA = Number.isFinite(fixture.oppXgAgainst) ? fixture.oppXgAgainst.toFixed(2) : '?';
            const oppXgF = Number.isFinite(fixture.oppXgFor) ? fixture.oppXgFor.toFixed(2) : '?';
            const oppDef = `Opp xGC: ${oppXgA}`;
            const oppAtt = `Opp xG: ${oppXgF}`;
            const btts = fixture.bttsLikely ? 'BTTS Likely' : '';
            
            if (calendarColorMode === 'attack') {
                return `${base}\nAttack FDR: ${fixture.attackFdr} (opponent concedes ${oppXgA} xG a game)\nStd FDR: ${fixture.fdr} | ${cs}${btts ? '\n' + btts : ''}`;
            } else if (calendarColorMode === 'defense') {
                return `${base}\nDefense FDR: ${fixture.defenseFdr} (opponent scores ${oppXgF} xG a game)\nStd FDR: ${fixture.fdr} | ${cs}${btts ? '\n' + btts : ''}`;
            }
            return `${base}\n${fdr} | ${atkFdr} | ${defFdr}\n${cs} | ${oppDef} | ${oppAtt}${btts ? '\n' + btts : ''}`;
        }

        function renderFixtureCell(fixtures, gw, easyRuns, team) {
            if (!fixtures || fixtures.length === 0) {
                return `<td data-gw="${gw}"><div class="fixture-cell bgw-cell"></div></td>`;
            }

            // Check if this GW is part of an easy run
            let runClass = '';
            for (const run of easyRuns) {
                if (gw >= run.startGW && gw <= run.endGW) {
                    if (gw === run.startGW) runClass = 'easy-run-start';
                    else if (gw === run.endGW) runClass = 'easy-run-end';
                    else runClass = 'easy-run-middle';
                    break;
                }
            }

            const f = fixtures[0];
            const colorClass = getColorClass(f, team);
            const tooltip = getFixtureTooltip(f, gw);
            
            // BTTS indicator
            const bttsIndicator = f.bttsLikely && !f.finished ? '<span class="btts-marker"><i data-lucide="flame" style="width:10px;height:10px;"></i></span>' : '';
            
            // Show CS% in cell if in CS mode
            const cellContent = calendarColorMode === 'cs' ? 
                `<span class="cs-value">${f.csChance || '?'}%</span>${bttsIndicator}` :
                `<span class="opp">${escHTML(f.opponent)}</span><span class="venue">${f.isHome ? 'H' : 'A'}</span>${bttsIndicator}`;

            // Handle double gameweeks
            if (fixtures.length > 1) {
                return `<td data-gw="${gw}">
                    <div class="fixture-cell ${colorClass} ${f.finished ? 'past' : ''} ${runClass} ${f.bttsLikely ? 'btts' : ''}" 
                         title="${fixtures.map(fix => getFixtureTooltip(fix, gw)).join('\n---\n')}">
                        ${cellContent}
                        <span class="dgw-indicator">DGW</span>
                    </div>
                </td>`;
            }

            return `<td data-gw="${gw}">
                <div class="fixture-cell ${colorClass} ${f.finished ? 'past' : ''} ${runClass} ${f.bttsLikely ? 'btts' : ''}" 
                     title="${tooltip}">${cellContent}</div>
            </td>`;
        }

        function calculateAvgFDR(teamFixtures, displayGWs) {
            if (!teamFixtures) return 3;
            
            let total = 0;
            let count = 0;
            
            displayGWs.forEach(gw => {
                const fixtures = teamFixtures[gw];
                if (fixtures && fixtures.length > 0) {
                    fixtures.forEach(f => {
                        if (!f.finished) {
                            total += getEffectiveFdr(f);
                            count++;
                        }
                    });
                }
            });
            
            return count > 0 ? total / count : 3;
        }

        // ===== STATS TABLE =====
        let statsSort = { col: 'pts', dir: 'desc' };
        let statsView = 'season'; // 'season', 'last10', or 'last5'
        let statsVenue = 'all'; // 'all', 'home', or 'away'
        let statsCategory = 'overall'; // kept for legacy; not used in new all-columns view
        // All column keys visible by default — populated from getStatsColumns() on first render
        let statsVisibleCols = null; // initialized lazily
        let statsSearch = '';

        function createEmptyStatBucket() {
            return {
                p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0,
                cs: 0, fts: 0,
                assists: 0, ownGoals: 0,
                penScored: 0, penMissed: 0, penSaved: 0,
                yellowCards: 0, redCards: 0,
                saves: 0,
                bonus: 0, bps: 0,
                btts: 0, // both teams to score
                o25: 0,  // over 2.5 goals
                scoredFirst: 0,
                concededFirst: 0,
                comebacks: 0,
                homeP: 0, homeW: 0, homeGf: 0, homeGa: 0, homeCs: 0,
                awayP: 0, awayW: 0, awayGf: 0, awayGa: 0, awayCs: 0
            };
        }

        function extractStatCount(statsArr, identifier, side) {
            // side: 'h' or 'a'
            if (!statsArr) return 0;
            const stat = statsArr.find(s => s.identifier === identifier);
            if (!stat || !stat[side]) return 0;
            return stat[side].reduce((sum, entry) => sum + (entry.value || 0), 0);
        }

        function extractStatEntries(statsArr, identifier, side) {
            if (!statsArr) return 0;
            const stat = statsArr.find(s => s.identifier === identifier);
            if (!stat || !stat[side]) return 0;
            return stat[side].length; // number of players who got this stat
        }

        function calculateSeasonStats() {
            const fixtures = window.rawFixturesData;
            const stats = {};

            // Initialize stats for all teams
            allTeamsData.forEach(team => {
                stats[team.id] = {
                    id: team.id,
                    name: team.name,
                    shortName: team.shortName,
                    badgeUrl: team.badgeUrl,
                    season: createEmptyStatBucket(),
                    last5: createEmptyStatBucket(),
                    last10: createEmptyStatBucket(),
                    form: [],
                    attackStrength: (team.xgForHome + team.xgForAway) / 2,
                    defenseStrength: (team.xgAgainstHome + team.xgAgainstAway) / 2
                };
            });

            // Process all finished fixtures
            const finishedFixtures = fixtures
                .filter(fixturePlayed)
                .sort((a, b) => a.event - b.event);

            // Track per-team history for last 5
            const teamFixtureHistory = {};
            allTeamsData.forEach(team => {
                teamFixtureHistory[team.id] = [];
            });

            // Shared bucket accumulator — used for season, last5, and last10
            function addToBucket(bucket, rec) {
                bucket.p++;
                bucket.gf += rec.gf;
                bucket.ga += rec.ga;
                if (rec.result === 'W') bucket.w++;
                else if (rec.result === 'D') bucket.d++;
                else bucket.l++;
                if (rec.cs) bucket.cs++;
                if (rec.fts) bucket.fts++;
                bucket.assists += rec.assists;
                bucket.ownGoals += rec.ownGoals;
                bucket.penMissed += rec.penMissed;
                bucket.penSaved += rec.penSaved;
                bucket.yellowCards += rec.yellowCards;
                bucket.redCards += rec.redCards;
                bucket.saves += rec.saves;
                bucket.bonus += rec.bonus;
                bucket.bps += rec.bps;
                if (rec.btts) bucket.btts++;
                if (rec.o25) bucket.o25++;
                if (rec.isHome) {
                    bucket.homeP++;
                    if (rec.result === 'W') bucket.homeW++;
                    bucket.homeGf += rec.gf;
                    bucket.homeGa += rec.ga;
                    if (rec.cs) bucket.homeCs++;
                } else {
                    bucket.awayP++;
                    if (rec.result === 'W') bucket.awayW++;
                    bucket.awayGf += rec.gf;
                    bucket.awayGa += rec.ga;
                    if (rec.cs) bucket.awayCs++;
                }
            }

            finishedFixtures.forEach(f => {
                const homeId = f.team_h;
                const awayId = f.team_a;
                const hg = f.team_h_score;
                const ag = f.team_a_score;
                const st = f.stats || [];

                const totalGoals = hg + ag;
                const btts = hg > 0 && ag > 0;
                const o25 = totalGoals > 2;

                // === Extract stats from the fixture stats array ===
                const homeAssists = extractStatCount(st, 'assists', 'h');
                const awayAssists = extractStatCount(st, 'assists', 'a');
                const homeOG = extractStatEntries(st, 'own_goals', 'h');
                const awayOG = extractStatEntries(st, 'own_goals', 'a');
                const homePenSaved = extractStatEntries(st, 'penalties_saved', 'h');
                const awayPenSaved = extractStatEntries(st, 'penalties_saved', 'a');
                const homePenMissed = extractStatEntries(st, 'penalties_missed', 'h');
                const awayPenMissed = extractStatEntries(st, 'penalties_missed', 'a');
                const homeYC = extractStatEntries(st, 'yellow_cards', 'h');
                const awayYC = extractStatEntries(st, 'yellow_cards', 'a');
                const homeRC = extractStatEntries(st, 'red_cards', 'h');
                const awayRC = extractStatEntries(st, 'red_cards', 'a');
                const homeSaves = extractStatCount(st, 'saves', 'h');
                const awaySaves = extractStatCount(st, 'saves', 'a');
                const homeBonus = extractStatCount(st, 'bonus', 'h');
                const awayBonus = extractStatCount(st, 'bonus', 'a');
                const homeBPS = extractStatCount(st, 'bps', 'h');
                const awayBPS = extractStatCount(st, 'bps', 'a');

                // Penalties scored: opponent's pen saved + pen missed = pens attempted
                // Pen scored = goals from pens. We approximate: pens attempted by team = opponent penSaved + team penMissed
                // Actually, pens scored = pens attempted - penMissed - oppPenSaved
                // Simpler: count from goals that were penalties. But API doesn't separate that.
                // We'll track penMissed per team and penSaved per team (saves made by keeper)
                
                // Build game record for both sides
                function buildRecord(teamGoals, oppGoals, isHome, assists, og, penMissed, penSaved, yc, rc, saves, bonus, bps) {
                    const result = teamGoals > oppGoals ? 'W' : teamGoals === oppGoals ? 'D' : 'L';
                    return {
                        gf: teamGoals, ga: oppGoals, result, isHome,
                        cs: oppGoals === 0, fts: teamGoals === 0,
                        assists, ownGoals: og, penMissed, penSaved, 
                        yellowCards: yc, redCards: rc,
                        saves, bonus, bps,
                        btts, o25,
                        scoredFirst: teamGoals > 0 && (isHome ? hg > 0 : ag > 0), // simplified
                        totalGoals: teamGoals + oppGoals
                    };
                }

                // Home team record
                const homeRec = buildRecord(hg, ag, true, homeAssists, homeOG, homePenMissed, homePenSaved, homeYC, homeRC, homeSaves, homeBonus, homeBPS);
                // Away team record
                const awayRec = buildRecord(ag, hg, false, awayAssists, awayOG, awayPenMissed, awayPenSaved, awayYC, awayRC, awaySaves, awayBonus, awayBPS);

                if (stats[homeId]) {
                    addToBucket(stats[homeId].season, homeRec);
                    teamFixtureHistory[homeId].push(homeRec);
                }
                if (stats[awayId]) {
                    addToBucket(stats[awayId].season, awayRec);
                    teamFixtureHistory[awayId].push(awayRec);
                }
            });

            // Calculate last 5, last 10 stats and form
            Object.keys(teamFixtureHistory).forEach(teamId => {
                const history = teamFixtureHistory[teamId];
                const last5Games = history.slice(-5);
                const last10Games = history.slice(-10);
                
                if (stats[teamId]) {
                    stats[teamId].form = last5Games.map(g => g.result);
                    last5Games.forEach(g => addToBucket(stats[teamId].last5, g));
                    last10Games.forEach(g => addToBucket(stats[teamId].last10, g));
                }
            });

            return stats;
        }

        // Cached season stats — invalidated when data changes
        let _cachedSeasonStats = null;

                            <div class="stats-toolbar-divider"></div>
                            <div class="search-box stats-search-box">
                                <span class="search-icon"><i data-lucide="search" style="width:14px;height:14px;"></i></span>
                                <input type="text" class="search-input stats-search-input" placeholder="Search teams..." id="statsSearchInput" value="${statsSearch}">
                            </div>
                            <div class="col-selector-wrap">
                                <button class="col-selector-btn" id="colSelectorBtn">
                                    <i data-lucide="settings-2" style="width:13px;height:13px;"></i> Columns
                                </button>
                                <div class="col-selector-popover" id="colSelectorPopover">
                                    ${colSelectorHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="stats-scroll">
                        <table class="stats-table" id="statsTable">
                            <thead id="statsHead"></thead>
                            <tbody id="statsBody"></tbody>
                        </table>
                    </div>
                </div>
            `;

            // Column Selector: open/close popover
            const colBtn = document.getElementById('colSelectorBtn');
            const colPopover = document.getElementById('colSelectorPopover');
            if (colBtn && colPopover) {
                colBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    colPopover.classList.toggle('open');
                });
                document.addEventListener('click', (e) => {
                    if (!colPopover.contains(e.target) && e.target !== colBtn) {
                        colPopover.classList.remove('open');
                    }
                }, { once: false });

                // Individual column checkboxes
                colPopover.querySelectorAll('input[data-col-key]').forEach(chk => {
                    chk.addEventListener('change', () => {
                        const key = chk.dataset.colKey;
                        if (chk.checked) {
                            statsVisibleCols.add(key);
                        } else {
                            statsVisibleCols.delete(key);
                        }
                        buildStatsTableHeader(cats);
                        updateStatsTable(_cachedSeasonStats || calculateSeasonStats());
                    });
                });

                // Group toggle buttons
                colPopover.querySelectorAll('.col-selector-toggle-all').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const groupKey = btn.dataset.toggleGroup;
                        const cat = cats[groupKey];
                        if (!cat) return;
                        const allVisible = cat.cols.every(c => statsVisibleCols.has(c.key));
                        cat.cols.forEach(c => {
                            if (allVisible) {
                                statsVisibleCols.delete(c.key);
                            } else {
                                statsVisibleCols.add(c.key);
                            }
                        });
                        // Update checkboxes in this group
                        const groupEl = colPopover.querySelector(`[data-group-key="${groupKey}"]`);
                        if (groupEl) {
                            groupEl.querySelectorAll('input[data-col-key]').forEach(chk => {
                                chk.checked = statsVisibleCols.has(chk.dataset.colKey);
                            });
                        }
                        buildStatsTableHeader(cats);
                        updateStatsTable(_cachedSeasonStats || calculateSeasonStats());
                    });
                });
            }

            // View pill handlers
            document.querySelectorAll('.stats-view-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    statsView = btn.dataset.view;
                    renderStatsTable(document.getElementById('content-area'));
                });
            });

            // Venue pill handlers
            document.querySelectorAll('.stats-venue-pills .segmented-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    statsVenue = btn.dataset.venue;
                    renderStatsTable(document.getElementById('content-area'));
                });
            });

            // Search handler
            const searchInput = document.getElementById('statsSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    statsSearch = e.target.value.toLowerCase();
                    updateStatsTable(_cachedSeasonStats || calculateSeasonStats());
                });
                // Focus back to search position
                if (statsSearch) {
                    searchInput.focus();
                    searchInput.setSelectionRange(statsSearch.length, statsSearch.length);
                }
            }

            buildStatsTableHeader(cats);
            updateStatsTable(seasonStats);
        }

        function buildStatsTableHeader(cats) {
            const thead = document.getElementById('statsHead');
            if (!thead) return;

            // Build headers using per-column visibility
            let groupHeaders = '<th class="team-col" rowspan="2">Team</th>';
            let colHeaders = '';
            let groupIdx = 0;
            Object.keys(cats).forEach(catKey => {
                const cat = cats[catKey];
                const visCols = cat.cols.filter(c => statsVisibleCols.has(c.key));
                if (visCols.length === 0) return;
                const dividerClass = groupIdx > 0 ? ' section-divider' : '';
                groupHeaders += `<th colspan="${visCols.length}" class="${cat.groupClass}${dividerClass}">${cat.groupLabel}</th>`;
                visCols.forEach((c, ci) => {
                    const firstColDivider = (groupIdx > 0 && ci === 0) ? ' section-divider' : '';
                    colHeaders += `<th data-col="${c.key}" title="${c.title}" class="${firstColDivider}">${c.label}</th>`;
                });
                groupIdx++;
            });

            thead.innerHTML = `
                <tr class="col-groups">${groupHeaders}</tr>
                <tr>${colHeaders}</tr>
            `;

            // Sort handlers
            thead.querySelectorAll('th[data-col]').forEach(th => {
                if (th.dataset.col === 'form') return; // form is not sortable
                th.style.cursor = 'pointer';
                th.addEventListener('click', () => {
                    const col = th.dataset.col;
                    if (statsSort.col === col) {
                        statsSort.dir = statsSort.dir === 'desc' ? 'asc' : 'desc';
                    } else {
                        statsSort.col = col;
                        statsSort.dir = 'desc';
                    }
                    updateStatsTable(_cachedSeasonStats || calculateSeasonStats());
                });
            });
        }

        function setStatsView(view) {
            statsView = view;
            renderCurrentView();
        }

        function updateStatsTable(seasonStats) {
            const tbody = document.getElementById('statsBody');
            if (!tbody) return;

            const cats = getStatsColumns();
            // Flatten visible columns using per-column set
            const cols = [];
            const colGroupBoundaries = new Set();
            let gIdx = 0;
            Object.keys(cats).forEach(catKey => {
                const visCols = cats[catKey].cols.filter(c => statsVisibleCols.has(c.key));
                if (visCols.length === 0) return;
                if (gIdx > 0) colGroupBoundaries.add(cols.length);
                visCols.forEach(c => cols.push(c));
                gIdx++;
            });

            // Convert to flat array with computed values
            let teams = Object.values(seasonStats).map(team => {
                const s = statsView === 'season' ? team.season : (statsView === 'last10' ? team.last10 : team.last5);

                // Venue-aware base stats
                let games, w, gf, ga, cs;
                if (statsVenue === 'home') {
                    games = s.homeP || 1; w = s.homeW || 0; gf = s.homeGf || 0; ga = s.homeGa || 0; cs = s.homeCs || 0;
                } else if (statsVenue === 'away') {
                    games = s.awayP || 1; w = s.awayW || 0; gf = s.awayGf || 0; ga = s.awayGa || 0; cs = s.awayCs || 0;
                } else {
                    games = s.p || 1; w = s.w; gf = s.gf; ga = s.ga; cs = s.cs;
                }
                const pts = (w * 3) + (statsVenue === 'all' ? s.d : 0);
                return {
                    ...team,
                    ...s,
                    // Override base stats with venue-filtered values
                    p: games,
                    w: w,
                    gf: gf,
                    ga: ga,
                    cs: cs,
                    pts,
                    gd: gf - ga,
                    ppg: pts / games,
                    gpg: gf / games,
                    gapg: ga / games,
                    apg: s.assists / games,
                    csPct: (cs / games) * 100,
                    ftsPct: (s.fts / games) * 100,
                    svpg: s.saves / games,
                    ycpg: s.yellowCards / games,
                    bttsPct: (s.btts / games) * 100,
                    o25Pct: (s.o25 / games) * 100,
                    bnspg: s.bonus / games,
                    bpspg: s.bps / games,
                    homeGpg: s.homeP > 0 ? s.homeGf / s.homeP : 0,
                    awayGpg: s.awayP > 0 ? s.awayGf / s.awayP : 0,
                    homeCsPct: s.homeP > 0 ? (s.homeCs / s.homeP) * 100 : 0,
                    awayCsPct: s.awayP > 0 ? (s.awayCs / s.awayP) * 100 : 0,
                    gAndA: gf + s.assists,
                    gapg_combined: (gf + s.assists) / games,
                    csBonus: cs + s.saves,
                    // xG data — matched to current statsView window
                    xGpg: (() => {
                        if (statsView === 'last5') { const r = getTeamXgWindow(team.id, 5); return r ? r.xGpg : 0; }
                        if (statsView === 'last10') { const r = getTeamXgWindow(team.id, 10); return r ? r.xGpg : 0; }
                        const sx = getTeamSeasonXg(team.id); return sx ? sx.xGpg : 0;
                    })(),
                    xGCpg: (() => {
                        if (statsView === 'last5') { const r = getTeamXgWindow(team.id, 5); return r ? r.xGCpg : 0; }
                        if (statsView === 'last10') { const r = getTeamXgWindow(team.id, 10); return r ? r.xGCpg : 0; }
                        const sx = getTeamSeasonXg(team.id); return sx ? sx.xGCpg : 0;
                    })(),
                    xGdiffTotal: (() => {
                        if (statsView === 'last5') { const r = getTeamXgWindow(team.id, 5); return r ? r.xGoverperformance : 0; }
                        if (statsView === 'last10') { const r = getTeamXgWindow(team.id, 10); return r ? r.xGoverperformance : 0; }
                        const sx = getTeamSeasonXg(team.id); return sx ? sx.xGoverperformance : 0;
                    })(),
                    xGCdiffTotal: (() => {
                        if (statsView === 'last5') { const r = getTeamXgWindow(team.id, 5); return r ? (r.totalConceded - r.totalXgc) : 0; }
                        if (statsView === 'last10') { const r = getTeamXgWindow(team.id, 10); return r ? (r.totalConceded - r.totalXgc) : 0; }
                        const sx = getTeamSeasonXg(team.id); return sx ? (sx.totalConceded - sx.totalXgc) : 0;
                    })(),
                    r6xGpg: (() => { const r = getTeamXgWindow(team.id, 6); return r ? r.xGpg : 0; })(),
                    r6gapg: (() => { const r = getTeamXgWindow(team.id, 6); return r ? r.gapg : 0; })(),
                    // NPxG/G placeholder (~90% of xG) — replace with real NPxG from backend when available
                    npxGpg: (() => {
                        if (statsView === 'last5') { const r = getTeamXgWindow(team.id, 5); return r ? r.xGpg * 0.9 : 0; }
                        if (statsView === 'last10') { const r = getTeamXgWindow(team.id, 10); return r ? r.xGpg * 0.9 : 0; }
                        const sx = getTeamSeasonXg(team.id); return sx ? sx.xGpg * 0.9 : 0;
                    })(),
                    netXGpg: (() => {
                        let xgVal, xgcVal;
                        if (statsView === 'last5') { const r = getTeamXgWindow(team.id, 5); xgVal = r ? r.xGpg : 0; xgcVal = r ? r.xGCpg : 0; }
                        else if (statsView === 'last10') { const r = getTeamXgWindow(team.id, 10); xgVal = r ? r.xGpg : 0; xgcVal = r ? r.xGCpg : 0; }
                        else { const sx = getTeamSeasonXg(team.id); xgVal = sx ? sx.xGpg : 0; xgcVal = sx ? sx.xGCpg : 0; }
                        return xgVal - xgcVal;
                    })(),
                };
            });

            // Apply search filter
            if (statsSearch) {
                teams = teams.filter(t => 
                    t.name.toLowerCase().includes(statsSearch) || 
                    t.shortName.toLowerCase().includes(statsSearch)
                );
            }

            // Sort
            const sortCol = statsSort.col;
            const sortDir = statsSort.dir;
            const invertedCols = cols.filter(c => c.inverted).map(c => c.key);

            teams.sort((a, b) => {
                let aVal = a[sortCol] ?? 0;
                let bVal = b[sortCol] ?? 0;
                if (invertedCols.includes(sortCol)) {
                    return sortDir === 'desc' ? aVal - bVal : bVal - aVal;
                }
                return sortDir === 'desc' ? bVal - aVal : aVal - bVal;
            });

            // Compute ranks/percentiles for color coding
            const allVals = {};
            cols.forEach(c => {
                if (c.key === 'form') return;
                allVals[c.key] = teams.map(t => t[c.key] ?? 0);
            });

            function getValueClass(key, val, col) {
                const arr = allVals[key];
                if (!arr || arr.length === 0) return '';
                const sorted = [...arr].sort((a, b) => a - b);
                // Use average rank for ties instead of indexOf (which always returns first occurrence)
                const matchingIndices = [];
                sorted.forEach((v, i) => { if (v === val) matchingIndices.push(i); });
                const avgRank = matchingIndices.length > 0 
                    ? matchingIndices.reduce((a, b) => a + b, 0) / matchingIndices.length 
                    : sorted.indexOf(val);
                const pct = avgRank / (sorted.length - 1);
                if (col.inverted) {
                    if (pct <= 0.25) return 'good';
                    if (pct >= 0.75) return 'bad';
                } else {
                    if (pct >= 0.75) return 'good';
                    if (pct <= 0.25) return 'bad';
                }
                return 'neutral';
            }

            // Update header active sort indicator
            document.querySelectorAll('#statsHead th[data-col]').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (th.dataset.col === sortCol) {
                    th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });

            // Render rows
            tbody.innerHTML = teams.map((team, idx) => {
                const rank = idx + 1;
                
                const cells = cols.map((col, colIdx) => {
                    const dividerClass = colGroupBoundaries.has(colIdx) ? ' section-divider' : '';
                    if (col.key === 'form') {
                        const formDots = (team.form || []).map(r => 
                            `<span class="stats-form-dot ${r}"></span>`
                        ).join('');
                        return `<td class="${dividerClass}"><div style="display:flex;gap:3px;justify-content:center;">${formDots}</div></td>`;
                    }
                    
                    let val = team[col.key] ?? 0;
                    let display;
                    
                    if (col.decimals !== undefined) {
                        display = val.toFixed(col.decimals);
                    } else {
                        display = typeof val === 'number' && !Number.isInteger(val) ? val.toFixed(1) : val;
                    }
                    
                    if (col.suffix) display += col.suffix;
                    
                    const cls = getValueClass(col.key, val, col);
                    const isBold = ['pts', 'gf', 'ga', 'gd', 'bonus', 'bps'].includes(col.key);
                    
                    return `<td class="stats-value ${cls}${dividerClass}">${isBold ? '<strong>' : ''}${display}${isBold ? '</strong>' : ''}</td>`;
                }).join('');

                return `
                    <tr>
                        <td class="team-col">
                            <div class="stats-team">
                                <span class="stats-rank">${rank}</span>
                                <img src="${team.badgeUrl}" alt="${escHTML(team.shortName)}" class="stats-badge" onerror="this.style.display='none'">
                                <span class="stats-team-name">${escHTML(team.name)}</span>
                            </div>
                        </td>
                        ${cells}
                    </tr>
                `;
            }).join('');
        }

        // ===== ADVANCED xG TABLE — removed; columns merged into Stats Table =====

        // ===== MOMENTUM MATRIX =====
        let momentumMetric = 'net'; // 'net', 'attack', 'defense'
        let momentumChart = null;
        let badgeImages = new Map();

        function preloadTeamBadges(teams) {
            return Promise.all(teams.map(team => new Promise(resolve => {
                if (!team.badgeUrl) { resolve(); return; }

                let img = badgeImages.get(team.id);
                if (!img) {
                    img = new Image();
                    badgeImages.set(team.id, img);
                    img.src = team.badgeUrl;
                }

                if (img.complete) { resolve(); return; }
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
            })));
        }

        // Tinted bands so the four corners read as meanings rather than as
        // coordinates. The vertical split is the metric's own threshold (zero for
        // net xG, the league mean otherwise); the horizontal split is average
        // fixture difficulty, which is what the x axis carries.
        const momentumQuadrantPlugin = {
            id: 'momentumQuadrants',
            beforeDatasetsDraw(chart) {
                const area = chart.chartArea, sx = chart.scales.x, sy = chart.scales.y;
                if (!area || !sx || !sy) return;
                const yT = momentumMetric === 'net'
                    ? 0
                    : allTeamsData.reduce((s, t) => s + getMomentumY(t), 0) / allTeamsData.length;
                const xT = allTeamsData.reduce((s, t) => s + getMomentumX(t), 0) / allTeamsData.length;
                const cx = Math.min(Math.max(sx.getPixelForValue(xT), area.left), area.right);
                const cy = Math.min(Math.max(sy.getPixelForValue(yT), area.top), area.bottom);

                const ctx = chart.ctx;
                ctx.save();
                const bands = [
                    ['Elite form & fixtures', 'rgba(52,211,153,0.10)', 'rgba(16,185,129,0.85)', cx, area.top, area.right - cx, cy - area.top, 'right', 'top'],
                    ['Good form, hard run',   'rgba(96,165,250,0.09)', 'rgba(59,130,246,0.8)',  area.left, area.top, cx - area.left, cy - area.top, 'left', 'top'],
                    ['Kind run, poor form',   'rgba(251,191,36,0.09)', 'rgba(217,119,6,0.8)',   cx, cy, area.right - cx, area.bottom - cy, 'right', 'bottom'],
                    ['Avoid',                 'rgba(248,113,113,0.10)', 'rgba(239,68,68,0.8)',  area.left, cy, cx - area.left, area.bottom - cy, 'left', 'bottom']
                ];
                bands.forEach(([label, fill, text, x, y, w, h, hA, vA]) => {
                    if (w <= 2 || h <= 2) return;
                    ctx.fillStyle = fill;
                    ctx.fillRect(x, y, w, h);
                    if (w > 118 && h > 34) {
                        ctx.fillStyle = text;
                        ctx.font = '700 10px Inter, system-ui, sans-serif';
                        ctx.textAlign = hA; ctx.textBaseline = vA;
                        ctx.fillText(label.toUpperCase(), hA === 'left' ? x + 10 : x + w - 10, vA === 'top' ? y + 8 : y + h - 8);
                    }
                });
                ctx.strokeStyle = 'rgba(128,128,128,0.25)';
                ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(cx, area.top); ctx.lineTo(cx, area.bottom);
                ctx.moveTo(area.left, cy); ctx.lineTo(area.right, cy);
                ctx.stroke();
                ctx.restore();
            }
        };

        const momentumBadgePlugin = {
            id: 'momentumBadges',
            afterDatasetsDraw(chart) {
                const meta = chart.getDatasetMeta(0);
                const points = chart.data.datasets[0].data;
                const chartCtx = chart.ctx;

                meta.data.forEach((element, index) => {
                    const team = points[index]?.teamData;
                    if (!team || element.skip) return;

                    chartCtx.save();
                    chartCtx.beginPath();
                    chartCtx.arc(element.x, element.y, 18, 0, Math.PI * 2);
                    chartCtx.fillStyle = '#F1F1EF';
                    chartCtx.fill();
                    chartCtx.strokeStyle = '#E4E4E1';
                    chartCtx.lineWidth = 1;
                    chartCtx.stroke();

                    const img = badgeImages.get(team.id);
                    if (img && img.complete && img.naturalWidth > 0) {
                        const maxSize = 26;
                        const scale = Math.min(maxSize / img.naturalWidth, maxSize / img.naturalHeight);
                        const width = img.naturalWidth * scale;
                        const height = img.naturalHeight * scale;
                        chartCtx.drawImage(img, element.x - width / 2, element.y - height / 2, width, height);
                    } else {
                        chartCtx.fillStyle = '#636363';
                        chartCtx.font = '600 8px Inter, sans-serif';
                        chartCtx.textAlign = 'center';
                        chartCtx.textBaseline = 'middle';
                        chartCtx.fillText(team.shortName || '?', element.x, element.y);
                    }
                    chartCtx.restore();
                });
            }
        };

        function renderMomentumMatrix() {
            return `
                <section class="momentum-matrix-section">
                    <div class="momentum-header">
                        <div class="momentum-title">
                            <i data-lucide="scatter-chart" style="width:20px;height:20px;color:var(--color-info)"></i>
                            FPL Momentum Matrix
                            <span class="momentum-title-badge">Interactive</span>
                        </div>
                        <div class="segmented-control" id="momentumMetricControl">
                            <button class="segmented-btn ${momentumMetric === 'net' ? 'active' : ''}" data-metric="net">Overall Form (Net xG)</button>
                            <button class="segmented-btn ${momentumMetric === 'attack' ? 'active' : ''}" data-metric="attack">Attack Threat (xG)</button>
                            <button class="segmented-btn ${momentumMetric === 'defense' ? 'active' : ''}" data-metric="defense">Defensive Solidity (xGC)</button>
                        </div>
                    </div>
                    <div class="momentum-grid">
                        <div class="momentum-chart-container">
                            <canvas id="momentumChart"></canvas>
                        </div>
                        <div class="scout-report-panel" id="scoutReportPanel"></div>
                    </div>
                </section>
            `;
        }

        // Fixture ease: FDR inverted so an easier run sits to the right.
        function getMomentumX(team) {
            return 6 - parseFloat(team.avgFdr);
        }

        function getMomentumY(team) {
            const xg = team.seasonXg;
            if (!xg || !team.hasRealXg) return 0;
            switch (momentumMetric) {
                case 'attack': return xg.xGpg || 0;
                case 'defense': return -(xg.xGCpg || 0); // invert: lower conceded = higher on chart
                default: return xg.netXGpg || 0;
            }
        }

        function getMomentumYLabel() {
            switch (momentumMetric) {
                case 'attack': return 'Attack Threat (xG per game)';
                case 'defense': return 'Defensive Solidity (inverted xGC per game)';
                default: return 'Overall Form (Net xG per game)';
            }
        }

        function renderMomentumTooltip(context) {
            const { chart, tooltip } = context;
            let card = document.querySelector('.momentum-hover-card');

            if (!card) {
                card = document.createElement('div');
                card.className = 'momentum-hover-card';
                card.setAttribute('role', 'tooltip');
                document.body.appendChild(card);
            }

            if (!tooltip || tooltip.opacity === 0 || !tooltip.dataPoints?.length) {
                card.classList.remove('visible');
                return;
            }

            const team = tooltip.dataPoints[0].raw.teamData;
            const changedTeam = card.dataset.teamId !== String(team.id);
            card.dataset.teamId = String(team.id);
            card.innerHTML = `
                <div class="momentum-hover-name">${escHTML(team.name)}</div>
                <div class="momentum-hover-meta"><strong>FDR ${team.avgFdr}</strong><span>•</span><span>${team.wins ?? 0}W ${team.draws ?? 0}D ${team.losses ?? 0}L</span></div>
            `;

            const gap = 26;
            const cardWidth = 196;
            const canvasRect = chart.canvas.getBoundingClientRect();
            let left = canvasRect.left + tooltip.caretX + gap;
            let cardSide = 'points-right';
            if (left + cardWidth > window.innerWidth - 8) {
                left = canvasRect.left + tooltip.caretX - cardWidth - gap;
                cardSide = 'points-left';
            }
            const top = Math.max(8, Math.min(
                canvasRect.top + tooltip.caretY - 34,
                window.innerHeight - 76
            ));

            card.style.left = `${left}px`;
            card.style.top = `${top}px`;
            card.classList.remove('points-left', 'points-right');
            card.classList.add(cardSide);
            if (changedTeam) {
                card.classList.remove('visible');
                void card.offsetWidth;
                card.classList.add('visible');
            } else {
                card.classList.add('visible');
            }
        }

        async function initMomentumChart() {
            const canvas = document.getElementById('momentumChart');
            if (!canvas || typeof Chart === 'undefined') return;
            document.querySelector('.momentum-hover-card')?.remove();

            if (momentumChart) {
                momentumChart.destroy();
                momentumChart = null;
            }

            // Wait for badge assets before drawing. If the user changes view
            // while they load, abandon this now-stale chart instance.
            await preloadTeamBadges(allTeamsData);
            if (!canvas.isConnected) return;

            const ctx = canvas.getContext('2d');

            const dataPoints = allTeamsData.map(team => {
                const xVal = getMomentumX(team);
                const yVal = getMomentumY(team);
                return {
                    x: xVal,
                    y: yVal,
                    teamData: team,
                };
            });

            // Compute Y-axis midpoint for quadrant lines
            const yValues = dataPoints.map(p => p.y);
            const yMid = momentumMetric === 'net' ? 0 : yValues.reduce((a, b) => a + b, 0) / (yValues.length || 1);

            // Dynamic X-axis range based on actual data with tight padding
            const xValues = dataPoints.map(p => p.x);
            const xDataMin = Math.min(...xValues);
            const xDataMax = Math.max(...xValues);
            const xPad = Math.max(0.1, (xDataMax - xDataMin) * 0.05);
            const xAxisMin = Math.floor((xDataMin - xPad) * 10) / 10;
            const xAxisMax = Math.ceil((xDataMax + xPad) * 10) / 10;
            const xMid = (xAxisMin + xAxisMax) / 2;

            const style = getComputedStyle(document.documentElement);
            const gridColor = style.getPropertyValue('--border-default').trim() || 'rgba(0,0,0,0.08)';
            const textColor = style.getPropertyValue('--text-secondary').trim() || '#6B7280';
            const mutedColor = style.getPropertyValue('--text-muted').trim() || '#9CA3AF';

            momentumChart = new Chart(ctx, {
                type: 'scatter',
                plugins: [momentumQuadrantPlugin, momentumBadgePlugin],
                data: {
                    datasets: [{
                        data: dataPoints,
                        pointStyle: 'circle',
                        pointRadius: 19,
                        pointHoverRadius: 21,
                        pointBackgroundColor: 'rgba(0,0,0,0.001)',
                        pointBorderColor: 'transparent',
                        pointBorderWidth: 0,
                        pointHoverBorderWidth: 2,
                        pointHoverBorderColor: '#ffffff',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: false,
                            external: renderMomentumTooltip,
                            animations: {
                                x: { duration: 0 },
                                y: { duration: 0 },
                                opacity: { duration: 0 },
                            },
                        },
                        annotation: {
                            annotations: {
                                quadTopRight: {
                                    type: 'box',
                                    xMin: xMid, xMax: xAxisMax,
                                    yMin: yMid, yMax: momentumMetric === 'net' ? 2.5 : Math.max(...yValues) + 0.3,
                                    backgroundColor: 'rgba(16, 185, 129, 0.05)',
                                    borderWidth: 0,
                                },
                                quadBottomLeft: {
                                    type: 'box',
                                    xMin: xAxisMin, xMax: xMid,
                                    yMin: momentumMetric === 'net' ? -2.5 : Math.min(...yValues) - 0.3,
                                    yMax: yMid,
                                    backgroundColor: 'rgba(239, 68, 68, 0.05)',
                                    borderWidth: 0,
                                },
                                quadTopLeft: {
                                    type: 'box',
                                    xMin: xAxisMin, xMax: xMid,
                                    yMin: yMid, yMax: momentumMetric === 'net' ? 2.5 : Math.max(...yValues) + 0.3,
                                    backgroundColor: 'rgba(96, 165, 250, 0.04)',
                                    borderWidth: 0,
                                },
                                quadBottomRight: {
                                    type: 'box',
                                    xMin: xMid, xMax: xAxisMax,
                                    yMin: momentumMetric === 'net' ? -2.5 : Math.min(...yValues) - 0.3,
                                    yMax: yMid,
                                    backgroundColor: 'rgba(245, 158, 11, 0.04)',
                                    borderWidth: 0,
                                },
                                lineH: {
                                    type: 'line',
                                    yMin: yMid, yMax: yMid,
                                    borderColor: gridColor,
                                    borderWidth: 1,
                                    borderDash: [4, 4],
                                },
                                lineV: {
                                    type: 'line',
                                    xMin: xMid, xMax: xMid,
                                    borderColor: gridColor,
                                    borderWidth: 1,
                                    borderDash: [4, 4],
                                },
                                labelTR: {
                                    type: 'label',
                                    xValue: xMid + (xAxisMax - xMid) * 0.85, yValue: yMid + (momentumMetric === 'net' ? 0.15 : 0.05),
                                    content: ['\u2714 TARGET'],
                                    font: { size: 10, weight: '700', family: 'Inter' },
                                    color: 'rgba(16, 185, 129, 0.35)',
                                },
                                labelBL: {
                                    type: 'label',
                                    xValue: xAxisMin + (xMid - xAxisMin) * 0.15, yValue: yMid - (momentumMetric === 'net' ? 0.15 : 0.05),
                                    content: ['\u2716 AVOID'],
                                    font: { size: 10, weight: '700', family: 'Inter' },
                                    color: 'rgba(239, 68, 68, 0.35)',
                                },
                            }
                        }
                    },
                    scales: {
                        x: {
                            offset: false,
                            title: {
                                display: true,
                                text: 'Upcoming Fixture Ease \u2192',
                                font: { size: 12, weight: '600', family: 'Inter' },
                                color: textColor,
                            },
                            min: xAxisMin,
                            max: xAxisMax,
                            grid: { color: gridColor },
                            ticks: {
                                color: mutedColor,
                                font: { size: 11 },
                                callback: function(v) {
                                    if (Math.abs(v - xAxisMin) < 0.01) return 'Harder';
                                    if (Math.abs(v - xAxisMax) < 0.01) return 'Easier';
                                    if (Math.abs(v - xMid) < 0.01) return 'Mid';
                                    return '';
                                },
                                stepSize: (xAxisMax - xAxisMin) / 4,
                            }
                        },
                        y: {
                            offset: false,
                            title: {
                                display: true,
                                text: getMomentumYLabel(),
                                font: { size: 12, weight: '600', family: 'Inter' },
                                color: textColor,
                            },
                            grid: { color: gridColor },
                            ticks: {
                                color: mutedColor,
                                font: { size: 11 },
                            }
                        }
                    },
                    onClick: function(evt) {
                        const points = momentumChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, false);
                        if (points.length > 0) {
                            const idx = points[0].index;
                            const team = momentumChart.data.datasets[0].data[idx].teamData;
                            updateScoutReport(team);
                        }
                    }
                }
            });

            // Fill the panel immediately rather than waiting for a click.
            primeScoutReport();

            // Wire up metric toggle buttons
            document.querySelectorAll('#momentumMetricControl .segmented-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setMomentumMetric(btn.dataset.metric);
                });
            });
        }

        // The panel used to sit empty until someone clicked a dot, which wasted the
        // most valuable column on the page. It now opens on the strongest team in
        // the target quadrant — good form and a kind run — which is the team the
        // matrix exists to surface.
        function pickTeamOfTheWeek() {
            if (!allTeamsData || !allTeamsData.length) return null;
            const yT = momentumMetric === 'net'
                ? 0
                : allTeamsData.reduce((s, t) => s + getMomentumY(t), 0) / allTeamsData.length;
            const xT = allTeamsData.reduce((s, t) => s + getMomentumX(t), 0) / allTeamsData.length;

            const inTarget = allTeamsData.filter(t => getMomentumY(t) > yT && getMomentumX(t) > xT);
            const pool = inTarget.length ? inTarget : allTeamsData;
            // Distance from the split, so the pick is the most emphatic corner
            // dweller rather than whoever merely qualifies.
            return pool.slice().sort((a, b) =>
                ((getMomentumY(b) - yT) + (getMomentumX(b) - xT)) -
                ((getMomentumY(a) - yT) + (getMomentumX(a) - xT))
            )[0];
        }

        function primeScoutReport() {
            const panel = document.getElementById('scoutReportPanel');
            if (!panel) return;
            const pick = pickTeamOfTheWeek();
            if (!pick) return;
            updateScoutReport(pick);
            // Mark it as a default so it does not read as a deliberate selection.
            const badge = document.createElement('div');
            badge.className = 'scout-default-badge';
            badge.innerHTML = '⭐ Team of the week — click any dot to scout another';
            panel.prepend(badge);
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function setMomentumMetric(metric) {
            momentumMetric = metric;
            // Re-render entire rankings view to rebuild chart with new metric
            renderCurrentView();
        }

        function updateScoutReport(team) {
            const panel = document.getElementById('scoutReportPanel');
            if (!panel) return;

            const xg = team.seasonXg;
            const xGVal = xg ? (xg.xGpg || 0).toFixed(2) : 'N/A';
            const xGCVal = xg ? (xg.xGCpg || 0).toFixed(2) : 'N/A';
            const netXgVal = xg ? (xg.netXGpg || 0) : 0;
            const fdrVal = parseFloat(team.avgFdr);
            const ease = 6 - fdrVal;

            // Determine quadrant
            const yVal = getMomentumY(team);
            const yThreshold = momentumMetric === 'net' ? 0 : allTeamsData.reduce((s, t) => s + getMomentumY(t), 0) / allTeamsData.length;
            const goodForm = yVal > yThreshold;
            const goodFixtures = ease > 3.0;

            let quadrant, quadrantLabel, quadrantClass, reportText;

            if (goodForm && goodFixtures) {
                quadrant = 'target';
                quadrantLabel = '\u2714 Prime Target';
                quadrantClass = 'target';
                reportText = `<strong>${escHTML(team.name)}</strong> are currently prime FPL targets. They are dominating underlying metrics with a positive performance trend, and are entering a highly favorable run of fixtures (avg FDR ${fdrVal}). Investment in their key assets is highly recommended.`;
            } else if (goodForm && !goodFixtures) {
                quadrant = 'monitor';
                quadrantLabel = '\u23F3 Monitor';
                quadrantClass = 'monitor';
                reportText = `<strong>${escHTML(team.name)}</strong> boast strong underlying numbers \u2014 their xG metrics rank well above average. However, their upcoming fixture schedule is challenging (avg FDR ${fdrVal}). Hold existing assets but consider selling to fund moves elsewhere. Revisit once fixtures turn.`;
            } else if (!goodForm && goodFixtures) {
                quadrant = 'speculative';
                quadrantLabel = '\u26A0 Speculative Buy';
                quadrantClass = 'speculative';
                reportText = `<strong>${escHTML(team.name)}</strong> have been underwhelming in recent underlying data, but their fixture schedule is about to soften significantly (avg FDR ${fdrVal}). This makes them a speculative buy \u2014 the easy games could catalyse a turnaround. Low-cost differentials from this squad could pay off.`;
            } else {
                quadrant = 'avoid';
                quadrantLabel = '\u2716 Avoid';
                quadrantClass = 'avoid';
                reportText = `<strong>${escHTML(team.name)}</strong> should be avoided right now. Their underlying metrics are poor and their upcoming fixtures offer no relief (avg FDR ${fdrVal}). Look to sell any assets from this squad and reinvest in teams with better profiles.`;
            }

            const xgClass = netXgVal > 0.2 ? 'good' : netXgVal < -0.2 ? 'bad' : 'warn';
            const fdrClass = fdrVal <= 2.5 ? 'good' : fdrVal >= 3.5 ? 'bad' : 'warn';

            panel.innerHTML = `
                <div class="scout-team-header">
                    <img src="${team.badgeUrl}" alt="${escHTML(team.shortName)}" class="scout-badge" onerror="this.style.display='none'">
                    <div>
                        <div class="scout-team-name">${escHTML(team.name)}</div>
                        <div class="scout-team-sub">${team.wins}W ${team.draws}D ${team.losses}L \u00B7 ${(team.last5Ppg ?? 0).toFixed(2)} pts/game</div>
                    </div>
                </div>
                <div class="scout-stat-grid">
                    <div class="scout-stat">
                        <div class="scout-stat-label">xG/g</div>
                        <div class="scout-stat-value">${xGVal}</div>
                    </div>
                    <div class="scout-stat">
                        <div class="scout-stat-label">xGC/g</div>
                        <div class="scout-stat-value">${xGCVal}</div>
                    </div>
                    <div class="scout-stat">
                        <div class="scout-stat-label">Avg FDR</div>
                        <div class="scout-stat-value ${fdrClass}">${fdrVal}</div>
                    </div>
                </div>
                <span class="scout-quadrant-tag ${quadrantClass}">${quadrantLabel}</span>
                <p id="scoutReportText">${reportText}</p>
            `;
        }

        function findEasyRuns(fixtureMap) {
            const allRuns = [];
            const MIN_WINDOW = 3;
            const MAX_WINDOW = 8;

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                // Get all remaining GWs with fixtures
                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => {
                        const fx = teamFixtures[gw];
                        return gw >= currentGW && fx && fx.length > 0 && !fx[0].finished;
                    })
                    .sort((a, b) => a - b);

                if (futureGWs.length < MIN_WINDOW) return;

                // Sliding window: scan every window of size MIN_WINDOW to MAX_WINDOW
                for (let winSize = MIN_WINDOW; winSize <= Math.min(MAX_WINDOW, futureGWs.length); winSize++) {
                    for (let start = 0; start <= futureGWs.length - winSize; start++) {
                        const windowGWs = futureGWs.slice(start, start + winSize);
                        const windowFixtures = windowGWs.map(gw => {
                            const fx = teamFixtures[gw];
                            return fx && fx[0] ? { ...fx[0], gw } : null;
                        }).filter(Boolean);

                        if (windowFixtures.length < MIN_WINDOW) continue;

                        const avgFdr = windowFixtures.reduce((s, f) => s + getEffectiveFdr(f), 0) / windowFixtures.length;

                        // Only include windows with avg FDR ≤ 3.0 (generous)
                        if (avgFdr > 3.0) continue;

                        // Count how many fixtures are genuinely easy (FDR ≤ 2)
                        const easyCount = windowFixtures.filter(f => getEffectiveFdr(f) <= 2).length;
                        // Skip if none are actually easy
                        if (easyCount === 0) continue;

                        const homeCount = windowFixtures.filter(f => f.isHome).length;
                        const hardCount = windowFixtures.filter(f => getEffectiveFdr(f) >= 4).length;

                        // Composite score: lower is better
                        // Rewards: low avg FDR, longer runs, more home games, fewer hard games
                        // Length bonus scales quadratically to properly reward longer useful runs
                        const lengthBonus = windowFixtures.length * 0.05 + Math.pow(windowFixtures.length - MIN_WINDOW, 1.3) * 0.04;
                        const score = avgFdr - lengthBonus - (homeCount * 0.06) + (hardCount * 0.20);

                        allRuns.push({
                            teamId: team.id,
                            teamName: team.name,
                            teamShort: team.shortName,
                            badgeUrl: team.badgeUrl,
                            startGW: windowGWs[0],
                            endGW: windowGWs[windowGWs.length - 1],
                            length: windowFixtures.length,
                            fixtures: windowFixtures,
                            homeCount,
                            avgFdr: parseFloat(avgFdr.toFixed(2)),
                            easyCount,
                            hardCount,
                            score,
                            xgFor: team.xgFor,
                            xgAgainst: team.xgAgainst,
                            last5Ppg: team.last5Ppg
                        });
                    }
                }
            });

            // Deduplicate: for each team, keep the best non-overlapping runs
            // Sort by score first (lower = better)
            allRuns.sort((a, b) => a.score - b.score);

            const bestRuns = [];
            const usedSlots = {}; // teamId -> Set of GWs already claimed

            allRuns.forEach(run => {
                const key = run.teamId;
                if (!usedSlots[key]) usedSlots[key] = new Set();

                // Check how much this run overlaps with already-picked runs for this team
                const runGWs = run.fixtures.map(f => f.gw);
                const overlapCount = runGWs.filter(gw => usedSlots[key].has(gw)).length;

                // Allow if less than half overlaps
                if (overlapCount <= runGWs.length * 0.4) {
                    bestRuns.push(run);
                    runGWs.forEach(gw => usedSlots[key].add(gw));
                }
            });

            // Final sort: by score (best patches first)
            bestRuns.sort((a, b) => a.score - b.score);

            // Assign tier labels
            bestRuns.forEach(run => {
                if (run.avgFdr <= 2.0) run.tier = 'premium';
                else if (run.avgFdr <= 2.5) run.tier = 'great';
                else run.tier = 'good';
            });

            return bestRuns;
        }

        function findFixtureSwings(fixtureMap) {
            const swings = [];

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                // Compare next 3 GWs vs GWs 4-6
                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => gw >= currentGW)
                    .sort((a, b) => a - b)
                    .slice(0, 6);

                if (futureGWs.length < 6) return;

                const first3 = futureGWs.slice(0, 3);
                const next3 = futureGWs.slice(3, 6);

                const avgFirst = first3.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? getEffectiveFdr(f[0]) : 3);
                }, 0) / 3;

                const avgNext = next3.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? getEffectiveFdr(f[0]) : 3);
                }, 0) / 3;

                const swing = avgFirst - avgNext;

                if (Math.abs(swing) > 0.5) {
                    swings.push({
                        teamId: team.id,
                        teamName: team.name,
                        teamShort: team.shortName,
                        badgeUrl: team.badgeUrl,
                        swing: swing,
                        direction: swing > 0 ? 'improving' : 'worsening',
                        currentFdr: avgFirst.toFixed(1),
                        futureFdr: avgNext.toFixed(1),
                        swingGW: futureGWs[3]
                    });
                }
            });

            return swings.sort((a, b) => b.swing - a.swing);
        }

        function findFixtureSwingsEnhanced(fixtureMap) {
            const swings = [];

            allTeamsData.forEach(team => {
                const teamFixtures = fixtureMap[team.id];
                if (!teamFixtures) return;

                const futureGWs = Object.keys(teamFixtures)
                    .map(Number)
                    .filter(gw => gw >= currentGW)
                    .sort((a, b) => a - b);

                if (futureGWs.length < 6) return;

                // Compare windows: GW1-3 vs GW4-6
                const first3 = futureGWs.slice(0, 3);
                const next3 = futureGWs.slice(3, 6);

                const getAvg = (gws) => gws.reduce((sum, gw) => {
                    const f = teamFixtures[gw];
                    return sum + (f && f[0] ? getEffectiveFdr(f[0]) : 3);
                }, 0) / gws.length;

                const getFixtures = (gws) => gws.map(gw => {
                    const f = teamFixtures[gw];
                    return f && f[0] ? { ...f[0], gw } : null;
                }).filter(Boolean);

                const avgFirst = getAvg(first3);
                const avgNext = getAvg(next3);
