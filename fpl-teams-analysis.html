    <script>
        // Data URLs - served from local files updated by GitHub Actions
        const BOOTSTRAP_URL = DATA_URLS.bootstrap;
        const FIXTURES_URL = DATA_URLS.fixtures;
        const PLAYERS_URL = DATA_URLS.players;
        
        let allTeamsData = [];
        let currentView = 'rankings';
        let rankingsSort = 'attack';
        let currentGW = 1;
        let isPreseason = false; // true until the season's first fixture kicks off — see computeIsPreseason() in scripts/common.js
        window.rawFixturesData = [];
        window.teamXgData = {};      // Per-GW xG/xGC aggregated by team
        window.playerElements = [];  // Raw bootstrap elements (for season xG)

        // Hash routing
        const HASH_TO_VIEW = { 'rankings': 'rankings', 'swings': 'swings', 'targets': 'targets', 'calendar': 'calendar', 'stats': 'stats', 'xg': 'xg' };

        // ===== INITIALIZATION =====

        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            loadTeamData();
            // Activate tab from URL hash
            const hash = window.location.hash.replace('#', '');
            if (HASH_TO_VIEW[hash]) {
                currentView = hash;
            }
        });

        /* The sidebar's section links are same-page hash links. Following one from
           this page — #rankings to #targets, say — changes the URL without a
           reload, so without this the nav item appears to do nothing at all.
           The tab buttons use history.replaceState, which does not fire
           hashchange, so there is no loop back into this. */
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (!HASH_TO_VIEW[hash] || hash === currentView) return;
            currentView = hash;
            // Before the first load resolves there is nothing to draw; that render
            // will pick up currentView on its own.
            if (allTeamsData.length) renderCurrentView();
        });

        function initFilters() {
            document.querySelectorAll('.tabs-container .tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tabs-container .tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentView = tab.dataset.view;
                    history.replaceState(null, '', '#' + currentView);
                    renderCurrentView();
                });
            });
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        // ===== DATA LOADING =====
        async function loadTeamData() {
            try {
                showLoading(true);

                const [bootstrapData, fixturesData] = await Promise.all([
                    DataCache.fetchJSON(BOOTSTRAP_URL),
                    DataCache.fetchJSON(FIXTURES_URL)
                ]);
                
                // Store fixtures globally (includes stats array with goals, assists, cards, bonus etc.)
                window.rawFixturesData = fixturesData;
                window.playerElements = bootstrapData.elements || [];
                
                // Log stats availability
                const fixturesWithStats = fixturesData.filter(f => f.stats && f.stats.length > 0);
                console.log(`📊 Loaded ${fixturesData.length} fixtures (${fixturesWithStats.length} with detailed stats)`);

                currentGW = bootstrapData.events.find(e => e.is_current)?.id ||
                                  bootstrapData.events.find(e => e.is_next)?.id || 1;
                document.getElementById('currentGW').textContent = `GW${currentGW}`;
                isPreseason = computeIsPreseason(bootstrapData, fixturesData);

                // ===== BUILD TEAM xG DATA =====
                // Try loading players-data.json for per-GW xG (gold standard)
                // Falls back to bootstrap season-level xG if unavailable
                await buildTeamXgData(bootstrapData);

                allTeamsData = bootstrapData.teams.map(team => 
                    analyzeTeam(team, bootstrapData.teams, fixturesData)
                );

                renderCurrentView();
                showLoading(false);

            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
                document.getElementById('teams-grid').innerHTML = renderErrorState(
                    'Failed to load team data',
                    'Check your connection and try again.',
                    'loadData'
                );
                initIcons();
        loadFooter();
            }
        }

        // ===== xG DATA BUILDER =====
        async function buildTeamXgData(bootstrapData) {
            const teamXg = {};
            const teams = bootstrapData.teams;
            
            // Initialize all teams
            teams.forEach(t => {
                teamXg[t.id] = {
                    // Season totals (from bootstrap elements)
                    seasonXg: 0, seasonXa: 0, seasonXgc: 0, seasonGoals: 0, seasonAssists: 0, seasonConceded: 0, seasonGames: 0,
                    // Per-GW breakdown (populated from players-data.json if available)
                    perGw: {},
                    hasPerGwData: false
                };
            });

            // 1. Season-level xG from bootstrap elements (always available)
            (bootstrapData.elements || []).forEach(p => {
                if (p.minutes > 0 && teamXg[p.team]) {
                    const t = teamXg[p.team];
                    t.seasonXg += parseFloat(p.expected_goals) || 0;
                    t.seasonXa += parseFloat(p.expected_assists) || 0;
                    t.seasonGoals += p.goals_scored || 0;
                    t.seasonAssists += p.assists || 0;
                }
            });

            // Count season games from fixtures
            const finishedFixtures = window.rawFixturesData.filter(fixturePlayed);
            finishedFixtures.forEach(f => {
                if (teamXg[f.team_h]) teamXg[f.team_h].seasonGames++;
                if (teamXg[f.team_a]) teamXg[f.team_a].seasonGames++;
            });

            // Season xGC: for each fixture, home team's xGC = away team's xG and vice versa
            // We'll compute this after per-GW data is loaded, or estimate from fixture results
            // For now, compute from the goals conceded in bootstrap
            finishedFixtures.forEach(f => {
                if (teamXg[f.team_h]) teamXg[f.team_h].seasonConceded += f.team_a_score || 0;
                if (teamXg[f.team_a]) teamXg[f.team_a].seasonConceded += f.team_h_score || 0;
            });

            // 2. Try loading per-GW xG from players-data.json (much richer)
            try {
                const playersRes = await fetch(PLAYERS_URL);
                if (playersRes.ok) {
                    const playersData = await playersRes.json();
                    if (playersData?.metadata?.lastUpdated && window.updateDataFreshness) window.updateDataFreshness(playersData.metadata.lastUpdated);
                    console.log(`🎯 Loaded players-data.json: ${playersData.metadata?.playerCount} players with per-GW history`);
                    
                    (playersData.players || []).forEach(player => {
                        const tid = player.team;
                        if (!teamXg[tid]) return;
                        
                        (player.history || []).forEach(h => {
                            const gw = h.round;
                            // Use fixture ID to handle DGWs (multiple fixtures in one round)
                            const fixtureKey = h.fixture;
                            if (!teamXg[tid].perGw[gw]) {
                                teamXg[tid].perGw[gw] = {
                                    xG: 0, xA: 0, xGC: 0,
                                    goals: 0, assists: 0, conceded: 0,
                                    wasHome: null, oppTeam: null,
                                    xGC_90min: 0, // xGC from a 90-min player (= team xGC)
                                    _fixtures: {} // track per-fixture scores to avoid double-counting
                                };
                            }
                            const d = teamXg[tid].perGw[gw];
                            d.xG += parseFloat(h.expected_goals) || 0;
                            d.xA += parseFloat(h.expected_assists) || 0;
                            
                            // Use fixture-keyed dedup for goals/conceded (handles DGWs)
                            const teamGoals = h.was_home ? (h.team_h_score || 0) : (h.team_a_score || 0);
                            const teamConceded = h.was_home ? (h.team_a_score || 0) : (h.team_h_score || 0);
                            if (!d._fixtures[fixtureKey]) {
                                d._fixtures[fixtureKey] = { goals: teamGoals, conceded: teamConceded };
                                d.goals += teamGoals;
                                d.conceded += teamConceded;
                            }
                            
                            d.wasHome = h.was_home;
                            d.oppTeam = h.opponent_team;
                            
                            // xGC: use value from player who played 85+ minutes (per-fixture)
                            if (h.minutes >= 85) {
                                const xgc = parseFloat(h.expected_goals_conceded) || 0;
                                // In DGWs, accumulate xGC across fixtures
                                const fxKey = `_xgc_${fixtureKey}`;
                                if (!d[fxKey]) {
                                    d[fxKey] = true;
                                    d.xGC_90min += xgc;
                                } else if (xgc > 0) {
                                    // Already have this fixture's xGC — keep the higher value
                                }
                            }
                        });
                    });
                    
                    // Mark teams that have per-GW data
                    teams.forEach(t => {
                        const gwKeys = Object.keys(teamXg[t.id].perGw);
                        if (gwKeys.length > 0) {
                            teamXg[t.id].hasPerGwData = true;
                            // Also compute season xGC from per-GW data (more accurate)
                            teamXg[t.id].seasonXgc = gwKeys.reduce((sum, gw) => 
                                sum + teamXg[t.id].perGw[gw].xGC_90min, 0);
                        }
                    });
                    
                    const teamsWithData = teams.filter(t => teamXg[t.id].hasPerGwData).length;
                    console.log(`🎯 Per-GW xG data available for ${teamsWithData}/20 teams`);
                }
            } catch (e) {
                console.log('⚠️ players-data.json not available, using season-level xG only');
            }

            window.teamXgData = teamXg;
        }

        // Helper: get team xG stats for a window of recent GWs
        function getTeamXgWindow(teamId, windowSize = 6) {
            const data = window.teamXgData[teamId];
            if (!data || !data.hasPerGwData) return null;
            
            const gws = Object.keys(data.perGw).map(Number).sort((a, b) => a - b);
            const recentGws = gws.slice(-windowSize);
            if (recentGws.length === 0) return null;
            
            const n = recentGws.length;
            const totals = recentGws.reduce((acc, gw) => {
                const d = data.perGw[gw];
                acc.xG += d.xG;
                acc.xA += d.xA;
                acc.xGC += d.xGC_90min;
                acc.goals += d.goals;
                acc.assists += d.assists;
                acc.conceded += d.conceded;
                acc.homeGames += d.wasHome ? 1 : 0;
                return acc;
            }, { xG: 0, xA: 0, xGC: 0, goals: 0, assists: 0, conceded: 0, homeGames: 0 });
            
            return {
                games: n,
                xGpg: totals.xG / n,
                xApg: totals.xA / n,
                xGCpg: totals.xGC / n,
                gpg: totals.goals / n,
                apg: totals.assists / n,
                gapg: totals.conceded / n,
                totalXg: totals.xG,
                totalGoals: totals.goals,
                totalXgc: totals.xGC,
                totalConceded: totals.conceded,
                homeGames: totals.homeGames,
                xGoverperformance: totals.goals - totals.xG,
                xGCoverperformance: totals.xGC - totals.conceded  // positive = conceding less than expected (good)
            };
        }

        // The FPL API keeps `finished` false until bonus points are confirmed, so a
        // match that has been played and scored can still report false for hours.
        // Anything that counts games played has to look wider than that flag or it
        // divides a season total by one and calls the result a per-game rate.
        function fixturePlayed(f) {
            return !!f && f.team_h_score !== null && f.team_h_score !== undefined
                && (f.finished || f.finished_provisional || f.started);
        }

        /* The same per-gameweek series, split by where the match was played.
           perGw already records wasHome for every round, so a venue-specific xG
           and xGC come out of it for free — and a venue split built from what a
           side actually created and conceded at home says more than one built
           from goals alone. Null for either venue with nothing played there. */
        function getTeamVenueXg(teamId) {
            const data = window.teamXgData && window.teamXgData[teamId];
            if (!data || !data.hasPerGwData) return null;
            const acc = { home: { n: 0, xG: 0, xGC: 0, goals: 0, conceded: 0 },
                          away: { n: 0, xG: 0, xGC: 0, goals: 0, conceded: 0 } };
            Object.keys(data.perGw).forEach(gw => {
                const d = data.perGw[gw];
                if (d.wasHome === null || d.wasHome === undefined) return;
                const side = d.wasHome ? acc.home : acc.away;
                side.n++; side.xG += d.xG; side.xGC += d.xGC_90min;
                side.goals += d.goals; side.conceded += d.conceded;
            });
            const rate = s => s.n ? {
                games: s.n, xGpg: s.xG / s.n, xGCpg: s.xGC / s.n,
                gpg: s.goals / s.n, gapg: s.conceded / s.n,
                totalXg: s.xG, totalGoals: s.goals, totalXgc: s.xGC, totalConceded: s.conceded
            } : null;
            return { home: rate(acc.home), away: rate(acc.away) };
        }

        /* The last N gameweeks one row at a time, rather than averaged into one
           figure — what a side created and what it took, what it allowed and
           what it let in, match by match. An average hides the shape: two
           blanks and a five is not the same team as three twos. */
        function getTeamRecentMatches(teamId, count = 5) {
            const data = window.teamXgData && window.teamXgData[teamId];
            if (!data || !data.hasPerGwData) return [];
            return Object.keys(data.perGw).map(Number).sort((a, b) => a - b).slice(-count)
                .map(gw => {
                    const d = data.perGw[gw];
                    return {
                        gw,
                        isHome: !!d.wasHome,
                        opponentId: d.oppTeam,
                        xG: d.xG, goals: d.goals,
                        xGC: d.xGC_90min, conceded: d.conceded
                    };
                }).reverse();   // most recent first
        }

        // Helper: get team season xG averages
        function getTeamSeasonXg(teamId) {
            const data = window.teamXgData[teamId];
            if (!data) return null;
            
            const g = data.seasonGames || 1;
            return {
                games: data.seasonGames,
                xGpg: data.seasonXg / g,
                xApg: data.seasonXa / g,
                xGCpg: data.seasonXgc / g,
                gpg: data.seasonGoals / g,
                gapg: data.seasonConceded / g,
                totalXg: data.seasonXg,
                totalGoals: data.seasonGoals,
                totalXgc: data.seasonXgc,
                totalConceded: data.seasonConceded,
                netXGpg: (data.seasonXg - data.seasonXgc) / g,
                xGoverperformance: data.seasonGoals - data.seasonXg,
                xGCoverperformance: data.seasonXgc - data.seasonConceded
            };
        }

        // ===== TEAM ANALYSIS =====
        // Derive "big teams" dynamically from FPL strength ratings (top 8 by avg strength)
        function getBigTeams(allTeams) {
            return [...allTeams]
                .map(t => ({
                    name: t.name,
                    avgStrength: (t.strength_attack_home + t.strength_attack_away + t.strength_defence_home + t.strength_defence_away) / 4
                }))
                .sort((a, b) => b.avgStrength - a.avgStrength)
                .slice(0, 8)
                .map(t => t.name);
        }

        function analyzeTeam(team, allTeams, fixtures) {
            const teamId = team.id;
            
            // Compute big teams dynamically (cached per call batch via allTeams reference)
            if (!analyzeTeam._bigTeams || analyzeTeam._teamCount !== allTeams.length) {
                analyzeTeam._bigTeams = getBigTeams(allTeams);
                analyzeTeam._teamCount = allTeams.length;
            }
            const bigTeamNames = analyzeTeam._bigTeams;

            // Past fixtures (last 5)
            const pastFixtures = fixtures
                .filter(f => fixturePlayed(f) && (f.team_h === teamId || f.team_a === teamId))
                .sort((a, b) => a.event - b.event)
                .slice(-5);

            // Future fixtures (next 5)
            const futureFixtures = fixtures
                .filter(f => !fixturePlayed(f) && (f.team_h === teamId || f.team_a === teamId))
                .sort((a, b) => a.event - b.event)
                .slice(0, 5);

            // ===== HOME/AWAY SPLIT STATS =====
            const homeStats = { goals: 0, conceded: 0, games: 0, wins: 0, cleanSheets: 0 };
            const awayStats = { goals: 0, conceded: 0, games: 0, wins: 0, cleanSheets: 0 };
            
            // Stats vs Big Teams vs Others (for Flat-Track Bully)
            const vsBigTeams = { goals: 0, conceded: 0, games: 0 };
            const vsOtherTeams = { goals: 0, conceded: 0, games: 0 };

            let wins = 0, draws = 0, losses = 0;
            let totalGoalsScored = 0, totalGoalsConceded = 0;
            const pastResults = [];
            const goalsHistory = [];
            const xGHistory = [];

            pastFixtures.forEach(f => {
                const isHome = f.team_h === teamId;
                const teamScore = isHome ? f.team_h_score : f.team_a_score;
                const oppScore = isHome ? f.team_a_score : f.team_h_score;
                const oppId = isHome ? f.team_a : f.team_h;
                const opponent = allTeams.find(t => t.id === oppId);
                const isBigTeam = bigTeamNames.includes(opponent?.name);

                // Total stats
                totalGoalsScored += teamScore || 0;
                totalGoalsConceded += oppScore || 0;
                goalsHistory.push(teamScore || 0);

                // Home/Away splits
                if (isHome) {
                    homeStats.goals += teamScore || 0;
                    homeStats.conceded += oppScore || 0;
                    homeStats.games++;
                    if (teamScore > oppScore) homeStats.wins++;
                    if (oppScore === 0) homeStats.cleanSheets++;
                } else {
                    awayStats.goals += teamScore || 0;
                    awayStats.conceded += oppScore || 0;
                    awayStats.games++;
                    if (teamScore > oppScore) awayStats.wins++;
                    if (oppScore === 0) awayStats.cleanSheets++;
                }

                // Big Team splits (for Flat-Track Bully)
                if (isBigTeam) {
                    vsBigTeams.goals += teamScore || 0;
                    vsBigTeams.conceded += oppScore || 0;
                    vsBigTeams.games++;
                } else {
                    vsOtherTeams.goals += teamScore || 0;
                    vsOtherTeams.conceded += oppScore || 0;
                    vsOtherTeams.games++;
                }

                // W/D/L
                if (teamScore > oppScore) wins++;
                else if (teamScore === oppScore) draws++;
                else losses++;

                pastResults.push({
                    result: teamScore > oppScore ? 'W' : teamScore === oppScore ? 'D' : 'L',
                    opponent: opponent?.short_name || '?',
                    opponentName: opponent?.name || '?',
                    score: `${teamScore}-${oppScore}`,
                    isHome,
                    isBigTeam
                });

                // Per-GW real xG from player data (if available)
                const gwXg = window.teamXgData[teamId]?.perGw?.[f.event];
                if (gwXg) {
                    xGHistory.push(gwXg.xG);
                } else {
                    // Fallback: estimate from FPL strength ratings
                    const teamAttack = isHome ? team.strength_attack_home : team.strength_attack_away;
                    const oppDefense = isHome ? opponent?.strength_defence_away : opponent?.strength_defence_home;
                    const estXG = 0.8 + ((teamAttack - 1000) / 400) * 1.0 - ((oppDefense - 1000) / 400) * 0.5 + (isHome ? 0.25 : 0);
                    xGHistory.push(Math.max(0.3, Math.min(3.5, estXG)));
                }
            });

            // ===== REAL xG DATA (from players-data.json) =====
            const seasonXg = getTeamSeasonXg(teamId);
            const recent6Xg = getTeamXgWindow(teamId, 6);
            const recent10Xg = getTeamXgWindow(teamId, 10);
            const hasRealXg = seasonXg && seasonXg.totalXg > 0;

            // ===== FUTURE FIXTURES ANALYSIS =====
            const futureDetails = [];
            let totalFdr = 0;

            futureFixtures.forEach(f => {
                const isHome = f.team_h === teamId;
                const oppId = isHome ? f.team_a : f.team_h;
                const opponent = allTeams.find(t => t.id === oppId);
                const fdr = isHome ? f.team_h_difficulty : f.team_a_difficulty;

                totalFdr += fdr || 3;

                // Calculate Clean Sheet probability for this fixture
                const teamDefStrength = isHome ? team.strength_defence_home : team.strength_defence_away;
                const oppAttStrength = isHome ? opponent?.strength_attack_away : opponent?.strength_attack_home;
                const csBaseChance = isHome ? 0.38 : 0.28;
                const csChance = Math.round(Math.min(65, Math.max(10, 
                    csBaseChance * 100 * (teamDefStrength / (oppAttStrength || 1000)) * 0.95
                )));

                // BTTS likelihood
                const teamAttStrength = isHome ? team.strength_attack_home : team.strength_attack_away;
                const oppDefStrength = isHome ? opponent?.strength_defence_away : opponent?.strength_defence_home;
                const bttsLikely = (teamAttStrength > 1050 && oppAttStrength > 1050 && 
                                   teamDefStrength < 1100 && oppDefStrength < 1100);

                futureDetails.push({
                    gw: f.event,
                    opponent: opponent?.short_name || '?',
                    opponentId: oppId,
                    isHome,
                    fdr: fdr || 3,
                    csChance,
                    bttsLikely,
                    oppDefStrength: oppDefStrength || 1000,
                    oppAttStrength: oppAttStrength || 1000
                });
            });

            const avgFdr = futureDetails.length > 0 ? totalFdr / futureDetails.length : 3;
            const homeFixtureCount = futureDetails.filter(f => f.isHome).length;
            const awayFixtureCount = futureDetails.length - homeFixtureCount;

            // ===== CALCULATE METRICS WITH REAL xG + RECENCY WEIGHTING =====
            const gamesPlayed = pastFixtures.length || 1;
            const avgGoals = totalGoalsScored / gamesPlayed;
            const avgConceded = totalGoalsConceded / gamesPlayed;
            const cleanSheets = homeStats.cleanSheets + awayStats.cleanSheets;

            // FPL strength ratings (normalized 0-1 range)
            const fplAttackStrength = (team.strength_attack_home + team.strength_attack_away) / 2;
            const fplDefenseStrength = (team.strength_defence_home + team.strength_defence_away) / 2;
            const fplAttNorm = Math.min(1, Math.max(0, (fplAttackStrength - 900) / 500));  // 900-1400 → 0-1
            const fplDefNorm = Math.min(1, Math.max(0, (fplDefenseStrength - 900) / 500));

            // Stands in for measured xG when the per-gameweek series is missing:
            // whatever xG history there is, else the goals actually scored.
            const avgXGEstimate = xGHistory.length > 0
                ? xGHistory.reduce((a, b) => a + b, 0) / gamesPlayed
                : avgGoals;

            /* ===== TEAM STRENGTH, IN GOALS PER GAME =====

               This used to be two 0-100 indices, attack power and defence power.
               An index has no unit and nothing to check it against: 68 is not a
               quantity you can hold against what a side has actually done, and
               squashing everything onto 0-100 hid the two numbers that decide an
               FPL week — how many goals a team is expected to score, and how
               many it is expected to concede.

               Same three ingredients as the index had, and broadly the same
               ranking, but averaged in the unit they are measured in instead of
               each being normalised to 0-1 first: expected goals over the recent
               window, actual goals over the same window, and FPL's own strength
               rating mapped onto the same goals-per-game scale.

               The one real change is the weighting, which was fixed at 35/35/30.
               Two matches into a season a measured rate is noise, and FPL's
               rating is a prior rather than an observation — so the prior
               carries most of the answer until there is a sample worth
               preferring, and hands over as the games accumulate. */
            const LEAGUE_GPG = 1.42;                    // a league-average side, either way
            const GPG_FLOOR = 0.55, GPG_CEIL = 2.45;    // the range a Premier League season spans
            const clampGpg = v => Math.min(GPG_CEIL, Math.max(GPG_FLOOR, Number.isFinite(v) ? v : LEAGUE_GPG));
            // FPL publishes strength on a ~900-1400 scale. Mapped onto goals per
            // game so it can be averaged with the measured rates rather than
            // living on a scale of its own.
            const toGpg = norm => GPG_FLOOR + norm * (GPG_CEIL - GPG_FLOOR);

            const fplAttHomeNorm = Math.min(1, Math.max(0, (team.strength_attack_home - 900) / 500));
            const fplAttAwayNorm = Math.min(1, Math.max(0, (team.strength_attack_away - 900) / 500));
            const fplDefHomeNorm = Math.min(1, Math.max(0, (team.strength_defence_home - 900) / 500));
            const fplDefAwayNorm = Math.min(1, Math.max(0, (team.strength_defence_away - 900) / 500));

            /* FPL does not always publish these. Right now every strength field
               in bootstrap-static is 0 for all twenty clubs, and a 0 does not
               clamp to "average" — it clamps to the bottom of the scale, which
               for a defence is inverted into the TOP of the expected-conceded
               range. Every side would be modelled as conceding 2.45 a game and
               scoring 0.55, which is both wrong and wrong asymmetrically.

               When the rating is missing there is no prior to shrink toward
               except the league itself, so that is what is used. */
            const fplHasStrength = fplAttackStrength > 0 && fplDefenseStrength > 0;
            const priorAtt = fplHasStrength ? toGpg(fplAttNorm) : LEAGUE_GPG;
            const priorDef = fplHasStrength ? toGpg(1 - fplDefNorm) : LEAGUE_GPG;
            const priorAttHome = fplHasStrength && team.strength_attack_home > 0 ? toGpg(fplAttHomeNorm) : LEAGUE_GPG;
            const priorAttAway = fplHasStrength && team.strength_attack_away > 0 ? toGpg(fplAttAwayNorm) : LEAGUE_GPG;
            const priorDefHome = fplHasStrength && team.strength_defence_home > 0 ? toGpg(1 - fplDefHomeNorm) : LEAGUE_GPG;
            const priorDefAway = fplHasStrength && team.strength_defence_away > 0 ? toGpg(1 - fplDefAwayNorm) : LEAGUE_GPG;

            const measuredGames = (hasRealXg && recent6Xg) ? recent6Xg.games : gamesPlayed;
            const sample = Math.min(1, (measuredGames || 0) / 6);
            const wFpl = 0.30 + (1 - sample) * 0.55;    // .85 with nothing played, .30 by six games
            const wXg = (1 - wFpl) * 0.6;               // expectation leads
            const wReal = (1 - wFpl) * 0.4;             // outcome follows

            const attXgSrc = (hasRealXg && recent6Xg) ? recent6Xg.xGpg : avgXGEstimate;
            const attRealSrc = (hasRealXg && recent6Xg) ? recent6Xg.gpg : avgGoals;
            const defXgSrc = (hasRealXg && recent6Xg) ? recent6Xg.xGCpg : avgConceded;
            const defRealSrc = (hasRealXg && recent6Xg) ? recent6Xg.gapg : avgConceded;

            /* Read them as the numbers they are: xgFor is the goals a side is
               expected to score in a game, xgAgainst the goals it is expected to
               concede. Higher xgFor is a better attack; LOWER xgAgainst is a
               better defence, which is the one place the direction flips. */
            const xgFor = clampGpg(
                (Number.isFinite(attXgSrc) ? attXgSrc : LEAGUE_GPG) * wXg +
                (Number.isFinite(attRealSrc) ? attRealSrc : LEAGUE_GPG) * wReal +
                priorAtt * wFpl);
            // A high FPL defence rating means a good defence, so it maps to a LOW
            // expected-conceded figure — hence 1 - norm.
            const xgAgainst = clampGpg(
                (Number.isFinite(defXgSrc) ? defXgSrc : LEAGUE_GPG) * wXg +
                (Number.isFinite(defRealSrc) ? defRealSrc : LEAGUE_GPG) * wReal +
                priorDef * wFpl);

            /* Venue splits, same idea on a smaller sample — so the prior hands
               over more slowly. Venue xG comes from the per-gameweek series where
               there is one, since perGw records which matches were at home;
               otherwise the venue's actual goals stand in. */
            const venueXg = typeof getTeamVenueXg === 'function' ? getTeamVenueXg(teamId) : null;
            const venueStrength = (st, vXg, priorFor, priorAgainst) => {
                if (!st || !st.games) return { xgFor, xgAgainst };
                const s = Math.min(1, st.games / 4);
                const wF = 0.30 + (1 - s) * 0.55;
                const attMeasured = vXg && Number.isFinite(vXg.xGpg)
                    ? vXg.xGpg * 0.6 + (st.goals / st.games) * 0.4
                    : st.goals / st.games;
                const defMeasured = vXg && Number.isFinite(vXg.xGCpg)
                    ? vXg.xGCpg * 0.6 + (st.conceded / st.games) * 0.4
                    : st.conceded / st.games;
                return {
                    xgFor: clampGpg(attMeasured * (1 - wF) + priorFor * wF),
                    xgAgainst: clampGpg(defMeasured * (1 - wF) + priorAgainst * wF)
                };
            };
            const homeStrength = venueStrength(homeStats, venueXg && venueXg.home, priorAttHome, priorDefHome);
            const awayStrength = venueStrength(awayStats, venueXg && venueXg.away, priorAttAway, priorDefAway);
            const xgForHome = homeStrength.xgFor, xgAgainstHome = homeStrength.xgAgainst;
            const xgForAway = awayStrength.xgFor, xgAgainstAway = awayStrength.xgAgainst;

            // FIXTURE SCORE (0-100) - Pure fixture opportunity
            // DGW bonus: extra fixtures beyond 5 are valuable for FPL
            const fixtureCountBonus = Math.max(0, (futureDetails.length - 5) * 8);
            const fixtureScore = Math.round(Math.min(100, Math.max(0,
                ((5 - avgFdr) / 4) * 85 +
                (homeFixtureCount / Math.max(1, futureDetails.length)) * 15 +
                fixtureCountBonus
            )));

            // Average CS Chance across next fixtures
            const avgCSChance = futureDetails.length > 0 
                ? Math.round(futureDetails.reduce((sum, f) => sum + f.csChance, 0) / futureDetails.length)
                : 30;

            // ===== FLAT-TRACK BULLY INDEX =====
            let bullyIndex = 0;
            let bullyLabel = 'balanced';
            
            if (vsBigTeams.games > 0 && vsOtherTeams.games > 0) {
                const goalsVsBig = vsBigTeams.goals / vsBigTeams.games;
                const goalsVsOther = vsOtherTeams.goals / vsOtherTeams.games;
                bullyIndex = goalsVsOther - goalsVsBig;
                
                if (bullyIndex > 0.8) bullyLabel = 'bully';
                else if (bullyIndex < -0.5) bullyLabel = 'giant-killer';
                else bullyLabel = 'consistent';
            }

            // ===== xG vs GOALS — REAL DATA =====
            const totalXG = xGHistory.reduce((a, b) => a + b, 0);
            const avgXG = xGHistory.length > 0 ? totalXG / gamesPlayed : 1.0;
            
            // Use real season xG data if available for overperformance
            let xgDiff, xgPerformance, xgcDiff, xgcPerformance;
            if (hasRealXg) {
                xgDiff = seasonXg.xGoverperformance;
                xgPerformance = xgDiff > 3 ? 'overperforming' : xgDiff < -3 ? 'underperforming' : 'balanced';
                xgcDiff = seasonXg.xGCoverperformance;
                xgcPerformance = xgcDiff > 3 ? 'overperforming-def' : xgcDiff < -3 ? 'underperforming-def' : 'balanced-def';
            } else {
                xgDiff = totalGoalsScored - totalXG;
                xgPerformance = xgDiff > 0.5 ? 'overperforming' : xgDiff < -0.5 ? 'underperforming' : 'balanced';
                xgcDiff = 0;
                xgcPerformance = 'balanced-def';
            }

            /* ===== RECENT FORM =====
               A recency-weighted 0-100 form rating used to be built here out of
               a weighted points base, a goal-difference bonus and a streak
               bonus. Nothing reads it any more: form is reported as points per
               game (last5Ppg) and as the unbeaten run below, both of which are
               countable. The goal difference it computed is still worth having,
               since the run and the goal swing are what the prose talks about. */
            const reversedResults = [...pastResults].reverse();

            const recentGD = pastFixtures.slice(-5).reduce((sum, f) => {
                const isH = f.team_h === teamId;
                const scored = isH ? (f.team_h_score || 0) : (f.team_a_score || 0);
                const conceded = isH ? (f.team_a_score || 0) : (f.team_h_score || 0);
                return sum + (scored - conceded);
            }, 0);

            // Matches unbeaten, counting back from the most recent.
            let unbeatenRun = 0;
            for (let i = 0; i < reversedResults.length; i++) {
                if (reversedResults[i]?.result === 'W' || reversedResults[i]?.result === 'D') unbeatenRun++;
                else break;
            }


            // ===== FIXTURE SWING =====
            let fixtureSwing = 'stable';
            if (futureDetails.length >= 4) {
                const first2 = (futureDetails[0].fdr + futureDetails[1].fdr) / 2;
                const last2 = (futureDetails[futureDetails.length - 2].fdr + futureDetails[futureDetails.length - 1].fdr) / 2;
                if (last2 < first2 - 0.5) fixtureSwing = 'improving';
                else if (last2 > first2 + 0.5) fixtureSwing = 'worsening';
            }

            /* ===== VENUE DEPENDENCY =====
               In goals per game now, so the thresholds are quantities too: a
               third of a goal a game better at home either way is a real home
               advantage, and the old 15-and-10 points of a 0-100 index were
               about that. Attack counts up and defence counts down, so the
               defensive half is negated to put both on "higher = better at
               home". */
            const attackHomeDiff = xgForHome - xgForAway;
            const defenseHomeDiff = xgAgainstAway - xgAgainstHome;
            const avgHomeDiff = (attackHomeDiff + defenseHomeDiff) / 2;

            let venueLabel = 'balanced';
            let venueEmoji = '<i data-lucide="scale" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i>';
            if (avgHomeDiff > 0.30) {
                venueLabel = 'home-fortress';
                venueEmoji = '<i data-lucide="home" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i>';
            } else if (avgHomeDiff < -0.20) {
                venueLabel = 'road-warrior';
                venueEmoji = '<i data-lucide="map" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i>';
            }

            // What their next five actually ask of them: the venue split weighted
            // by how many of those fixtures are at home.
            const homeWeight = homeFixtureCount / 5;
            const awayWeight = awayFixtureCount / 5;

            const weightedXgFor = (xgForHome * homeWeight) + (xgForAway * awayWeight);
            const weightedXgAgainst = (xgAgainstHome * homeWeight) + (xgAgainstAway * awayWeight);

            // ===== xG TREND (recency direction) =====
            let xgTrend = 'stable';
            if (hasRealXg && recent6Xg && seasonXg) {
                const seasonRate = seasonXg.xGpg;
                const recentRate = recent6Xg.xGpg;
                if (recentRate > seasonRate + 0.25) xgTrend = 'rising';
                else if (recentRate < seasonRate - 0.25) xgTrend = 'falling';
            }

            let xgcTrend = 'stable';
            if (hasRealXg && recent6Xg && seasonXg) {
                const seasonRate = seasonXg.xGCpg;
                const recentRate = recent6Xg.xGCpg;
                if (recentRate < seasonRate - 0.2) xgcTrend = 'improving';
                else if (recentRate > seasonRate + 0.2) xgcTrend = 'worsening';
            }

            return {
                id: teamId,
                code: team.code,
                name: team.name,
                shortName: team.short_name,
                badgeUrl: `https://resources.premierleague.com/premierleague/badges/50/t${team.code}.png`,
                
                /* Core strength, in goals per game rather than a 0-100 index.
                   xgFor is what they are expected to score, xgAgainst what they
                   are expected to concede — so a lower xgAgainst is a better
                   defence, which is the one field on this object where smaller
                   is better. */
                xgFor,
                xgAgainst,
                xgForHome,
                xgForAway,
                xgAgainstHome,
                xgAgainstAway,
                venueXg,
                /* Net expected goals a game — what a side is expected to win the
                   match by. One number for overall strength, and the one the
                   rankings sort on when neither end is being asked about. */
                netXg: xgFor - xgAgainst,
                /* Form as points won, not as a 0-100 rating of them. Over the
                   same last-five window as the W/D/L beside it. */
                last5Ppg: gamesPlayed ? ((wins * 3) + draws) / gamesPlayed : 0,

                // Weighted by how many of the next five are at home
                weightedXgFor,
                weightedXgAgainst,

                // Venue dependency
                venueLabel,
                venueEmoji,
                attackHomeDiff,
                defenseHomeDiff,
                
                // Fixture opportunity (SEPARATE)
                fixtureScore,
                avgFdr: avgFdr.toFixed(1),
                // The same figure unrounded and as a number — avgFdr is a string,
                // so sorting on it compares "2.4" against "10" as text.
                avgFdrNum: avgFdr,
                avgCSChance,
                
                // Form & results
                wins, draws, losses,
                
                // Stats
                avgGoals: avgGoals.toFixed(2),
                avgConceded: avgConceded.toFixed(2),
                avgXG: avgXG.toFixed(2),
                totalGoals: totalGoalsScored,
                totalXG: totalXG.toFixed(1),
                xgDiff: (typeof xgDiff === 'number' ? xgDiff : 0).toFixed(1),
                xgPerformance,
                xgcDiff: (typeof xgcDiff === 'number' ? xgcDiff : 0).toFixed(1),
                xgcPerformance,
                cleanSheets,
                
                // xG data (new!)
                hasRealXg,
                seasonXg,
                recent6Xg,
                recent10Xg,
                xgTrend,
                xgcTrend,
                
                // Home/Away
                homeFixtures: homeFixtureCount,
                awayFixtures: awayFixtureCount,
                homeStats,
                awayStats,
                
                // Special indices
                bullyIndex: bullyIndex.toFixed(1),
                bullyLabel,
                
                // History
                pastResults,
                futureFixtures: futureDetails,
                goalsHistory,
                xGHistory,
                fixtureSwing,
                
                // Last five matches, one row each, for the report's xG-vs-actual table
                recentMatches: typeof getTeamRecentMatches === 'function' ? getTeamRecentMatches(teamId, 5) : []
            };
        }

        // ===== RENDERING =====
        function setRankingsSort(sort) {
            rankingsSort = sort;
            renderCurrentView();
        }

        function renderCurrentView() {
            const contentArea = document.getElementById('content-area');
            // Sync tab active state
            document.querySelectorAll('.tabs-container .tab').forEach(t => {
                t.classList.toggle('active', t.dataset.view === currentView);
            });

            switch (currentView) {
                case 'rankings': {
                    /* Every sort is now on a real quantity, and two of the four
                       are better when smaller — a defence is rated by the goals
                       it is expected to concede, and a fixture run by its FDR.
                       So the direction travels with the key rather than being
                       assumed descending. */
                    const SORTS = {
                        attack:   { key: 'xgFor',      asc: false },
                        defense:  { key: 'xgAgainst',  asc: true  },
                        fixtures: { key: 'avgFdrNum',  asc: true  },
                        form:     { key: 'last5Ppg',   asc: false }
                    };
                    const sortSpec = SORTS[rankingsSort] || SORTS.form;
                    const highlightMode = rankingsSort === 'defense' ? 'defense' : rankingsSort === 'fixtures' ? 'fixture' : rankingsSort === 'form' ? 'form' : 'attack';
                    const sorted = [...allTeamsData].sort((a, b) => {
                        const av = a[sortSpec.key] ?? 0, bv = b[sortSpec.key] ?? 0;
                        return sortSpec.asc ? av - bv : bv - av;
                    });
                    const pillsHtml = `
                        <div class="rankings-toolbar">
                            <span class="rankings-label">Sort by:</span>
                            <div class="rankings-pills">
                                <button class="rankings-pill ${rankingsSort === 'attack' ? 'active' : ''}" onclick="setRankingsSort('attack')"><i data-lucide="swords" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> Attack</button>
                                <button class="rankings-pill ${rankingsSort === 'defense' ? 'active' : ''}" onclick="setRankingsSort('defense')"><i data-lucide="shield-check" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> Defence</button>
                                <button class="rankings-pill ${rankingsSort === 'fixtures' ? 'active' : ''}" onclick="setRankingsSort('fixtures')"><i data-lucide="calendar" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> Fixtures</button>
                                <button class="rankings-pill ${rankingsSort === 'form' ? 'active' : ''}" onclick="setRankingsSort('form')"><i data-lucide="trending-up" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> Form</button>
                            </div>
                        </div>
                    `;
                    contentArea.innerHTML = renderMomentumMatrix() + pillsHtml + '<div class="teams-grid" id="teams-grid"></div>';
                    document.getElementById('teams-grid').innerHTML = sorted.map((team, i) => createTeamCard(team, i + 1, highlightMode)).join('');
                    initMomentumChart();
                    break;
                }

                case 'swings':
                    renderFixtureSwings(contentArea);
                    break;

                case 'targets':
                    renderSoftTargetsView(contentArea);
                    break;

                case 'calendar':
                    renderFullCalendar(contentArea);
                    break;

                case 'stats':
                    renderStatsTable(contentArea);
                    break;
            }

            document.getElementById('seasonNotice').classList.toggle('hidden', !isPreseason);

            // Initialize Lucide icons in dynamically rendered content
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function createTeamCard(team, rank, mode = 'form') {
            // Create FDR strip
            const fdrStrip = team.futureFixtures.slice(0, 5).map(f => `
                <div class="fdr-badge fdr-${Math.round(f.fdr)}" title="${escHTML(f.opponent)} (${f.isHome ? 'H' : 'A'})">
                    <span class="opp">${escHTML(f.opponent)}</span>
                    <span class="venue">${f.isHome ? 'H' : 'A'}</span>
                </div>
            `).join('');

            // Create form results (last 5 as W/D/L text)
            const formText = team.pastResults.slice(0, 5).map(r => {
                const cls = r.result.toLowerCase() === 'w' ? 'win' : r.result.toLowerCase() === 'd' ? 'draw' : 'loss';
                return `<span class="form-letter ${cls}" title="${escHTML(r.opponent)} ${escHTML(r.score)}">${r.result.toUpperCase()}</span>`;
            }).join('');

            // Trend badge
            const trendClass = team.fixtureSwing === 'improving' ? 'improving' : 
                               team.fixtureSwing === 'worsening' ? 'worsening' : 'stable';
            const trendText = team.fixtureSwing === 'improving' ? '↑ Easier' : 
                              team.fixtureSwing === 'worsening' ? '↓ Harder' : '→';

            // xG badge - simplified label
            let xgBadge = '';
            if (team.hasRealXg && team.seasonXg) {
                const diff = parseFloat(team.xgDiff);
                if (diff > 3) {
                    xgBadge = `<span class="xg-badge over" title="Overperforming xG by ${diff.toFixed(1)}">Over xG</span>`;
                } else if (diff < -3) {
                    xgBadge = `<span class="xg-badge under" title="Underperforming xG by ${Math.abs(diff).toFixed(1)}">Due boost</span>`;
                }
            } else if (team.xgPerformance === 'overperforming') {
                xgBadge = '<span class="xg-badge over">Over xG</span>';
            } else if (team.xgPerformance === 'underperforming') {
                xgBadge = '<span class="xg-badge under">Due</span>';
            }

            // Determine which metric to highlight based on mode
            const highlightATK = mode === 'attack' ? ' highlight' : '';
            const highlightDEF = mode === 'defense' ? ' highlight' : '';
            const highlightFIX = mode === 'fixture' ? ' highlight' : '';
            const highlightFORM = mode === 'form' ? ' highlight' : '';

            return `
                <div class="team-card" data-team="${escHTML(team.name)}" onclick="openTeamReport(${team.id})">
                    <div class="card-header">
                        <div class="team-badge">
                            <img src="${team.badgeUrl}" alt="${escHTML(team.shortName)}" onerror="this.style.display='none'">
                        </div>
                        <div class="team-info">
                            <div class="team-name">${escHTML(team.name)}</div>
                            <div class="team-meta">
                                <span><abbr title="Fixture Difficulty Rating (1=easiest, 5=hardest)">FDR</abbr> ${team.avgFdr}</span>
                                <span>•</span>
                                <span>${team.wins}W ${team.draws}D ${team.losses}L</span>
                            </div>
                        </div>
                        <div class="rank-wrap">
                            <div class="rank-badge ${rank <= 3 ? 'top-3' : ''}">${rank}</div>
                            ${(() => { const t = teamTrend(team); return t
                                ? `<span class="rank-trend ${t.dir}" title="Recent net xG against the season average: ${t.delta >= 0 ? '+' : ''}${t.delta.toFixed(2)} per game">${t.dir === 'up' ? '▲' : t.dir === 'down' ? '▼' : '—'}</span>`
                                : ''; })()}
                        </div>
                    </div>

                    ${renderTeamStatBlock(team, { highlightATK, highlightDEF })}

                    <div class="fdr-strip">${fdrStrip}</div>

                    <div class="card-footer">
                        <div class="form-section">
                            <span class="form-label">Form</span>
                            <div class="form-letters">${formText}</div>
                        </div>
                        <div class="footer-stats">
                            ${xgBadge}
                            <span class="trend ${trendClass}">${trendText}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Concrete numbers rather than four 0-100 indices nobody can anchor to.
        //
        // Two of the metrics originally specified do not exist: FPL stopped
        // publishing big chances and shot counts years ago, and neither
        // big_chances_created nor shots appears anywhere in the element data.
        // Rather than estimate them from xA and pass the estimate off as a count,
        // the two slots carry the real measures nearest in purpose — expected
        // assists for chance quality, goals conceded for defensive leakage.
        function renderTeamStatBlock(team, hl) {
            const xg = team.seasonXg;
            const games = xg && xg.games ? xg.games : 0;
            const n = (v, d) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '—';

            const attack = [
                { label: 'xG/game', value: xg ? n(xg.xGpg, 2) : '—', good: xg && xg.xGpg >= 1.6 },
                { label: 'Goals', value: xg ? xg.totalGoals : team.totalGoals ?? '—', good: false },
                { label: 'xA/game', value: xg ? n(xg.xApg, 2) : '—', good: xg && xg.xApg >= 1.0 }
            ];
            const defence = [
                { label: 'xGC/game', value: xg ? n(xg.xGCpg, 2) : '—', good: xg && xg.xGCpg <= 1.1 },
                { label: 'Clean sheets', value: team.cleanSheets ?? '—', good: (team.cleanSheets || 0) > 0 },
                { label: 'Conceded/game', value: xg ? n(xg.gapg, 2) : team.avgConceded ?? '—', good: xg && xg.gapg <= 1.0 }
            ];

            const col = (title, rows, tone, isHl) => `
                <div class="tsb-col ${tone}${isHl ? ' tsb-hl' : ''}">
                    <div class="tsb-title">${title}</div>
                    ${rows.map(r => `<div class="tsb-row">
                        <span class="tsb-label">${r.label}</span>
                        <span class="tsb-value${r.good ? ' good' : ''}">${r.value}</span>
                    </div>`).join('')}
                </div>`;

            /* The two comparisons that say whether the rates above are being
               converted. Per game, so they can be read against the xG/game and
               xGC/game directly above them rather than needing a season total
               held in your head. */
            const conversion = xg && xg.games ? `
                <div class="tsb-conversion">
                    ${renderXgVsActual('Scoring', xg.xGpg, xg.gpg, { per: true, expectedLabel: 'xG', actualLabel: 'scored' })}
                    ${renderXgVsActual('Conceding', xg.xGCpg, xg.gapg, { per: true, lowerIsBetter: true, expectedLabel: 'xGC', actualLabel: 'let in' })}
                </div>` : '';

            return `<div class="team-stat-block">
                ${col('Attack', attack, 'atk', !!hl.highlightATK)}
                ${col('Defence', defence, 'def', !!hl.highlightDEF)}
            </div>
            ${conversion}
            ${games ? `<div class="tsb-sample">Season to date · ${games} game${games === 1 ? '' : 's'}</div>` : ''}`;
        }

        /* Expected against actual, as one row.

           An xG figure on its own is only half a sentence. 12.4 xG means one
           thing beside 17 goals and the opposite beside 7, and the gap is the
           part that predicts: a side scoring well above its xG is riding
           finishing that usually regresses, one below it is creating chances it
           has not taken yet. The same reading works on the defensive side with
           the signs flipped, which is what `lowerIsBetter` is for. */
        function renderXgVsActual(label, expected, actual, opts) {
            const o = opts || {};
            if (!Number.isFinite(expected) || !Number.isFinite(actual)) return '';
            const diff = actual - expected;
            const unit = o.per ? '/game' : '';
            // Under- and over-performing are only worth colouring once the gap is
            // bigger than the noise. A tenth of a goal a game, or two over a season.
            const meaningful = Math.abs(diff) >= (o.threshold != null ? o.threshold : (o.per ? 0.15 : 2));
            const good = o.lowerIsBetter ? diff < 0 : diff > 0;
            const cls = !meaningful ? 'level' : good ? 'over' : 'under';
            const dp = o.per ? 2 : 1;
            const word = !meaningful ? 'about level with'
                : o.lowerIsBetter
                    ? (diff < 0 ? 'better than' : 'worse than')
                    : (diff > 0 ? 'above' : 'below');
            return `<div class="xgva-row ${cls}" data-tooltip="${escHTML(
                `${o.actualLabel || 'Actual'} ${actual.toFixed(dp)}${unit} against ${expected.toFixed(dp)}${unit} expected — ${word} expectation by ${Math.abs(diff).toFixed(dp)}.`)}">
                <span class="xgva-label">${escHTML(label)}</span>
                <span class="xgva-pair">
                    <span class="xgva-exp">${expected.toFixed(dp)}<em>${escHTML(o.expectedLabel || 'expected')}</em></span>
                    <span class="xgva-arrow">→</span>
                    <span class="xgva-act">${actual.toFixed(dp)}<em>${escHTML(o.actualLabel || 'actual')}</em></span>
                </span>
                <span class="xgva-diff">${diff > 0 ? '+' : diff < 0 ? '−' : ''}${Math.abs(diff).toFixed(dp)}</span>
            </div>`;
        }

        // Whether recent expected-goal output is running above or below the
        // season figure. Needs a few games behind it before it means anything.
        function teamTrend(team) {
            const xg = team.seasonXg;
            const recent = team.recent6Xg;
            if (!xg || !recent || !xg.games || xg.games < 4) return null;
            const seasonNet = xg.netXGpg;
            const recentNet = (recent.xG - recent.xGC) / Math.max(recent.games || 1, 1);
            const delta = recentNet - seasonNet;
            if (Math.abs(delta) < 0.15) return { dir: 'flat', label: 'Steady', delta };
            return delta > 0
                ? { dir: 'up', label: 'Improving', delta }
                : { dir: 'down', label: 'Declining', delta };
        }

        function renderFixtureSwings(container) {
            // Build fixture map for analysis
            const teamFixtureMap = buildFullSeasonMap();
            const easyRuns = findEasyRuns(teamFixtureMap);
            const fixtureSwingTeams = findFixtureSwingsEnhanced(teamFixtureMap);
            
            // Get display GWs for upcoming gold mines
            const allGWs = new Set();
            Object.values(teamFixtureMap).forEach(team => {
                Object.keys(team).forEach(gw => allGWs.add(parseInt(gw)));
            });
            const displayGWs = Array.from(allGWs).sort((a, b) => a - b).filter(gw => gw >= currentGW);

            // Store data globally for modal access
            window._easyRunsData = easyRuns;
            window._swingsData = fixtureSwingTeams;
            window._teamFixtureMap = teamFixtureMap;

            // Filter to future runs only — PREMIUM & GREAT tiers only (avgFdr ≤ 2.5)
            const futureRuns = easyRuns.filter(r => r.startGW >= currentGW && (r.tier === 'premium' || r.tier === 'great'));
            const improvingSwings = fixtureSwingTeams.filter(s => s.direction === 'improving');
            const worseningSwings = fixtureSwingTeams.filter(s => s.direction === 'worsening');

            const tierColors = {
                premium: { bg: 'rgba(74, 222, 128, 0.15)', color: 'var(--color-success)', label: 'PREMIUM' },
                great: { bg: 'rgba(96, 165, 250, 0.15)', color: 'var(--color-info)', label: 'GREAT' },
                good: { bg: 'rgba(251, 191, 36, 0.12)', color: 'var(--color-warning)', label: 'GOOD' }
            };

            const html = `
                <div class="swing-section">
                    ${renderUpcomingGoldMines(teamFixtureMap, displayGWs)}
                    <div class="swings-layout">
                        <!-- Easy Fixture Runs Panel -->
                        <div class="swings-panel">
                            <div class="swings-panel-header">
                                <span class="swings-panel-icon"><i data-lucide="circle-check" style="width:16px;height:16px;"></i></span>
                                <span class="swings-panel-title">Best Targetable Fixture Patches</span>
                                <span class="swings-panel-count">${futureRuns.length} found</span>
                            </div>
                            <div class="swings-panel-body">
                                ${futureRuns.length === 0 ? 
                                    '<div style="padding: var(--space-4); text-align: center; color: var(--text-muted); font-size: 12px;">No targetable patches found in remaining fixtures.</div>' :
                                    futureRuns.map((run, i) => {
                                        const tier = tierColors[run.tier] || tierColors.good;
                                        const fdrClass = run.avgFdr <= 2.2 ? 'good' : run.avgFdr <= 2.7 ? 'info' : 'warn';
                                        return `
                                            <div class="swings-run-item" onclick="openEasyRunModal(${i})">
                                                <span class="swings-run-rank" style="color: ${i < 3 ? 'var(--color-warning)' : 'var(--text-muted)'}">${i + 1}</span>
                                                <img src="${run.badgeUrl}" alt="${escHTML(run.teamShort)}" class="swings-run-badge" onerror="this.style.display='none'">
                                                <div class="swings-run-info">
                                                    <div class="swings-run-name">${escHTML(run.teamName)}</div>
                                                    <div class="swings-run-detail">
                                                        <span>GW${run.startGW}–${run.endGW}</span>
                                                        <span>•</span>
                                                        <span>${run.homeCount}H ${run.length - run.homeCount}A</span>
                                                        <span style="font-size: 8px; padding: 1px 4px; border-radius: 3px; background: ${tier.bg}; color: ${tier.color}; font-weight: 700;">${tier.label}</span>
                                                    </div>
                                                </div>
                                                <div class="fx-run patch-run">
                                                    ${renderFdrRun(run.fixtures.slice(0, 7).map(f => ({ gw: f.gw, fixtures: [f] })))}
                                                </div>
                                                <span class="swings-run-stat" style="color: ${tier.color}">${run.avgFdr}<span style="font-size:10px;font-weight:400;color:var(--text-muted)"> avg</span></span>
                                                <span class="swings-run-arrow">›</span>
                                            </div>
                                        `;
                                    }).join('')
                                }
                            </div>
                        </div>

                        <!-- Fixture Swings Panel -->
                        <div class="swings-panel">
                            <div class="swings-panel-header">
                                <span class="swings-panel-icon"><i data-lucide="trending-up" style="width:16px;height:16px;"></i></span>
                                <span class="swings-panel-title">Fixture Swings</span>
                                <span class="swings-panel-count">${fixtureSwingTeams.length} swings</span>
                            </div>
                            <div class="swings-panel-body">
                                <!-- Improving -->
                                <div class="swing-direction-group">
                                    <div class="swing-direction-label" style="color: var(--color-success);">↑ Getting Easier (${improvingSwings.length})</div>
                                    ${improvingSwings.length === 0 ? 
                                        '<div style="padding: var(--space-2); font-size: 11px; color: var(--text-muted);">None found</div>' :
                                        improvingSwings.map((s, i) => `
                                            <div class="swing-card improving" onclick="openSwingModal(${i}, 'improving')">
                                                <div class="swing-card-top">
                                                    <img src="${s.badgeUrl}" alt="${escHTML(s.teamShort)}" class="swings-run-badge" onerror="this.style.display='none'">
                                                    <div class="swings-run-info">
                                                        <div class="swings-run-name">${escHTML(s.teamName)}</div>
                                                        <div class="swings-run-detail">${s.homeCountNext}H ${3 - s.homeCountNext}A across the new run</div>
                                                    </div>
                                                    <span class="swing-delta improving">${s.currentFdr} → ${s.futureFdr}</span>
                                                    <span class="swings-run-arrow">›</span>
                                                </div>
                                                <div class="swing-timeline">
                                                    <div class="swing-side">
                                                        <span class="swing-side-label">Now</span>
                                                        <div class="fx-run">${renderFdrRun((s.currentFixtures || []).map(f => ({ gw: f.gw, fixtures: [f] })), { dim: true })}</div>
                                                    </div>
                                                    <div class="swing-pivot">
                                                        <span class="swing-pivot-badge improving">⚡ Eases GW${s.swingGW}</span>
                                                    </div>
                                                    <div class="swing-side">
                                                        <span class="swing-side-label">From GW${s.swingGW}</span>
                                                        <div class="fx-run">${renderFdrRun((s.nextFixtures || []).map(f => ({ gw: f.gw, fixtures: [f] })))}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')
                                    }
                                </div>
                                <!-- Worsening -->
                                <div class="swing-direction-group">
                                    <div class="swing-direction-label" style="color: var(--color-error);">↓ Getting Harder (${worseningSwings.length})</div>
                                    ${worseningSwings.length === 0 ?
                                        '<div style="padding: var(--space-2); font-size: 11px; color: var(--text-muted);">None found</div>' :
                                        worseningSwings.map((s, i) => `
                                            <div class="swing-card worsening" onclick="openSwingModal(${i}, 'worsening')">
                                                <div class="swing-card-top">
                                                    <img src="${s.badgeUrl}" alt="${escHTML(s.teamShort)}" class="swings-run-badge" onerror="this.style.display='none'">
                                                    <div class="swings-run-info">
                                                        <div class="swings-run-name">${escHTML(s.teamName)}</div>
                                                        <div class="swings-run-detail">${s.homeCountNext}H ${3 - s.homeCountNext}A across the new run</div>
                                                    </div>
                                                    <span class="swing-delta worsening">${s.currentFdr} → ${s.futureFdr}</span>
                                                    <span class="swings-run-arrow">›</span>
                                                </div>
                                                <div class="swing-timeline">
                                                    <div class="swing-side">
                                                        <span class="swing-side-label">Now</span>
                                                        <div class="fx-run">${renderFdrRun((s.currentFixtures || []).map(f => ({ gw: f.gw, fixtures: [f] })), { dim: true })}</div>
                                                    </div>
                                                    <div class="swing-pivot">
                                                        <span class="swing-pivot-badge worsening">⚡ Hardens GW${s.swingGW}</span>
                                                    </div>
                                                    <div class="swing-side">
                                                        <span class="swing-side-label">From GW${s.swingGW}</span>
                                                        <div class="fx-run">${renderFdrRun((s.nextFixtures || []).map(f => ({ gw: f.gw, fixtures: [f] })))}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    ${renderTargetableCalendar(teamFixtureMap, easyRuns, displayGWs)}
                </div>
            `;

            container.innerHTML = html;
            // Not deferred through requestAnimationFrame: it can be throttled to
            // never firing for work scheduled around freshly-inserted markup.
            applyGwWindow();
        }

        // ===== SOFT TARGETS (in Fixture Swings tab) =====
        /* Everything else in this tab answers "whose fixtures are kind" — which
           teams to own. This answers the opposite question, which is the one that
           actually picks a captain or a differential striker: whose defence is
           worth attacking right now, and who gets to attack it.

           A team can have a terrible schedule and still be a fine target, and a
           side with a soft run can be tightening up. Neither shows in an FDR
           number, which is set before a ball is kicked and never moves. */
        function softTargetScore(team) {
            const games = (team.wins || 0) + (team.draws || 0) + (team.losses || 0);
            if (!games) return null;

            const conceded = parseFloat(team.avgConceded) || 0;
            const csRate = (team.cleanSheets || 0) / games;

            // Four independent readings of the same weakness, so no single noisy
            // one runs away with the ranking. Note the `??` rather than `||`:
            // these ratings are genuinely 0-100 and the worst team in the league
            // can score 0, which `||` would silently rewrite to an average 50.
            /* Both were "100 minus a 0-100 rating". Now both come off the
               quantity itself: expected goals conceded against a league-average
               1.42, and points won against a league-average 1.35 a game. Each
               maps onto the same 0-100 attackability scale the caller expects. */
            const defWeak = Math.max(0, Math.min(100, ((team.xgAgainst ?? 1.42) - 0.55) / 1.90 * 100));
            const formWeak = Math.max(0, Math.min(100, (1 - ((team.last5Ppg ?? 1.35) / 3)) * 100));
            const leak = Math.min(100, (conceded / 2.5) * 100);         // goals actually shipped
            const csDrought = Math.max(0, 100 - csRate * 250);          // 40% CS rate scores 0

            let score = defWeak * 0.34 + formWeak * 0.24 + leak * 0.26 + csDrought * 0.16;

            // Direction of travel. xgcTrend on this page reads 'improving' /
            // 'worsening' (team-analysis-core.js uses rising/falling for the same
            // idea — do not cross the two vocabularies).
            if (team.xgcTrend === 'worsening') score += 6;
            else if (team.xgcTrend === 'improving') score -= 6;

            return Math.round(Math.max(0, Math.min(100, score)));
        }

        // Who gets to play this defence, and when. The payoff of the whole
        // section: a leaky team is only useful if you know whose attackers face it.
        function attackersFacing(teamId, fixtureMap, gws) {
            const rows = [];
            gws.forEach(gw => {
                (fixtureMap[teamId]?.[gw] || []).forEach(fx => {
                    const opp = allTeamsData.find(t => t.id === fx.opponentId);
                    if (!opp) return;
                    // fx.isHome is the SOFT TEAM's venue, so the attacking side's
                    // venue is the opposite of it.
                    rows.push({ gw, team: opp, attackerAtHome: !fx.isHome });
                });
            });
            return rows;
        }

        /* Its own view now rather than a section at the bottom of Fixture Swings.
           buildFullSeasonMap() is rebuilt here because a visitor can land on
           #targets directly, and window._teamFixtureMap — which the team report
           modal reads for its attack/defence fixture table — would otherwise
           never have been populated. */
        function renderSoftTargetsView(container) {
            const fixtureMap = buildFullSeasonMap();
            const allGWs = new Set();
            Object.values(fixtureMap).forEach(team => {
                Object.keys(team).forEach(gw => allGWs.add(parseInt(gw)));
            });
            const displayGWs = Array.from(allGWs).sort((a, b) => a - b).filter(gw => gw >= currentGW);
            window._teamFixtureMap = fixtureMap;
            container.innerHTML = renderSoftTargets(fixtureMap, displayGWs, { standalone: true });
        }

        function renderSoftTargets(fixtureMap, displayGWs, opts) {
            const standalone = !!(opts && opts.standalone);
            const window5 = displayGWs.filter(gw => gw >= currentGW).slice(0, 5);

            // Six, not a dozen. Twelve of twenty clubs is most of the league, and a
            // shortlist that holds most of the league is not a shortlist — if
            // nearly everyone is a target then none of them is.
            const ranked = allTeamsData
                .map(t => ({ team: t, score: softTargetScore(t) }))
                .filter(x => x.score !== null)
                .sort((a, b) => b.score - a.score)
                .slice(0, 6);

            if (!ranked.length) {
                return `<div class="soft-section">
                    <div class="soft-header">
                        <span class="soft-title"><i data-lucide="crosshair" style="width:16px;height:16px;display:inline;vertical-align:middle;"></i> Soft Targets</span>
                    </div>
                    <div class="soft-empty">No matches played yet this season, so there is no form or defensive record to rank teams on. This fills in once the season is under way.</div>
                </div>`;
            }

            const cards = ranked.map((entry, i) => {
                const t = entry.team;
                const games = t.wins + t.draws + t.losses;
                const csRate = Math.round(((t.cleanSheets || 0) / games) * 100);
                const form = (t.pastResults || []).slice(-5)
                    .map(r => `<span class="soft-form-dot ${r.result.toLowerCase()}" data-tooltip="${escHTML(r.result === 'W' ? 'Won' : r.result === 'D' ? 'Drew' : 'Lost')} ${escHTML(r.score)} ${r.isHome ? 'at home to' : 'away at'} ${escHTML(r.opponentName)}">${r.result}</span>`).join('');

                // A side can be solid at home and a free hit on the road. Averaging
                // that away is how "they concede a lot" ends up pointed at the
                // wrong fixture.
                // Positive = leakier at home. In goals conceded, so it reads directly.
                const venueGap = (t.xgAgainstHome ?? 1.42) - (t.xgAgainstAway ?? 1.42);
                const venueNote = venueGap > 12 ? `Much softer away from home`
                    : venueGap < -12 ? `Much softer at home`
                    : null;

                const trendNote = t.xgcTrend === 'worsening' ? 'Conceding more than their season rate lately'
                    : t.xgcTrend === 'improving' ? 'Tightening up lately — the record overstates how soft they are'
                    : null;

                const facing = attackersFacing(t.id, fixtureMap, window5);
                const facingHtml = facing.length
                    ? facing.map(f => `<span class="soft-face ${f.attackerAtHome ? 'home' : 'away'}"
                            data-tooltip="${escHTML(f.team.name)} ${f.attackerAtHome ? 'host' : 'travel to'} ${escHTML(t.shortName)} in GW${f.gw}">
                            <span class="soft-face-gw">GW${f.gw}</span>${escHTML(f.team.shortName)}<span class="soft-face-ha">${f.attackerAtHome ? 'H' : 'A'}</span>
                        </span>`).join('')
                    : '<span class="soft-face-none">No fixtures scheduled in this window</span>';

                /* Being in the top six does not make a side soft — it makes them
                   the softest six available, which in a tight league can still be
                   ordinary. Every card used to print its score in the same alarm
                   red, so the sixth-ranked team read exactly like the first. */
                const tier = entry.score >= 60 ? 'prime' : entry.score >= 45 ? 'fair' : 'mild';
                const tierWord = tier === 'prime' ? 'prime target' : tier === 'fair' ? 'worth a look' : 'marginal';

                return `<div class="soft-card tier-${tier}" onclick="openTeamReport(${t.id})" data-tooltip="Open the full report for ${escHTML(t.name)}">
                    <div class="soft-card-head">
                        <span class="soft-rank">${i + 1}</span>
                        <img src="${t.badgeUrl}" alt="" class="soft-badge" onerror="this.style.display='none'">
                        <span class="soft-name">${escHTML(t.name)}</span>
                        <span class="soft-score" data-tooltip="How attackable this defence looks right now, from defensive quality, current form, goals conceded and clean-sheet rate, adjusted for whether they are trending better or worse. 60 and above is a genuinely soft defence; below 45 they are only here because someone has to be sixth.">${entry.score}<em>${tierWord}</em></span>
                    </div>
                    <div class="soft-metrics">
                        <span class="soft-metric" data-tooltip="Goals conceded per game across ${games} matches."><em>${parseFloat(t.avgConceded).toFixed(2)}</em>conceded/gm</span>
                        <span class="soft-metric" data-tooltip="Share of matches they have kept a clean sheet in."><em>${csRate}%</em>clean sheets</span>
                        <span class="soft-metric" data-tooltip="Goals this defence is expected to concede in a game. A league-average side is around 1.4, so anything above that is leaking."><em>${(t.xgAgainst ?? 0).toFixed(2)}</em>xGC/game</span>
                        <span class="soft-form">${form}</span>
                    </div>
                    ${(venueNote || trendNote) ? `<div class="soft-note">${[venueNote, trendNote].filter(Boolean).join(' · ')}</div>` : ''}
                    <div class="soft-facing">
                        <span class="soft-facing-l">Attacked by</span>
                        <div class="soft-facing-list">${facingHtml}</div>
                    </div>
                </div>`;
            }).join('');

            return `<div class="soft-section${standalone ? ' standalone' : ''}">
