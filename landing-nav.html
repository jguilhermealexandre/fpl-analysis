<!-- The landing chrome — fetch-injected by loadSidebarNav() in
     scripts/sidebar-nav.js when there is no team saved.

     The sidebar is the signed-in shell: it is a list of the things you can
     do to a squad, and without one every item in it leads to a page that
     asks for a Team ID. A visitor was shown that whole rail anyway. This
     is what a visitor gets instead — what the site is, and what it costs.

     The way in is a Log in button, going to /dashboard/login — the same page
     scripts/dashboard-gate.js sends anybody to who opens an app screen
     without a saved Team ID. One place asks for the number, which is one
     fewer than before.

     For a manager who already has a Team ID saved, that button is wrong: it
     is this chrome's only way back into the app, and telling somebody who is
     signed in to log in is both a dead end and a lie about their own state.
     loadLandingNav() rewrites it to a way back to the dashboard. These pages
     are reachable while signed in — the Features menu, the footer and the
     logo all lead here from inside the app. -->
<header class="v2-landing-nav" id="v2LandingNav">
<div class="v2-landing-inner">
    <a href="/" class="v2-landing-logo"><span>Easy<b>FPL</b></span></a>

    <nav class="v2-landing-links" aria-label="Site">
        <!-- Features opens a panel rather than going anywhere: the eight pages
             under it are the product, and a visitor who does not already know
             what "Rivals" or "Scout's Desk" mean cannot pick one off a flat
             bar. -->
        <div class="v2-nav-group">
            <button type="button" class="v2-nav-trigger" id="navFeaturesBtn"
                    aria-expanded="false" aria-controls="navFeatures"
                    onclick="v2ToggleNavPanel(this)">
                Features
                <svg class="v2-nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>

            <!-- In the sheet the trigger is gone and the panel is just a run of
                 links, so the group needs a name of its own or the eight pages
                 read as peers of Methodology and FAQ. Decorative on desktop,
                 where the button says it. -->
            <span class="v2-nav-label" aria-hidden="true">Features</span>

            <div class="v2-nav-panel" id="navFeatures" hidden>
                <!-- These go to the feature pages, not straight into the app:
                     a visitor who has not saved a Team ID yet would land on the
                     ID page, which is a worse answer to "what is this" than a
                     page explaining it. -->
                <div class="v2-nav-cols">
                    <a href="/feature-squad-analysis.html" data-page="feature-squad-analysis.html">Squad Analysis</a>
                    <a href="/feature-player-explorer.html" data-page="feature-player-explorer.html">Player Explorer</a>
                    <a href="/feature-fixture-ratings.html" data-page="feature-fixture-ratings.html">Fixture Ratings</a>
                    <a href="/feature-league-rivals.html" data-page="feature-league-rivals.html">League Rivals</a>
                    <a href="/feature-scouts-desk.html" data-page="feature-scouts-desk.html">Scout's Desk</a>
                    <a href="/feature-team-news.html" data-page="feature-team-news.html">Team News</a>
                </div>
                <!-- The two wizards have pages of their own now, so the cards
                     link to those rather than deep into a tab of the app. -->
                <div class="v2-nav-cards">
                    <a class="v2-nav-card" href="/feature-transfer-wizard.html" data-page="feature-transfer-wizard.html">
                        <span class="v2-nav-card-art" aria-hidden="true">
                            <img alt="" src="/assets/lp/card-transfer-dark-1400.webp?v=453" srcset="/assets/lp/card-transfer-dark-700.webp?v=453 700w, /assets/lp/card-transfer-dark-1000.webp?v=453 1000w, /assets/lp/card-transfer-dark-1400.webp?v=453 1400w" sizes="(max-width: 760px) 100vw, 1400px" width="1400" height="449" loading="lazy" decoding="async">
                        </span>
                        <span class="v2-nav-card-t">Transfer Wizard</span>
                        <span class="v2-nav-card-d">Plan the week's moves, priced against the hit</span>
                    </a>
                    <a class="v2-nav-card" href="/feature-lineup-wizard.html" data-page="feature-lineup-wizard.html">
                        <span class="v2-nav-card-art is-lineup" aria-hidden="true">
                            <img alt="" src="/assets/lp/card-lineup-dark-1400.webp?v=453" srcset="/assets/lp/card-lineup-dark-700.webp?v=453 700w, /assets/lp/card-lineup-dark-1000.webp?v=453 1000w, /assets/lp/card-lineup-dark-1400.webp?v=453 1400w" sizes="(max-width: 760px) 100vw, 1400px" width="1400" height="449" loading="lazy" decoding="async">
                        </span>
                        <span class="v2-nav-card-t">Lineup Wizard</span>
                        <span class="v2-nav-card-d">Who starts, who sits, who takes the armband</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- display:contents on desktop, so these three stay direct children of
             the bar and lay out as three plain links. In the sheet it becomes a
             labelled section, which is the whole difference between a menu and
             a list of eleven things.

             Accuracy was the fourth and is no longer in the bar. The page still
             exists and is still linked from the footer and from every feature
             page; it is off the landing route on purpose. The cols grid is
             two-up with its row and flow explicitly reset, so dropping one link
             reflows to 2 + 1 without touching the stylesheet. -->
        <div class="v2-nav-more">
            <span class="v2-nav-label" aria-hidden="true">Everything else</span>
            <div class="v2-nav-more-cols">
                <a href="/fpl-methodology.html" data-page="fpl-methodology.html">Methodology</a>
                <a href="/fpl-faq.html" data-page="fpl-faq.html">FAQ</a>
                <a href="/fpl-pricing.html" data-page="fpl-pricing.html">Pricing</a>
            </div>
        </div>
    </nav>

    <div class="v2-landing-actions">
        <!-- One door, and it is a link to it. The bar used to hold the Team ID
             field itself, which meant two places asked for the same number and
             the narrow-screen fallback was a third thing to keep in step. The
             ID page does it better than a 64px bar can: it has room for where
             to find the number, for what is stored and what is not, and for
             the demo squad. -->
        <a class="v2-landing-login" id="v2LandingWayIn" href="/dashboard/login">Log in</a>
    </div>

    <!-- Below the breakpoint the links collapse behind this. -->
    <button type="button" class="v2-landing-burger" id="v2LandingBurger" onclick="toggleLandingNav()" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
</div>
</header>
