<!-- The landing chrome — fetch-injected by loadSidebarNav() in
     scripts/sidebar-nav.js when there is no team saved.

     The sidebar is the signed-in shell: it is a list of the things you can
     do to a squad, and without one every item in it leads to a page that
     asks for a Team ID. A visitor was shown that whole rail anyway. This
     is what a visitor gets instead — what the site is, what it costs, and
     the way in. -->
<header class="v2-landing-nav" id="v2LandingNav">
<div class="v2-landing-inner">
    <a href="index.html" class="v2-landing-logo"><span>Easy<b>FPL</b></span></a>

    <nav class="v2-landing-links" aria-label="Site">
        <!-- Features opens a panel rather than going anywhere: the six pages
             under it are the product, and a visitor who does not already know
             what "Rivals" or "Scout's Desk" mean cannot pick one off a flat
             bar. The two cards are the tools rather than the pages — both
             live inside Squad Analysis as tabs, so they have no page of their
             own to list. -->
        <div class="v2-nav-group">
            <button type="button" class="v2-nav-trigger" id="navFeaturesBtn"
                    aria-expanded="false" aria-controls="navFeatures"
                    onclick="v2ToggleNavPanel(this)">
                Features
                <svg class="v2-nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>

            <!-- In the mobile sheet the trigger is gone and the panel is just
                 a run of links, so the group needs a name of its own or the
                 six pages read as peers of Methodology and FAQ. Decorative on
                 desktop, where the button says it. -->
            <span class="v2-nav-label" aria-hidden="true">Features</span>

            <div class="v2-nav-panel" id="navFeatures" hidden>
                <div class="v2-nav-cols">
                    <a href="fpl-my-team-analysis.html" data-page="fpl-my-team-analysis.html">Squad Analysis</a>
                    <a href="fpl-players-analysis.html" data-page="fpl-players-analysis.html">Player Explorer</a>
                    <a href="fpl-teams-analysis.html" data-page="fpl-teams-analysis.html">Fixture Ratings</a>
                    <a href="fpl-league-rivals.html" data-page="fpl-league-rivals.html">League Rivals</a>
                    <a href="fpl-scouts-desk.html" data-page="fpl-scouts-desk.html">Scout's Desk</a>
                    <a href="fpl-news.html" data-page="fpl-news.html">Team News</a>
                </div>
                <div class="v2-nav-cards">
                    <a class="v2-nav-card" href="fpl-my-team-analysis.html#transfer">
                        <span class="v2-nav-card-art" aria-hidden="true">
                            <img src="assets/lp/card-transfer-dark.png" alt="" loading="lazy" decoding="async">
                        </span>
                        <span class="v2-nav-card-t">Transfer Wizard</span>
                        <span class="v2-nav-card-d">Plan the week's moves, priced against the hit</span>
                    </a>
                    <a class="v2-nav-card" href="fpl-my-team-analysis.html#lineup">
                        <span class="v2-nav-card-art is-lineup" aria-hidden="true">
                            <img src="assets/lp/card-lineup-dark.png" alt="" loading="lazy" decoding="async">
                        </span>
                        <span class="v2-nav-card-t">Lineup Wizard</span>
                        <span class="v2-nav-card-d">Who starts, who sits, who takes the armband</span>
                    </a>
                </div>
            </div>
        </div>

        <a href="fpl-methodology.html" data-page="fpl-methodology.html">Methodology</a>
        <a href="fpl-faq.html" data-page="fpl-faq.html">FAQ</a>
        <a href="#" onclick="openSettingsModal('plan'); return false;">Pricing</a>
    </nav>

    <div class="v2-landing-actions">
        <!-- One door again, and it is the Team ID itself — typed here rather
             than behind a button that opens a box to type it in. Nearly every
             reader of this site arrives with an id and no account, so the bar
             asks for the one thing it needs.

             The button below is the same door for a screen too narrow to hold
             a field: CSS shows exactly one of the two. It also stays the way
             to the explanation and the demo squad, which a bar this size has
             no room for — v2SubmitLandingId() opens it on an empty or
             malformed id for that reason. -->
        <form class="v2-landing-id" aria-label="Open your team"
              onsubmit="return v2SubmitLandingId(event)">
            <input type="text" id="v2LandingIdInput" placeholder="Team ID"
                   inputmode="numeric" autocomplete="off" maxlength="9"
                   aria-label="Your FPL Team ID"
                   oninput="this.classList.remove('is-bad')">
            <button type="submit" class="v2-landing-id-go">Go</button>
        </form>
        <button type="button" class="v2-landing-login v2-landing-id-fallback"
                onclick="openLoginModal()">Log in</button>
    </div>

    <!-- Below the breakpoint the links collapse behind this. -->
    <button type="button" class="v2-landing-burger" id="v2LandingBurger" onclick="toggleLandingNav()" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
</div>
</header>
