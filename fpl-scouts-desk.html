            <!-- The articles live in a section, like the cards on every other
                 page. Nothing stands between the masthead and the first one:

            </section>

            <!-- Editorial studio: triggers the recurring formats on demand -->

    <script>
        initIcons();
        loadFooter();
        loadSidebarNav().then(initScoutsDesk);

        /* Every article here is generated from the same data the rest of the
           site runs on, so the help explains the KINDS rather than the writing.
           A reader's real question is which of these is worth four minutes. */
        v2MountPageHelp(
            'Every article on this page is written from the site\u2019s own data \u2014 no opinion, no insider, nothing that is not in the numbers. They are published on a cadence and kept afterwards, so a gameweek\u2019s piece stays exactly as it read at the time.',
            [
                { title: 'The recurring articles', steps: [
                    { title: 'The Gameweek Debrief \u00b7 weekly',
                      text: 'What actually happened in the round just gone: the hauls, the blanks, the captaincy that worked and the one that did not.',
                      more: '<p>Written after the round is marked data-checked, so bonus points and any FPL corrections are already in \u2014 which is why it lands a day or two after the last whistle rather than on the Monday morning.</p><p>It is a record, not a preview. Nothing in it is a recommendation for the week ahead.</p>' },
                    { title: 'The Hall of Shame \u00b7 weekly',
                      text: 'The same round read for the disasters \u2014 benched hauls, captain calls that cost you, players who took a wage for ninety minutes of nothing.',
                      more: '<p>Deliberately the funny one. Every figure in it is real and checkable; the tone is the only thing that changes.</p><p>It exists because the debrief rewards correct decisions and nobody learns from those. The bench call that cost fourteen points is the one worth remembering.</p>' },
                    { title: 'Captaincy Matrix \u00b7 weekly',
                      text: 'Before the deadline: the armband candidates side by side, with the fixture, the projection and how much of the field is on each.',
                      more: '<p>Ownership is in there because captaincy is relative. Captaining the player seventy per cent of the field has captained is a low-variance choice whatever his projection; captaining the one on four per cent is a bet on rank. It says which is which rather than picking for you.</p>' },
                    { title: 'Under the Hood \u00b7 fortnightly',
                      text: 'Where the underlying numbers and the points have come apart \u2014 players scoring more than their chances deserve, and players owed goals.',
                      more: '<p>Built entirely on the gap between expected and actual. A forward on six goals from 2.9 xG has been finishing above what the chances were worth, and finishing regresses; one on two goals from 5.5 xG is getting into the right places and is usually repaid.</p><p>It says nothing about when. Regression is a direction, not a date, and a player can be owed goals for two months.</p>' },
                    { title: 'The Fixture Horizon \u00b7 fortnightly',
                      text: 'Which clubs\u2019 runs turn kind and which turn brutal, far enough ahead to act on.',
                      more: '<p>Longer-range than the fixture tools elsewhere on the site, which are weighted towards the next match or two. This one is about planning three to six gameweeks out \u2014 the horizon a wildcard or a defensive rebuild actually works on.</p>' },
                    { title: 'Market Watch \u00b7 fortnightly',
                      text: 'Who the field is buying and selling, what it has done to prices, and where the crowd looks wrong.',
                      more: '<p>Price movement is the one part of FPL where the crowd moves before the evidence does. A player rising three times in a week is a fact about transfers, not about football, and the article separates the two.</p>' },
                    { title: 'The Tactical Playbook \u00b7 monthly',
                      text: 'How the clubs are actually set up, and which FPL assets that makes valuable.',
                      more: '<p>The slowest-moving of the seven, because formations and roles do not change weekly. A full-back who has started taking corners is worth more than the same full-back a month ago, and that is the kind of change this one looks for.</p>' },
                ] },
                { title: 'How to read them', steps: [
                    { title: 'Where the numbers come from',
                      text: 'The same committed data files the rest of the site reads \u2014 FPL\u2019s own feed for results, minutes and prices, and the bookmakers\u2019 lines where an article quotes a market.',
                      more: '<p>Nothing here is scraped from a rival site and nothing is invented to round out a paragraph. If a figure cannot be sourced it is left out, which is why an article occasionally says a section could not be written this week.</p>' },
                    { title: 'The archive',
                      text: 'Once published, an article is fixed. It is written to the repository after the data refresh and never edited afterwards.',
                      more: '<p>That is the point of it. An article quietly updating itself to match what happened next would be worthless as a record, and the only interesting question about a prediction is what it said <strong>before</strong>.</p>' }
                ] }
            ]
        );
    </script>
