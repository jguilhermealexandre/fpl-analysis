    <meta name="description" content="Gameweek-by-gameweek Fantasy Premier League analysis: debriefs, captaincy matrices, differentials and fixture swings. Written fresh every round.">
    <link rel="canonical" href="https://easyfpl.com/dashboard/scouts-desk">
    <!-- Social card: generated by tools/social-meta.mjs from this page's own
         title, description and canonical URL. Do not edit by hand; re-run it.
         The image is drawn by tools/make-og-cards.mjs from the same three. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EasyFPL">
    <meta property="og:locale" content="en_GB">
    <meta property="og:title" content="The Scout's Desk — FPL Gameweek Analysis">
    <meta property="og:description" content="Gameweek-by-gameweek Fantasy Premier League analysis: debriefs, captaincy matrices, differentials and fixture swings. Written fresh every round.">
    <meta property="og:url" content="https://easyfpl.com/dashboard/scouts-desk">
    <meta property="og:image" content="https://easyfpl.com/assets/og/fpl-scouts-desk.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">

    <meta property="og:image:alt" content="The Scout's Desk — FPL Gameweek Analysis — EasyFPL">

    <meta name="twitter:title" content="The Scout's Desk — FPL Gameweek Analysis">
    <meta name="twitter:description" content="Gameweek-by-gameweek Fantasy Premier League analysis: debriefs, captaincy matrices, differentials and fixture swings. Written fresh every round.">
    <meta name="twitter:image" content="https://easyfpl.com/assets/og/fpl-scouts-desk.png">
    <!-- /social card -->
    <!-- The site's typefaces, from our own origin rather than Google's.
         Two cross-origin connections used to stand in front of the first
         glyph: one to fonts.googleapis.com for a stylesheet that names files
         on fonts.gstatic.com, then one to that. Both are gone — see the note
         at the top of tools/fetch-fonts.mjs — and with them every
         third-party request a signed-out visitor made.

         Still off the critical path via media="print", and still
         font-display: swap inside, so text paints in the fallback face and
         reflows once. Preloading the two faces above the fold instead of
         waiting for the stylesheet to name them: same-origin now, so a
         preload here costs nothing and starts them with the CSS. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin-ca11fe9ca5.woff2" crossorigin>
    <link rel="stylesheet" href="/styles/fonts.min.css?v=360">
    <script src="/scripts/dashboard-gate.min.js?v=360"></script>
    <link rel="stylesheet" href="/styles/common.min.css?v=360">
    <link rel="stylesheet" href="/styles/v2-design.min.css?v=360">
    <!-- v2-app.css is the signed-in half of v2-design.css. Asked for here, so
         that the cascade reads the same as it did when the two were one file,
         and only when there is a saved Team ID — see the note at the top of
         v2-design.css. Kept identical on every page by check:appcss. -->
    <script>(function(){var t=null;try{t=localStorage.getItem('fpl_team_id')}catch(e){}if(!t)return;var l=document.createElement('link');l.rel='stylesheet';l.href='/styles/v2-app.min.css?v=360';document.head.appendChild(l)})();</script>
    <link rel="stylesheet" href="/styles/scouts-desk.min.css?v=360">
    <link rel="stylesheet" href="/styles/responsive.min.css?v=360">
</head>
<body>
    <!-- V2 sidebar is fetch-injected here by loadSidebarNav() (scripts/sidebar-nav.js) -->
    <!-- The same two-element shell every other page uses: .v2-main-content is
         the shell beside the sidebar, main.main-content is the column inside
         it. This page had the shell class on a <main> and then its own
         1180px .sd-page inside that, so its content sat 36px further in and
         72px narrower than every page you reach it from. -->
    <div class="v2-main-content v2-no-tabs">
    <main class="main-content">
        <div class="sd-page">
            <header class="sd-masthead">
                <!-- No theme button here. The sidebar carries the one switch
                     for the whole site; a second one in this page's masthead was
                     the only page-level copy, and two controls for one setting
                     is one more than the setting has. -->
                <div class="sd-masthead-row">
                    <h1 class="v2-page-heading">The Scout's Desk</h1>
                </div>
            </header>

            <!-- The articles live in a section, like the cards on every other
                 page. Nothing stands between the masthead and the first one:
                 the standfirst, the dataset note and a "Latest analysis"
                 heading all said, in three ways, what the page title says. -->
            <section class="v2-section">
                <div id="sdFeed" class="sd-feed">
                    <div class="sd-empty">Loading articles…</div>
                </div>
            </section>

            <!-- Editorial studio: triggers the recurring formats on demand -->
            <section class="sd-studio-wrap">
                <button class="sd-studio-toggle" onclick="sdToggleStudio()" aria-expanded="false">
                    Editorial studio
                </button>
                <div class="sd-studio" id="sdStudio">
                    <p class="sd-studio-note">
                        These formats normally publish on a schedule. Run one now and it is generated from the current data and added to the top of the feed.
                    </p>
                    <div class="sd-gen-list" id="sdStudioList"></div>
                    <div class="sd-gen-status" id="sdGenStatus" role="status" aria-live="polite"></div>
                </div>
            </section>
        </div>
    </main>
    </div>

    <!-- Reader -->
    <div class="sd-reader" id="sdReader" onclick="sdCloseArticle(event)">
        <div class="sd-reader-panel">
            <button class="sd-reader-close" onclick="sdCloseArticle()" aria-label="Close article">&times;</button>
            <div class="sd-reader-scroll" id="sdReaderScroll">
                <article class="sd-reader-body" id="sdReaderBody"></article>
            </div>
        </div>
    </div>

    <script src="/scripts/error-monitor.min.js?v=360"></script>
    <script src="/scripts/auth.min.js?v=360"></script>
    <script src="/scripts/common.min.js?v=360"></script>
    <!-- The bell in the sidebar. The dashboard writes the feed; every
         page reads it, so the record is visible wherever you are. -->
    <script src="/scripts/push-alerts.min.js?v=360"></script>
    <script src="/scripts/notifications.min.js?v=360"></script>
    <script src="/scripts/sidebar-nav.min.js?v=360"></script>
    <script src="/scripts/scouts-art.min.js?v=360"></script>
    <script src="/scripts/scouts-desk.min.js?v=360"></script>
    <script>
        initIcons();
        loadFooter();
        loadSidebarNav().then(initScoutsDesk);
    </script>
</body>
</html>
