<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team Analysis - FPL Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface-bg: #0A0E14;
            --surface-0: #0D1117;
            --surface-1: #161B22;
            --surface-2: #1C2128;
            --surface-3: #21262D;
            --surface-4: #30363D;
            
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.45);
            
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.10);
            --border-emphasis: rgba(255, 255, 255, 0.16);
            
            --color-success: #4ADE80;
            --color-error: #F87171;
            --color-warning: #FBBF24;
            --color-info: #60A5FA;
            
            --verdict-sell: #EF4444;
            --verdict-sell-bg: rgba(239, 68, 68, 0.12);
            --verdict-monitor: #F59E0B;
            --verdict-monitor-bg: rgba(245, 158, 11, 0.12);
            --verdict-hold: #22C55E;
            --verdict-hold-bg: rgba(34, 197, 94, 0.12);
            
            --fdr-1: #4ADE80;
            --fdr-2: #86EFAC;
            --fdr-3: #9CA3AF;
            --fdr-4: #FB923C;
            --fdr-5: #EF4444;
            
            --font-display: 'Space Grotesk', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface-bg);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
            min-height: 100vh;
        }

        /* ===== TOP NAVIGATION ===== */
        .top-nav {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 48px;
            gap: 32px;
        }

        .nav-logo {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-logo span { color: var(--color-success); }

        .nav-links {
            display: flex;
            gap: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
        }

        .nav-link:hover { 
            color: var(--text-primary); 
            background: var(--surface-1);
        }
        
        .nav-link.active {
            color: var(--color-success);
            background: rgba(74, 222, 128, 0.1);
        }

        .nav-link .icon { font-size: 14px; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px 100px;
        }

        /* ===== HEADER ROW ===== */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
        }

        .team-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-id-input {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 13px;
            width: 100px;
        }

        .team-id-input:focus {
            outline: none;
            border-color: var(--color-success);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-primary {
            background: var(--color-success);
            color: var(--surface-bg);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--surface-3);
        }

        .manager-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            background: var(--surface-1);
            border-radius: var(--radius-md);
            font-size: 13px;
        }

        .manager-info.hidden { display: none; }

        .manager-name {
            font-weight: 600;
            color: var(--color-success);
        }

        .manager-stat {
            color: var(--text-secondary);
        }

        .manager-stat strong {
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        /* ===== TEAM HEALTH SUMMARY ===== */
        .team-health {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
        }

        .health-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .health-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .health-counts {
            display: flex;
            gap: 16px;
        }

        .health-count {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .health-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .health-dot.sell { background: var(--verdict-sell); }
        .health-dot.monitor { background: var(--verdict-monitor); }
        .health-dot.hold { background: var(--verdict-hold); }

        .priority-action {
            background: var(--surface-2);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .priority-icon {
            font-size: 24px;
        }

        .priority-content {
            flex: 1;
        }

        .priority-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--verdict-sell);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .priority-text {
            font-size: 14px;
            color: var(--text-primary);
        }

        .priority-btn {
            padding: 8px 16px;
            background: var(--verdict-sell);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ===== VERDICT SECTIONS ===== */
        .verdict-section {
            margin-bottom: 16px;
        }

        .verdict-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            cursor: pointer;
            user-select: none;
        }

        .verdict-header:hover .verdict-title {
            opacity: 0.8;
        }

        .verdict-badge {
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .verdict-badge.sell {
            background: var(--verdict-sell-bg);
            color: var(--verdict-sell);
        }

        .verdict-badge.monitor {
            background: var(--verdict-monitor-bg);
            color: var(--verdict-monitor);
        }

        .verdict-badge.hold {
            background: var(--verdict-hold-bg);
            color: var(--verdict-hold);
        }

        .verdict-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .verdict-count {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .verdict-toggle {
            color: var(--text-muted);
            font-size: 12px;
            transition: transform 0.2s;
        }

        .verdict-toggle.open {
            transform: rotate(180deg);
        }

        /* ===== PLAYER GRID ===== */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }

        /* ===== COMPACT PLAYER CARD ===== */
        .player-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 14px;
            transition: all 0.15s;
            cursor: pointer;
        }

        .player-card:hover {
            border-color: var(--border-emphasis);
            transform: translateY(-1px);
        }

        .player-card.sell {
            border-left: 3px solid var(--verdict-sell);
        }

        .player-card.monitor {
            border-left: 3px solid var(--verdict-monitor);
        }

        .player-card.hold {
            border-left: 3px solid var(--verdict-hold);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .position-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }

        .position-badge.gk { background: rgba(252, 211, 77, 0.2); color: #FCD34D; }
        .position-badge.def { background: rgba(52, 211, 153, 0.2); color: #34D399; }
        .position-badge.mid { background: rgba(96, 165, 250, 0.2); color: #60A5FA; }
        .position-badge.fwd { background: rgba(248, 113, 113, 0.2); color: #F87171; }

        .verdict-chip {
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .verdict-chip.sell {
            background: var(--verdict-sell-bg);
            color: var(--verdict-sell);
        }

        .verdict-chip.monitor {
            background: var(--verdict-monitor-bg);
            color: var(--verdict-monitor);
        }

        .verdict-chip.hold {
            background: var(--verdict-hold-bg);
            color: var(--verdict-hold);
        }

        /* Verdict reason - the key insight */
        .verdict-reason {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* Key metrics - only 3 */
        .key-metrics {
            display: flex;
            gap: 8px;
        }

        .metric-box {
            flex: 1;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
        }

        .metric-value.good { color: var(--color-success); }
        .metric-value.warning { color: var(--color-warning); }
        .metric-value.bad { color: var(--color-error); }
        .metric-value.neutral { color: var(--text-primary); }

        .metric-trend {
            font-size: 10px;
            margin-left: 2px;
        }

        /* Fixture strip */
        .fixture-strip {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
        }

        .fixture-chip {
            flex: 1;
            padding: 4px 0;
            text-align: center;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .fixture-chip.fdr-1 { background: rgba(74, 222, 128, 0.2); color: var(--fdr-1); }
        .fixture-chip.fdr-2 { background: rgba(134, 239, 172, 0.2); color: var(--fdr-2); }
        .fixture-chip.fdr-3 { background: rgba(156, 163, 175, 0.15); color: var(--fdr-3); }
        .fixture-chip.fdr-4 { background: rgba(251, 146, 60, 0.2); color: var(--fdr-4); }
        .fixture-chip.fdr-5 { background: rgba(239, 68, 68, 0.2); color: var(--fdr-5); }

        .fixture-team {
            display: block;
            font-size: 11px;
        }

        .fixture-venue {
            display: block;
            font-size: 9px;
            opacity: 0.7;
        }

        /* Card actions */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
        }

        .card-btn {
            flex: 1;
            padding: 6px 10px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .card-btn:hover {
            background: var(--surface-3);
            color: var(--text-primary);
        }

        .card-btn.primary {
            background: var(--color-info);
            border-color: var(--color-info);
            color: white;
        }

        .card-btn.primary:hover {
            filter: brightness(1.1);
        }

        /* ===== HOLD SECTION COMPACT ===== */
        .hold-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        .hold-card-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-left: 3px solid var(--verdict-hold);
            border-radius: var(--radius-sm);
        }

        .hold-card-mini .player-name {
            font-size: 13px;
            margin: 0;
        }

        .hold-card-mini .player-meta {
            font-size: 11px;
        }

        .hold-mini-stat {
            margin-left: auto;
            text-align: right;
        }

        .hold-mini-stat .value {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--color-success);
        }

        .hold-mini-stat .label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ===== DETAIL PANEL (Slide-out) ===== */
        .detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
        }

        .detail-overlay.show {
            display: block;
        }

        .detail-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: var(--surface-0);
            border-left: 1px solid var(--border-default);
            z-index: 201;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .detail-overlay.show .detail-panel {
            transform: translateX(0);
        }

        .detail-header {
            position: sticky;
            top: 0;
            background: var(--surface-0);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .detail-close:hover {
            color: var(--text-primary);
        }

        .detail-body {
            padding: 20px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .insight-item {
            padding: 12px;
            background: var(--surface-1);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }

        .insight-item.positive {
            border-left: 3px solid var(--color-success);
        }

        .insight-item.warning {
            border-left: 3px solid var(--color-warning);
        }

        .insight-item.critical {
            border-left: 3px solid var(--color-error);
        }

        .insight-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .insight-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .replacement-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .replacement-card:hover {
            border-color: var(--color-info);
            background: var(--surface-2);
        }

        .replacement-rank {
            width: 24px;
            height: 24px;
            background: var(--surface-3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .replacement-info {
            flex: 1;
        }

        .replacement-name {
            font-size: 13px;
            font-weight: 600;
        }

        .replacement-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .replacement-stats {
            text-align: right;
        }

        .replacement-primary {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-success);
        }

        .replacement-secondary {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 20, 0.9);
            z-index: 300;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-3);
            border-top-color: var(--color-success);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ===== MOBILE NAV ===== */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-0);
            border-top: 1px solid var(--border-default);
            padding: 8px 0;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .mobile-nav {
                display: flex;
                justify-content: space-around;
            }

            .main-content {
                padding-bottom: 80px;
            }
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
        }

        .mobile-nav-item.active {
            color: var(--color-success);
        }

        .mobile-nav-item .icon {
            font-size: 20px;
        }

        /* ===== STATUS ===== */
        .status {
            text-align: center;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
        }

        .status.loading {
            color: var(--color-info);
        }

        .status.success {
            color: var(--color-success);
        }

        .status.error {
            color: var(--color-error);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-row {
                flex-direction: column;
                align-items: stretch;
            }

            .team-input-row {
                flex-wrap: wrap;
            }

            .manager-info {
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }

            .hold-grid {
                grid-template-columns: 1fr;
            }

            .health-header {
                flex-direction: column;
                gap: 12px;
            }

            .priority-action {
                flex-direction: column;
                text-align: center;
            }

            .detail-panel {
                max-width: 100%;
            }
        }
    </style>
</head>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">

        <a href="fpl-my-team-analysis.html" class="mobile-nav-item active"><span class="icon">⚽</span>My Team</a>
        <a href="fpl-players-analysis.html" class="mobile-nav-item"><span class="icon">👤</span>Players</a>
        <a href="fpl-teams-analysis.html" class="mobile-nav-item"><span class="icon">📊</span>Teams</a>
        <a href="fpl-league-rivals.html" class="mobile-nav-item"><span class="icon">🏆</span>Rivals</a>
    </nav>

    <script>
        // ===== CONFIGURATION =====
        const WORKER_URL = 'https://fpl-proxy.jguilhermealexandre.workers.dev';
        
        const POSITION_CONFIG = {
            1: { name: 'Goalkeeper', short: 'GK', class: 'gk', count: 2 },
            2: { name: 'Defender', short: 'DEF', class: 'def', count: 5 },
            3: { name: 'Midfielder', short: 'MID', class: 'mid', count: 5 },
            4: { name: 'Forward', short: 'FWD', class: 'fwd', count: 3 }
        };

        // Thresholds for verdicts
        const SELL_THRESHOLD = 50;
        const MONITOR_THRESHOLD = 30;

        // ===== STATE =====
        let allPlayers = [];
        let allPlayersById = {};
        let teams = {};
        let teamFixtures = {};
        let currentGW = 1;
        let selectedPlayers = [];
        let managerData = null;
        let analysisResults = [];

        let userSettings = {
            blankTolerance: 4,
            fixtureWeight: 1.0,
            premiumPatience: 0.85,
            budgetHarshness: 1.1,
            minutesThreshold: 60
        };

        // ===== UTILITY FUNCTIONS =====
        async function fetchWithProxy(url) {
            const apiPath = url.replace('https://fantasy.premierleague.com/', '');
            const proxyUrl = `${WORKER_URL}/${apiPath}`;
            
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            
            try {
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeout);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            } catch (e) {
                clearTimeout(timeout);
                throw new Error('Failed to fetch from FPL API');
            }
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        // ===== DATA LOADING =====
        async function loadBootstrapData() {
            const response = await fetch('data/bootstrap-static.json');
            if (!response.ok) throw new Error('Failed to load data');
            return await response.json();
        }

        async function loadFixtures() {
            const response = await fetch('data/fixtures.json');
            if (!response.ok) throw new Error('Failed to load fixtures');
            return await response.json();
        }

        async function loadTeamById() {
            const teamId = document.getElementById('teamIdInput').value.trim();
            if (!teamId || isNaN(teamId)) {
                updateStatus('Please enter a valid Team ID', 'error');
                return;
            }

            const btn = document.getElementById('loadTeamBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';
            showLoading(true);

            try {
                updateStatus('Loading FPL data...', 'loading');

                // Load bootstrap data
                const bootData = await loadBootstrapData();
                
                // Build teams lookup
                teams = {};
                bootData.teams.forEach(t => {
                    teams[t.id] = t;
                });

                // Find current gameweek
                const currEvent = bootData.events.find(e => e.is_current);
                currentGW = currEvent ? currEvent.id : 1;

                // Load fixtures
                const fixturesData = await loadFixtures();
                processFixtures(fixturesData);

                // Build players
                allPlayers = bootData.elements.map(p => ({
                    id: p.id,
                    name: p.web_name,
                    fullName: `${p.first_name} ${p.second_name}`,
                    team: teams[p.team]?.short_name || 'N/A',
                    teamId: p.team,
                    position: p.element_type,
                    price: p.now_cost / 10,
                    form: parseFloat(p.form) || 0,
                    points: p.total_points,
                    ownership: parseFloat(p.selected_by_percent) || 0,
                    status: p.status,
                    news: p.news,
                    minutes: p.minutes,
                    goals: p.goals_scored,
                    assists: p.assists,
                    cleanSheets: p.clean_sheets,
                    xG: parseFloat(p.expected_goals) || 0,
                    xA: parseFloat(p.expected_assists) || 0,
                    xGI: parseFloat(p.expected_goal_involvements) || 0,
                    ictIndex: parseFloat(p.ict_index) || 0,
                    bonus: p.bonus,
                    bps: p.bps,
                    fixtures: teamFixtures[p.team] || []
                }));

                allPlayersById = {};
                allPlayers.forEach(p => allPlayersById[p.id] = p);

                // Fetch manager data
                updateStatus(`Loading team for GW${currentGW}...`, 'loading');
                
                const mgrRes = await fetchWithProxy(`https://fantasy.premierleague.com/api/entry/${teamId}/`);
                managerData = await mgrRes.json();

                const picksRes = await fetchWithProxy(`https://fantasy.premierleague.com/api/entry/${teamId}/event/${currentGW}/picks/`);
                const picksData = await picksRes.json();

                // Map picks to players
                selectedPlayers = picksData.picks.map(pick => {
                    const player = allPlayersById[pick.element];
                    if (!player) return null;
                    return {
                        ...player,
                        isCaptain: pick.is_captain,
                        isVice: pick.is_vice_captain,
                        onBench: pick.position > 11,
                        sellPrice: pick.selling_price / 10
                    };
                }).filter(p => p !== null);

                // Update manager display
                document.getElementById('managerInfo').classList.remove('hidden');
                document.getElementById('managerName').textContent = `${managerData.player_first_name} ${managerData.player_last_name}`;
                document.getElementById('overallRank').textContent = managerData.summary_overall_rank?.toLocaleString() || '-';
                document.getElementById('totalPoints').textContent = managerData.summary_overall_points?.toLocaleString() || '-';
                document.getElementById('bankValue').textContent = `£${(picksData.entry_history?.bank / 10 || 0).toFixed(1)}m`;

                // Save team ID
                localStorage.setItem('fpl_team_id', teamId);

                // Run analysis
                analyzeTeam();

            } catch (error) {
                console.error('Error loading team:', error);
                updateStatus(error.message || 'Failed to load team', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Load Team';
                showLoading(false);
            }
        }

        function processFixtures(fixturesData) {
            teamFixtures = {};
            
            const upcoming = fixturesData
                .filter(f => !f.finished && f.event !== null)
                .sort((a, b) => a.event - b.event);

            Object.keys(teams).forEach(teamId => {
                const tid = parseInt(teamId);
                const teamFix = upcoming
                    .filter(f => f.team_h === tid || f.team_a === tid)
                    .slice(0, 5);

                teamFixtures[tid] = teamFix.map(f => {
                    const isHome = f.team_h === tid;
                    return {
                        opponent: isHome ? teams[f.team_a]?.short_name : teams[f.team_h]?.short_name,
                        opponentId: isHome ? f.team_a : f.team_h,
                        difficulty: isHome ? f.team_h_difficulty : f.team_a_difficulty,
                        isHome: isHome,
                        event: f.event
                    };
                });
            });
        }

        // ===== ANALYSIS ENGINE =====
        function analyzeTeam() {
            if (selectedPlayers.length === 0) {
                updateStatus('No players loaded', 'error');
                return;
            }

            updateStatus('Analyzing...', 'loading');
            
            analysisResults = selectedPlayers.map(player => analyzePlayer(player));
            
            // Sort by sell rating (highest first)
            analysisResults.sort((a, b) => b.sellRating - a.sellRating);

            renderTeamAnalysis();
            updateStatus(`Analysis complete for GW${currentGW}`, 'success');
        }

        function analyzePlayer(player) {
            let sellRating = 0;
            let reasons = [];
            let concerns = [];
            let positives = [];

            // 1. INJURY STATUS (Critical)
            if (player.status === 'i' || player.status === 'u') {
                sellRating += 60;
                concerns.push({ type: 'critical', text: `Injured/unavailable: ${player.news || 'Check team news'}` });
                reasons.push('Injured - cannot play');
            } else if (player.status === 'd') {
                sellRating += 25;
                concerns.push({ type: 'warning', text: `Doubtful: ${player.news || '75% chance of playing'}` });
            }

            // 2. FORM ANALYSIS
            const form = player.form;
            if (form < 2.0) {
                sellRating += 25;
                concerns.push({ type: 'critical', text: `Very poor form (${form.toFixed(1)})` });
                reasons.push('Form collapsed');
            } else if (form < 3.5) {
                sellRating += 15;
                concerns.push({ type: 'warning', text: `Below average form (${form.toFixed(1)})` });
            } else if (form >= 6.0) {
                sellRating -= 15;
                positives.push({ type: 'positive', text: `Excellent form (${form.toFixed(1)})` });
            } else if (form >= 4.5) {
                sellRating -= 5;
                positives.push({ type: 'positive', text: `Good form (${form.toFixed(1)})` });
            }

            // 3. FIXTURE DIFFICULTY
            const fixtures = player.fixtures || [];
            if (fixtures.length >= 3) {
                const avgFDR = fixtures.slice(0, 3).reduce((sum, f) => sum + f.difficulty, 0) / 3;
                player.avgFDR = avgFDR;

                if (avgFDR >= 4.0) {
                    sellRating += 20;
                    concerns.push({ type: 'warning', text: `Tough fixtures ahead (FDR ${avgFDR.toFixed(1)})` });
                    reasons.push('Hard fixture run');
                } else if (avgFDR >= 3.5) {
                    sellRating += 10;
                    concerns.push({ type: 'warning', text: `Mixed fixtures (FDR ${avgFDR.toFixed(1)})` });
                } else if (avgFDR <= 2.5) {
                    sellRating -= 15;
                    positives.push({ type: 'positive', text: `Great fixtures (FDR ${avgFDR.toFixed(1)})` });
                } else if (avgFDR <= 3.0) {
                    sellRating -= 5;
                    positives.push({ type: 'positive', text: `Good fixtures (FDR ${avgFDR.toFixed(1)})` });
                }
            }

            // 4. MINUTES / ROTATION RISK
            const minsPerGame = player.minutes / Math.max(currentGW - 1, 1);
            if (minsPerGame < 45) {
                sellRating += 30;
                concerns.push({ type: 'critical', text: `Heavy rotation risk (${minsPerGame.toFixed(0)} mins/game)` });
                reasons.push('Not starting regularly');
            } else if (minsPerGame < 60) {
                sellRating += 15;
                concerns.push({ type: 'warning', text: `Rotation concern (${minsPerGame.toFixed(0)} mins/game)` });
            } else if (minsPerGame >= 85) {
                positives.push({ type: 'positive', text: `Nailed starter (${minsPerGame.toFixed(0)} mins/game)` });
            }

            // 5. VALUE ASSESSMENT (for premiums)
            const isPremium = player.price >= 10.0;
            const isMidPrice = player.price >= 7.0;
            
            if (isPremium && form < 4.0) {
                sellRating += 15;
                concerns.push({ type: 'warning', text: `Premium price (£${player.price.toFixed(1)}m) not justified by form` });
                reasons.push('Premium underperforming');
            }

            // 6. xGI ANALYSIS (for attackers)
            if (player.position >= 3) {
                const xGIPer90 = player.minutes > 0 ? (player.xGI / player.minutes) * 90 : 0;
                if (xGIPer90 < 0.25 && player.minutes >= 270) {
                    sellRating += 15;
                    concerns.push({ type: 'warning', text: `Low attacking output (${xGIPer90.toFixed(2)} xGI/90)` });
                } else if (xGIPer90 >= 0.60) {
                    sellRating -= 10;
                    positives.push({ type: 'positive', text: `Strong underlying stats (${xGIPer90.toFixed(2)} xGI/90)` });
                }
            }

            // 7. CLEAN SHEET POTENTIAL (for defenders/GKs)
            if (player.position <= 2 && fixtures.length >= 3) {
                const csRate = player.cleanSheets / Math.max(currentGW - 1, 1);
                if (csRate >= 0.4) {
                    positives.push({ type: 'positive', text: `Good CS rate (${(csRate * 100).toFixed(0)}%)` });
                }
            }

            // Determine verdict
            let verdict, verdictReason;
            if (sellRating >= SELL_THRESHOLD) {
                verdict = 'sell';
                verdictReason = reasons[0] || 'Multiple concerns - consider selling';
            } else if (sellRating >= MONITOR_THRESHOLD) {
                verdict = 'monitor';
                verdictReason = reasons[0] || 'Some concerns - keep monitoring';
            } else {
                verdict = 'hold';
                verdictReason = positives.length > 0 
                    ? positives[0].text 
                    : 'Performing as expected';
            }

            // Calculate key metric based on position
            let keyMetric = {};
            if (player.position <= 2) {
                // GK/DEF: Focus on FDR and clean sheets
                keyMetric = {
                    primary: { label: 'Form', value: form.toFixed(1), status: form >= 4.5 ? 'good' : form < 3.0 ? 'bad' : 'warning' },
                    secondary: { label: 'FDR', value: player.avgFDR?.toFixed(1) || '-', status: (player.avgFDR || 3) <= 2.8 ? 'good' : (player.avgFDR || 3) >= 3.5 ? 'bad' : 'warning' },
                    tertiary: { label: 'Mins', value: minsPerGame.toFixed(0), status: minsPerGame >= 80 ? 'good' : minsPerGame < 60 ? 'bad' : 'warning' }
                };
            } else {
                // MID/FWD: Focus on form and xGI
                const xGIPer90 = player.minutes > 0 ? (player.xGI / player.minutes) * 90 : 0;
                keyMetric = {
                    primary: { label: 'Form', value: form.toFixed(1), status: form >= 5.0 ? 'good' : form < 3.5 ? 'bad' : 'warning' },
                    secondary: { label: 'xGI/90', value: xGIPer90.toFixed(2), status: xGIPer90 >= 0.50 ? 'good' : xGIPer90 < 0.30 ? 'bad' : 'warning' },
                    tertiary: { label: 'FDR', value: player.avgFDR?.toFixed(1) || '-', status: (player.avgFDR || 3) <= 2.8 ? 'good' : (player.avgFDR || 3) >= 3.5 ? 'bad' : 'warning' }
                };
            }

            return {
                player,
                sellRating: Math.max(0, Math.min(100, sellRating)),
                verdict,
                verdictReason,
                concerns,
                positives,
                keyMetric,
                fixtures: fixtures.slice(0, 5)
            };
        }

        // ===== RENDERING =====
        function renderTeamAnalysis() {
            const sells = analysisResults.filter(a => a.verdict === 'sell');
            const monitors = analysisResults.filter(a => a.verdict === 'monitor');
            const holds = analysisResults.filter(a => a.verdict === 'hold');

            // Find priority action
            const priorityPlayer = sells[0] || monitors[0];

            let html = `
                <!-- Team Health Summary -->
                <div class="team-health">
                    <div class="health-header">
                        <div class="health-title">📊 Team Health</div>
                        <div class="health-counts">
                            <div class="health-count"><div class="health-dot sell"></div>${sells.length} Sell</div>
                            <div class="health-count"><div class="health-dot monitor"></div>${monitors.length} Monitor</div>
                            <div class="health-count"><div class="health-dot hold"></div>${holds.length} Hold</div>
                        </div>
                    </div>
                    ${priorityPlayer ? `
                    <div class="priority-action">
                        <div class="priority-icon">⚡</div>
                        <div class="priority-content">
                            <div class="priority-label">Priority Transfer</div>
                            <div class="priority-text">
                                <strong>${priorityPlayer.player.name}</strong> — ${priorityPlayer.verdictReason}
                            </div>
                        </div>
                        <button class="priority-btn" onclick="openDetailPanel(${priorityPlayer.player.id})">
                            View Options →
                        </button>
                    </div>
                    ` : `
                    <div class="priority-action" style="background: var(--verdict-hold-bg);">
                        <div class="priority-icon">✅</div>
                        <div class="priority-content">
                            <div class="priority-label" style="color: var(--verdict-hold);">Team Looking Good</div>
                            <div class="priority-text">No urgent transfers needed this week</div>
                        </div>
                    </div>
                    `}
                </div>
            `;

            // Sell section
            if (sells.length > 0) {
                html += `
                    <div class="verdict-section">
                        <div class="verdict-header" onclick="toggleSection('sell-section')">
                            <span class="verdict-badge sell">Sell</span>
                            <span class="verdict-title">Transfer Out</span>
                            <span class="verdict-count">${sells.length} player${sells.length > 1 ? 's' : ''}</span>
                            <span class="verdict-toggle" id="sell-section-toggle">▼</span>
                        </div>
                        <div class="players-grid" id="sell-section">
                            ${sells.map(a => renderPlayerCard(a)).join('')}
                        </div>
                    </div>
                `;
            }

            // Monitor section
            if (monitors.length > 0) {
                html += `
                    <div class="verdict-section">
                        <div class="verdict-header" onclick="toggleSection('monitor-section')">
                            <span class="verdict-badge monitor">Monitor</span>
                            <span class="verdict-title">Keep Watching</span>
                            <span class="verdict-count">${monitors.length} player${monitors.length > 1 ? 's' : ''}</span>
                            <span class="verdict-toggle" id="monitor-section-toggle">▼</span>
                        </div>
                        <div class="players-grid" id="monitor-section">
                            ${monitors.map(a => renderPlayerCard(a)).join('')}
                        </div>
                    </div>
                `;
            }

            // Hold section (compact)
            if (holds.length > 0) {
                html += `
                    <div class="verdict-section">
                        <div class="verdict-header" onclick="toggleSection('hold-section')">
                            <span class="verdict-badge hold">Hold</span>
                            <span class="verdict-title">Strong Performers</span>
                            <span class="verdict-count">${holds.length} player${holds.length > 1 ? 's' : ''}</span>
                            <span class="verdict-toggle" id="hold-section-toggle">▼</span>
                        </div>
                        <div class="hold-grid" id="hold-section">
                            ${holds.map(a => renderHoldCardMini(a)).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('teamDisplay').innerHTML = html;
        }

        function renderPlayerCard(analysis) {
            const { player, verdict, verdictReason, keyMetric, fixtures } = analysis;
            const posConfig = POSITION_CONFIG[player.position];

            // Fixture chips
            const fixtureChips = fixtures.slice(0, 4).map(f => `
                <div class="fixture-chip fdr-${f.difficulty}">
                    <span class="fixture-team">${f.opponent}</span>
                    <span class="fixture-venue">${f.isHome ? 'H' : 'A'}</span>
                </div>
            `).join('');

            return `
                <div class="player-card ${verdict}" onclick="openDetailPanel(${player.id})">
                    <div class="card-top">
                        <div class="player-info">
                            <div class="player-name">${player.name}</div>
                            <div class="player-meta">
                                <span class="position-badge ${posConfig.class}">${posConfig.short}</span>
                                <span>${player.team}</span>
                                <span>£${player.price.toFixed(1)}m</span>
                            </div>
                        </div>
                        <div class="verdict-chip ${verdict}">${verdict}</div>
                    </div>
                    
                    <div class="verdict-reason">${verdictReason}</div>
                    
                    <div class="key-metrics">
                        <div class="metric-box">
                            <div class="metric-label">${keyMetric.primary.label}</div>
                            <div class="metric-value ${keyMetric.primary.status}">${keyMetric.primary.value}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">${keyMetric.secondary.label}</div>
                            <div class="metric-value ${keyMetric.secondary.status}">${keyMetric.secondary.value}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">${keyMetric.tertiary.label}</div>
                            <div class="metric-value ${keyMetric.tertiary.status}">${keyMetric.tertiary.value}</div>
                        </div>
                    </div>
                    
                    <div class="fixture-strip">${fixtureChips}</div>
                </div>
            `;
        }

        function renderHoldCardMini(analysis) {
            const { player, keyMetric } = analysis;
            const posConfig = POSITION_CONFIG[player.position];

            return `
                <div class="hold-card-mini" onclick="openDetailPanel(${player.id})">
                    <div>
                        <div class="player-name">${player.name}</div>
                        <div class="player-meta">
                            <span class="position-badge ${posConfig.class}">${posConfig.short}</span>
                            ${player.team}
                        </div>
                    </div>
                    <div class="hold-mini-stat">
                        <div class="value">${keyMetric.primary.value}</div>
                        <div class="label">Form</div>
                    </div>
                </div>
            `;
        }

        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const toggle = document.getElementById(sectionId + '-toggle');
            
            if (section.style.display === 'none') {
                section.style.display = '';
                toggle.classList.remove('open');
                toggle.textContent = '▼';
            } else {
                section.style.display = 'none';
                toggle.classList.add('open');
                toggle.textContent = '▶';
            }
        }

        // ===== DETAIL PANEL =====
        function openDetailPanel(playerId) {
            const analysis = analysisResults.find(a => a.player.id === playerId);
            if (!analysis) return;

            const { player, verdict, verdictReason, concerns, positives, sellRating } = analysis;
            const posConfig = POSITION_CONFIG[player.position];

            document.getElementById('detailPlayerName').textContent = player.name;
            document.getElementById('detailPlayerMeta').innerHTML = `
                <span class="position-badge ${posConfig.class}">${posConfig.short}</span>
                ${player.team} • £${player.price.toFixed(1)}m
            `;

            // Build detail content
            let detailHtml = `
                <div class="detail-section">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                        <div class="verdict-chip ${verdict}" style="font-size: 13px; padding: 6px 14px;">${verdict.toUpperCase()}</div>
                        <div style="font-size: 14px; color: var(--text-secondary);">${verdictReason}</div>
                    </div>
                </div>
            `;

            // Concerns
            if (concerns.length > 0) {
                detailHtml += `
                    <div class="detail-section">
                        <div class="detail-section-title">⚠️ Concerns (${concerns.length})</div>
                        ${concerns.map(c => `
                            <div class="insight-item ${c.type}">
                                <div class="insight-text">${c.text}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Positives
            if (positives.length > 0) {
                detailHtml += `
                    <div class="detail-section">
                        <div class="detail-section-title">✅ Positives (${positives.length})</div>
                        ${positives.map(p => `
                            <div class="insight-item positive">
                                <div class="insight-text">${p.text}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Replacement suggestions (if sell/monitor)
            if (verdict !== 'hold') {
                const replacements = findReplacements(player);
                if (replacements.length > 0) {
                    detailHtml += `
                        <div class="detail-section">
                            <div class="detail-section-title">🔄 Replacement Options</div>
                            ${replacements.map((r, i) => `
                                <div class="replacement-card">
                                    <div class="replacement-rank">${i + 1}</div>
                                    <div class="replacement-info">
                                        <div class="replacement-name">${r.name}</div>
                                        <div class="replacement-meta">${r.team} • £${r.price.toFixed(1)}m</div>
                                    </div>
                                    <div class="replacement-stats">
                                        <div class="replacement-primary">${r.form.toFixed(1)}</div>
                                        <div class="replacement-secondary">Form</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }

            document.getElementById('detailBody').innerHTML = detailHtml;
            document.getElementById('detailOverlay').classList.add('show');
        }

        function closeDetailPanel(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('detailOverlay').classList.remove('show');
        }

        function findReplacements(player) {
            // Find players in same position, similar price, better form/fixtures
            const maxPrice = player.price + 1.0;
            
            const candidates = allPlayers.filter(p => 
                p.position === player.position &&
                p.price <= maxPrice &&
                p.id !== player.id &&
                p.status === 'a' &&
                p.form > player.form
            );

            // Sort by form and fixture difficulty
            candidates.sort((a, b) => {
                const aScore = a.form * 2 - (a.fixtures?.[0]?.difficulty || 3);
                const bScore = b.form * 2 - (b.fixtures?.[0]?.difficulty || 3);
                return bScore - aScore;
            });

            return candidates.slice(0, 3);
        }

        // ===== SETTINGS =====
        function openSettings() {
            document.getElementById('settingsOverlay').classList.add('show');
        }

        function closeSettings(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('settingsOverlay').classList.remove('show');
        }

        function applyPreset(preset) {
            if (preset === 'aggressive') {
                userSettings = { blankTolerance: 3, fixtureWeight: 1.5, premiumPatience: 0.90, budgetHarshness: 1.2, minutesThreshold: 70 };
            } else if (preset === 'balanced') {
                userSettings = { blankTolerance: 4, fixtureWeight: 1.0, premiumPatience: 0.85, budgetHarshness: 1.1, minutesThreshold: 60 };
            } else if (preset === 'patient') {
                userSettings = { blankTolerance: 5, fixtureWeight: 0.5, premiumPatience: 0.75, budgetHarshness: 1.0, minutesThreshold: 50 };
            }

            localStorage.setItem('fpl_analysis_settings', JSON.stringify(userSettings));
            closeSettings();
            
            if (selectedPlayers.length > 0) {
                analyzeTeam();
            }

            updateStatus(`${preset.charAt(0).toUpperCase() + preset.slice(1)} settings applied`, 'success');
        }

        // ===== INITIALIZATION =====
        window.addEventListener('load', () => {
            // Load saved settings
            const savedSettings = localStorage.getItem('fpl_analysis_settings');
            if (savedSettings) {
                userSettings = JSON.parse(savedSettings);
            }

            // Load saved team ID
            const savedTeamId = localStorage.getItem('fpl_team_id');
            if (savedTeamId) {
                document.getElementById('teamIdInput').value = savedTeamId;
            }
        });

        // Enter key to load team
        document.getElementById('teamIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadTeamById();
        });
    </script>
</body>
</html>
