    <script>
        // ===== CONFIGURATION =====
        const WORKER_URL = 'https://fpl-proxy.jguilhermealexandre.workers.dev';
        
        const POSITION_CONFIG = {
            1: { name: 'Goalkeeper', short: 'GK', class: 'gk', formMedian: 3.0 },
            2: { name: 'Defender', short: 'DEF', class: 'def', formMedian: 3.5 },
            3: { name: 'Midfielder', short: 'MID', class: 'mid', formMedian: 4.0 },
            4: { name: 'Forward', short: 'FWD', class: 'fwd', formMedian: 4.5 }
        };

        // ===== STATE =====
        let allPlayers = [], allPlayersById = {}, teams = {}, teamFixtures = {};
        let currentGW = 1, selectedPlayers = [], managerData = null, picksData = null, analysisResults = [];
        let positionAverages = {};

        let userSettings = {
            sellSensitivity: 1.0,   // multiplier for sell rating (>1 = aggressive, <1 = patient)
            fixtureWeight: 1.0,     // how much fixtures matter
            formWeight: 1.0,        // how much form matters
            valueWeight: 1.0,       // how much value-for-money matters
            minutesThreshold: 60,   // minutes per game to worry
            premiumHarshness: 1.0   // extra scrutiny on expensive players
        };

        // ===== UTILITY FUNCTIONS =====
        async function fetchWithProxy(url) {
            const apiPath = url.replace('https://fantasy.premierleague.com/', '');
            const proxyUrl = `${WORKER_URL}/${apiPath}`;
            
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            
            try {
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeout);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            } catch (e) {
                clearTimeout(timeout);
                throw new Error('Failed to fetch from FPL API');
            }
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function showLoading(show, text) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
            if (text) document.getElementById('loadingText').textContent = text;
        }

        function computePositionAverages() {
            positionAverages = {};
            [1, 2, 3, 4].forEach(pos => {
                const posPlayers = allPlayers.filter(p => p.position === pos && p.minutes >= 200);
                if (posPlayers.length === 0) { positionAverages[pos] = { form: 3, ppg: 3, ppm: 15, xGIPer90: 0.3 }; return; }
                const avg = (arr, fn) => arr.reduce((s, p) => s + fn(p), 0) / arr.length;
                positionAverages[pos] = {
                    form: avg(posPlayers, p => p.form),
                    ppg: avg(posPlayers, p => p.ppg),
                    ppm: avg(posPlayers, p => p.points / Math.max(p.price, 1)),
                    xGIPer90: avg(posPlayers, p => p.minutes > 0 ? (p.xGI / p.minutes) * 90 : 0)
                };
            });
        }

        // ===== DATA LOADING =====
        async function loadTeamById() {
            const teamId = document.getElementById('teamIdInput').value.trim();
            if (!teamId || isNaN(teamId)) { updateStatus('Please enter a valid Team ID', 'error'); return; }

            const btn = document.getElementById('loadTeamBtn');
            btn.disabled = true; btn.textContent = 'Loading...';
            showLoading(true, 'Loading FPL data...');

            try {
                // Load bootstrap + fixtures in parallel
                const [bootData, fixturesData] = await Promise.all([
                    fetch('data/bootstrap-static.json').then(r => { if (!r.ok) throw new Error('Data load failed'); return r.json(); }),
                    fetch('data/fixtures.json').then(r => { if (!r.ok) throw new Error('Fixtures load failed'); return r.json(); })
                ]);

                teams = {};
                bootData.teams.forEach(t => { teams[t.id] = t; });
                const currEvent = bootData.events.find(e => e.is_current);
                currentGW = currEvent ? currEvent.id : 1;
                processFixtures(fixturesData);

                // Build players with ALL available data
                allPlayers = bootData.elements.map(p => ({
                    id: p.id, name: p.web_name, fullName: `${p.first_name} ${p.second_name}`,
                    team: teams[p.team]?.short_name || 'N/A', teamId: p.team,
                    position: p.element_type, price: p.now_cost / 10,
                    form: parseFloat(p.form) || 0, points: p.total_points,
                    ppg: parseFloat(p.points_per_game) || 0,
                    ownership: parseFloat(p.selected_by_percent) || 0,
                    status: p.status, news: p.news,
                    chanceNextRound: p.chance_of_playing_next_round,
                    minutes: p.minutes, starts: p.starts || 0,
                    goals: p.goals_scored, assists: p.assists,
                    cleanSheets: p.clean_sheets, goalsConceded: p.goals_conceded || 0,
                    xG: parseFloat(p.expected_goals) || 0, xA: parseFloat(p.expected_assists) || 0,
                    xGI: parseFloat(p.expected_goal_involvements) || 0,
                    xGC: parseFloat(p.expected_goals_conceded) || 0,
                    ictIndex: parseFloat(p.ict_index) || 0,
                    influence: parseFloat(p.influence) || 0,
                    creativity: parseFloat(p.creativity) || 0,
                    threat: parseFloat(p.threat) || 0,
                    bonus: p.bonus, bps: p.bps,
                    yellowCards: p.yellow_cards, redCards: p.red_cards,
                    saves: p.saves || 0,
                    transfersIn: p.transfers_in_event || 0,
                    transfersOut: p.transfers_out_event || 0,
                    epNext: parseFloat(p.ep_next) || 0,
                    dreamteamCount: p.dreamteam_count || 0,
                    valueForm: parseFloat(p.value_form) || 0,
                    valueSeason: parseFloat(p.value_season) || 0,
                    fixtures: teamFixtures[p.team] || []
                }));

                allPlayersById = {};
                allPlayers.forEach(p => allPlayersById[p.id] = p);
                computePositionAverages();

                // Fetch manager + picks in parallel
                showLoading(true, `Loading team for GW${currentGW}...`);
                const [mgrRes, picksRes] = await Promise.all([
                    fetchWithProxy(`https://fantasy.premierleague.com/api/entry/${teamId}/`),
                    fetchWithProxy(`https://fantasy.premierleague.com/api/entry/${teamId}/event/${currentGW}/picks/`)
                ]);
                managerData = await mgrRes.json();
                picksData = await picksRes.json();

                selectedPlayers = picksData.picks.map(pick => {
                    const player = allPlayersById[pick.element];
                    if (!player) return null;
                    return { ...player, isCaptain: pick.is_captain, isVice: pick.is_vice_captain,
                        onBench: pick.position > 11, pickPosition: pick.position,
                        sellPrice: pick.selling_price / 10, multiplier: pick.multiplier };
                }).filter(p => p !== null);

                document.getElementById('managerInfo').classList.remove('hidden');
                document.getElementById('managerName').textContent = `${managerData.player_first_name} ${managerData.player_last_name}`;
                document.getElementById('overallRank').textContent = managerData.summary_overall_rank?.toLocaleString() || '-';
                document.getElementById('totalPoints').textContent = managerData.summary_overall_points?.toLocaleString() || '-';
                document.getElementById('bankValue').textContent = `£${(picksData.entry_history?.bank / 10 || 0).toFixed(1)}m`;

                localStorage.setItem('fpl_team_id', teamId);
                showLoading(true, 'Running analysis...');
                analyzeTeam();
            } catch (error) {
                console.error('Error loading team:', error);
                updateStatus(error.message || 'Failed to load team', 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Load Team';
                showLoading(false);
            }
        }

        function processFixtures(fixturesData) {
            teamFixtures = {};
            
            const upcoming = fixturesData
                .filter(f => !f.finished && f.event !== null)
                .sort((a, b) => a.event - b.event);

            Object.keys(teams).forEach(teamId => {
                const tid = parseInt(teamId);
                const teamFix = upcoming
                    .filter(f => f.team_h === tid || f.team_a === tid)
                    .slice(0, 5);

                teamFixtures[tid] = teamFix.map(f => {
                    const isHome = f.team_h === tid;
                    return {
                        opponent: isHome ? teams[f.team_a]?.short_name : teams[f.team_h]?.short_name,
                        opponentId: isHome ? f.team_a : f.team_h,
                        difficulty: isHome ? f.team_h_difficulty : f.team_a_difficulty,
                        isHome: isHome,
                        event: f.event
                    };
                });
            });
        }

        // ===== ENHANCED ANALYSIS ENGINE =====
        function analyzeTeam() {
            if (selectedPlayers.length === 0) { updateStatus('No players loaded', 'error'); return; }
            analysisResults = selectedPlayers.map(player => analyzePlayer(player));
            analysisResults.sort((a, b) => b.sellRating - a.sellRating);
            renderTeamAnalysis();
            updateStatus(`Analysis complete — GW${currentGW}`, 'success');
        }

        function analyzePlayer(player) {
            let sellRating = 0;
            let reasons = [], concerns = [], positives = [];
            const posAvg = positionAverages[player.position] || { form: 3, ppg: 3, ppm: 15, xGIPer90: 0.3 };
            const posConfig = POSITION_CONFIG[player.position];
            const gamesPlayed = Math.max(currentGW - 1, 1);
            const minsPerGame = player.minutes / gamesPlayed;
            const isPremium = player.price >= 10.0;
            const isBudget = player.price <= 5.5;

            // 1. AVAILABILITY (Critical)
            if (player.status === 'i' || player.status === 'u' || player.status === 's') {
                const penalty = player.status === 's' ? 55 : 60;
                sellRating += penalty * userSettings.sellSensitivity;
                const statusText = player.status === 'i' ? 'Injured' : player.status === 'u' ? 'Unavailable' : 'Suspended';
                concerns.push({ type: 'critical', title: statusText, text: player.news || 'Check team news for updates' });
                reasons.push(`${statusText} — cannot play`);
            } else if (player.status === 'd') {
                const chance = player.chanceNextRound;
                const penalty = chance !== null ? Math.round((100 - chance) * 0.4) : 25;
                sellRating += penalty * userSettings.sellSensitivity;
                concerns.push({ type: 'warning', title: 'Doubtful', text: `${chance !== null ? chance + '% chance' : '75% chance'} of playing. ${player.news || ''}` });
                if (penalty >= 25) reasons.push('Significant injury doubt');
            }

            // 2. FORM (Position-adjusted thresholds)
            const formDelta = player.form - posConfig.formMedian;
            const formPenalty = (() => {
                if (formDelta <= -2.5) return 28;
                if (formDelta <= -1.5) return 18;
                if (formDelta <= -0.5) return 8;
                if (formDelta >= 2.5) return -20;
                if (formDelta >= 1.5) return -12;
                if (formDelta >= 0.5) return -5;
                return 0;
            })() * userSettings.formWeight * userSettings.sellSensitivity;
            sellRating += formPenalty;

            if (formDelta <= -2.0) {
                concerns.push({ type: 'critical', title: 'Poor Form', text: `Form ${player.form.toFixed(1)} is well below ${posConfig.short} average of ${posConfig.formMedian}` });
                reasons.push('Form collapsed');
            } else if (formDelta <= -1.0) {
                concerns.push({ type: 'warning', title: 'Below Average Form', text: `Form ${player.form.toFixed(1)} vs ${posConfig.short} median ${posConfig.formMedian}` });
            } else if (formDelta >= 2.5) {
                positives.push({ type: 'positive', title: 'Elite Form', text: `Form ${player.form.toFixed(1)} — top tier for ${posConfig.short}s` });
            } else if (formDelta >= 1.0) {
                positives.push({ type: 'positive', title: 'Good Form', text: `Form ${player.form.toFixed(1)} — above average` });
            }

            // 3. FIXTURES (Weighted — near fixtures matter more)
            const fixtures = player.fixtures || [];
            let avgFDR = 3;
            if (fixtures.length >= 3) {
                const weights = [3, 2.5, 2, 1.5, 1];
                let totalWeight = 0, weightedSum = 0;
                fixtures.slice(0, 5).forEach((f, i) => {
                    const w = weights[i] || 1;
                    weightedSum += f.difficulty * w;
                    totalWeight += w;
                });
                avgFDR = weightedSum / totalWeight;

                const fixPenalty = (() => {
                    if (avgFDR >= 4.2) return 22;
                    if (avgFDR >= 3.7) return 14;
                    if (avgFDR >= 3.2) return 5;
                    if (avgFDR <= 2.3) return -18;
                    if (avgFDR <= 2.8) return -8;
                    return 0;
                })() * userSettings.fixtureWeight * userSettings.sellSensitivity;
                sellRating += fixPenalty;

                if (avgFDR >= 4.0) {
                    concerns.push({ type: 'warning', title: 'Tough Fixtures', text: `Weighted FDR ${avgFDR.toFixed(1)} — difficult run ahead` });
                    reasons.push('Brutal fixture run');
                } else if (avgFDR <= 2.5) {
                    positives.push({ type: 'positive', title: 'Great Fixtures', text: `Weighted FDR ${avgFDR.toFixed(1)} — fantastic fixture swing` });
                } else if (avgFDR <= 3.0) {
                    positives.push({ type: 'positive', title: 'Decent Fixtures', text: `Weighted FDR ${avgFDR.toFixed(1)}` });
                }
            }
            player.avgFDR = avgFDR;

            // 4. MINUTES & ROTATION
            const minsPenalty = (() => {
                if (minsPerGame < 30) return 35;
                if (minsPerGame < 50) return 25;
                if (minsPerGame < userSettings.minutesThreshold) return 15;
                if (minsPerGame >= 85) return -8;
                if (minsPerGame >= 75) return -3;
                return 0;
            })() * userSettings.sellSensitivity;
            sellRating += minsPenalty;
            player.minsPerGame = minsPerGame;

            if (minsPerGame < 45) {
                concerns.push({ type: 'critical', title: 'Rotation Risk', text: `Only ${minsPerGame.toFixed(0)} mins/game (${player.starts} starts in ${gamesPlayed} GWs)` });
                reasons.push('Not starting regularly');
            } else if (minsPerGame < 60) {
                concerns.push({ type: 'warning', title: 'Reduced Minutes', text: `${minsPerGame.toFixed(0)} mins/game — some rotation` });
            } else if (minsPerGame >= 85) {
                positives.push({ type: 'positive', title: 'Nailed On', text: `${minsPerGame.toFixed(0)} mins/game — consistent starter` });
            }

            // 5. VALUE FOR MONEY (Points per Million)
            const ppm = player.points / Math.max(player.price, 1);
            const ppmDelta = ppm - posAvg.ppm;
            player.ppm = ppm;

            const valuePenalty = (() => {
                if (isPremium && ppmDelta < -5) return 18;
                if (isPremium && ppmDelta < -2) return 10;
                if (!isBudget && ppmDelta < -5) return 12;
                if (ppmDelta > 5) return -8;
                if (ppmDelta > 2) return -4;
                return 0;
            })() * userSettings.valueWeight * userSettings.premiumHarshness * userSettings.sellSensitivity;
            sellRating += valuePenalty;

            if (isPremium && player.form < posConfig.formMedian) {
                concerns.push({ type: 'warning', title: 'Premium Underperforming', text: `£${player.price.toFixed(1)}m price tag not justified (${ppm.toFixed(1)} pts/£m vs avg ${posAvg.ppm.toFixed(1)})` });
                if (!reasons.length) reasons.push('Premium not delivering');
            } else if (ppmDelta > 3) {
                positives.push({ type: 'positive', title: 'Great Value', text: `${ppm.toFixed(1)} pts/£m — well above ${posConfig.short} average (${posAvg.ppm.toFixed(1)})` });
            }

            // 6. xG ANALYSIS
            if (player.position >= 3 && player.minutes >= 270) {
                const xGIPer90 = (player.xGI / player.minutes) * 90;
                const actualGI = player.goals + player.assists;
                const overperformance = actualGI - player.xGI;
                player.xGIPer90 = xGIPer90;

                if (xGIPer90 < 0.20) {
                    sellRating += 12 * userSettings.sellSensitivity;
                    concerns.push({ type: 'warning', title: 'Low Underlying Stats', text: `${xGIPer90.toFixed(2)} xGI/90 — not creating enough` });
                } else if (xGIPer90 >= 0.60) {
                    sellRating -= 10;
                    positives.push({ type: 'positive', title: 'Strong xGI', text: `${xGIPer90.toFixed(2)} xGI/90 — high-quality chances` });
                }

                if (overperformance > 3) {
                    sellRating += 8 * userSettings.sellSensitivity;
                    concerns.push({ type: 'info', title: 'Overperforming xG', text: `${actualGI} G+A vs ${player.xGI.toFixed(1)} xGI — may regress (+${overperformance.toFixed(1)})` });
                } else if (overperformance < -3) {
                    positives.push({ type: 'positive', title: 'Due Returns', text: `${actualGI} G+A vs ${player.xGI.toFixed(1)} xGI — unlucky, due a haul (${overperformance.toFixed(1)})` });
                    sellRating -= 5;
                }
            } else if (player.position <= 2 && player.minutes >= 270) {
                const csRate = player.cleanSheets / gamesPlayed;
                player.csRate = csRate;
                if (csRate >= 0.40) {
                    positives.push({ type: 'positive', title: 'CS Machine', text: `${(csRate * 100).toFixed(0)}% clean sheet rate` });
                } else if (csRate <= 0.15 && !isBudget) {
                    concerns.push({ type: 'warning', title: 'Few Clean Sheets', text: `Only ${(csRate * 100).toFixed(0)}% CS rate` });
                    sellRating += 8;
                }
                player.xGIPer90 = player.position === 1 ? (player.saves / Math.max(player.minutes / 90, 1)) : ((player.xGI / Math.max(player.minutes, 1)) * 90);
            }

            // 7. OWNERSHIP URGENCY
            if (player.ownership > 25 && sellRating > 40) {
                sellRating += 5;
                concerns.push({ type: 'info', title: 'High Ownership Risk', text: `${player.ownership.toFixed(1)}% owned — price drop risk if others sell` });
            } else if (player.ownership < 8 && sellRating < 10) {
                positives.push({ type: 'positive', title: 'Differential', text: `Only ${player.ownership.toFixed(1)}% owned — great differential pick` });
            }

            const netTransfers = player.transfersIn - player.transfersOut;
            player.netTransfers = netTransfers;

            // 8. BENCH DISCOUNT
            if (player.onBench) {
                sellRating = Math.round(sellRating * 0.55);
            }

            sellRating = Math.max(0, Math.min(100, Math.round(sellRating)));

            // VERDICT
            let verdict, verdictReason;
            if (sellRating >= 55) {
                verdict = 'sell';
                verdictReason = reasons[0] || 'Multiple red flags — prioritize transfer';
            } else if (sellRating >= 30) {
                verdict = 'monitor';
                verdictReason = reasons[0] || 'Some concerns — monitor closely';
            } else if (sellRating <= 8 && player.form >= posConfig.formMedian + 1.5 && minsPerGame >= 75) {
                verdict = 'star';
                verdictReason = positives.length > 0 ? positives[0].text : 'Top performer — team cornerstone';
            } else {
                verdict = 'hold';
                verdictReason = positives.length > 0 ? positives[0].text : 'Performing as expected';
            }

            const keyMetric = buildKeyMetrics(player, posConfig, minsPerGame, avgFDR);
            return { player, sellRating, verdict, verdictReason, concerns, positives, keyMetric, fixtures: fixtures.slice(0, 5) };
        }

        function buildKeyMetrics(player, posConfig, minsPerGame, avgFDR) {
            const form = player.form;
            if (player.position <= 2) {
                return {
                    primary: { label: 'Form', value: form.toFixed(1), status: form >= posConfig.formMedian + 1 ? 'good' : form < posConfig.formMedian - 0.5 ? 'bad' : 'warning' },
                    secondary: { label: 'FDR', value: avgFDR.toFixed(1), status: avgFDR <= 2.8 ? 'good' : avgFDR >= 3.5 ? 'bad' : 'warning' },
                    tertiary: { label: 'PPG', value: player.ppg.toFixed(1), status: player.ppg >= 5 ? 'good' : player.ppg < 3 ? 'bad' : 'neutral' },
                    quaternary: { label: 'Mins', value: minsPerGame.toFixed(0), status: minsPerGame >= 80 ? 'good' : minsPerGame < 60 ? 'bad' : 'warning' }
                };
            } else {
                const xGIPer90 = player.xGIPer90 || (player.minutes > 0 ? (player.xGI / player.minutes) * 90 : 0);
                return {
                    primary: { label: 'Form', value: form.toFixed(1), status: form >= posConfig.formMedian + 1.5 ? 'good' : form < posConfig.formMedian - 0.5 ? 'bad' : 'warning' },
                    secondary: { label: 'xGI/90', value: xGIPer90.toFixed(2), status: xGIPer90 >= 0.50 ? 'good' : xGIPer90 < 0.25 ? 'bad' : 'warning' },
                    tertiary: { label: 'FDR', value: avgFDR.toFixed(1), status: avgFDR <= 2.8 ? 'good' : avgFDR >= 3.5 ? 'bad' : 'warning' },
                    quaternary: { label: 'PPG', value: player.ppg.toFixed(1), status: player.ppg >= 5 ? 'good' : player.ppg < 3 ? 'bad' : 'neutral' }
                };
            }
        }

        // ===== RENDERING =====
        function renderTeamAnalysis() {
            const sells = analysisResults.filter(a => a.verdict === 'sell');
            const monitors = analysisResults.filter(a => a.verdict === 'monitor');
            const stars = analysisResults.filter(a => a.verdict === 'star');
            const holds = analysisResults.filter(a => a.verdict === 'hold');

            // Calculate team health score
            const starters = analysisResults.filter(a => !a.player.onBench);
            const bench = analysisResults.filter(a => a.player.onBench);
            const starterHealth = starters.reduce((s, a) => s + (100 - a.sellRating), 0) / Math.max(starters.length, 1);
            const benchHealth = bench.reduce((s, a) => s + (100 - a.sellRating), 0) / Math.max(bench.length, 1);
            const teamHealth = Math.round(starterHealth * 0.85 + benchHealth * 0.15);

            // Find best transfer recommendation
            const topSell = sells[0] || monitors[0];
            let topReplacement = null;
            if (topSell) {
                const replacements = findReplacements(topSell.player, 1);
                topReplacement = replacements[0] || null;
            }

            let html = '';
            html += renderTeamOverview(teamHealth, sells, monitors, holds, stars);

            // Transfer recommendation
            if (topSell && topReplacement) {
                html += renderTransferRecommendation(topSell, topReplacement);
            }

            // Sell section
            if (sells.length > 0) {
                html += renderVerdictSection('sell', 'Action Required', sells, true);
            }
            if (monitors.length > 0) {
                html += renderVerdictSection('monitor', 'Keep Watching', monitors, true);
            }
            if (stars.length > 0) {
                html += renderVerdictSection('star', 'Star Performers', stars, false);
            }
            if (holds.length > 0) {
                html += renderVerdictSection('hold', 'Solid Squad', holds, false);
            }

            document.getElementById('teamDisplay').innerHTML = html;
            document.getElementById('status').style.display = 'none';

            // Animate health ring
            requestAnimationFrame(() => {
                const fill = document.getElementById('healthRingFill');
                if (fill) {
                    const circumference = 2 * Math.PI * 54;
                    const offset = circumference * (1 - teamHealth / 100);
                    fill.style.strokeDashoffset = offset;
                }
            });
        }

        function renderTeamOverview(health, sells, monitors, holds, stars) {
            const circumference = 2 * Math.PI * 54;
            const healthColor = health >= 75 ? 'var(--verdict-hold)' : health >= 50 ? 'var(--verdict-monitor)' : 'var(--verdict-sell)';
            const healthText = health >= 85 ? 'Excellent' : health >= 70 ? 'Good Shape' : health >= 55 ? 'Needs Work' : health >= 40 ? 'Concerning' : 'Overhaul Needed';

            const startersSorted = analysisResults.filter(a => !a.player.onBench).sort((a, b) => a.player.pickPosition - b.player.pickPosition);
            const benchPlayers = analysisResults.filter(a => a.player.onBench).sort((a, b) => a.player.pickPosition - b.player.pickPosition);
            const gks = startersSorted.filter(a => a.player.position === 1);
            const defs = startersSorted.filter(a => a.player.position === 2);
            const mids = startersSorted.filter(a => a.player.position === 3);
            const fwds = startersSorted.filter(a => a.player.position === 4);

            const pitchNode = (a) => {
                const p = a.player;
                const injured = p.status === 'i' || p.status === 'u';
                return `<div class="pitch-player" onclick="openDetailPanel(${p.id})">
                    <div class="pitch-player-node ${a.verdict} ${injured ? 'injured' : ''}">
                        ${p.team}
                        ${p.isCaptain ? '<span class="captain-badge">C</span>' : ''}
                        ${p.isVice ? '<span class="captain-badge" style="background:var(--text-muted);color:white;">V</span>' : ''}
                    </div>
                    <div class="pitch-player-name">${p.name}</div>
                    <div class="pitch-player-pts">${p.form}</div>
                </div>`;
            };
            const benchNode = (a) => {
                const p = a.player;
                return `<div class="pitch-player" onclick="openDetailPanel(${p.id})" style="opacity:0.7;">
                    <div class="pitch-player-node ${a.verdict}" style="width:36px;height:36px;font-size:9px;">${p.team}</div>
                    <div class="pitch-player-name">${p.name}</div>
                </div>`;
            };

            return `
            <div class="team-overview">
                <div class="health-ring-container">
                    <div class="health-ring">
                        <svg viewBox="0 0 120 120">
                            <circle class="health-ring-track" cx="60" cy="60" r="54"/>
                            <circle class="health-ring-fill" id="healthRingFill" cx="60" cy="60" r="54"
                                stroke="${healthColor}" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"
                                style="transform:rotate(-90deg);transform-origin:center;"/>
                            <text x="60" y="55" text-anchor="middle" fill="${healthColor}" font-size="30" font-weight="700" font-family="var(--font-mono)">${health}</text>
                            <text x="60" y="72" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-weight="600">HEALTH</text>
                        </svg>
                    </div>
                    <div class="health-sublabel">${healthText}</div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
                        ${sells.length ? `<span style="font-size:12px;color:var(--verdict-sell);font-weight:600;">\u25cf ${sells.length} Sell</span>` : ''}
                        ${monitors.length ? `<span style="font-size:12px;color:var(--verdict-monitor);font-weight:600;">\u25cf ${monitors.length} Monitor</span>` : ''}
                        ${stars.length ? `<span style="font-size:12px;color:var(--verdict-star);font-weight:600;">\u2605 ${stars.length} Star</span>` : ''}
                        <span style="font-size:12px;color:var(--verdict-hold);font-weight:600;">\u25cf ${holds.length} Hold</span>
                    </div>
                </div>
                <div class="pitch-container">
                    <div class="pitch-rows">
                        <div class="pitch-row">${fwds.map(pitchNode).join('')}</div>
                        <div class="pitch-row">${mids.map(pitchNode).join('')}</div>
                        <div class="pitch-row">${defs.map(pitchNode).join('')}</div>
                        <div class="pitch-row">${gks.map(pitchNode).join('')}</div>
                        <div class="pitch-row bench-row">
                            <span class="bench-label">Bench</span>
                            ${benchPlayers.map(benchNode).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderTransferRecommendation(topSell, replacement) {
            const p = topSell.player;
            const bank = (picksData?.entry_history?.bank || 0) / 10;
            const savings = (p.sellPrice - replacement.price + bank).toFixed(1);
            const isPositive = parseFloat(savings) >= 0;
            return `
            <div class="transfer-rec">
                <div class="transfer-rec-header">
                    <span style="font-size:20px;">\u26a1</span>
                    <span class="transfer-rec-title">Top Transfer Recommendation</span>
                </div>
                <div class="transfer-rec-body">
                    <div class="transfer-player-out" onclick="openDetailPanel(${p.id})" style="cursor:pointer;">
                        <div class="transfer-dir out">Transfer Out</div>
                        <div class="transfer-name">${p.name}</div>
                        <div class="transfer-meta">${p.team} \u00b7 \u00a3${p.sellPrice.toFixed(1)}m \u00b7 Form ${p.form.toFixed(1)}</div>
                    </div>
                    <div class="transfer-arrow">\u2192</div>
                    <div class="transfer-player-in">
                        <div class="transfer-dir in">Transfer In</div>
                        <div class="transfer-name">${replacement.name}</div>
                        <div class="transfer-meta">${replacement.team} \u00b7 \u00a3${replacement.price.toFixed(1)}m \u00b7 Form ${replacement.form.toFixed(1)}</div>
                    </div>
                    <div class="transfer-savings">
                        <div class="transfer-savings-val" style="color:${isPositive ? 'var(--color-success)' : 'var(--color-error)'}">
                            ${isPositive ? '+' : ''}\u00a3${savings}m
                        </div>
                        <div class="transfer-savings-label">${isPositive ? 'Freed Up' : 'Extra Cost'}</div>
                    </div>
                </div>
            </div>`;
        }

        function renderVerdictSection(type, title, items, useFullCards) {
            const labels = { sell: '\ud83d\udd34', monitor: '\ud83d\udfe1', hold: '\ud83d\udfe2', star: '\u2b50' };
            return `
            <div class="verdict-section">
                <div class="verdict-header" onclick="toggleSection('${type}-section')">
                    <span class="verdict-badge ${type}">${labels[type]} ${type === 'star' ? 'Star' : type.charAt(0).toUpperCase() + type.slice(1)}</span>
                    <span class="verdict-title">${title}</span>
                    <span class="verdict-count">${items.length} player${items.length > 1 ? 's' : ''}</span>
                    <span class="verdict-toggle" id="${type}-section-toggle">\u25bc</span>
                </div>
                ${useFullCards
                    ? `<div class="players-grid" id="${type}-section">${items.map(a => renderPlayerCard(a)).join('')}</div>`
                    : `<div class="hold-grid" id="${type}-section">${items.map(a => renderHoldCard(a)).join('')}</div>`
                }
            </div>`;
        }

        function renderPlayerCard(analysis) {
            const { player, verdict, verdictReason, keyMetric, fixtures } = analysis;
            const posConfig = POSITION_CONFIG[player.position];
            const formPct = Math.min((player.form / 10) * 100, 100);
            const formClass = player.form >= posConfig.formMedian + 1.5 ? 'star' : player.form >= posConfig.formMedian + 0.5 ? 'good' : player.form < posConfig.formMedian - 0.5 ? 'bad' : 'warning';
            const fixtureChips = fixtures.slice(0, 5).map(f => `
                <div class="fixture-chip fdr-${f.difficulty}">
                    <span class="fixture-team">${f.opponent}</span>
                    <span class="fixture-venue">${f.isHome ? 'H' : 'A'}</span>
                </div>`).join('');

            return `
            <div class="player-card ${verdict}" onclick="openDetailPanel(${player.id})">
                <div class="card-top">
                    <div class="player-info">
                        <div class="player-name">${player.isCaptain ? '\ud83d\udc51 ' : ''}${player.name}</div>
                        <div class="player-meta">
                            <span class="position-badge ${posConfig.class}">${posConfig.short}</span>
                            <span>${player.team}</span>
                            <span>\u00a3${player.price.toFixed(1)}m</span>
                            ${player.onBench ? '<span class="on-bench-tag">Bench</span>' : ''}
                        </div>
                    </div>
                    <div class="verdict-chip ${verdict}">${verdict === 'star' ? '\u2605 Star' : verdict}</div>
                </div>
                <div class="verdict-reason">${verdictReason}</div>
                <div class="form-bar-container">
                    <div class="form-bar-label"><span>Form</span><span>${player.form.toFixed(1)}</span></div>
                    <div class="form-bar"><div class="form-bar-fill ${formClass}" style="width:${formPct}%"></div></div>
                </div>
                <div class="key-metrics">
                    ${Object.values(keyMetric).map(m => `
                        <div class="metric-box">
                            <div class="metric-label">${m.label}</div>
                            <div class="metric-value ${m.status}">${m.value}</div>
                        </div>`).join('')}
                </div>
                <div class="fixture-strip">${fixtureChips}</div>
            </div>`;
        }

        function renderHoldCard(analysis) {
            const { player, verdict, keyMetric } = analysis;
            const posConfig = POSITION_CONFIG[player.position];
            return `
            <div class="hold-card ${verdict === 'star' ? 'star' : 'hold-v'}" onclick="openDetailPanel(${player.id})">
                <div class="hold-player-info">
                    <div class="player-name">${player.isCaptain ? '\ud83d\udc51 ' : ''}${player.name}</div>
                    <div class="player-meta">
                        <span class="position-badge ${posConfig.class}">${posConfig.short}</span>
                        ${player.team} \u00b7 \u00a3${player.price.toFixed(1)}m
                        ${player.onBench ? ' <span class="on-bench-tag">Bench</span>' : ''}
                    </div>
                </div>
                <div class="hold-stats">
                    <div class="hold-stat">
                        <div class="val ${verdict === 'star' ? 'star' : 'good'}">${keyMetric.primary.value}</div>
                        <div class="lbl">Form</div>
                    </div>
                    <div class="hold-stat">
                        <div class="val ${keyMetric.tertiary.status}">${keyMetric.tertiary.value}</div>
                        <div class="lbl">${keyMetric.tertiary.label}</div>
                    </div>
                </div>
            </div>`;
        }

        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const toggle = document.getElementById(sectionId + '-toggle');
            
            if (section.style.display === 'none') {
                section.style.display = '';
                toggle.classList.remove('open');
                toggle.textContent = '▼';
            } else {
                section.style.display = 'none';
                toggle.classList.add('open');
                toggle.textContent = '▶';
            }
        }

        // ===== DETAIL PANEL =====
        function openDetailPanel(playerId) {
            const analysis = analysisResults.find(a => a.player.id === playerId);
            if (!analysis) return;
            const { player, verdict, verdictReason, concerns, positives, sellRating, keyMetric, fixtures } = analysis;
            const posConfig = POSITION_CONFIG[player.position];
            const gamesPlayed = Math.max(currentGW - 1, 1);
            const minsPerGame = player.minsPerGame || (player.minutes / gamesPlayed);
            const xGIPer90 = player.xGIPer90 || (player.minutes > 0 ? (player.xGI / player.minutes) * 90 : 0);

            document.getElementById('detailPlayerName').textContent = `${player.isCaptain ? '\ud83d\udc51 ' : ''}${player.name}`;
            document.getElementById('detailPlayerMeta').innerHTML = `
                <span class="position-badge ${posConfig.class}">${posConfig.short}</span>
                ${player.team} \u00b7 \u00a3${player.price.toFixed(1)}m \u00b7 ${player.ownership.toFixed(1)}% owned
            `;

            let html = '';

            // Verdict banner
            html += `<div class="detail-section">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                    <div class="verdict-chip ${verdict}" style="font-size:13px;padding:6px 14px;">${verdict === 'star' ? '\u2605 STAR' : verdict.toUpperCase()}</div>
                    <div style="font-size:14px;color:var(--text-secondary);flex:1;">${verdictReason}</div>
                </div>
                <div style="font-size:11px;color:var(--text-muted);">Sell Rating: ${sellRating}/100 ${player.onBench ? '(bench-adjusted)' : ''}</div>
            </div>`;

            // Key Statistics with visual bars
            html += `<div class="detail-section">
                <div class="detail-section-title">\ud83d\udcca Key Statistics</div>
                <div class="detail-stats-grid">
                    ${renderDetailStat('Form', player.form.toFixed(1), player.form / 10, player.form >= 5 ? 'var(--verdict-hold)' : player.form < 3 ? 'var(--verdict-sell)' : 'var(--verdict-monitor)', `${posConfig.short} median: ${posConfig.formMedian}`)}
                    ${renderDetailStat('Pts/Game', player.ppg.toFixed(1), player.ppg / 10, player.ppg >= 5 ? 'var(--verdict-hold)' : player.ppg < 3 ? 'var(--verdict-sell)' : 'var(--text-primary)', `Total: ${player.points} pts`)}
                    ${renderDetailStat('Mins/Game', minsPerGame.toFixed(0), minsPerGame / 90, minsPerGame >= 80 ? 'var(--verdict-hold)' : minsPerGame < 60 ? 'var(--verdict-sell)' : 'var(--verdict-monitor)', `${player.starts} starts in ${gamesPlayed} GWs`)}
                    ${renderDetailStat('FDR', (player.avgFDR || 3).toFixed(1), 1 - ((player.avgFDR || 3) - 1) / 4, (player.avgFDR || 3) <= 2.8 ? 'var(--verdict-hold)' : (player.avgFDR || 3) >= 3.5 ? 'var(--verdict-sell)' : 'var(--text-primary)', 'Next 5 weighted avg')}
                    ${player.position >= 3 ? renderDetailStat('xGI/90', xGIPer90.toFixed(2), xGIPer90, xGIPer90 >= 0.5 ? 'var(--verdict-hold)' : xGIPer90 < 0.25 ? 'var(--verdict-sell)' : 'var(--text-primary)', `${player.goals}G ${player.assists}A (${player.xG.toFixed(1)}xG ${player.xA.toFixed(1)}xA)`) : ''}
                    ${renderDetailStat('Value', (player.ppm || 0).toFixed(1) + '/\u00a3m', Math.min((player.ppm || 0) / 30, 1), 'var(--color-info)', `Sell: \u00a3${(player.sellPrice || player.price).toFixed(1)}m`)}
                </div>
            </div>`;

            // Season numbers
            html += `<div class="detail-section">
                <div class="detail-section-title">\ud83d\udcc8 Season Numbers</div>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
                    ${player.position >= 3 ? `
                        <div class="metric-box"><div class="metric-label">Goals</div><div class="metric-value neutral">${player.goals}</div></div>
                        <div class="metric-box"><div class="metric-label">Assists</div><div class="metric-value neutral">${player.assists}</div></div>
                    ` : `
                        <div class="metric-box"><div class="metric-label">CS</div><div class="metric-value neutral">${player.cleanSheets}</div></div>
                        <div class="metric-box"><div class="metric-label">${player.position === 1 ? 'Saves' : 'Goals'}</div><div class="metric-value neutral">${player.position === 1 ? player.saves : player.goals}</div></div>
                    `}
                    <div class="metric-box"><div class="metric-label">Bonus</div><div class="metric-value neutral">${player.bonus}</div></div>
                    <div class="metric-box"><div class="metric-label">ICT</div><div class="metric-value neutral">${player.ictIndex.toFixed(0)}</div></div>
                </div>
                <div style="margin-top:8px;display:flex;gap:8px;">
                    <div class="metric-box" style="flex:1;"><div class="metric-label">Ownership</div><div class="metric-value neutral">${player.ownership.toFixed(1)}%</div></div>
                    <div class="metric-box" style="flex:1;"><div class="metric-label">Net Transfers</div><div class="metric-value ${(player.netTransfers||0) > 0 ? 'good' : (player.netTransfers||0) < -5000 ? 'bad' : 'neutral'}">${(player.netTransfers||0) > 0 ? '+' : ''}${((player.netTransfers||0) / 1000).toFixed(1)}k</div></div>
                    <div class="metric-box" style="flex:1;"><div class="metric-label">EP Next</div><div class="metric-value ${player.epNext >= 5 ? 'good' : 'neutral'}">${player.epNext.toFixed(1)}</div></div>
                </div>
            </div>`;

            // Concerns
            if (concerns.length > 0) {
                html += `<div class="detail-section">
                    <div class="detail-section-title">\u26a0\ufe0f Concerns (${concerns.length})</div>
                    ${concerns.map(c => `<div class="insight-item ${c.type}">
                        ${c.title ? `<div style="font-size:13px;font-weight:600;margin-bottom:4px;">${c.title}</div>` : ''}
                        <div class="insight-text">${c.text}</div>
                    </div>`).join('')}
                </div>`;
            }

            // Positives
            if (positives.length > 0) {
                html += `<div class="detail-section">
                    <div class="detail-section-title">\u2705 Positives (${positives.length})</div>
                    ${positives.map(p => `<div class="insight-item positive">
                        ${p.title ? `<div style="font-size:13px;font-weight:600;margin-bottom:4px;">${p.title}</div>` : ''}
                        <div class="insight-text">${p.text}</div>
                    </div>`).join('')}
                </div>`;
            }

            // Fixtures
            if (fixtures.length > 0) {
                html += `<div class="detail-section">
                    <div class="detail-section-title">\ud83d\udcc5 Upcoming Fixtures</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        ${fixtures.map(f => `
                            <div class="fixture-chip fdr-${f.difficulty}" style="flex:1;min-width:52px;padding:8px 4px;">
                                <span style="display:block;font-size:9px;color:rgba(255,255,255,0.5);">GW${f.event}</span>
                                <span class="fixture-team">${f.opponent}</span>
                                <span class="fixture-venue">${f.isHome ? 'H' : 'A'}</span>
                            </div>`).join('')}
                    </div>
                </div>`;
            }

            // Replacement suggestions (sell/monitor only)
            if (verdict === 'sell' || verdict === 'monitor') {
                const replacements = findReplacements(player, 5);
                if (replacements.length > 0) {
                    const best = replacements[0];
                    html += `<div class="detail-section">
                        <div class="detail-section-title">\ud83d\udd04 Best Replacement Comparison</div>
                        <table class="comparison-table">
                            <tr><th></th><th>Current</th><th>Replacement</th></tr>
                            <tr><td>Player</td><td class="current">${player.name}</td><td class="replacement">${best.name}</td></tr>
                            <tr class="${best.form > player.form ? 'better' : best.form < player.form ? 'worse' : ''}"><td>Form</td><td class="current">${player.form.toFixed(1)}</td><td class="replacement">${best.form.toFixed(1)}</td></tr>
                            <tr class="${best.ppg > player.ppg ? 'better' : best.ppg < player.ppg ? 'worse' : ''}"><td>PPG</td><td class="current">${player.ppg.toFixed(1)}</td><td class="replacement">${best.ppg.toFixed(1)}</td></tr>
                            <tr class="${(best._fdr || 3) < (player.avgFDR || 3) ? 'better' : ''}"><td>FDR</td><td class="current">${(player.avgFDR || 3).toFixed(1)}</td><td class="replacement">${(best._fdr || 3).toFixed(1)}</td></tr>
                            <tr class="${best.price < player.price ? 'better' : ''}"><td>Price</td><td class="current">\u00a3${player.price.toFixed(1)}m</td><td class="replacement">\u00a3${best.price.toFixed(1)}m</td></tr>
                        </table>
                    </div>`;

                    if (replacements.length > 1) {
                        html += `<div class="detail-section">
                            <div class="detail-section-title">Other Options</div>
                            ${replacements.slice(1).map((r, i) => `
                                <div class="replacement-card">
                                    <div class="replacement-rank">${i + 2}</div>
                                    <div class="replacement-info">
                                        <div class="replacement-name">${r.name}</div>
                                        <div class="replacement-meta">${r.team} \u00b7 \u00a3${r.price.toFixed(1)}m \u00b7 ${r.ownership.toFixed(1)}% owned</div>
                                    </div>
                                    <div class="replacement-stats">
                                        <div class="replacement-primary">${r.form.toFixed(1)}</div>
                                        <div class="replacement-secondary">Form</div>
                                    </div>
                                </div>`).join('')}
                        </div>`;
                    }
                }
            }

            document.getElementById('detailBody').innerHTML = html;
            document.getElementById('detailOverlay').classList.add('show');
        }

        function renderDetailStat(label, value, barPct, color, context) {
            const pct = Math.max(0, Math.min(100, barPct * 100));
            return `<div class="detail-stat">
                <div class="detail-stat-label">${label}</div>
                <div class="detail-stat-value" style="color:${color}">${value}</div>
                <div class="detail-stat-bar"><div class="detail-stat-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                ${context ? `<div class="detail-stat-context">${context}</div>` : ''}
            </div>`;
        }

        function closeDetailPanel(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('detailOverlay').classList.remove('show');
        }

        function findReplacements(player, count = 5) {
            const bank = (picksData?.entry_history?.bank || 0) / 10;
            const maxPrice = (player.sellPrice || player.price) + bank + 0.5;
            const candidates = allPlayers.filter(p =>
                p.position === player.position && p.price <= maxPrice && p.id !== player.id &&
                (p.status === 'a' || p.status === 'd') && p.minutes >= 100 &&
                !selectedPlayers.some(sp => sp.id === p.id)
            );

            // Composite scoring
            candidates.forEach(c => {
                const fdr = c.fixtures.length >= 3
                    ? c.fixtures.slice(0, 3).reduce((s, f) => s + f.difficulty, 0) / 3 : 3;
                c._score = (c.form * 3) + (c.ppg * 2.5) + (c.epNext * 2) + ((5 - fdr) * 2) + (c.ownership > 15 ? 1 : 0);
                c._fdr = fdr;
            });
            candidates.sort((a, b) => b._score - a._score);
            return candidates.slice(0, count);
        }

        // ===== SETTINGS =====
        function openSettings() {
            document.getElementById('settingsOverlay').classList.add('show');
        }

        function closeSettings(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('settingsOverlay').classList.remove('show');
        }

        function applyPreset(preset) {
            if (preset === 'aggressive') {
                userSettings = { sellSensitivity: 1.3, fixtureWeight: 1.4, formWeight: 1.2, valueWeight: 1.3, minutesThreshold: 70, premiumHarshness: 1.3 };
            } else if (preset === 'balanced') {
                userSettings = { sellSensitivity: 1.0, fixtureWeight: 1.0, formWeight: 1.0, valueWeight: 1.0, minutesThreshold: 60, premiumHarshness: 1.0 };
            } else if (preset === 'patient') {
                userSettings = { sellSensitivity: 0.7, fixtureWeight: 0.6, formWeight: 0.8, valueWeight: 0.8, minutesThreshold: 50, premiumHarshness: 0.7 };
            }

            localStorage.setItem('fpl_analysis_settings', JSON.stringify(userSettings));
            closeSettings();
            
            if (selectedPlayers.length > 0) {
                analyzeTeam();
            }

            updateStatus(`${preset.charAt(0).toUpperCase() + preset.slice(1)} settings applied`, 'success');
        }

        // ===== INITIALIZATION =====
        window.addEventListener('load', () => {
            // Load saved settings
            const savedSettings = localStorage.getItem('fpl_analysis_settings');
            if (savedSettings) {
                userSettings = JSON.parse(savedSettings);
            }

            // Load saved team ID
            const savedTeamId = localStorage.getItem('fpl_team_id');
            if (savedTeamId) {
                document.getElementById('teamIdInput').value = savedTeamId;
            }
        });

        // Enter key to load team
        document.getElementById('teamIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadTeamById();
        });
    </script>
</body>
</html>
