    <!-- Signed out there is nothing on this page but a prompt for a Team ID,
         and the gate in dashboard-gate.js sends anyone without one to the ID
         page before it paints — so a crawler is never shown the screen this
         URL names. The page that describes this feature to someone who has
         not signed in is /feature-squad-analysis and friends, and those are
         the ones in the sitemap. follow, not nofollow: the links out of here
         are the rest of the product.
         Deliberately paired with the canonical above rather than replacing
         it: the URL is still the one this page is served at. -->
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0a0f1a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- The data URI stays as the fallback for anything that will not take an
         SVG icon. The file is what every current browser uses: one URL for the
         whole origin, so it is cached once and cannot resolve differently from
         one page to the next the way a per-page data URI can. -->
    <link rel="alternate icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%2310B981'/%3E%3Ctext%20x='50'%20y='72'%20font-size='65'%20font-family='Arial,sans-serif'%20font-weight='bold'%20fill='%230a0f1a'%20text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">

    <!-- The site's typefaces, from our own origin rather than Google's.
         Two cross-origin connections used to stand in front of the first
         glyph: one to fonts.googleapis.com for a stylesheet that names files
         on fonts.gstatic.com, then one to that. Both are gone — see the note
         at the top of tools/fetch-fonts.mjs — and with them every
         third-party request a signed-out visitor made.

         Still off the critical path via media="print", and still
         font-display: swap inside, so text paints in the fallback face and
         reflows once. Preloading the two faces above the fold instead of
         waiting for the stylesheet to name them: same-origin now, so a
         preload here costs nothing and starts them with the CSS. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin-ca11fe9ca5.woff2" crossorigin>

         that the cascade reads the same as it did when the two were one file,
         and only when there is a saved Team ID — see the note at the top of
         v2-design.css. Kept identical on every page by check:appcss. -->

    <!-- Why preload and not defer.

         The page's scripts sit at the foot of <body>, past roughly 210 KB of
         markup — the latest first-script discovery on the site — so the parser
         had nearly finished the document before it learned it needed any of them.
         These hints start the fetch up here instead; the tags themselves have not
         moved.

         Deferring them was the obvious alternative and it is wrong here. Deferred
         scripts run after parsing, but the inline block that follows them is not
         deferred and runs at parse time — and it opens with loadSidebarNav() and
         initIcons(), which these files define. The inline block would execute
         first and throw on its own first line. Preload changes when the bytes
         arrive, never the order anything executes in.

         The ?v= here is rewritten by `npm run stamp` along with every other asset
         reference. It has to stay identical to the <script src> below or the file
         is fetched twice; `npm run check:preload` fails the build if it drifts. -->

        /* Help beside the title. What each tab is for used to be a one-line

           held still and the explanation could never be longer than a line.
           Here it is the length it needs, in the same place on every page. */
        v2MountPageHelp(
            'This page ranks every player in the game six different ways. Each tab answers a different question, and the position pills at the top of each one filter all of them together.',
            [
                { title: 'The tabs', steps: [
                    { title: 'Recommendations', text: 'Who to buy, split into budget, premium and differential. Ranked on form, underlying numbers, minutes, value and fixtures together — <strong>Balanced</strong> lets form lead, <strong>Fixture-first</strong> weights the next three opponents heavily, so the same players re-rank on who they face.' },
                    { title: 'Rising Form', text: 'Players with at least two signals pointing the same way at once — points, underlying numbers, minutes, his club’s xG, the fixtures in front of him. One signal is noise; several agreeing is a trend. Weighted towards the next match or two, and towards players the field has not bought yet.' ,
                      more: '<p>Every reading compares his <strong>last three matches against the two before them</strong> \u2014 two samples sharing no match. Comparing a recent run against a season that contains it flattens the signal, and early in a season makes it impossible to satisfy at all.</p><svg class="help-diagram" viewBox="0 0 240 34" role="img" aria-label="Five matches: the earlier two are the baseline, the last three the recent window"><rect x="2" y="8" width="44" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1"/><rect x="48" y="8" width="44" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1"/><rect x="96" y="8" width="44" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.9"/><rect x="142" y="8" width="44" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.9"/><rect x="188" y="8" width="44" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.9"/><text x="24" y="6" text-anchor="middle">baseline</text><text x="165" y="6" text-anchor="middle">recent three</text></svg><p>Rate stats are read <strong>per 90 minutes</strong>, not per appearance, so a player who simply started playing more does not register as one who improved. Minutes are their own signal beside it.</p><p>A club-level figure always names the club. A line reading SUN is Sunderland\u2019s number, not the player\u2019s.</p>'},
                    { title: 'Purple Patch', text: 'Players scoring well above their own baseline, rated on whether the run is backed by process or about to regress. The score is the sustainability, not the streak.' ,
                      more: '<p>The two tabs are opposites. <strong>Rising Form</strong> looks for a player on the way up; this one takes a player who is <em>already</em> hot and asks whether it holds.</p><p>A high score means the chances underneath the run are real \u2014 shots in good places, minutes secure, fixtures not about to turn. A low score is a player whose points have outrun everything that produced them, which is the moment to sell rather than buy.</p>'},
                    { title: 'Charts', text: 'Scatter plots for spotting value, over- and under-performance and differentials by eye. The position filters at the top apply to every chart at once.' },
                    { title: 'Routes to Points', text: 'How many different ways a player has of scoring — goals, assists, clean sheets, saves, bonus. Four routes is less dependent on any one of them going right than one route is.' ,
                      more: '<p>A variance question, not a ceiling question. A striker with one route can beat a defender with four in any given week; he will also blank far more often, because everything he is worth depends on one thing going right.</p><p>Most useful for the back of a squad and a bench you would rather not think about.</p>'},
                    { title: 'All Players', text: 'The full table, sortable and filterable, with column presets and a shortlist. Every other tab is a view onto this one.' }
                ] },
                { title: 'Reading a card', steps: [
                    { title: 'The header', text: 'The club colour, the portrait and crest, the price, and how much of the field owns him. Clicking it opens the same player larger, with his full record.' },
                    { title: 'xP5', text: 'Projected points across the next five gameweeks, from his recent rates, his expected minutes and his fixtures. A projection, not a promise.' },
                    { title: 'The fixture blocks', text: 'His next matches, coloured by difficulty on the same five-step ramp the whole site uses — dark green easiest, dark red hardest.' },
                    { title: 'The star', text: 'Adds him to your shortlist, which survives a reload and filters the All Players table.' }
                ] }
            ]
        );
    </script>

    <script>
        function updateAllPlayersHeaderOffset() {
            const nav = document.querySelector('.top-nav');
            const tabsContainer = document.querySelector('.tabs-container');
            let offset = 0;
            if (nav) {
                const s = window.getComputedStyle(nav);
                if (s.position === 'sticky' || s.position === 'fixed') {
                    offset += nav.getBoundingClientRect().height;
                }
            }
            if (tabsContainer) {
                const s = window.getComputedStyle(tabsContainer);
                if (s.position === 'sticky' || s.position === 'fixed') {
                    offset += tabsContainer.getBoundingClientRect().height;
                }
            }
            document.documentElement.style.setProperty('--all-players-sticky-top', offset + 'px');
        }
        document.addEventListener('DOMContentLoaded', updateAllPlayersHeaderOffset);
        window.addEventListener('resize', updateAllPlayersHeaderOffset);
    </script>
</body>
</html>
