<!DOCTYPE html>
<html lang="en" class="v2-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>EasyFPL — Player Analysis</title>
    <meta name="description" content="Deep-dive FPL player analysis — scout recommendations, routes to points, rising form alerts, fixture-difficulty ratings, and advanced stats for every Premier League player.">
    <meta name="theme-color" content="#0a0f1a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0f1a'/><text x='50' y='72' font-size='65' font-family='Arial,sans-serif' font-weight='bold' fill='%2300DC82' text-anchor='middle'>e</text></svg>">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EasyFPL">
    <meta property="og:title" content="EasyFPL — Player Analysis">
    <meta property="og:description" content="Deep-dive FPL player analysis — scout recommendations, routes to points, rising form alerts, and advanced stats for every Premier League player.">
    <meta property="og:url" content="https://easyfpl.com/fpl-players-analysis.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EasyFPL — Player Analysis">
    <meta name="twitter:description" content="Deep-dive FPL player analysis — scout recommendations, routes to points, rising form alerts, and advanced stats for every Premier League player.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/common.css?v=150">
    <link rel="stylesheet" href="styles/players.css?v=150">
    <link rel="stylesheet" href="styles/v2-design.css?v=150">
    <style>
        /* The sticky header now lives in players.css and pins to the scrolling
           table container rather than to the viewport, so the offset that used to
           be computed from the nav and tab bar heights is no longer needed. */

        /* players.css's .table-section-wrapper breaks out to 100vw via a negative
           margin that assumes .content is centered on the viewport — true on the old
           top-nav layout, but in the sidebar layout .content sits inside .v2-main-content
           (offset by the fixed sidebar's width), so that math pushes the table left,
           under the sidebar, and off the right edge of the screen. Full-bleed relative
           to .v2-main-content instead, toggled by activateTab() when the ALL tab is active. */
        .v2-main-content .content.content--full-bleed {
            max-width: none;
            padding-left: 0;
            padding-right: 0;
        }
        .v2-main-content .content.content--full-bleed .position-section.table-section-wrapper {
            width: 100%;
            max-width: none;
            margin-left: 0;
            padding: 24px;
        }
    </style>
</head>
<body>
    <!-- V2 sidebar is fetch-injected here by loadSidebarNav() (scripts/sidebar-nav.js) -->
    <div class="v2-main-content">

    <div class="loading-overlay" id="loadingOverlay">
        <div style="text-align: center;">
            <div class="loader-spinner"></div>
            <div style="margin-top: 16px; color: var(--text-secondary);">Loading players...</div>
        </div>
    </div>

    <!-- Compare Bar -->
    <div class="compare-bar" id="compareBar">
        <div class="compare-bar-content">
            <div class="compare-bar-info">
                <span class="compare-bar-icon"><i data-lucide="scale" style="width:18px;height:18px;"></i></span>
                <span class="compare-bar-text">Compare <strong id="compareCount">0</strong> players</span>
            </div>
            <div class="compare-players-list" id="comparePlayersList"></div>
            <div class="compare-bar-actions">
                <button class="compare-btn clear" onclick="clearCompare()">Clear</button>
                <button class="compare-btn primary" onclick="showCompareModal()">Compare Now</button>
            </div>
        </div>
    </div>

    <!-- Compare Modal -->
    <div class="compare-modal" id="compareModal">
        <div class="compare-modal-backdrop" onclick="closeCompareModal()"></div>
        <div class="compare-modal-container">
            <div class="compare-modal-header">
                <h2><i data-lucide="brain" style="width:20px;height:20px;display:inline;"></i> AI Scouting Report</h2>
                <button class="compare-modal-close" onclick="closeCompareModal()" aria-label="Close player comparison">×</button>
            </div>
            <div class="compare-modal-body" id="compareModalContent">
                <!-- Content generated by JS -->
            </div>
        </div>
    </div>

    <!-- Chart Expand Modal -->
    <div class="chart-modal" id="chartModal">
        <div class="chart-modal-backdrop" onclick="closeChartModal()"></div>
        <div class="chart-modal-container">
            <div class="chart-modal-header">
                <div class="chart-modal-title">
                    <h2 id="chartModalTitle">Chart Title</h2>
                    <p id="chartModalSubtitle">Chart subtitle</p>
                </div>
                <div class="chart-modal-metrics">
                    <label>X axis
                        <select id="expandX" onchange="rebuildExpandedChart()"></select>
                    </label>
                    <label>Y axis
                        <select id="expandY" onchange="rebuildExpandedChart()"></select>
                    </label>
                </div>
                <button class="chart-modal-close" onclick="closeChartModal()" aria-label="Close expanded chart">×</button>
            </div>
            <div class="chart-modal-body">
                <div class="chart-modal-left">
                    <div class="chart-modal-canvas-container">
                        <canvas id="expandedChart"></canvas>
                    </div>
                    <div class="chart-modal-legend" id="chartModalLegend">
                        <div class="chart-legend-item">
                            <div class="chart-legend-dot" style="background: #fbbf24;"></div>
                            <span>GK</span>
                        </div>
                        <div class="chart-legend-item">
                            <div class="chart-legend-dot" style="background: #34d399;"></div>
                            <span>DEF</span>
                        </div>
                        <div class="chart-legend-item">
                            <div class="chart-legend-dot" style="background: #60a5fa;"></div>
                            <span>MID</span>
                        </div>
                        <div class="chart-legend-item">
                            <div class="chart-legend-dot" style="background: #f87171;"></div>
                            <span>FWD</span>
                        </div>
                    </div>
                </div>
                <div class="chart-modal-right">
                    <div class="chart-modal-players-header">
                        <div class="chart-modal-players-title" id="chartPlayersTitle">Notable Players</div>
                        <div class="chart-modal-players-subtitle" id="chartPlayersSubtitle">Top performers for this metric</div>
                    </div>
                    <div class="chart-players-list" id="chartPlayersGrid">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Detail Modal -->
    <div class="player-modal" id="playerModal">
        <div class="player-modal-backdrop" onclick="closePlayerModal()"></div>
        <div class="player-modal-container">
            <div class="player-modal-header">
                <div class="player-modal-header-top">
                    <div class="player-modal-profile">
                        <div class="player-modal-avatar" id="playerModalAvatar">MS</div>
                        <div>
                            <div class="player-modal-name" id="playerModalName">Player Name</div>
                            <div class="player-modal-meta">
                                <span class="player-modal-pos" id="playerModalPos">MID</span>
                                <span id="playerModalTeam">Team</span>
                                <span>•</span>
                                <span id="playerModalPrice">£10.0m</span>
                            </div>
                        </div>
                    </div>
                    <button class="player-modal-close" onclick="closePlayerModal()" aria-label="Close player profile">×</button>
                </div>
                <div class="player-modal-stats" id="playerModalStats">
                    <!-- Stats boxes generated by JS -->
                </div>
            </div>
            <div class="player-modal-body">
                <div class="player-modal-tabs">
                    <button class="player-modal-tab active" onclick="switchPlayerTab('season')">Season Trend</button>
                    <button class="player-modal-tab" onclick="switchPlayerTab('last5')">Last 5 Games</button>
                </div>
                <div class="player-charts-grid" id="playerChartsGrid">
                    <!-- Charts generated by JS -->
                </div>
                <div class="player-fixtures-section">
                    <div class="player-fixtures-title"><i data-lucide="calendar" style="width:16px;height:16px;display:inline;"></i> Upcoming Fixtures</div>
                    <div class="player-fixtures-grid" id="playerFixturesGrid">
                        <!-- Fixtures generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="tabs">
            <button class="tab active" data-position="RECOMMENDATIONS" data-desc="Position-specific recommendations split by budget, premium, and differential tiers using form, fixtures, and value." data-has-pos="true" title="Position-specific recommendations split by budget, premium, and differential tiers using form, fixtures, and value.">Recommendations</button>
            <button class="tab" data-position="RISING" data-desc="Players with converging positive signals — team form improving, fixtures getting easier, and underlying stats trending up." data-has-pos="true" title="Players with converging positive signals — team form improving, fixtures getting easier, and underlying stats trending up.">Rising Form</button>
            <button class="tab" data-position="PURPLE_PATCH" data-desc="Players on hot streaks — with a sustainability analysis showing whether their form is backed by process or likely to regress." data-has-pos="true" title="Players on hot streaks — with a sustainability analysis showing whether their form is backed by process or likely to regress.">Purple Patch</button>
            <button class="tab" data-position="CHARTS" data-desc="Interactive scatter plots to visually identify value picks, underperformers, regression candidates, and differentials." title="Interactive scatter plots to visually identify value picks, underperformers, regression candidates, and differentials.">Charts</button>
            <button class="tab" data-position="ROUTES" data-desc="Players with the most diverse ways to score FPL points. More routes = more reliable returns." data-has-pos="true" title="Players with the most diverse ways to score FPL points. More routes = more reliable returns.">Routes to Points</button>
            <button class="tab" data-position="ALL" data-desc="Full stats table for all players — sortable, filterable by position, with shortlist support." data-has-pos="false" title="Full stats table for all players — sortable, filterable by position, with shortlist support.">All Players</button>
        </div>
    </div>

    <main class="content">
        <div class="page-header">
            <h1 class="page-title v2-page-heading"><i data-lucide="user-round-search" class="icon"></i> Player Analysis</h1>
            <p class="page-subtitle" id="pageSubtitle"></p>
        </div>
        <div class="filter-bar" id="filterBar">
            <div class="filter-bar-inner">
                <div class="fp-group" id="posPills">
                    <button class="fp-pill active" data-pos="GK" onclick="switchGlobalPosition('GK', this)">GK</button>
                    <button class="fp-pill" data-pos="DEF" onclick="switchGlobalPosition('DEF', this)">DEF</button>
                    <button class="fp-pill" data-pos="MID" onclick="switchGlobalPosition('MID', this)">MID</button>
                    <button class="fp-pill" data-pos="FWD" onclick="switchGlobalPosition('FWD', this)">FWD</button>
                </div>
                <div class="filter-bar-divider" id="catDivider"></div>
                <div class="fc-group" id="catPills">
                    <button class="fc-chip active" data-cat="budget" onclick="switchGlobalCategory('budget', this)"><i data-lucide="coins" class="fc-icon"></i>Budget</button>
                    <button class="fc-chip" data-cat="premium" onclick="switchGlobalCategory('premium', this)"><i data-lucide="star" class="fc-icon"></i>Premium</button>
                    <button class="fc-chip" data-cat="differential" onclick="switchGlobalCategory('differential', this)"><i data-lucide="gem" class="fc-icon"></i>Differentials</button>
                </div>
            </div>
        </div>
        <div class="position-section active" id="section-RECOMMENDATIONS">
            <div class="skeleton-container skeleton-grid" style="padding:16px 0;">
                <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:36px;height:36px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:70%"></div></div></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
                <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:36px;height:36px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:70%"></div></div></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
                <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:36px;height:36px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:70%"></div></div></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
                <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:36px;height:36px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:70%"></div></div></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
                <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:36px;height:36px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:70%"></div></div></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
                <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-circle" style="width:36px;height:36px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:70%"></div></div></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
            </div>
        </div>
        <div class="position-section" id="section-RISING"></div>
        <div class="position-section" id="section-PURPLE_PATCH"></div>
        <div class="position-section" id="section-CHARTS"></div>
        <div class="position-section" id="section-ROUTES"></div>
        <div class="position-section table-section-wrapper" id="section-ALL"></div>
    </main>

    <!-- Hidden elements for JS compatibility -->
    <div class="hidden">
        <div id="section-FORM"></div>
        <div id="status"></div>
        <div id="cacheInfo"></div>
    </div>


    <script>
        // ============================================
        // GLOBALS
        // ============================================

        let bootstrapData = null;
        let bootstrapElements = {}; // id -> bootstrap element (for availability)
        let playerAnalyses = {};
        let teamFixtures = {};
        let teams = {};
        let teamAnalysis = {};
        let teamXgData = {};
        let fixtureSwingData = {};
        let currentGameweek = null;
        let currentPhase = 'mid';
        let allAnalyses = [];
        let isPreseason = false; // true until the season's first fixture kicks off — see computeIsPreseason() in scripts/common.js
        let currentPosition = 'RECOMMENDATIONS';

        // Shortlist state (persisted to localStorage)
        let shortlistedPlayerIds = new Set(JSON.parse(localStorage.getItem('fpl_shortlist') || '[]'));

        function saveShortlist() {
            localStorage.setItem('fpl_shortlist', JSON.stringify([...shortlistedPlayerIds]));
            updateShortlistBadge();
        }

        function updateShortlistBadge() {
            // Update the shortlist filter pill badge in the All Players table
            const pill = document.getElementById('shortlistPill-ALL');
            if (pill) {
                const count = shortlistedPlayerIds.size;
                pill.innerHTML = `<span class="dot"></span> <i data-lucide="star" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></i> Shortlisted${count > 0 ? ' (' + count + ')' : ''}`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        function toggleShortlist(playerId, event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            if (shortlistedPlayerIds.has(playerId)) {
                shortlistedPlayerIds.delete(playerId);
            } else {
                shortlistedPlayerIds.add(playerId);
            }
            saveShortlist();
            // Update all star icons on the page
            document.querySelectorAll(`.shortlist-star[data-player-id="${playerId}"]`).forEach(el => {
                el.classList.toggle('shortlisted', shortlistedPlayerIds.has(playerId));
            });
            // Re-render the All Players table if shortlist filter is active
            if (currentPosition === 'ALL' && tableState.ALL?.filters?.shortlist) {
                refreshTable('ALL');
            }
            updateShortlistBadge();
        }

        function getStarHtml(playerId, extraClass = '') {
            const active = shortlistedPlayerIds.has(playerId) ? 'shortlisted' : '';
            return `<span class="shortlist-star ${active} ${extraClass}" data-player-id="${playerId}" onclick="toggleShortlist(${playerId}, event)" title="Toggle shortlist"><i data-lucide="star" style="width:14px;height:14px;"></i></span>`;
        }

        // Clean stale shortlist IDs on load
        function cleanStaleShortlist() {
            const validIds = new Set(allAnalyses.map(p => p.id));
            let staleRemoved = false;
            shortlistedPlayerIds.forEach(id => {
                if (!validIds.has(id)) { shortlistedPlayerIds.delete(id); staleRemoved = true; }
            });
            if (staleRemoved) saveShortlist();
        }

        // Global filter state
        let globalFilters = {
            availability: true,  // Improvement #4: Default ON — hide injured/suspended (<75% chance)
            starters: false      // Hide players <45 min/game (L5)
        };

        // ============================================
        // TAB NAVIGATION
        // ============================================
        // Hash-to-tab mapping
        const HASH_TO_TAB = {
            'recommendations': 'RECOMMENDATIONS',
            'rising': 'RISING',
            'purple-patch': 'PURPLE_PATCH',
            'charts': 'CHARTS',
            'routes': 'ROUTES',
            'all': 'ALL'
        };
        const TAB_TO_HASH = Object.fromEntries(Object.entries(HASH_TO_TAB).map(([k,v]) => [v,k]));

        function activateTab(tab) {
            document.querySelectorAll('.tabs-container .tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            const pos = tab.dataset.position;
            currentPosition = pos;
            
            document.querySelectorAll('.position-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`section-${pos}`)?.classList.add('active');

            // ALL tab's table breaks out to full-bleed width (see <style> block for why)
            document.querySelector('main.content')?.classList.toggle('content--full-bleed', pos === 'ALL');

            // Give the charts their real dimensions the moment the tab is shown.
            // Deliberately not deferred through requestAnimationFrame: rAF can be
            // throttled to never firing for work scheduled around a just-revealed
            // element, which leaves the canvas stuck at the 0x0 it was built with.
            // The synchronous call forces the layout we need; the timeout covers
            // fonts and scrollbars settling afterwards.
            if (pos === 'CHARTS') { resizeAllCharts(); setTimeout(resizeAllCharts, 80); }

            // Update page subtitle with tab description
            const desc = tab.dataset.desc;
            const subtitleEl = document.getElementById('pageSubtitle');
            if (subtitleEl && desc) {
                subtitleEl.textContent = desc;
            }

            // Show/hide position pills based on tab
            const posPills = document.getElementById('posPills');
            const filterBar = document.getElementById('filterBar');
            if (posPills) {
                const hasPos = tab.dataset.hasPos === 'true';
                posPills.classList.toggle('hidden', !hasPos);
                // Routes overrides this: its default view spans every position.
                if (hasPos && tab.dataset.position === 'ROUTES') {
                    const top15Active = !!document.querySelector('.routes-top15-view.active');
                    posPills.classList.toggle('hidden', top15Active);
                }
                // Hide entire filter bar when no filters apply (ALL tab has its own toolbar)
                if (filterBar) filterBar.style.display = (pos === 'ALL') ? 'none' : '';
            }

            // Show/hide category pills (only on Recommendations, Rising, Purple Patch)
            const catPills = document.getElementById('catPills');
            const catDivider = document.getElementById('catDivider');
            const showCats = ['RECOMMENDATIONS', 'RISING', 'PURPLE_PATCH'].includes(pos);
            if (catPills) catPills.style.display = showCats ? '' : 'none';
            if (catDivider) catDivider.style.display = showCats ? '' : 'none';

            // Update hash
            const hash = TAB_TO_HASH[pos];
            if (hash) history.replaceState(null, '', '#' + hash);
        }

        document.querySelectorAll('.tabs-container .tab').forEach(tab => {
            tab.addEventListener('click', () => activateTab(tab));
        });

        // Activate tab from URL hash on load
        (function() {
            const hash = window.location.hash.replace('#', '');
            const tabPos = HASH_TO_TAB[hash];
            if (tabPos) {
                const tab = document.querySelector(`.tabs-container .tab[data-position="${tabPos}"]`);
                if (tab) activateTab(tab);
            }
        })();

        // ============================================
        // LOADING
        // ============================================
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }
        function updateStatus(msg, type) { console.log(msg); }
        function showCacheInfo() {}

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadData() {
            try {
                showLoading(true);
                
                const [staticData, fixturesData, bootData] = await Promise.all([
                    DataCache.fetchJSON(DATA_URLS.players),
                    DataCache.fetchJSON(DATA_URLS.fixtures).catch(() => []),
                    DataCache.fetchJSON(DATA_URLS.bootstrap).catch(() => null)
                ]);

                if (staticData?.metadata?.lastUpdated && window.updateDataFreshness) window.updateDataFreshness(staticData.metadata.lastUpdated);

                // Load bootstrap data for availability info
                if (bootData && bootData.elements) {
                    try {
                        bootData.elements.forEach(el => {
                            bootstrapElements[el.id] = {
                                status: el.status,
                                news: el.news || '',
                                chanceNextRound: el.chance_of_playing_next_round
                            };
                        });
                    } catch (e) {
                        console.warn('Could not parse bootstrap-static.json for availability data:', e);
                    }
                }

                // Build teams
                staticData.teams.forEach(team => {
                    teams[team.id] = {
                        id: team.id,
                        name: team.name,
                        short_name: team.short_name,
                        code: team.code,
                        strength: team.strength
                    };
                });

                // Process fixtures
                processFixtures(fixturesData);

                // Build per-team xG data from player histories
                buildTeamXgData(staticData, fixturesData);

                // Compute team-level scores (attack, defense, form, fixtures) — 3-component xG model
                computeTeamScores(staticData.teams, fixturesData);

                isPreseason = computeIsPreseason(bootData, fixturesData);

                // Build a history lookup from players-data.json (current-season per-GW logs, may be empty pre-season)
                const historyById = {};
                (staticData.players || []).forEach(p => { historyById[p.id] = p.history || []; });

                // Process players — source the roster from bootstrap (always complete, 568 players)
                // and merge in current-season history by id when available. This keeps the page
                // working immediately even if players-data.json hasn't caught up yet.
                const analyses = [];
                for (const player of (bootData?.elements || [])) {
                    const history = historyById[player.id] || [];
                    const season = calculateStats(history, false);
                    const l5 = calculateStats(history, true);

                    const playerFixtures = teamFixtures[player.team] || [];
                    let fixtureData = null;

                    if (playerFixtures.length > 0) {
                        const next3 = playerFixtures.slice(0, 3);
                        const next5 = playerFixtures.slice(0, 5);
                        const avgFDR3 = next3.reduce((s, f) => s + f.difficulty, 0) / next3.length;
                        const avgFDR5 = next5.reduce((s, f) => s + f.difficulty, 0) / next5.length;

                        fixtureData = {
                            avgFDR3, avgFDR5, next3, next5,
                            fixtureString: next3.map(f => `${teams[f.opponent]?.short_name || '???'}(${f.isHome ? 'H' : 'A'})`).join(', ')
                        };
                    }

                    // Last season's cumulative stats — still sitting in bootstrap-static.json's
                    // season-total fields until FPL rolls them over for the new season.
                    const lastSeason = {
                        totalPoints: player.total_points || 0,
                        minutes: player.minutes || 0,
                        goals: player.goals_scored || 0,
                        assists: player.assists || 0,
                        cleanSheets: player.clean_sheets || 0,
                        goalsConceded: player.goals_conceded || 0,
                        saves: player.saves || 0,
                        bonus: player.bonus || 0,
                        bps: player.bps || 0,
                        xG: parseFloat(player.expected_goals) || 0,
                        xA: parseFloat(player.expected_assists) || 0,
                        xGI: parseFloat(player.expected_goal_involvements) || 0,
                        ictIndex: parseFloat(player.ict_index) || 0,
                        starts: player.starts || 0
                    };

                    analyses.push({
                        id: player.id,
                        name: player.web_name,
                        fullName: `${player.first_name} ${player.second_name}`,
                        position: player.element_type,
                        team: teams[player.team]?.short_name || '???',
                        teamId: player.team,
                        teamCode: teams[player.team]?.code,
                        price: player.now_cost / 10,
                        form: parseFloat(player.form) || 0,
                        selectedBy: parseFloat(player.selected_by_percent) || 0,
                        totalPoints: player.total_points,
                        season, l5, fixtures: fixtureData,
                        history,
                        lastSeason,
                        // Availability fields
                        status: player.status || 'a',
                        news: player.news || '',
                        chanceNextRound: player.chance_of_playing_next_round,
                        // Market movement — drives the buy-now / wait signal on rec cards
                        transfersIn: player.transfers_in_event || 0,
                        transfersOut: player.transfers_out_event || 0,
                        costChangeEvent: (player.cost_change_event || 0) / 10,
                        // Published by FPL rather than inferred. 1 = first choice.
                        penaltiesOrder: player.penalties_order || null,
                        cornersOrder: player.corners_and_indirect_freekicks_order || null,
                        freekicksOrder: player.direct_freekicks_order || null,
                        defCon: player.defensive_contribution || 0,
                        defCon90: parseFloat(player.defensive_contribution_per_90) || 0,
                        // Team-level scores
                        teamScores: teamAnalysis[player.team] || null
                    });
                }

                // Preseason: the "All Players" table (createTable) filters on l5.games >= 1 and
                // reads a wide set of l5/season fields. Rather than rewrite its ~40 columns, feed it
                // a last-season-shaped stand-in so the existing table code works unchanged — both
                // "L5" and "Season" columns will show identical last-season totals during preseason,
                // which the season-notice banner above the table explains.
                if (isPreseason) {
                    analyses.forEach(p => { p.season = p.l5 = lastSeasonAsStatsShape(p.lastSeason); });
                }

                allAnalyses = analyses;
                computeSeasonGamesAvailable(analyses);
                currentGameweek = detectCurrentGameweek(analyses);
                currentPhase = getSeasonPhase(currentGameweek);

                // Build fixture swing data (needs currentGameweek)
                buildFixtureSwingData(staticData.teams, fixturesData);

                // Pre-compute Rising Form and Routes data for cross-wiring into recommendations
                precomputeRisingFormScores(analyses);
                precomputeRoutesData(analyses);
                precomputePurplePatchScores(analyses);

                // Render (recommendations uses rising form + routes data)
                document.getElementById('section-RECOMMENDATIONS').innerHTML = generateRecommendations(analyses);
                document.getElementById('section-CHARTS').innerHTML = generateCharts(analyses);
                document.getElementById('section-RISING').innerHTML = generateRisingForm(analyses);
                document.getElementById('section-PURPLE_PATCH').innerHTML = generatePurplePatch(analyses);
                document.getElementById('section-ROUTES').innerHTML = generateRoutesToPoints(analyses);
                document.getElementById('section-ALL').innerHTML =
                    (isPreseason ? renderSeasonNotice('Showing 2025/26 season totals in the L5 &amp; Season columns — this season’s per-gameweek data isn’t available until GW1.') : '')
                    + createTable('ALL', analyses);

                // Toxic List (hidden by default — revealed via triple-click easter egg)
                const toxicPlayers = generateToxicList(allAnalyses);
                const toxicHtml = `<div id="toxicListContainer" class="toxic-hidden">${renderToxicList(toxicPlayers)}</div>`;
                document.getElementById('section-RECOMMENDATIONS').insertAdjacentHTML('beforeend', toxicHtml);

                // Initialize Lucide icons in dynamically rendered content
                if (typeof lucide !== 'undefined') lucide.createIcons();

                // Clean stale shortlist IDs and update badge
                cleanStaleShortlist();
                updateShortlistBadge();

                showLoading(false);
            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
                document.getElementById('section-RECOMMENDATIONS').innerHTML = renderErrorState(
                    'Failed to load player data',
                    'Check your connection and try again.',
                    'loadData'
                );
                initIcons();
            } finally {
                /* Was inside the catch, so the footer only ever rendered on the
                   error path — a successful load left the page with no footer
                   at all. It belongs on both. */
                loadFooter();
            }
        }

        function processFixtures(fixtures) {
            const upcoming = fixtures.filter(f => !f.finished && f.event);
            upcoming.forEach(f => {
                if (!teamFixtures[f.team_h]) teamFixtures[f.team_h] = [];
                teamFixtures[f.team_h].push({ opponent: f.team_a, isHome: true, difficulty: f.team_h_difficulty, event: f.event });
                
                if (!teamFixtures[f.team_a]) teamFixtures[f.team_a] = [];
                teamFixtures[f.team_a].push({ opponent: f.team_h, isHome: false, difficulty: f.team_a_difficulty, event: f.event });
            });
            Object.keys(teamFixtures).forEach(id => teamFixtures[id].sort((a, b) => a.event - b.event));
        }

        // ============================================
        // xG DATA BUILDER (from players-data.json)
        // ============================================
        function buildTeamXgData(staticData, fixturesData) {
            const bootTeams = staticData.teams;
            bootTeams.forEach(t => {
                teamXgData[t.id] = {
                    seasonXg: 0, seasonXa: 0, seasonXgc: 0,
                    seasonGoals: 0, seasonAssists: 0, seasonConceded: 0, seasonGames: 0,
                    perGw: {}, hasPerGwData: false
                };
            });
            const finishedFx = fixturesData.filter(f => f.finished && f.team_h_score !== null);
            finishedFx.forEach(f => {
                if (teamXgData[f.team_h]) { teamXgData[f.team_h].seasonGames++; teamXgData[f.team_h].seasonConceded += f.team_a_score || 0; }
                if (teamXgData[f.team_a]) { teamXgData[f.team_a].seasonGames++; teamXgData[f.team_a].seasonConceded += f.team_h_score || 0; }
            });
            (staticData.players || []).forEach(player => {
                const tid = player.team;
                if (!teamXgData[tid]) return;
                (player.history || []).forEach(h => {
                    const gw = h.round;
                    const fk = h.fixture;
                    teamXgData[tid].seasonXg += parseFloat(h.expected_goals) || 0;
                    teamXgData[tid].seasonXa += parseFloat(h.expected_assists) || 0;
                    teamXgData[tid].seasonGoals += h.goals_scored || 0;
                    teamXgData[tid].seasonAssists += h.assists || 0;
                    if (!teamXgData[tid].perGw[gw]) {
                        teamXgData[tid].perGw[gw] = { xG: 0, xA: 0, xGC: 0, goals: 0, assists: 0, conceded: 0, wasHome: null, oppTeam: null, xGC_90min: 0, _fixtures: {} };
                    }
                    const d = teamXgData[tid].perGw[gw];
                    d.xG += parseFloat(h.expected_goals) || 0;
                    d.xA += parseFloat(h.expected_assists) || 0;
                    const tg = h.was_home ? (h.team_h_score || 0) : (h.team_a_score || 0);
                    const tc = h.was_home ? (h.team_a_score || 0) : (h.team_h_score || 0);
                    if (!d._fixtures[fk]) { d._fixtures[fk] = true; d.goals += tg; d.conceded += tc; }
                    d.wasHome = h.was_home; d.oppTeam = h.opponent_team;
                    if (h.minutes >= 85) {
                        const xgc = parseFloat(h.expected_goals_conceded) || 0;
                        const xk = `_xgc_${fk}`;
                        if (!d[xk]) { d[xk] = true; d.xGC_90min += xgc; }
                    }
                });
            });
            bootTeams.forEach(t => {
                const gwKeys = Object.keys(teamXgData[t.id].perGw);
                if (gwKeys.length > 0) {
                    teamXgData[t.id].hasPerGwData = true;
                    teamXgData[t.id].seasonXgc = gwKeys.reduce((sum, gw) => sum + teamXgData[t.id].perGw[gw].xGC_90min, 0);
                }
            });
            console.log('\ud83c\udfaf Team xG data built for', bootTeams.length, 'teams');
        }

        function getTeamXgWindow(teamId, windowSize) {
            const data = teamXgData[teamId];
            if (!data || !data.hasPerGwData) return null;
            const gws = Object.keys(data.perGw).map(Number).sort((a, b) => a - b);
            const recentGws = gws.slice(-windowSize);
            if (recentGws.length === 0) return null;
            const n = recentGws.length;
            const totals = recentGws.reduce((acc, gw) => {
                const d = data.perGw[gw];
                acc.xG += d.xG; acc.xA += d.xA; acc.xGC += d.xGC_90min;
                acc.goals += d.goals; acc.conceded += d.conceded;
                return acc;
            }, { xG: 0, xA: 0, xGC: 0, goals: 0, conceded: 0 });
            return {
                games: n, xGpg: totals.xG / n, xGCpg: totals.xGC / n,
                gpg: totals.goals / n, gapg: totals.conceded / n,
                totalXg: totals.xG, totalGoals: totals.goals,
                totalXgc: totals.xGC, totalConceded: totals.conceded
            };
        }

        function getTeamSeasonXg(teamId) {
            const data = teamXgData[teamId];
            if (!data) return null;
            const g = data.seasonGames || 1;
            return {
                games: data.seasonGames, xGpg: data.seasonXg / g, xGCpg: data.seasonXgc / g,
                gpg: data.seasonGoals / g, gapg: data.seasonConceded / g,
                totalXg: data.seasonXg, totalGoals: data.seasonGoals,
                totalXgc: data.seasonXgc, totalConceded: data.seasonConceded
            };
        }

        // ============================================
        // CLEAN SHEET PROBABILITY MODEL (from transfer-wizard)
        // ============================================
        function getCleanSheetProb(teamId, opponentId, isHome) {
            const tp = teamAnalysis[teamId], op = teamAnalysis[opponentId];
            if (!tp || !op) return 0.25;
            let base = isHome ? 0.35 : 0.25;
            // Use venue-adjusted power when available
            const teamDef = isHome ? (tp.defensePowerHome || tp.defensePower) : (tp.defensePowerAway || tp.defensePower);
            const oppAtk = isHome ? (op.attackPowerAway || op.attackPower) : (op.attackPowerHome || op.attackPower);
            base += (teamDef - 50) * 0.003;
            base -= (oppAtk - 50) * 0.0025;
            base += (1.3 - tp.gaPerGame) * 0.06;
            return Math.max(0.05, Math.min(0.65, base));
        }

        // ============================================
        // FIXTURE SWING DETECTION (from teams-analysis)
        // ============================================
        function buildFixtureSwingData(bootTeams, fixturesData) {
            const fixtureMap = {};
            bootTeams.forEach(t => { fixtureMap[t.id] = {}; });
            fixturesData.forEach(f => {
                if (!f.event) return;
                if (fixtureMap[f.team_h]) {
                    if (!fixtureMap[f.team_h][f.event]) fixtureMap[f.team_h][f.event] = [];
                    fixtureMap[f.team_h][f.event].push({ opponent: teams[f.team_a]?.short_name || '???', opponentId: f.team_a, fdr: f.team_h_difficulty || 3, isHome: true, finished: f.finished });
                }
                if (fixtureMap[f.team_a]) {
                    if (!fixtureMap[f.team_a][f.event]) fixtureMap[f.team_a][f.event] = [];
                    fixtureMap[f.team_a][f.event].push({ opponent: teams[f.team_h]?.short_name || '???', opponentId: f.team_h, fdr: f.team_a_difficulty || 3, isHome: false, finished: f.finished });
                }
            });
            fixtureSwingData = {};
            const gw = currentGameweek || 1;
            bootTeams.forEach(team => {
                const tfm = fixtureMap[team.id];
                if (!tfm) return;
                const futureGWs = Object.keys(tfm).map(Number).filter(g => g >= gw && tfm[g]?.[0] && !tfm[g][0].finished).sort((a, b) => a - b);
                if (futureGWs.length < 6) return;
                const first3 = futureGWs.slice(0, 3), next3 = futureGWs.slice(3, 6);
                const getAvg = (gws) => {
                    let totalFdr = 0, totalFixtures = 0;
                    gws.forEach(g => {
                        const fx = tfm[g];
                        if (fx && fx.length > 0) {
                            fx.forEach(f => { totalFdr += f.fdr; totalFixtures++; });
                        } else {
                            totalFdr += 3; totalFixtures++;
                        }
                    });
                    return totalFixtures > 0 ? totalFdr / totalFixtures : 3;
                };
                const avgFirst = getAvg(first3), avgNext = getAvg(next3);
                const swing = avgFirst - avgNext;
                if (Math.abs(swing) > 0.3) {
                    fixtureSwingData[team.id] = { swing, direction: swing > 0 ? 'improving' : 'worsening', currentFdr: avgFirst.toFixed(1), futureFdr: avgNext.toFixed(1), swingGW: futureGWs[3] };
                }
            });
            console.log('Fixture swings computed:', Object.keys(fixtureSwingData).length, 'teams with swings');
        }

        // ============================================
        // TEAM ANALYSIS SCORES (3-component xG model)
        // ============================================
        function computeTeamScores(bootTeams, fixturesData) {
            teamAnalysis = {};

            const finishedFixtures = fixturesData
                .filter(f => f.finished && f.team_h_score !== null)
                .sort((a, b) => a.event - b.event);

            const upcomingFixtures = fixturesData
                .filter(f => !f.finished && f.event !== null)
                .sort((a, b) => a.event - b.event);

            bootTeams.forEach(team => {
                const teamId = team.id;

                const pastFixtures = finishedFixtures
                    .filter(f => f.team_h === teamId || f.team_a === teamId);
                const last10 = pastFixtures.slice(-10);
                const last5 = pastFixtures.slice(-5);

                const futureFixtures = upcomingFixtures
                    .filter(f => f.team_h === teamId || f.team_a === teamId)
                    .slice(0, 5);

                let totalScored = 0, totalConceded = 0;
                let homeStats = { goals: 0, conceded: 0, games: 0, cleanSheets: 0 };
                let awayStats = { goals: 0, conceded: 0, games: 0, cleanSheets: 0 };

                last10.forEach(f => {
                    const isHome = f.team_h === teamId;
                    const scored = isHome ? (f.team_h_score || 0) : (f.team_a_score || 0);
                    const conceded = isHome ? (f.team_a_score || 0) : (f.team_h_score || 0);
                    totalScored += scored;
                    totalConceded += conceded;
                    if (isHome) {
                        homeStats.goals += scored; homeStats.conceded += conceded;
                        homeStats.games++; if (conceded === 0) homeStats.cleanSheets++;
                    } else {
                        awayStats.goals += scored; awayStats.conceded += conceded;
                        awayStats.games++; if (conceded === 0) awayStats.cleanSheets++;
                    }
                });

                const gamesPlayed = last10.length || 1;
                const avgGoals = totalScored / gamesPlayed;
                const avgConceded = totalConceded / gamesPlayed;

                // xG data for this team
                const seasonXg = getTeamSeasonXg(teamId);
                const recent6Xg = getTeamXgWindow(teamId, 6);
                const hasRealXg = seasonXg && seasonXg.totalXg > 0;

                // FPL strength ratings (normalized 0-1)
                const fplAttackStrength = (team.strength_attack_home + team.strength_attack_away) / 2;
                const fplDefenseStrength = (team.strength_defence_home + team.strength_defence_away) / 2;
                const fplAttNorm = Math.min(1, Math.max(0, (fplAttackStrength - 900) / 500));
                const fplDefNorm = Math.min(1, Math.max(0, (fplDefenseStrength - 900) / 500));

                // Attack Power (0-100) — 3-component: 35% xG + 35% actual goals + 30% FPL
                let attackPower;
                if (hasRealXg && recent6Xg) {
                    const recentXgRate = Math.min(1, recent6Xg.xGpg / 2.0);
                    const recent6Rate = Math.min(1, recent6Xg.gpg / 2.0);
                    attackPower = Math.round((recentXgRate * 0.35 + recent6Rate * 0.35 + fplAttNorm * 0.30) * 100);
                } else {
                    const goalRate = Math.min(1, avgGoals / 2.0);
                    attackPower = Math.round((goalRate * 0.55 + fplAttNorm * 0.45) * 100);
                }
                attackPower = Math.min(100, Math.max(0, attackPower));

                // Defense Power (0-100) — 3-component: 35% xGC + 35% actual GA + 30% FPL
                let defensePower;
                if (hasRealXg && recent6Xg) {
                    const recentXgcRate = Math.min(1, Math.max(0, 1 - (recent6Xg.xGCpg / 2.0)));
                    const recent6DefRate = Math.min(1, Math.max(0, 1 - (recent6Xg.gapg / 2.0)));
                    defensePower = Math.round((recentXgcRate * 0.35 + recent6DefRate * 0.35 + fplDefNorm * 0.30) * 100);
                } else {
                    const concedeRate = Math.min(1, Math.max(0, 1 - (avgConceded / 2.0)));
                    defensePower = Math.round((concedeRate * 0.55 + fplDefNorm * 0.45) * 100);
                }
                defensePower = Math.min(100, Math.max(0, defensePower));

                // Form Rating (0-100) - recency-weighted W/D/L from last 5
                const formWeights = [5, 4, 3, 2, 1];
                const reversedResults = [...last5].reverse();
                let weightedPts = 0, weightSum = 0;
                let wins = 0, draws = 0, losses = 0;
                reversedResults.forEach((f, i) => {
                    const isHome = f.team_h === teamId;
                    const scored = isHome ? (f.team_h_score || 0) : (f.team_a_score || 0);
                    const conceded = isHome ? (f.team_a_score || 0) : (f.team_h_score || 0);
                    const result = scored > conceded ? 'W' : scored === conceded ? 'D' : 'L';
                    const pts = result === 'W' ? 3 : result === 'D' ? 1 : 0;
                    weightedPts += pts * formWeights[i];
                    weightSum += formWeights[i];
                    if (result === 'W') wins++; else if (result === 'D') draws++; else losses++;
                });
                const maxWeightedPts = 3 * weightSum;
                const formBase = weightSum > 0 ? (weightedPts / maxWeightedPts) * 70 : 35;

                const recentGD = last5.reduce((sum, f) => {
                    const isHome = f.team_h === teamId;
                    return sum + (isHome ? (f.team_h_score || 0) : (f.team_a_score || 0))
                                - (isHome ? (f.team_a_score || 0) : (f.team_h_score || 0));
                }, 0);
                const gdBonus = Math.min(10, Math.max(-10, recentGD * 2));

                let streakBonus = 0;
                for (let i = 0; i < reversedResults.length; i++) {
                    const f = reversedResults[i];
                    const isHome = f.team_h === teamId;
                    const scored = isHome ? (f.team_h_score || 0) : (f.team_a_score || 0);
                    const conceded = isHome ? (f.team_a_score || 0) : (f.team_h_score || 0);
                    if (scored > conceded) streakBonus += 3;
                    else if (scored === conceded) streakBonus += 1;
                    else break;
                }
                streakBonus = Math.min(15, streakBonus);

                const formRating = Math.round(Math.min(100, Math.max(0, formBase + gdBonus + streakBonus)));

                // Fixture Score (0-100)
                let totalFdr = 0;
                const futureDetails = futureFixtures.map(f => {
                    const isHome = f.team_h === teamId;
                    const fdr = isHome ? f.team_h_difficulty : f.team_a_difficulty;
                    totalFdr += fdr || 3;
                    return { fdr: fdr || 3, isHome };
                });
                const avgFdr = futureDetails.length > 0 ? totalFdr / futureDetails.length : 3;
                const homeFixCount = futureDetails.filter(f => f.isHome).length;
                const fixtureScore = Math.round(Math.min(100, Math.max(0,
                    ((5 - avgFdr) / 4) * 85 + (homeFixCount / Math.max(1, futureDetails.length)) * 15)));

                const totalCS = homeStats.cleanSheets + awayStats.cleanSheets;
                const csRate = gamesPlayed > 0 ? totalCS / gamesPlayed : 0;

                const gaPerGame = avgConceded;

                // ── Venue-adjusted attack/defense power (ported from teams-analysis) ──
                const fplAttHomeNorm = Math.min(1, Math.max(0, (team.strength_attack_home - 900) / 500));
                const fplAttAwayNorm = Math.min(1, Math.max(0, (team.strength_attack_away - 900) / 500));
                const fplDefHomeNorm = Math.min(1, Math.max(0, (team.strength_defence_home - 900) / 500));
                const fplDefAwayNorm = Math.min(1, Math.max(0, (team.strength_defence_away - 900) / 500));

                const attackPowerHome = homeStats.games > 0 ? Math.round(Math.min(100, Math.max(0, (
                    Math.min(1, homeStats.goals / homeStats.games / 2.0) * 0.35 +
                    (hasRealXg && recent6Xg ? Math.min(1, recent6Xg.xGpg / 2.0) * 0.35 : Math.min(1, homeStats.goals / homeStats.games / 2.0) * 0.35) +
                    fplAttHomeNorm * 0.30
                ) * 100))) : attackPower;

                const attackPowerAway = awayStats.games > 0 ? Math.round(Math.min(100, Math.max(0, (
                    Math.min(1, awayStats.goals / awayStats.games / 2.0) * 0.35 +
                    (hasRealXg && recent6Xg ? Math.min(1, recent6Xg.xGpg / 2.0) * 0.35 : Math.min(1, awayStats.goals / awayStats.games / 2.0) * 0.35) +
                    fplAttAwayNorm * 0.30
                ) * 100))) : attackPower;

                const homeGaConcededRate = homeStats.games > 0 ? Math.min(1, Math.max(0, 1 - (homeStats.conceded / homeStats.games / 2.0))) : 0.5;
                const awayGaConcededRate = awayStats.games > 0 ? Math.min(1, Math.max(0, 1 - (awayStats.conceded / awayStats.games / 2.0))) : 0.5;
                const xgcHomeComponent = hasRealXg && recent6Xg ? Math.min(1, Math.max(0, 1 - (recent6Xg.xGCpg / 2.0))) : homeGaConcededRate;
                const xgcAwayComponent = hasRealXg && recent6Xg ? Math.min(1, Math.max(0, 1 - (recent6Xg.xGCpg / 2.0))) : awayGaConcededRate;

                const defensePowerHome = homeStats.games > 0 ? Math.round(Math.min(100, Math.max(0, (
                    homeGaConcededRate * 0.35 + xgcHomeComponent * 0.35 + fplDefHomeNorm * 0.30
                ) * 100))) : defensePower;

                const defensePowerAway = awayStats.games > 0 ? Math.round(Math.min(100, Math.max(0, (
                    awayGaConcededRate * 0.35 + xgcAwayComponent * 0.35 + fplDefAwayNorm * 0.30
                ) * 100))) : defensePower;

                // ── xG trend data (ported from teams-analysis) ──
                let xgTrend = 'stable', xgcTrend = 'stable';
                if (recent6Xg && seasonXg && (seasonXg.games || 0) >= 10) {
                    const xgDelta = recent6Xg.xGpg - seasonXg.xGpg;
                    if (xgDelta > 0.25) xgTrend = 'rising';
                    else if (xgDelta < -0.25) xgTrend = 'falling';
                    const xgcDelta = recent6Xg.xGCpg - seasonXg.xGCpg;
                    if (xgcDelta < -0.20) xgcTrend = 'improving';
                    else if (xgcDelta > 0.20) xgcTrend = 'worsening';
                }

                teamAnalysis[teamId] = {
                    attackPower, defensePower, formRating, fixtureScore,
                    attackPowerHome, attackPowerAway, defensePowerHome, defensePowerAway,
                    xgTrend, xgcTrend, xgTrendDelta: recent6Xg && seasonXg ? recent6Xg.xGpg - seasonXg.xGpg : 0,
                    xgcTrendDelta: recent6Xg && seasonXg ? seasonXg.xGCpg - recent6Xg.xGCpg : 0,
                    avgGoals, avgConceded, avgFdr, csRate, gaPerGame,
                    wins, draws, losses, gamesPlayed,
                    teamName: team.short_name || team.name
                };
            });
            console.log('Team analysis computed for', Object.keys(teamAnalysis).length, 'teams (3-component xG model)');
        }

        // Wraps a player's lastSeason cumulative totals in the same shape calculateStats()
        // returns, so preseason code paths that expect a season/l5 object (e.g. the All
        // Players table) can consume last-season data without any changes of their own.
        function lastSeasonAsStatsShape(lastSeason) {
            const ls = lastSeason || {};
            return {
                games: 1,
                minutes: ls.minutes || 0,
                points: ls.totalPoints || 0,
                goals: ls.goals || 0,
                assists: ls.assists || 0,
                cleanSheets: ls.cleanSheets || 0,
                goalsConceded: ls.goalsConceded || 0,
                saves: ls.saves || 0,
                bonus: ls.bonus || 0,
                bps: ls.bps || 0,
                xG: ls.xG || 0,
                xA: ls.xA || 0,
                xGI: ls.xGI || 0,
                xGC: 0,
                penaltiesSaved: 0,
                penaltiesMissed: 0,
                bigChancesCreated: null,
                _bigChancesCreatedEst: Math.round((ls.xA || 0) * 2),
                bigChancesMissed: null,
                _bigChancesMissedEst: Math.round((ls.xG || 0) * 0.8),
                keyPasses: null,
                _keyPassesEst: Math.round((ls.xA || 0) * 5),
                ict: ls.ictIndex || 0,
                influence: 0,
                creativity: 0,
                threat: 0,
                homeSplit: null,
                awaySplit: null
            };
        }

        function detectCurrentGameweek(analyses) {
            const maxGames = Math.max(...analyses.map(a => a.season?.games || 0));
            return Math.min(38, Math.max(1, maxGames));
        }

        function getSeasonPhase(gw) {
            if (gw <= 10) return 'early';
            if (gw >= 30) return 'late';
            return 'mid';
        }

        // ============================================
        // SHARED ELIGIBILITY LOGIC (Task 3)
        // ============================================
        /**
         * Central eligibility check for player recommendations/captaincy.
         * @param {Object} p - Player analysis object
         * @param {Object} opts - Options to override thresholds
         * @param {boolean} opts.checkAvailability - Enforce availability filter (status + chance >= 75%)
         * @param {boolean} opts.checkStarters - Enforce regular starter filter (>= 45 min/game L5)
         * @param {number} opts.minGames - Minimum L5 games played (default: 3)
         * @returns {boolean}
         */
        // Most games any player has on record. The three-game minimum below is a
        // quality bar, not a rule of the game, and early in a season nobody can
        // meet it — so it is clamped to what the season has actually produced.
        let seasonGamesAvailable = 0;

        // Games on record across the whole season, used to tell "nobody qualifies"
        // apart from "the season is too young for this question".
        let seasonGamesPlayed = 0;

        function computeSeasonGamesAvailable(analyses) {
            seasonGamesAvailable = (analyses || []).reduce((max, a) => Math.max(max, a.l5?.games || 0), 0);
            seasonGamesPlayed = (analyses || []).reduce((max, a) => Math.max(max, a.season?.games || 0), 0);
            return seasonGamesAvailable;
        }

        // Rising Form and Purple Patch both measure a player against their own
        // season baseline, so neither can say anything until that baseline exists.
        // Reporting "no players found" implies we looked; this says we cannot look
        // yet, and when we will be able to.
        function seasonTooYoungNotice(requiredSeasonGames, label, explanation) {
            if (seasonGamesPlayed >= requiredSeasonGames) return null;
            const played = seasonGamesPlayed;
            return `<div class="no-players season-young">
                <strong>${escHTML(label)} needs more of the season played.</strong><br>
                ${escHTML(explanation)}
                It needs ${requiredSeasonGames} gameweeks of history and there ${played === 1 ? 'is' : 'are'} ${played} so far,
                so this fills in from around GW${requiredSeasonGames + 1}.
            </div>`;
        }

        function isPlayerEligible(p, opts = {}) {
            const checkAvailability = opts.checkAvailability ?? globalFilters.availability;
            const checkStarters = opts.checkStarters ?? globalFilters.starters;
            // Never ask for more games than exist. At three gameweeks and beyond
            // this is the usual 3 and nothing changes; before that it relaxes to
            // however many have been played, instead of rejecting the entire league
            // and rendering "No players found" in every section on the page.
            const requested = opts.minGames ?? 3;
            const minGames = Math.min(requested, Math.max(seasonGamesAvailable, 1));

            // Must have minimum games
            if ((p.l5?.games || 0) < minGames) return false;

            // Availability filter: exclude injured/suspended/unavailable
            if (checkAvailability) {
                const suspendedOrOut = ['s', 'u', 'n'].includes(p.status);
                if (suspendedOrOut) return false;

                // chance_of_playing_next_round: null means "no news" (treat as available)
                // 0 = will not play, 25 = 25% chance, 50, 75, 100
                const chance = p.chanceNextRound;
                if (chance !== null && chance !== undefined && chance < 75) return false;
            }

            // Regular starters filter: average >= 45 mins/game in L5
            if (checkStarters) {
                const minsPerGame = (p.l5?.minutes || 0) / (p.l5?.games || 1);
                if (minsPerGame < 45) return false;
            }

            return true;
        }

        // (Global filter toggles removed — filters were taking up space without enough utility)

        // ============================================
        // PRE-COMPUTE DATA FOR CROSS-WIRING INTO RECOMMENDATIONS
        // ============================================

        /**
         * Pre-computes rising form scores for all players and stores in window._risingFormScores.
         * This allows calculatePositionScore to reward players with rising momentum.
         */
        function precomputeRisingFormScores(analyses) {
            window._risingFormScores = {};
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            analyses.forEach(p => {
                if ((p.l5?.games || 0) < 3 || (p.season?.games || 0) < 6) return;
                if ((p.l5?.minutes || 0) < 180) return;
                if (p.status !== 'a') return;
                const l5PPG = (p.l5?.points || 0) / (p.l5?.games || 1);
                const seasonPPG = (p.season?.points || 0) / (p.season?.games || 1);
                if (l5PPG <= seasonPPG * 1.15) return;
                const pos = posMap[p.position];
                if (pos === 'MID' || pos === 'FWD') {
                    const l5XGIper90 = (p.l5?.xGI || 0) / ((p.l5?.minutes || 1) / 90);
                    if (l5XGIper90 <= 0.2) return;
                }
                const isDefPos = (pos === 'GK' || pos === 'DEF');
                let risingScore = 0;

                // Pillar 1: Team form
                const ts = p.teamScores;
                if (ts && ts.formRating > 55) risingScore += Math.min(9, ((ts.formRating - 55) / 45) * 9) * 1.5;

                // Pillar 1b: Team xG trend
                const seasonXg = getTeamSeasonXg(p.teamId);
                const recent6Xg = getTeamXgWindow(p.teamId, 6);
                if (recent6Xg && seasonXg && (seasonXg.games || 0) >= 10) {
                    if (isDefPos) {
                        const xgcDelta = seasonXg.xGCpg - recent6Xg.xGCpg;
                        if (xgcDelta > 0.10) risingScore += Math.min(10, (xgcDelta / 0.6) * 10) * 2;
                    } else {
                        const xgDelta = recent6Xg.xGpg - seasonXg.xGpg;
                        if (xgDelta > 0.10) risingScore += Math.min(10, (xgDelta / 0.6) * 10) * 2;
                    }
                }

                // Pillar 2: Fixture swing
                const swing = fixtureSwingData[p.teamId];
                if (swing && swing.direction === 'improving') risingScore += Math.min(10, Math.abs(swing.swing) * 4) * 2.5;
                const avgFdr = p.fixtures?.avgFDR3 || 3;
                if (avgFdr <= 2.5) risingScore += Math.min(8, (3 - avgFdr) * 6) * 1.2;

                // Pillar 3: Player stats improving (simplified — L3 vs season trend)
                const history = p.history || [];
                if (history.length >= 5) {
                    const last5Pts = history.slice(-5).map(g => parseFloat(g.total_points) || 0);
                    const l3Avg = last5Pts.slice(-3).reduce((s, v) => s + v, 0) / 3;
                    const p2Avg = last5Pts.slice(0, 2).reduce((s, v) => s + v, 0) / 2;
                    if (l3Avg > p2Avg + 1) risingScore += Math.min(8, (l3Avg - p2Avg) * 1.5);
                }

                if (risingScore >= 6) window._risingFormScores[p.id] = risingScore;
            });
        }

        /**
         * Pre-computes routes-to-points data for all players and stores in window._routesData.
         * This allows calculatePositionScore to reward players with multiple reliable routes.
         */
        function precomputeRoutesData(analyses) {
            window._routesData = {};
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            const goalPts = { GK: 6, DEF: 6, MID: 5, FWD: 4 };

            analyses.filter(p => isPlayerEligible(p, { minGames: 3 })).forEach(p => {
                const pos = posMap[p.position];
                const g5 = p.l5?.games || 1;
                const gS = p.season?.games || g5;
                const blend = (l5val, sVal) => (l5val / g5) * 0.6 + (sVal / gS) * 0.4;

                const xGpg = blend(p.l5?.xG || 0, p.season?.xG || 0);
                const xApg = blend(p.l5?.xA || 0, p.season?.xA || 0);
                const goalsPg = blend(p.l5?.goals || 0, p.season?.goals || 0);
                const assistsPg = blend(p.l5?.assists || 0, p.season?.assists || 0);
                const csPg = blend(p.l5?.cleanSheets || 0, p.season?.cleanSheets || 0);
                const bonusPg = blend(p.l5?.bonus || 0, p.season?.bonus || 0);
                const savesPg = blend(p.l5?.saves || 0, p.season?.saves || 0);
                const creativityPg = blend(p.l5?.creativity || 0, p.season?.creativity || 0);

                const goalThresh = { GK: 0.03, DEF: 0.06, MID: 0.12, FWD: 0.15 }[pos];
                const assistThresh = { GK: 0.02, DEF: 0.06, MID: 0.10, FWD: 0.08 }[pos];
                const csThresh = { GK: 0.15, DEF: 0.15, MID: 0.30, FWD: 999 }[pos];
                const bonusThresh = { GK: 0.3, DEF: 0.3, MID: 0.4, FWD: 0.5 }[pos];

                let routeCount = 0;
                let weightedSum = 0;

                if (xGpg >= goalThresh || goalsPg >= goalThresh * 1.5) {
                    const ceiling = pos === 'FWD' ? 0.6 : pos === 'MID' ? 0.5 : 0.3;
                    routeCount++; weightedSum += Math.min(10, (xGpg / ceiling) * 10) * goalPts[pos];
                }
                if (xApg >= assistThresh || assistsPg >= assistThresh * 1.5) {
                    const ceiling = pos === 'MID' ? 0.4 : 0.3;
                    routeCount++; weightedSum += Math.min(10, (xApg / ceiling) * 10) * 3;
                }
                if (csPg >= csThresh) {
                    const ptWeight = { GK: 4, DEF: 4, MID: 1, FWD: 0 }[pos];
                    routeCount++; weightedSum += Math.min(10, (csPg / 0.55) * 10) * ptWeight;
                }
                if (bonusPg >= bonusThresh) {
                    routeCount++; weightedSum += Math.min(10, (bonusPg / 2) * 10) * 2;
                }
                if (pos === 'GK' && savesPg >= 2) {
                    routeCount++; weightedSum += Math.min(10, (savesPg / 5) * 10) * 1.5;
                }
                if (creativityPg >= 12 && (pos === 'MID' || pos === 'DEF')) {
                    routeCount++; weightedSum += Math.min(10, (creativityPg / 45) * 10) * 1.5;
                }

                if (routeCount >= 2) {
                    window._routesData[p.id] = { routeCount, compositeScore: weightedSum };
                }
            });
        }

        // ============================================
        // ROUTES TO POINTS
        // ============================================
        // Per-game rates a player of this position produces on average. Thin
        // samples get regressed toward these so one good afternoon does not read
        // as a season-long rate. Shared by the recommendations xP model and the
        // routes point-source breakdown so the two never disagree.
        const POS_RATE_BASELINE = {
            GK:  { xG: 0.00, xA: 0.01, cs: 0.28, bonus: 0.25, saves: 2.80, gc: 1.35 },
            DEF: { xG: 0.03, xA: 0.04, cs: 0.28, bonus: 0.20, saves: 0.00, gc: 1.35 },
            MID: { xG: 0.08, xA: 0.09, cs: 0.28, bonus: 0.25, saves: 0.00, gc: 1.35 },
            FWD: { xG: 0.15, xA: 0.07, cs: 0.00, bonus: 0.30, saves: 0.00, gc: 1.35 }
        };
        function posRateBaseline(pos) {
            return POS_RATE_BASELINE[pos] || { xG: 0.08, xA: 0.08, cs: 0.25, bonus: 0.25, saves: 0, gc: 1.35 };
        }

        /* The baseline above says every midfielder is the same midfielder until
           proven otherwise, which with one gameweek played is three quarters of
           the projection. It is not true and the market says so: across the pool
           price and FPL's own ep_next correlate at +0.89, a single gameweek's
           xGI/90 at +0.32. Left flat, one goal from a £5.5m player outranked a
           quiet afternoon from a £12.0m one.

           Same exponents and clamp as the squad projection in pitch-snapshot.js,
           fitted from minutes-pooled price deciles. Attacking rates only — clean
           sheets and saves come from the team model, not from what a player cost.
           Scales the prior alone, so it fades out as evidence arrives. */
        const PRICE_PRIOR_K = { GK: 0, DEF: 1.5, MID: 1.5, FWD: 1.0 };
        const PRICE_PRIOR_CLAMP = [0.6, 2.4];
        let _medPriceByPos = null;

        function medianPriceForPos(pos) {
            if (!_medPriceByPos) {
                const pool = typeof allAnalyses !== 'undefined' ? allAnalyses : [];
                // Nothing to measure yet. Return neutral WITHOUT caching, or the
                // empty answer sticks for the life of the page and the prior
                // silently reverts to price-blind.
                if (!pool.length) return 0;
                const built = {};
                const posName = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
                // Match the squad model's filter: enough minutes to be a real option.
                const minMinutes = Math.min(200, Math.max((currentGameweek || 1) - 1, 1) * 60);
                ['GK', 'DEF', 'MID', 'FWD'].forEach(pn => {
                    const of = pool.filter(p => posName[p.position] === pn);
                    let prices = of.filter(p => (p.lastSeason?.minutes || 0) >= minMinutes).map(p => p.price);
                    // Early in a season the minutes bar can empty a position; fall
                    // back to the whole position rather than to no reference at all.
                    if (prices.length < 5) prices = of.map(p => p.price);
                    prices.sort((a, b) => a - b);
                    built[pn] = prices.length ? prices[Math.floor(prices.length / 2)] : 0;
                });
                _medPriceByPos = built;
            }
            return _medPriceByPos[pos] || 0;
        }

        function priceQualityMultiplier(price, pos) {
            const k = PRICE_PRIOR_K[pos] || 0;
            if (!k || !price) return 1;
            const med = medianPriceForPos(pos);
            if (!med) return 1;
            const m = Math.pow(price / med, k);
            return Math.max(PRICE_PRIOR_CLAMP[0], Math.min(PRICE_PRIOR_CLAMP[1], m));
        }

        // Preseason fallback: route diversity computed from last season's raw totals
        // instead of the blended L5/season model (which needs current-season data).
        function renderLastSeasonRoutes(analyses) {
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            const banner = renderSeasonNotice('Routes to Points blends recent and season-long trends, which need this season’s data. Showing last season’s route breakdown instead.');

            const scored = analyses
                .filter(p => p.status === 'a')
                .map(p => {
                    const ls = p.lastSeason || {};
                    const pos = posMap[p.position];
                    const routes = [];
                    if ((ls.goals || 0) >= 3) routes.push({ label: 'Goals', detail: `${ls.goals} last season` });
                    if ((ls.assists || 0) >= 3) routes.push({ label: 'Assists', detail: `${ls.assists} last season` });
                    if ((pos === 'GK' || pos === 'DEF') && (ls.cleanSheets || 0) >= 5) routes.push({ label: 'Clean Sheets', detail: `${ls.cleanSheets} last season` });
                    if ((ls.bonus || 0) >= 8) routes.push({ label: 'Bonus', detail: `${ls.bonus} last season` });
                    return { ...p, routes };
                })
                .filter(p => p.routes.length >= 2)
                .sort((a, b) => (b.lastSeason?.totalPoints || 0) - (a.lastSeason?.totalPoints || 0));

            const posColors = { GK: '#FBBF24', DEF: '#34D399', MID: '#60A5FA', FWD: '#F87171' };
            const cards = scored.slice(0, 24).map((p, i) => `
                <div class="route-card" onclick="openPlayerModal(${p.id})">
                    ${getStarHtml(p.id, 'shortlist-star-card')}
                    <div class="route-card-top">
                        <div class="route-card-rank">${i + 1}</div>
                        <div class="route-card-player">
                            <div class="route-card-name">${escHTML(p.name)}</div>
                            <div class="route-card-meta">
                                <span class="route-pos-badge" style="background: ${posColors[posMap[p.position]]}20; color: ${posColors[posMap[p.position]]}">${posMap[p.position]}</span>
                                ${escHTML(p.team)} &middot; £${p.price.toFixed(1)}m
                            </div>
                        </div>
                        <div class="route-card-score" title="Number of distinct scoring routes last season">
                            <div class="route-score-number">${p.routes.length}</div>
                            <div class="route-score-label">routes</div>
                        </div>
                    </div>
                    <div class="route-card-bars">
                        ${p.routes.map(r => `
                            <div class="route-bar-row" title="${r.label}: ${r.detail}">
                                <span class="route-bar-name">${r.label}</span>
                                <span class="route-bar-detail">${r.detail}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="route-card-footer">
                        <span>${p.lastSeason?.totalPoints || 0} pts (25/26)</span>
                    </div>
                </div>
            `).join('');

            return `${banner}<div class="routes-grid">${cards || '<div class="no-players">No players with 2+ last-season routes found</div>'}</div>`;
        }

        function generateRoutesToPoints(analyses) {
            if (isPreseason) {
                return renderLastSeasonRoutes(analyses);
            }
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };

            // FPL point values per route (used to weight composite score)
            // Goals: GK/DEF=6, MID=5, FWD=4. Assists: 3. CS: GK/DEF=4, MID=1. Bonus: 1-3. Saves: 1 per 3.
            const goalPts = { GK: 6, DEF: 6, MID: 5, FWD: 4 };
            const csPts  = { GK: 4, DEF: 4, MID: 1, FWD: 0 };

            // Compute routes for each eligible player
            const scored = analyses
                .filter(p => isPlayerEligible(p, { minGames: 3 }))
                .map(p => {
                    const pos = posMap[p.position];
                    const g5 = p.l5?.games || 1;
                    const gS = p.season?.games || g5;

                    // Blend L5 (60%) + Season (40%) for robustness — per-game metrics
                    const blend = (l5val, sVal) => {
                        const l5pg = l5val / g5;
                        const spg = sVal / gS;
                        return l5pg * 0.6 + spg * 0.4;
                    };

                    const xGpg = blend(p.l5?.xG || 0, p.season?.xG || 0);
                    const xApg = blend(p.l5?.xA || 0, p.season?.xA || 0);
                    const goalsPg = blend(p.l5?.goals || 0, p.season?.goals || 0);
                    const assistsPg = blend(p.l5?.assists || 0, p.season?.assists || 0);
                    const csPg = blend(p.l5?.cleanSheets || 0, p.season?.cleanSheets || 0);
                    const bonusPg = blend(p.l5?.bonus || 0, p.season?.bonus || 0);
                    const savesPg = blend(p.l5?.saves || 0, p.season?.saves || 0);
                    const minsPg = blend(p.l5?.minutes || 0, p.season?.minutes || 0);
                    const creativityPg = blend(p.l5?.creativity || 0, p.season?.creativity || 0);

                    // Penalty duty is published — penalties_order, 1 for the first
                    // choice. This used to be inferred from a goals-minus-xG gap,
                    // which guessed at something the API states outright and was
                    // worthless early in a season when that gap is one match wide.
                    const penOrder = p.penaltiesOrder;
                    const isPenTaker = penOrder != null && penOrder <= 2;
                    const penAttempts = (p.season?.penaltiesMissed || 0)
                        + Math.max(0, Math.round((p.season?.goals || 0) - (p.season?.xG || 0)));

                    // Consistency: std deviation of per-game points in L5
                    let consistency = 0;
                    if (p.history && p.history.length >= 5) {
                        const last5 = p.history.slice(-5);
                        const pts = last5.map(g => parseFloat(g.total_points) || 0);
                        const mean = pts.reduce((s, v) => s + v, 0) / pts.length;
                        const variance = pts.reduce((s, v) => s + (v - mean) ** 2, 0) / pts.length;
                        const stdDev = Math.sqrt(variance);
                        // Lower stdDev = more consistent. Convert to 0-10 score (stdDev of ~5 is normal)
                        consistency = Math.max(0, Math.min(10, (1 - stdDev / 6) * 10));
                    }

                    // Nailed-on multiplier (not a route): 0.85-1.15 range
                    const nailedMultiplier = minsPg >= 85 ? 1.15 : minsPg >= 75 ? 1.07 : minsPg >= 60 ? 1.0 : 0.85;

                    // Position-specific thresholds
                    const goalThresh = { GK: 0.03, DEF: 0.06, MID: 0.12, FWD: 0.15 }[pos];
                    const assistThresh = { GK: 0.02, DEF: 0.06, MID: 0.10, FWD: 0.08 }[pos];
                    const csThresh = { GK: 0.15, DEF: 0.15, MID: 0.30, FWD: 999 }[pos]; // FWD can't use CS route
                    const bonusThresh = { GK: 0.3, DEF: 0.3, MID: 0.4, FWD: 0.5 }[pos];

                    // Define routes: each has a name, icon, strength (0-10), point weight, and detail
                    const routes = [];
