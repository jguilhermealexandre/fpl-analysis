<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | FPL Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Surfaces */
            --surface-bg: #0A0E14;
            --surface-0: #0D1117;
            --surface-1: #161B22;
            --surface-2: #1C2128;
            --surface-3: #21262D;
            --surface-4: #30363D;
            
            /* Text */
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-muted: rgba(255, 255, 255, 0.45);
            
            /* Borders */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.10);
            --border-emphasis: rgba(255, 255, 255, 0.16);
            
            /* Semantic */
            --color-success: #4ADE80;
            --color-error: #F87171;
            --color-warning: #FBBF24;
            --color-info: #60A5FA;
            
            /* FDR Scale */
            --fdr-1: #4ADE80;
            --fdr-2: #86EFAC;
            --fdr-3: #A3A3A3;
            --fdr-4: #FB923C;
            --fdr-5: #EF4444;
            
            /* Position colors */
            --position-gk: #FCD34D;
            --position-def: #34D399;
            --position-mid: #60A5FA;
            --position-fwd: #F87171;
            
            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            
            /* Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            background: var(--surface-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ===== TOP NAVIGATION ===== */
        .top-nav {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-6);
            display: flex;
            align-items: center;
            height: 56px;
            gap: var(--space-8);
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .nav-logo span { color: var(--color-success); }

        .nav-links {
            display: flex;
            gap: var(--space-1);
        }

        .nav-link {
            padding: var(--space-2) var(--space-4);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all 150ms ease-out;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: var(--surface-2);
        }

        .nav-link.active {
            color: var(--color-success);
            background: rgba(74, 222, 128, 0.1);
        }

        .nav-link .icon { font-size: 16px; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
            gap: var(--space-4);
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-3) var(--space-4);
            padding-left: 40px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            width: 280px;
            transition: all 200ms ease-out;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-info);
            width: 320px;
        }

        .search-input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
        }

        .position-filters {
            display: flex;
            gap: var(--space-1);
            background: var(--surface-1);
            padding: var(--space-1);
            border-radius: var(--radius-md);
        }

        .pos-btn {
            padding: var(--space-2) var(--space-4);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 150ms ease-out;
        }

        .pos-btn:hover { color: var(--text-primary); }
        .pos-btn.active { background: var(--surface-3); color: var(--text-primary); }
        .pos-btn.active[data-pos="GK"] { color: var(--position-gk); }
        .pos-btn.active[data-pos="DEF"] { color: var(--position-def); }
        .pos-btn.active[data-pos="MID"] { color: var(--position-mid); }
        .pos-btn.active[data-pos="FWD"] { color: var(--position-fwd); }

        .filter-dropdowns {
            display: flex;
            gap: var(--space-3);
            margin-left: auto;
        }

        .filter-select {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-4);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--color-info);
        }

        /* ===== QUICK PICKS SECTION ===== */
        .quick-picks {
            margin-bottom: var(--space-8);
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .picks-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-4);
        }

        @media (max-width: 1000px) {
            .picks-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .picks-grid { grid-template-columns: 1fr; }
        }

        .pick-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            transition: all 200ms ease-out;
        }

        .pick-card:hover {
            border-color: var(--border-emphasis);
            transform: translateY(-2px);
        }

        .pick-header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .pick-header.captain { color: var(--color-warning); }
        .pick-header.value { color: var(--color-success); }
        .pick-header.differential { color: var(--color-info); }
        .pick-header.consistent { color: #C084FC; }

        .pick-player {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .player-badge {
            width: 48px;
            height: 48px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .player-info { flex: 1; }

        .player-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .player-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .player-score {
            text-align: right;
        }

        .score-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
        }

        .score-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ===== PLAYERS TABLE ===== */
        .table-section {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4);
            border-bottom: 1px solid var(--border-default);
        }

        .table-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .table-actions {
            display: flex;
            gap: var(--space-3);
        }

        .column-toggle {
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-3);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 150ms ease-out;
        }

        .column-toggle:hover {
            background: var(--surface-3);
            color: var(--text-primary);
        }

        .table-container {
            overflow-x: auto;
        }

        .players-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .players-table th {
            background: var(--surface-2);
            padding: var(--space-3) var(--space-4);
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            transition: background 150ms ease-out;
            position: sticky;
            top: 0;
        }

        .players-table th:hover {
            background: var(--surface-3);
        }

        .players-table th.sorted {
            color: var(--color-info);
        }

        .players-table td {
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--border-subtle);
            white-space: nowrap;
        }

        .players-table tr:hover {
            background: var(--surface-2);
        }

        .players-table .player-cell {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .player-cell .team-badge {
            width: 24px;
            height: 24px;
            border-radius: var(--radius-sm);
            object-fit: contain;
        }

        .player-cell .name {
            font-weight: 500;
        }

        .pos-badge {
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: 700;
        }

        .pos-badge.gk { background: rgba(252, 211, 77, 0.2); color: var(--position-gk); }
        .pos-badge.def { background: rgba(52, 211, 153, 0.2); color: var(--position-def); }
        .pos-badge.mid { background: rgba(96, 165, 250, 0.2); color: var(--position-mid); }
        .pos-badge.fwd { background: rgba(248, 113, 113, 0.2); color: var(--position-fwd); }

        .form-dots {
            display: flex;
            gap: 3px;
        }

        .form-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .form-dot.high { background: var(--color-success); }
        .form-dot.mid { background: var(--color-warning); }
        .form-dot.low { background: var(--color-error); }

        .fdr-mini {
            display: flex;
            gap: 2px;
        }

        .fdr-pip {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
        }

        .fdr-pip.fdr-1 { background: var(--fdr-1); }
        .fdr-pip.fdr-2 { background: var(--fdr-2); }
        .fdr-pip.fdr-3 { background: var(--fdr-3); }
        .fdr-pip.fdr-4 { background: var(--fdr-4); }
        .fdr-pip.fdr-5 { background: var(--fdr-5); }

        .stat-good { color: var(--color-success); }
        .stat-bad { color: var(--color-error); }

        /* ===== COMPARE PANEL ===== */
        .compare-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-1);
            border-top: 1px solid var(--border-emphasis);
            padding: var(--space-4) var(--space-6);
            transform: translateY(100%);
            transition: transform 300ms ease-out;
            z-index: 50;
        }

        .compare-panel.show {
            transform: translateY(0);
        }

        .compare-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .compare-players {
            display: flex;
            gap: var(--space-3);
            flex: 1;
        }

        .compare-chip {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: var(--surface-2);
            border-radius: var(--radius-md);
            font-size: 13px;
        }

        .compare-chip .remove {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
        }

        .compare-chip .remove:hover {
            color: var(--color-error);
        }

        .compare-btn {
            background: var(--color-info);
            color: #000;
            border: none;
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease-out;
        }

        .compare-btn:hover {
            transform: scale(1.02);
        }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 20, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease-out;
        }

        .loading-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .loader {
            text-align: center;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-3);
            border-top-color: var(--color-success);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto var(--space-4);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 var(--space-4);
                gap: var(--space-4);
            }

            .nav-link span:not(.icon) { display: none; }
            .nav-link { padding: var(--space-2); }

            .page-header { flex-direction: column; }
            
            .search-input { width: 100%; }
            .search-input:focus { width: 100%; }

            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-dropdowns { margin-left: 0; }

            .page-title { font-size: 22px; }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: var(--space-8);
            color: var(--text-muted);
        }

        /* Tooltip */
        .tooltip {
            position: relative;
        }

        .tooltip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-4);
            color: var(--text-primary);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
            font-size: 11px;
            white-space: nowrap;
            z-index: 10;
            margin-bottom: 4px;
        }

        /* Checkbox styling */
        .compare-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--color-info);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading players data...</div>
        </div>
    </div>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span>⚡</span> FPL Analysis
            </a>
            <div class="nav-links">
                <a href="fpl-transfer-wizard.html" class="nav-link">
                    <span class="icon">🧙</span>
                    <span>Wizard</span>
                </a>
                <a href="fpl-my-team-analysis.html" class="nav-link">
                    <span class="icon">⚽</span>
                    <span>My Team</span>
                </a>
                <a href="fpl-players-analysis.html" class="nav-link active">
                    <span class="icon">👤</span>
                    <span>Players</span>
                </a>
                <a href="fpl-teams-analysis.html" class="nav-link">
                    <span class="icon">📊</span>
                    <span>Teams</span>
                </a>
                <a href="fpl-league-rivals.html" class="nav-link">
                    <span class="icon">🏆</span>
                    <span>Rivals</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <header class="page-header">
            <div>
                <h1 class="page-title">Players Analysis</h1>
                <p class="page-subtitle">Stats, form trends, and fixture difficulty for all Premier League players</p>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="Search players..." id="searchInput">
            </div>
        </header>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="position-filters">
                <button class="pos-btn active" data-pos="ALL">All</button>
                <button class="pos-btn" data-pos="GK">GK</button>
                <button class="pos-btn" data-pos="DEF">DEF</button>
                <button class="pos-btn" data-pos="MID">MID</button>
                <button class="pos-btn" data-pos="FWD">FWD</button>
            </div>
            <div class="filter-dropdowns">
                <select class="filter-select" id="priceFilter">
                    <option value="">All Prices</option>
                    <option value="0-5">Under £5.0m</option>
                    <option value="5-7">£5.0m - £7.0m</option>
                    <option value="7-10">£7.0m - £10.0m</option>
                    <option value="10-99">Over £10.0m</option>
                </select>
                <select class="filter-select" id="teamFilter">
                    <option value="">All Teams</option>
                </select>
                <select class="filter-select" id="sortBy">
                    <option value="total_points">Total Points</option>
                    <option value="form">Form</option>
                    <option value="pts_per_game">Pts/Game</option>
                    <option value="xgi">xGI (L5)</option>
                    <option value="value">Value (Pts/£m)</option>
                    <option value="ownership">Ownership</option>
                </select>
            </div>
        </div>

        <!-- Quick Picks -->
        <section class="quick-picks">
            <h2 class="section-title">⚡ Quick Picks</h2>
            <div class="picks-grid" id="quickPicks">
                <!-- Generated by JS -->
            </div>
        </section>

        <!-- Players Table -->
        <section class="table-section">
            <div class="table-header">
                <div class="table-title">
                    <span id="tableTitle">All Players</span>
                    <span style="color: var(--text-muted); font-weight: 400;" id="playerCount"></span>
                </div>
                <div class="table-actions">
                    <button class="column-toggle" id="toggleColumns">⚙️ Columns</button>
                </div>
            </div>
            <div class="table-container">
                <table class="players-table" id="playersTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Compare Panel -->
    <div class="compare-panel" id="comparePanel">
        <div class="compare-content">
            <span style="color: var(--text-muted); font-size: 13px;">Compare:</span>
            <div class="compare-players" id="comparePlayers"></div>
            <button class="compare-btn" id="compareBtn">Compare Players</button>
        </div>
    </div>

    <script>
        // ===== GLOBALS =====
        let allPlayers = [];
        let filteredPlayers = [];
        let teams = {};
        let teamFixtures = {};
        let selectedForCompare = [];
        let currentPosition = 'ALL';
        let currentSort = 'total_points';
        let sortDirection = 'desc';

        // Position mapping
        const POSITIONS = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
        const POS_COLORS = { GK: 'gk', DEF: 'def', MID: 'mid', FWD: 'fwd' };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
            initSearch();
            loadData();
        });

        function initFilters() {
            // Position filters
            document.querySelectorAll('.pos-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPosition = btn.dataset.pos;
                    applyFilters();
                });
            });

            // Dropdown filters
            document.getElementById('priceFilter').addEventListener('change', applyFilters);
            document.getElementById('teamFilter').addEventListener('change', applyFilters);
            document.getElementById('sortBy').addEventListener('change', (e) => {
                currentSort = e.target.value;
                applyFilters();
            });
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            let debounce;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounce);
                debounce = setTimeout(() => {
                    applyFilters();
                }, 200);
            });
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        // ===== DATA LOADING =====
        async function loadData() {
            try {
                showLoading(true);

                // Load from static files
                const [playersRes, fixturesRes] = await Promise.all([
                    fetch('data/players-data.json'),
                    fetch('data/fixtures.json')
                ]);

                if (!playersRes.ok || !fixturesRes.ok) {
                    throw new Error('Failed to load data files');
                }

                const playersData = await playersRes.json();
                const fixturesData = await fixturesRes.json();

                // Build teams object
                playersData.teams.forEach(team => {
                    teams[team.id] = {
                        id: team.id,
                        name: team.name,
                        short_name: team.short_name,
                        code: team.code
                    };
                });

                // Populate team filter
                const teamSelect = document.getElementById('teamFilter');
                playersData.teams
                    .sort((a, b) => a.name.localeCompare(b.name))
                    .forEach(team => {
                        const option = document.createElement('option');
                        option.value = team.id;
                        option.textContent = team.name;
                        teamSelect.appendChild(option);
                    });

                // Process fixtures
                processFixtures(fixturesData);

                // Process players
                allPlayers = playersData.players
                    .filter(p => p.minutes > 0 && p.history && p.history.length > 0)
                    .map(p => processPlayer(p, playersData.teams));

                console.log(`Loaded ${allPlayers.length} players`);

                // Initial render
                applyFilters();
                renderQuickPicks();
                showLoading(false);

            } catch (error) {
                console.error('Error loading data:', error);
                showLoading(false);
            }
        }

        function processFixtures(fixtures) {
            const upcoming = fixtures.filter(f => !f.finished && f.event !== null);
            
            upcoming.forEach(f => {
                // Home team
                if (!teamFixtures[f.team_h]) teamFixtures[f.team_h] = [];
                teamFixtures[f.team_h].push({
                    opponent: f.team_a,
                    isHome: true,
                    difficulty: f.team_h_difficulty,
                    event: f.event
                });

                // Away team
                if (!teamFixtures[f.team_a]) teamFixtures[f.team_a] = [];
                teamFixtures[f.team_a].push({
                    opponent: f.team_h,
                    isHome: false,
                    difficulty: f.team_a_difficulty,
                    event: f.event
                });
            });

            // Sort by gameweek
            Object.keys(teamFixtures).forEach(teamId => {
                teamFixtures[teamId].sort((a, b) => a.event - b.event);
            });
        }

        function processPlayer(p, teamsData) {
            const team = teams[p.team];
            const history = p.history || [];
            const last5 = history.slice(-5);

            // Calculate stats
            const totalPoints = history.reduce((sum, g) => sum + (g.total_points || 0), 0);
            const totalMinutes = history.reduce((sum, g) => sum + (g.minutes || 0), 0);
            const gamesPlayed = history.filter(g => g.minutes > 0).length;

            const l5Points = last5.reduce((sum, g) => sum + (g.total_points || 0), 0);
            const l5xG = last5.reduce((sum, g) => sum + (parseFloat(g.expected_goals) || 0), 0);
            const l5xA = last5.reduce((sum, g) => sum + (parseFloat(g.expected_assists) || 0), 0);
            const l5xGI = l5xG + l5xA;
            const l5Goals = last5.reduce((sum, g) => sum + (g.goals_scored || 0), 0);
            const l5Assists = last5.reduce((sum, g) => sum + (g.assists || 0), 0);
            const l5CS = last5.reduce((sum, g) => sum + (g.clean_sheets || 0), 0);
            const l5Saves = last5.reduce((sum, g) => sum + (g.saves || 0), 0);
            const l5Bonus = last5.reduce((sum, g) => sum + (g.bonus || 0), 0);
            const l5Games = last5.filter(g => g.minutes > 0).length;

            // Form indicator (last 5 game points)
            const formHistory = last5.map(g => g.total_points || 0);

            // Fixtures
            const playerFixtures = (teamFixtures[p.team] || []).slice(0, 5);
            const avgFDR = playerFixtures.length > 0 
                ? playerFixtures.reduce((sum, f) => sum + f.difficulty, 0) / playerFixtures.length 
                : 3;

            const price = p.price / 10;

            return {
                id: p.id,
                name: p.name,
                fullName: p.fullName,
                position: p.position,
                posName: POSITIONS[p.position],
                team: team?.short_name || '???',
                teamId: p.team,
                teamCode: team?.code,
                price,
                form: parseFloat(p.form) || 0,
                ownership: parseFloat(p.ownership) || 0,
                totalPoints,
                gamesPlayed,
                ptsPerGame: gamesPlayed > 0 ? totalPoints / gamesPlayed : 0,
                value: price > 0 ? totalPoints / price : 0,
                l5Points,
                l5xGI,
                l5xG,
                l5xA,
                l5Goals,
                l5Assists,
                l5CS,
                l5Saves,
                l5Bonus,
                l5Games,
                formHistory,
                fixtures: playerFixtures,
                avgFDR
            };
        }

        // ===== FILTERING & SORTING =====
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const priceRange = document.getElementById('priceFilter').value;
            const teamId = document.getElementById('teamFilter').value;

            filteredPlayers = allPlayers.filter(p => {
                // Position filter
                if (currentPosition !== 'ALL' && p.posName !== currentPosition) return false;

                // Search filter
                if (search && !p.name.toLowerCase().includes(search) && !p.fullName?.toLowerCase().includes(search)) {
                    return false;
                }

                // Price filter
                if (priceRange) {
                    const [min, max] = priceRange.split('-').map(Number);
                    if (p.price < min || p.price >= max) return false;
                }

                // Team filter
                if (teamId && p.teamId !== parseInt(teamId)) return false;

                return true;
            });

            // Sort
            filteredPlayers.sort((a, b) => {
                let aVal, bVal;
                switch (currentSort) {
                    case 'form': aVal = a.form; bVal = b.form; break;
                    case 'pts_per_game': aVal = a.ptsPerGame; bVal = b.ptsPerGame; break;
                    case 'xgi': aVal = a.l5xGI; bVal = b.l5xGI; break;
                    case 'value': aVal = a.value; bVal = b.value; break;
                    case 'ownership': aVal = a.ownership; bVal = b.ownership; break;
                    default: aVal = a.totalPoints; bVal = b.totalPoints;
                }
                return sortDirection === 'desc' ? bVal - aVal : aVal - bVal;
            });

            renderTable();
            updateTableTitle();
        }

        function updateTableTitle() {
            const title = currentPosition === 'ALL' ? 'All Players' : `${currentPosition}s`;
            document.getElementById('tableTitle').textContent = title;
            document.getElementById('playerCount').textContent = `(${filteredPlayers.length})`;
        }

        // ===== RENDERING =====
        function renderQuickPicks() {
            const container = document.getElementById('quickPicks');

            // Captain pick - highest form + good fixtures
            const captainPick = [...allPlayers]
                .filter(p => p.posName !== 'GK')
                .sort((a, b) => (b.form * 10 + b.l5xGI * 5 - b.avgFDR * 3) - (a.form * 10 + a.l5xGI * 5 - a.avgFDR * 3))[0];

            // Value pick - best pts per million
            const valuePick = [...allPlayers]
                .filter(p => p.price <= 7.0 && p.gamesPlayed >= 3)
                .sort((a, b) => b.value - a.value)[0];

            // Differential - low ownership, good form
            const diffPick = [...allPlayers]
                .filter(p => p.ownership < 5 && p.form >= 4)
                .sort((a, b) => b.form - a.form)[0];

            // Consistent - high floor
            const consistentPick = [...allPlayers]
                .filter(p => p.gamesPlayed >= 5)
                .sort((a, b) => {
                    const aConsistency = a.l5Points / Math.max(1, a.l5Games);
                    const bConsistency = b.l5Points / Math.max(1, b.l5Games);
                    return bConsistency - aConsistency;
                })[0];

            const picks = [
                { label: '👑 Captain Pick', player: captainPick, class: 'captain', metric: 'Form', value: captainPick?.form.toFixed(1) },
                { label: '💰 Value Pick', player: valuePick, class: 'value', metric: 'Pts/£m', value: valuePick?.value.toFixed(1) },
                { label: '💎 Differential', player: diffPick, class: 'differential', metric: 'Own%', value: diffPick?.ownership.toFixed(1) + '%' },
                { label: '🔒 Consistent', player: consistentPick, class: 'consistent', metric: 'Pts/G', value: consistentPick?.ptsPerGame.toFixed(1) }
            ];

            container.innerHTML = picks.map(pick => {
                if (!pick.player) return '';
                const p = pick.player;
                return `
                    <div class="pick-card">
                        <div class="pick-header ${pick.class}">${pick.label}</div>
                        <div class="pick-player">
                            <div class="player-badge">
                                <img src="https://resources.premierleague.com/premierleague/badges/50/t${p.teamCode}.png" 
                                     style="width: 36px; height: 36px;"
                                     onerror="this.style.display='none'">
                            </div>
                            <div class="player-info">
                                <div class="player-name">${p.name}</div>
                                <div class="player-meta">${p.team} • ${p.posName} • £${p.price.toFixed(1)}m</div>
                            </div>
                            <div class="player-score">
                                <div class="score-value" style="color: var(--color-success)">${pick.value}</div>
                                <div class="score-label">${pick.metric}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');

            // Columns based on position
            const baseColumns = [
                { key: 'compare', label: '⚖️', sortable: false },
                { key: 'player', label: 'Player', sortable: true },
                { key: 'price', label: 'Price', sortable: true },
                { key: 'form', label: 'Form', sortable: true },
                { key: 'total_points', label: 'Pts', sortable: true },
                { key: 'pts_per_game', label: 'Pts/G', sortable: true }
            ];

            // Position-specific columns
            let posColumns = [];
            if (currentPosition === 'GK') {
                posColumns = [
                    { key: 'l5Saves', label: 'Saves (L5)', sortable: true },
                    { key: 'l5CS', label: 'CS (L5)', sortable: true }
                ];
            } else if (currentPosition === 'DEF') {
                posColumns = [
                    { key: 'l5CS', label: 'CS (L5)', sortable: true },
                    { key: 'l5xGI', label: 'xGI (L5)', sortable: true }
                ];
            } else if (currentPosition === 'MID' || currentPosition === 'FWD') {
                posColumns = [
                    { key: 'l5xGI', label: 'xGI (L5)', sortable: true },
                    { key: 'l5Goals', label: 'G (L5)', sortable: true },
                    { key: 'l5Assists', label: 'A (L5)', sortable: true }
                ];
            } else {
                posColumns = [
                    { key: 'l5xGI', label: 'xGI (L5)', sortable: true }
                ];
            }

            const columns = [
                ...baseColumns,
                ...posColumns,
                { key: 'fixtures', label: 'Next 3', sortable: false },
                { key: 'ownership', label: 'Own%', sortable: true }
            ];

            // Render header
            thead.innerHTML = `
                <tr>
                    ${columns.map(col => `
                        <th class="${currentSort === col.key ? 'sorted' : ''}"
                            ${col.sortable ? `onclick="sortBy('${col.key}')"` : ''}>
                            ${col.label}
                        </th>
                    `).join('')}
                </tr>
            `;

            // Render body
            tbody.innerHTML = filteredPlayers.slice(0, 100).map(p => {
                const isSelected = selectedForCompare.includes(p.id);
                const formDots = p.formHistory.map(pts => {
                    const cls = pts >= 6 ? 'high' : pts >= 3 ? 'mid' : 'low';
                    return `<div class="form-dot ${cls}"></div>`;
                }).join('');

                const fdrPips = p.fixtures.slice(0, 3).map(f => {
                    const opp = teams[f.opponent]?.short_name?.substring(0, 3) || '???';
                    return `<div class="fdr-pip fdr-${f.difficulty}" title="${opp} (${f.isHome ? 'H' : 'A'})">${opp}</div>`;
                }).join('');

                return `
                    <tr>
                        <td>
                            <input type="checkbox" class="compare-checkbox" 
                                ${isSelected ? 'checked' : ''} 
                                onchange="toggleCompare(${p.id}, this)">
                        </td>
                        <td>
                            <div class="player-cell">
                                <img class="team-badge" 
                                     src="https://resources.premierleague.com/premierleague/badges/50/t${p.teamCode}.png"
                                     onerror="this.style.display='none'">
                                <div>
                                    <div class="name">${p.name}</div>
                                    <span class="pos-badge ${POS_COLORS[p.posName]}">${p.posName}</span>
                                </div>
                            </div>
                        </td>
                        <td>£${p.price.toFixed(1)}m</td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="${p.form >= 5 ? 'stat-good' : ''}">${p.form.toFixed(1)}</span>
                                <div class="form-dots">${formDots}</div>
                            </div>
                        </td>
                        <td>${p.totalPoints}</td>
                        <td class="${p.ptsPerGame >= 5 ? 'stat-good' : ''}">${p.ptsPerGame.toFixed(1)}</td>
                        ${currentPosition === 'GK' ? `
                            <td>${p.l5Saves}</td>
                            <td class="${p.l5CS >= 2 ? 'stat-good' : ''}">${p.l5CS}</td>
                        ` : currentPosition === 'DEF' ? `
                            <td class="${p.l5CS >= 2 ? 'stat-good' : ''}">${p.l5CS}</td>
                            <td class="${p.l5xGI >= 0.5 ? 'stat-good' : ''}">${p.l5xGI.toFixed(2)}</td>
                        ` : currentPosition === 'MID' || currentPosition === 'FWD' ? `
                            <td class="${p.l5xGI >= 1 ? 'stat-good' : ''}">${p.l5xGI.toFixed(2)}</td>
                            <td>${p.l5Goals}</td>
                            <td>${p.l5Assists}</td>
                        ` : `
                            <td class="${p.l5xGI >= 0.5 ? 'stat-good' : ''}">${p.l5xGI.toFixed(2)}</td>
                        `}
                        <td><div class="fdr-mini">${fdrPips}</div></td>
                        <td class="${p.ownership > 20 ? '' : 'stat-good'}">${p.ownership.toFixed(1)}%</td>
                    </tr>
                `;
            }).join('');
        }

        function sortBy(key) {
            if (currentSort === key) {
                sortDirection = sortDirection === 'desc' ? 'asc' : 'desc';
            } else {
                currentSort = key;
                sortDirection = 'desc';
            }
            document.getElementById('sortBy').value = key;
            applyFilters();
        }

        // ===== COMPARE =====
        function toggleCompare(playerId, checkbox) {
            if (checkbox.checked) {
                if (selectedForCompare.length < 4) {
                    selectedForCompare.push(playerId);
                } else {
                    checkbox.checked = false;
                    return;
                }
            } else {
                selectedForCompare = selectedForCompare.filter(id => id !== playerId);
            }
            updateComparePanel();
        }

        function updateComparePanel() {
            const panel = document.getElementById('comparePanel');
            const container = document.getElementById('comparePlayers');

            if (selectedForCompare.length > 0) {
                panel.classList.add('show');
                container.innerHTML = selectedForCompare.map(id => {
                    const p = allPlayers.find(player => player.id === id);
                    return `
                        <div class="compare-chip">
                            <span>${p.name}</span>
                            <span class="remove" onclick="removeFromCompare(${id})">×</span>
                        </div>
                    `;
                }).join('');
            } else {
                panel.classList.remove('show');
            }
        }

        function removeFromCompare(playerId) {
            selectedForCompare = selectedForCompare.filter(id => id !== playerId);
            updateComparePanel();
            // Update checkbox in table
            const checkbox = document.querySelector(`input[onchange="toggleCompare(${playerId}, this)"]`);
            if (checkbox) checkbox.checked = false;
        }
    </script>
</body>
</html>
