<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | FPL Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --surface-bg: #0A0E14;
            --surface-0: #0D1117;
            --surface-1: #161B22;
            --surface-2: #1C2128;
            --surface-3: #21262D;
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-muted: rgba(255, 255, 255, 0.45);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.10);
            --color-success: #4ADE80;
            --color-error: #F87171;
            --color-warning: #FBBF24;
            --color-info: #60A5FA;
            --fdr-1: #4ADE80; --fdr-2: #86EFAC; --fdr-3: #A3A3A3; --fdr-4: #FB923C; --fdr-5: #EF4444;
        }

        body {
            background: var(--surface-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* NAV */
        .top-nav {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 32px;
        }
        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-logo span { color: var(--color-success); }
        .nav-links { display: flex; gap: 4px; }
        .nav-link {
            padding: 8px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 150ms;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-link:hover { color: var(--text-primary); background: var(--surface-1); }
        .nav-link.active { color: var(--color-success); background: rgba(74, 222, 128, 0.1); }

        /* HEADER */
        .page-header {
            background: var(--surface-1);
            border-bottom: 1px solid var(--border-default);
            padding: 20px 24px;
        }
        .page-header-inner {
            max-width: 1400px;
            margin: 0 auto;
        }
        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-subtitle { color: var(--text-muted); font-size: 14px; }

        /* TABS */
        .tabs-container {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
        }
        .tabs {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
            transition: all 150ms;
        }
        .tab:hover { color: var(--text-primary); background: var(--surface-1); }
        .tab.active { color: var(--color-success); background: rgba(74, 222, 128, 0.1); }

        /* CONTENT */
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        .position-section { display: none; }
        .position-section.active { display: block; }

        /* POSITION RECOMMENDATIONS */
        .pos-rec-section { margin-bottom: 24px; }
        .pos-rec-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-default);
        }
        .pos-rec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (max-width: 800px) { .pos-rec-grid { grid-template-columns: 1fr; } }

        .pos-rec-col {
            background: var(--surface-1);
            border-radius: 12px;
            padding: 16px;
        }
        .pos-rec-col-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pos-rec-col-title.budget { color: var(--color-success); }
        .pos-rec-col-title.premium { color: var(--color-warning); }

        .rec-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--surface-2);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .rec-player:last-child { margin-bottom: 0; }
        .rec-rank {
            width: 22px;
            height: 22px;
            background: var(--surface-3);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .rec-info { flex: 1; min-width: 0; }
        .rec-name {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rec-meta { font-size: 11px; color: var(--text-muted); }

        /* TABLES - Elegant Design */
        .table-section {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            overflow: hidden;
        }

        /* Table Toolbar */
        .table-toolbar {
            padding: 20px;
            background: var(--surface-1);
            border-bottom: 1px solid var(--border-default);
        }
        .table-toolbar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .table-title-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .table-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .table-icon.gk { background: rgba(251, 191, 36, 0.15); }
        .table-icon.def { background: rgba(52, 211, 153, 0.15); }
        .table-icon.mid { background: rgba(96, 165, 250, 0.15); }
        .table-icon.fwd { background: rgba(248, 113, 113, 0.15); }
        .table-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; }
        .table-count { font-size: 13px; color: var(--text-muted); }

        .table-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            padding: 8px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 150ms;
        }
        .action-btn:hover { background: var(--surface-3); color: var(--text-primary); }
        .action-btn.active { background: rgba(74, 222, 128, 0.15); color: var(--color-success); border-color: rgba(74, 222, 128, 0.3); }

        /* Search & Filters Row */
        .table-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            transition: all 150ms;
        }
        .search-box input:focus { outline: none; border-color: var(--color-info); background: var(--surface-3); }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Filter Pills */
        .filter-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-pill {
            padding: 8px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 150ms;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-pill:hover { background: var(--surface-3); color: var(--text-primary); }
        .filter-pill.active { background: rgba(74, 222, 128, 0.12); color: var(--color-success); border-color: rgba(74, 222, 128, 0.25); }
        .filter-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Column Selector Dropdown */
        .column-selector {
            position: relative;
        }
        .column-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 12px;
            min-width: 220px;
            z-index: 50;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: none;
        }
        .column-dropdown.show { display: block; }
        .column-dropdown-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-default);
        }
        .column-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 150ms;
        }
        .column-option:hover { background: var(--surface-3); }
        .column-option input { accent-color: var(--color-success); }
        .column-option label { cursor: pointer; font-size: 13px; flex: 1; }
        .column-option .col-desc { font-size: 10px; color: var(--text-muted); }

        /* Advanced Filters Panel */
        .filters-panel {
            background: var(--surface-2);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }
        .filters-panel.show { display: block; }
        .filter-group {
            margin-bottom: 16px;
        }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-group-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .filter-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-option {
            padding: 6px 12px;
            background: var(--surface-3);
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 150ms;
        }
        .filter-option:hover { color: var(--text-primary); border-color: var(--border-default); }
        .filter-option.active { background: rgba(74, 222, 128, 0.12); color: var(--color-success); border-color: rgba(74, 222, 128, 0.25); }
        .filter-range {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-range input {
            width: 80px;
            padding: 6px 10px;
            background: var(--surface-3);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 12px;
        }
        .filter-range input:focus { outline: none; border-color: var(--color-info); }
        .filter-range span { color: var(--text-muted); font-size: 12px; }

        /* Table Styles */
        .table-container { overflow-x: auto; }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table thead {
            background: var(--surface-2);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .data-table th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: all 150ms;
            border-bottom: 1px solid var(--border-default);
        }
        .data-table th:hover { color: var(--text-primary); background: var(--surface-3); }
        .data-table th.sorted { color: var(--color-success); }
        .data-table th .sort-icon { margin-left: 6px; font-size: 10px; opacity: 0.5; }
        .data-table th.sorted .sort-icon { opacity: 1; }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
            transition: all 150ms;
        }
        .data-table tbody tr { transition: all 150ms; }
        .data-table tbody tr:hover { background: var(--surface-2); }
        .data-table tbody tr:hover td { border-bottom-color: transparent; }

        /* Player Cell */
        .player-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface-3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
        }
        .player-info { }
        .player-name { font-weight: 600; font-size: 13px; }
        .player-team { font-size: 11px; color: var(--text-muted); }

        /* Stat Cells */
        .stat-cell {
            font-variant-numeric: tabular-nums;
        }
        .stat-cell.good { color: var(--color-success); font-weight: 600; }
        .stat-cell.warning { color: var(--color-warning); }
        .stat-cell.bad { color: var(--color-error); }

        /* FDR Badge */
        .fdr-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .fdr-1 { background: var(--fdr-1); color: #000; }
        .fdr-2 { background: var(--fdr-2); color: #000; }
        .fdr-3 { background: var(--fdr-3); color: #000; }
        .fdr-4 { background: var(--fdr-4); color: #000; }
        .fdr-5 { background: var(--fdr-5); color: #fff; }

        /* Form Dots */
        .form-dots {
            display: flex;
            gap: 3px;
        }
        .form-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .form-dot.high { background: var(--color-success); }
        .form-dot.mid { background: var(--color-warning); }
        .form-dot.low { background: var(--color-error); }

        /* Ownership Bar */
        .ownership-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ownership-track {
            width: 50px;
            height: 4px;
            background: var(--surface-3);
            border-radius: 2px;
            overflow: hidden;
        }
        .ownership-fill {
            height: 100%;
            background: var(--color-info);
            border-radius: 2px;
        }
        .ownership-value {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 40px;
        }

        /* Table Footer */
        .table-footer {
            padding: 16px 20px;
            background: var(--surface-2);
            border-top: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .table-info { font-size: 12px; color: var(--text-muted); }
        .table-pagination {
            display: flex;
            gap: 4px;
        }
        .page-btn {
            padding: 6px 12px;
            background: var(--surface-3);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 150ms;
        }
        .page-btn:hover { background: var(--surface-1); color: var(--text-primary); }
        .page-btn.active { background: var(--color-success); color: #000; border-color: var(--color-success); }

        /* CHARTS */
        .charts-section { }
        .charts-header {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .charts-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-info);
        }
        .charts-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        .position-toggles {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .position-toggles > span {
            font-size: 12px;
            color: var(--text-muted);
        }
        .pos-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface-2);
            border-radius: 20px;
            border: 2px solid var(--pos-color);
            cursor: pointer;
            font-size: 12px;
        }
        .pos-toggle input { accent-color: var(--pos-color); cursor: pointer; }
        .reset-btn {
            padding: 6px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
        }
        .reset-btn:hover { background: var(--surface-3); color: var(--text-primary); }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 16px;
        }
        .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .chart-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .chart-container { height: 300px; position: relative; }

        /* LOADING */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 20, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms;
        }
        .loading-overlay.show { opacity: 1; pointer-events: all; }
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-3);
            border-top-color: var(--color-success);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HIDDEN ELEMENTS */
        .hidden { display: none !important; }

        /* Mobile nav */
        @media (max-width: 768px) {
            .nav-link span:not(.icon) { display: none; }
            .nav-link { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div style="text-align: center;">
            <div class="loader-spinner"></div>
            <div style="margin-top: 16px; color: var(--text-secondary);">Loading players...</div>
        </div>
    </div>

    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>⚡</span> FPL Analysis</a>
            <div class="nav-links">
                <a href="fpl-transfer-wizard.html" class="nav-link"><span class="icon">🧙</span><span>Wizard</span></a>
                <a href="fpl-my-team-analysis.html" class="nav-link"><span class="icon">⚽</span><span>My Team</span></a>
                <a href="fpl-players-analysis.html" class="nav-link active"><span class="icon">👤</span><span>Players</span></a>
                <a href="fpl-teams-analysis.html" class="nav-link"><span class="icon">📊</span><span>Teams</span></a>
                <a href="fpl-league-rivals.html" class="nav-link"><span class="icon">🏆</span><span>Rivals</span></a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="page-header-inner">
            <h1 class="page-title">Players Analysis</h1>
            <p class="page-subtitle">Stats, form trends, and recommendations for all Premier League players</p>
        </div>
    </header>

    <div class="tabs-container">
        <div class="tabs" id="tabs">
            <button class="tab active" data-position="RECOMMENDATIONS">⭐ Recommendations</button>
            <button class="tab" data-position="CHARTS">📊 Charts</button>
            <button class="tab" data-position="FIXTURES">📅 Fixtures</button>
            <button class="tab" data-position="GK">🧤 GK</button>
            <button class="tab" data-position="DEF">🛡️ DEF</button>
            <button class="tab" data-position="MID">⚡ MID</button>
            <button class="tab" data-position="FWD">🎯 FWD</button>
        </div>
    </div>

    <main class="content">
        <div class="position-section active" id="section-RECOMMENDATIONS"></div>
        <div class="position-section" id="section-CHARTS"></div>
        <div class="position-section" id="section-FIXTURES"></div>
        <div class="position-section" id="section-GK"></div>
        <div class="position-section" id="section-DEF"></div>
        <div class="position-section" id="section-MID"></div>
        <div class="position-section" id="section-FWD"></div>
    </main>

    <!-- Hidden elements for JS compatibility -->
    <div class="hidden">
        <div id="section-FORM"></div>
        <div id="status"></div>
        <div id="cacheInfo"></div>
    </div>

    <script>
        // ============================================
        // GLOBALS
        // ============================================
        let bootstrapData = null;
        let playerAnalyses = {};
        let teamFixtures = {};
        let teams = {};
        let currentGameweek = null;
        let currentPhase = 'mid';
        let allAnalyses = [];
        let currentPosition = 'RECOMMENDATIONS';

        // ============================================
        // TAB NAVIGATION
        // ============================================
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const pos = tab.dataset.position;
                currentPosition = pos;
                
                document.querySelectorAll('.position-section').forEach(s => s.classList.remove('active'));
                document.getElementById(`section-${pos}`)?.classList.add('active');
            });
        });

        // ============================================
        // LOADING
        // ============================================
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }
        function updateStatus(msg, type) { console.log(msg); }
        function showCacheInfo() {}

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadData() {
            try {
                showLoading(true);
                
                const [playersRes, fixturesRes] = await Promise.all([
                    fetch('data/players-data.json'),
                    fetch('data/fixtures.json')
                ]);

                if (!playersRes.ok) throw new Error('Failed to load players data');
                
                const staticData = await playersRes.json();
                const fixturesData = fixturesRes.ok ? await fixturesRes.json() : [];

                // Build teams
                staticData.teams.forEach(team => {
                    teams[team.id] = {
                        id: team.id,
                        name: team.name,
                        short_name: team.short_name,
                        code: team.code,
                        strength: team.strength
                    };
                });

                // Process fixtures
                processFixtures(fixturesData);

                // Process players
                const analyses = [];
                for (const player of staticData.players) {
                    if (player.history && player.history.length > 0) {
                        const season = calculateStats(player.history, false);
                        const l5 = calculateStats(player.history, true);
                        
                        if (season && l5) {
                            const playerFixtures = teamFixtures[player.team] || [];
                            let fixtureData = null;
                            
                            if (playerFixtures.length > 0) {
                                const next3 = playerFixtures.slice(0, 3);
                                const next5 = playerFixtures.slice(0, 5);
                                const avgFDR3 = next3.reduce((s, f) => s + f.difficulty, 0) / next3.length;
                                const avgFDR5 = next5.reduce((s, f) => s + f.difficulty, 0) / next5.length;
                                
                                fixtureData = {
                                    avgFDR3, avgFDR5, next3, next5,
                                    fixtureString: next3.map(f => `${teams[f.opponent]?.short_name || '???'}(${f.is_home ? 'H' : 'A'})`).join(', ')
                                };
                            }
                            
                            analyses.push({
                                id: player.id,
                                name: player.name,
                                fullName: player.fullName || player.name,
                                position: player.position,
                                team: teams[player.team]?.short_name || '???',
                                teamId: player.team,
                                teamCode: teams[player.team]?.code,
                                price: player.price / 10,
                                form: parseFloat(player.form) || 0,
                                selectedBy: parseFloat(player.ownership) || 0,
                                totalPoints: player.totalPoints,
                                season, l5, fixtures: fixtureData
                            });
                        }
                    }
                }

                allAnalyses = analyses;
                currentGameweek = detectCurrentGameweek(analyses);
                currentPhase = getSeasonPhase(currentGameweek);

                // Render
                document.getElementById('section-RECOMMENDATIONS').innerHTML = generateRecommendations(analyses);
                document.getElementById('section-CHARTS').innerHTML = generateCharts(analyses);
                document.getElementById('section-FIXTURES').innerHTML = generateFixtureTicker(analyses);
                document.getElementById('section-GK').innerHTML = createTable('GK', analyses);
                document.getElementById('section-DEF').innerHTML = createTable('DEF', analyses);
                document.getElementById('section-MID').innerHTML = createTable('MID', analyses);
                document.getElementById('section-FWD').innerHTML = createTable('FWD', analyses);

                showLoading(false);
            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
            }
        }

        function processFixtures(fixtures) {
            const upcoming = fixtures.filter(f => !f.finished && f.event);
            upcoming.forEach(f => {
                if (!teamFixtures[f.team_h]) teamFixtures[f.team_h] = [];
                teamFixtures[f.team_h].push({ opponent: f.team_a, isHome: true, difficulty: f.team_h_difficulty, event: f.event });
                
                if (!teamFixtures[f.team_a]) teamFixtures[f.team_a] = [];
                teamFixtures[f.team_a].push({ opponent: f.team_h, isHome: false, difficulty: f.team_a_difficulty, event: f.event });
            });
            Object.keys(teamFixtures).forEach(id => teamFixtures[id].sort((a, b) => a.event - b.event));
        }

        function calculateStats(history, last5 = false) {
            const games = last5 ? history.slice(-5) : history;
            if (games.length === 0) return null;
            const sum = (arr, key) => arr.reduce((acc, g) => acc + (parseFloat(g[key]) || 0), 0);
            return {
                games: games.length,
                minutes: sum(games, 'minutes'),
                points: sum(games, 'total_points'),
                goals: sum(games, 'goals_scored'),
                assists: sum(games, 'assists'),
                cleanSheets: sum(games, 'clean_sheets'),
                goalsConceded: sum(games, 'goals_conceded'),
                saves: sum(games, 'saves'),
                bonus: sum(games, 'bonus'),
                xG: sum(games, 'expected_goals'),
                xA: sum(games, 'expected_assists'),
                xGI: sum(games, 'expected_goal_involvements'),
                xGC: sum(games, 'expected_goals_conceded')
            };
        }

        function detectCurrentGameweek(analyses) {
            const maxGames = Math.max(...analyses.map(a => a.season?.games || 0));
            return Math.min(38, Math.max(1, Math.ceil(maxGames / 10) * 10));
        }

        function getSeasonPhase(gw) {
            if (gw <= 10) return 'early';
            if (gw >= 30) return 'late';
            return 'mid';
        }

        // ============================================
        // RECOMMENDATIONS
        // ============================================
        const POSITIONS = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };

        function generateRecommendations(analyses) {
            let html = '';

            // Only By position sections - no Quick Picks
            ['GK', 'DEF', 'MID', 'FWD'].forEach(pos => {
                const posPlayers = analyses.filter(a => POSITIONS[a.position] === pos && a.l5?.games >= 3);
                const budget = getTopByValue(posPlayers.filter(p => p.price <= getBudgetCap(pos)), 5);
                const premium = getTopByValue(posPlayers.filter(p => p.price > getBudgetCap(pos)), 5);

                html += `
                    <div class="pos-rec-section">
                        <h2 class="pos-rec-title">${pos === 'GK' ? '🧤' : pos === 'DEF' ? '🛡️' : pos === 'MID' ? '⚡' : '🎯'} ${pos === 'GK' ? 'Goalkeepers' : pos === 'DEF' ? 'Defenders' : pos === 'MID' ? 'Midfielders' : 'Forwards'}</h2>
                        <div class="pos-rec-grid">
                            <div class="pos-rec-col">
                                <div class="pos-rec-col-title budget">Budget (≤£${getBudgetCap(pos).toFixed(1)}m)</div>
                                ${budget.map((p, i) => renderRecPlayer(p, i + 1)).join('') || '<div style="color: var(--text-muted); font-size: 12px;">No players found</div>'}
                            </div>
                            <div class="pos-rec-col">
                                <div class="pos-rec-col-title premium">Premium (>£${getBudgetCap(pos).toFixed(1)}m)</div>
                                ${premium.map((p, i) => renderRecPlayer(p, i + 1)).join('') || '<div style="color: var(--text-muted); font-size: 12px;">No players found</div>'}
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function renderRecPlayer(p, rank) {
            const ptsPerGame = p.l5?.games > 0 ? (p.l5.points / p.l5.games).toFixed(1) : '0.0';
            const xGI = p.l5?.games > 0 ? (p.l5.xGI / p.l5.games).toFixed(2) : '0.00';
            const fdr = p.fixtures?.avgFDR3 || 3;
            const fdrClass = fdr <= 2 ? 'fdr-1' : fdr <= 2.5 ? 'fdr-2' : fdr <= 3.5 ? 'fdr-3' : fdr <= 4 ? 'fdr-4' : 'fdr-5';
            
            return `
                <div class="rec-player">
                    <div class="rec-rank">${rank}</div>
                    <div class="rec-info">
                        <div class="rec-name">${p.name}</div>
                        <div class="rec-meta">${p.team} • £${p.price.toFixed(1)}m • ${ptsPerGame} pts/g • xGI ${xGI}</div>
                    </div>
                    <span class="fdr-badge ${fdrClass}" style="font-size: 10px;">${fdr.toFixed(1)}</span>
                </div>
            `;
        }

        function getBudgetCap(pos) {
            return { GK: 5.0, DEF: 5.5, MID: 7.0, FWD: 7.5 }[pos] || 6.0;
        }

        function getTopByValue(players, limit) {
            return players
                .filter(p => p.l5?.games >= 3 && (p.l5.minutes / p.l5.games) >= 70)
                .map(p => {
                    const l5Pts = p.l5.points / p.l5.games;
                    const l5xGI = p.l5.xGI / p.l5.games;
                    const fdr = p.fixtures?.avgFDR3 || 3;
                    const value = l5Pts / p.price;
                    const score = (value * 10) + (l5Pts * 2) + (l5xGI * 15) + (fdr < 2.5 ? 10 : fdr < 3 ? 5 : 0);
                    return { ...p, score };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        // ============================================
        // TABLES
        // ============================================
        // ============================================
        // TABLES - Advanced Implementation
        // ============================================
        let tableData = {};
        let tableState = {
            GK: { sort: 'pts', sortDir: 'desc', filters: {}, visibleCols: [], search: '', page: 1 },
            DEF: { sort: 'pts', sortDir: 'desc', filters: {}, visibleCols: [], search: '', page: 1 },
            MID: { sort: 'pts', sortDir: 'desc', filters: {}, visibleCols: [], search: '', page: 1 },
            FWD: { sort: 'pts', sortDir: 'desc', filters: {}, visibleCols: [], search: '', page: 1 }
        };
        const ROWS_PER_PAGE = 25;

        // Column definitions with metadata
        const COLUMN_DEFS = {
            player: { label: 'Player', key: 'name', sortable: true, always: true },
            team: { label: 'Team', key: 'team', sortable: true, always: true },
            price: { label: 'Price', key: 'price', sortable: true, format: v => `£${v.toFixed(1)}m` },
            form: { label: 'Form', key: 'form', sortable: true, format: v => v.toFixed(1), highlight: v => v >= 6 ? 'good' : v >= 4 ? '' : 'bad' },
            pts: { label: 'Pts (L5)', key: 'l5.points', sortable: true },
            ptsG: { label: 'Pts/G', key: 'ptsPerGame', sortable: true, format: v => v.toFixed(1), highlight: v => v >= 5 ? 'good' : v >= 3 ? '' : 'bad' },
            xGI: { label: 'xGI/G', key: 'xgiPerGame', sortable: true, format: v => v.toFixed(2), highlight: v => v >= 0.5 ? 'good' : v >= 0.25 ? '' : 'bad' },
            goals: { label: 'G', key: 'l5.goals', sortable: true },
            assists: { label: 'A', key: 'l5.assists', sortable: true },
            cs: { label: 'CS', key: 'l5.cleanSheets', sortable: true },
            saves: { label: 'Saves', key: 'l5.saves', sortable: true },
            gc: { label: 'GC', key: 'l5.goalsConceded', sortable: true },
            bonus: { label: 'Bonus', key: 'l5.bonus', sortable: true },
            mins: { label: 'Mins/G', key: 'minsPerGame', sortable: true, format: v => v.toFixed(0), highlight: v => v >= 80 ? 'good' : v >= 60 ? '' : 'bad' },
            fdr: { label: 'FDR', key: 'fdr', sortable: true, type: 'fdr' },
            own: { label: 'Own%', key: 'selectedBy', sortable: true, type: 'ownership' },
            ict: { label: 'ICT', key: 'ict', sortable: true, format: v => v.toFixed(1) },
            value: { label: 'Value', key: 'valueScore', sortable: true, format: v => v.toFixed(2), highlight: v => v >= 1 ? 'good' : '' },
            xG: { label: 'xG/G', key: 'xgPerGame', sortable: true, format: v => v.toFixed(2) },
            xA: { label: 'xA/G', key: 'xaPerGame', sortable: true, format: v => v.toFixed(2) },
            seasonPts: { label: 'Season Pts', key: 'season.points', sortable: true },
            seasonPtsG: { label: 'Season Pts/G', key: 'seasonPtsPerGame', sortable: true, format: v => v.toFixed(1) }
        };

        // Default columns per position
        const DEFAULT_COLS = {
            GK: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'cs', 'saves', 'mins', 'fdr', 'own'],
            DEF: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'cs', 'xGI', 'mins', 'fdr', 'own'],
            MID: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'xGI', 'goals', 'assists', 'fdr', 'own'],
            FWD: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'xGI', 'goals', 'assists', 'fdr', 'own']
        };

        // Available columns per position
        const AVAILABLE_COLS = {
            GK: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'cs', 'saves', 'gc', 'bonus', 'mins', 'fdr', 'own', 'seasonPts', 'seasonPtsG', 'value'],
            DEF: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'cs', 'xGI', 'goals', 'assists', 'gc', 'bonus', 'mins', 'fdr', 'own', 'xG', 'xA', 'seasonPts', 'seasonPtsG', 'value'],
            MID: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'xGI', 'goals', 'assists', 'bonus', 'mins', 'fdr', 'own', 'xG', 'xA', 'ict', 'seasonPts', 'seasonPtsG', 'value'],
            FWD: ['player', 'team', 'price', 'form', 'pts', 'ptsG', 'xGI', 'goals', 'assists', 'bonus', 'mins', 'fdr', 'own', 'xG', 'xA', 'ict', 'seasonPts', 'seasonPtsG', 'value']
        };

        function createTable(position, analyses) {
            const posMap = { GK: 1, DEF: 2, MID: 3, FWD: 4 };
            const posNames = { GK: 'Goalkeepers', DEF: 'Defenders', MID: 'Midfielders', FWD: 'Forwards' };
            const posIcons = { GK: '🧤', DEF: '🛡️', MID: '⚡', FWD: '🎯' };
            
            // Initialize state
            if (!tableState[position].visibleCols.length) {
                tableState[position].visibleCols = [...DEFAULT_COLS[position]];
            }

            // Process players with computed fields
            const players = analyses
                .filter(a => a.position === posMap[position] && a.l5?.games >= 1)
                .map(p => {
                    const l5Games = p.l5?.games || 1;
                    const seasonGames = p.season?.games || 1;
                    return {
                        ...p,
                        ptsPerGame: (p.l5?.points || 0) / l5Games,
                        xgiPerGame: (p.l5?.xGI || 0) / l5Games,
                        xgPerGame: (p.l5?.xG || 0) / l5Games,
                        xaPerGame: (p.l5?.xA || 0) / l5Games,
                        minsPerGame: (p.l5?.minutes || 0) / l5Games,
                        seasonPtsPerGame: (p.season?.points || 0) / seasonGames,
                        fdr: p.fixtures?.avgFDR3 || 3,
                        valueScore: ((p.l5?.points || 0) / l5Games) / p.price,
                        ict: p.l5?.ict || 0
                    };
                });

            tableData[position] = players;

            return `
                <div class="table-section" id="tableSection-${position}">
                    <div class="table-toolbar">
                        <div class="table-toolbar-top">
                            <div class="table-title-section">
                                <div class="table-icon ${position.toLowerCase()}">${posIcons[position]}</div>
                                <div>
                                    <div class="table-title">${posNames[position]}</div>
                                    <div class="table-count"><span id="rowCount-${position}">${players.length}</span> players</div>
                                </div>
                            </div>
                            <div class="table-actions">
                                <button class="action-btn" onclick="toggleFilters('${position}')" id="filterBtn-${position}">
                                    <span>⚙️</span> Filters
                                </button>
                                <div class="column-selector">
                                    <button class="action-btn" onclick="toggleColumnDropdown('${position}')" id="colBtn-${position}">
                                        <span>📊</span> Columns
                                    </button>
                                    <div class="column-dropdown" id="colDropdown-${position}">
                                        <div class="column-dropdown-title">Show/Hide Columns</div>
                                        ${AVAILABLE_COLS[position].map(col => {
                                            const def = COLUMN_DEFS[col];
                                            const checked = tableState[position].visibleCols.includes(col);
                                            const disabled = def.always ? 'disabled' : '';
                                            return `
                                                <div class="column-option">
                                                    <input type="checkbox" id="col-${position}-${col}" ${checked ? 'checked' : ''} ${disabled}
                                                        onchange="toggleColumn('${position}', '${col}')">
                                                    <label for="col-${position}-${col}">${def.label}</label>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="table-controls">
                            <div class="search-box">
                                <span class="search-icon">🔍</span>
                                <input type="text" placeholder="Search players..." id="search-${position}" 
                                    oninput="handleSearch('${position}', this.value)">
                            </div>
                            <div class="filter-pills">
                                <button class="filter-pill ${tableState[position].filters.form === 'hot' ? 'active' : ''}" 
                                    onclick="quickFilter('${position}', 'form', 'hot')">
                                    <span class="dot"></span> Hot Form
                                </button>
                                <button class="filter-pill ${tableState[position].filters.fixtures === 'easy' ? 'active' : ''}" 
                                    onclick="quickFilter('${position}', 'fixtures', 'easy')">
                                    <span class="dot"></span> Easy Fixtures
                                </button>
                                <button class="filter-pill ${tableState[position].filters.value === 'high' ? 'active' : ''}" 
                                    onclick="quickFilter('${position}', 'value', 'high')">
                                    <span class="dot"></span> High Value
                                </button>
                                <button class="filter-pill ${tableState[position].filters.nailed === true ? 'active' : ''}" 
                                    onclick="quickFilter('${position}', 'nailed', true)">
                                    <span class="dot"></span> Nailed On
                                </button>
                            </div>
                        </div>
                        
                        <div class="filters-panel" id="filtersPanel-${position}">
                            <div class="filter-group">
                                <div class="filter-group-label">Price Range</div>
                                <div class="filter-range">
                                    <input type="number" placeholder="Min" step="0.5" id="priceMin-${position}" 
                                        onchange="applyRangeFilter('${position}', 'price')">
                                    <span>to</span>
                                    <input type="number" placeholder="Max" step="0.5" id="priceMax-${position}"
                                        onchange="applyRangeFilter('${position}', 'price')">
                                </div>
                            </div>
                            <div class="filter-group">
                                <div class="filter-group-label">Ownership</div>
                                <div class="filter-options">
                                    <button class="filter-option" onclick="setFilter('${position}', 'ownership', 'low')">< 5% (Diff)</button>
                                    <button class="filter-option" onclick="setFilter('${position}', 'ownership', 'mid')">5-15%</button>
                                    <button class="filter-option" onclick="setFilter('${position}', 'ownership', 'high')">15-30%</button>
                                    <button class="filter-option" onclick="setFilter('${position}', 'ownership', 'template')"> 30%+</button>
                                </div>
                            </div>
                            <div class="filter-group">
                                <div class="filter-group-label">Minutes (Last 5)</div>
                                <div class="filter-options">
                                    <button class="filter-option" onclick="setFilter('${position}', 'minutes', '90')">90 mins avg</button>
                                    <button class="filter-option" onclick="setFilter('${position}', 'minutes', '75')">75+ mins</button>
                                    <button class="filter-option" onclick="setFilter('${position}', 'minutes', '60')">60+ mins</button>
                                </div>
                            </div>
                            <div style="margin-top: 12px;">
                                <button class="action-btn" onclick="clearFilters('${position}')">Clear All Filters</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <table class="data-table" id="table-${position}">
                            <thead>
                                <tr id="tableHead-${position}">
                                    ${renderTableHeader(position)}
                                </tr>
                            </thead>
                            <tbody id="tableBody-${position}">
                                ${renderTableBody(position)}
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="table-footer">
                        <div class="table-info">
                            Showing <span id="showingCount-${position}">${Math.min(ROWS_PER_PAGE, players.length)}</span> of ${players.length}
                        </div>
                        <div class="table-pagination" id="pagination-${position}">
                            ${renderPagination(position, players.length)}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTableHeader(position) {
            const state = tableState[position];
            return state.visibleCols.map(colKey => {
                const col = COLUMN_DEFS[colKey];
                const isSorted = state.sort === colKey;
                const sortIcon = isSorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
                return `<th class="${isSorted ? 'sorted' : ''}" onclick="sortTable('${position}', '${colKey}')">
                    ${col.label}<span class="sort-icon">${sortIcon}</span>
                </th>`;
            }).join('');
        }

        function renderTableBody(position) {
            const state = tableState[position];
            let players = [...(tableData[position] || [])];
            
            // Apply search
            if (state.search) {
                const q = state.search.toLowerCase();
                players = players.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
            }
            
            // Apply filters
            if (state.filters.form === 'hot') players = players.filter(p => p.form >= 5);
            if (state.filters.fixtures === 'easy') players = players.filter(p => p.fdr <= 2.5);
            if (state.filters.value === 'high') players = players.filter(p => p.valueScore >= 0.8);
            if (state.filters.nailed) players = players.filter(p => p.minsPerGame >= 75);
            if (state.filters.ownership === 'low') players = players.filter(p => p.selectedBy < 5);
            if (state.filters.ownership === 'mid') players = players.filter(p => p.selectedBy >= 5 && p.selectedBy < 15);
            if (state.filters.ownership === 'high') players = players.filter(p => p.selectedBy >= 15 && p.selectedBy < 30);
            if (state.filters.ownership === 'template') players = players.filter(p => p.selectedBy >= 30);
            if (state.filters.minutes === '90') players = players.filter(p => p.minsPerGame >= 85);
            if (state.filters.minutes === '75') players = players.filter(p => p.minsPerGame >= 75);
            if (state.filters.minutes === '60') players = players.filter(p => p.minsPerGame >= 60);
            if (state.filters.priceMin) players = players.filter(p => p.price >= state.filters.priceMin);
            if (state.filters.priceMax) players = players.filter(p => p.price <= state.filters.priceMax);
            
            // Sort
            const sortCol = COLUMN_DEFS[state.sort];
            if (sortCol) {
                players.sort((a, b) => {
                    const aVal = getNestedValue(a, sortCol.key);
                    const bVal = getNestedValue(b, sortCol.key);
                    return state.sortDir === 'asc' ? aVal - bVal : bVal - aVal;
                });
            }
            
            // Update count
            setTimeout(() => {
                const countEl = document.getElementById(`rowCount-${position}`);
                if (countEl) countEl.textContent = players.length;
                const showingEl = document.getElementById(`showingCount-${position}`);
                if (showingEl) showingEl.textContent = Math.min(ROWS_PER_PAGE * state.page, players.length);
            }, 0);
            
            // Paginate
            const start = (state.page - 1) * ROWS_PER_PAGE;
            const paginated = players.slice(start, start + ROWS_PER_PAGE);
            
            return paginated.map(p => renderPlayerRow(p, position)).join('');
        }

        function renderPlayerRow(p, position) {
            const state = tableState[position];
            return `<tr>${state.visibleCols.map(colKey => renderCell(p, colKey)).join('')}</tr>`;
        }

        function renderCell(p, colKey) {
            const col = COLUMN_DEFS[colKey];
            let value = getNestedValue(p, col.key);
            
            if (colKey === 'player') {
                const initials = p.name.split(' ').map(n => n[0]).join('').slice(0, 2);
                return `<td>
                    <div class="player-cell">
                        <div class="player-avatar">${initials}</div>
                        <div class="player-info">
                            <div class="player-name">${p.name}</div>
                            <div class="player-team">${p.team}</div>
                        </div>
                    </div>
                </td>`;
            }
            
            if (colKey === 'team') {
                return `<td>${p.team}</td>`;
            }
            
            if (col.type === 'fdr') {
                const fdrClass = value <= 2 ? 'fdr-1' : value <= 2.5 ? 'fdr-2' : value <= 3.5 ? 'fdr-3' : value <= 4 ? 'fdr-4' : 'fdr-5';
                return `<td><span class="fdr-badge ${fdrClass}">${value.toFixed(1)}</span></td>`;
            }
            
            if (col.type === 'ownership') {
                const pct = Math.min(100, value);
                return `<td>
                    <div class="ownership-bar">
                        <div class="ownership-track"><div class="ownership-fill" style="width: ${pct}%"></div></div>
                        <span class="ownership-value">${value.toFixed(1)}%</span>
                    </div>
                </td>`;
            }
            
            const formatted = col.format ? col.format(value) : value;
            const highlight = col.highlight ? col.highlight(value) : '';
            return `<td class="stat-cell ${highlight}">${formatted}</td>`;
        }

        function renderPagination(position, total) {
            const pages = Math.ceil(total / ROWS_PER_PAGE);
            if (pages <= 1) return '';
            
            const state = tableState[position];
            let html = '';
            for (let i = 1; i <= Math.min(pages, 5); i++) {
                html += `<button class="page-btn ${state.page === i ? 'active' : ''}" onclick="goToPage('${position}', ${i})">${i}</button>`;
            }
            return html;
        }

        function getNestedValue(obj, path) {
            return path.split('.').reduce((o, k) => o?.[k], obj) || 0;
        }

        // Table interactions
        function sortTable(position, colKey) {
            const state = tableState[position];
            if (state.sort === colKey) {
                state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                state.sort = colKey;
                state.sortDir = 'desc';
            }
            refreshTable(position);
        }

        function handleSearch(position, query) {
            tableState[position].search = query;
            tableState[position].page = 1;
            refreshTable(position);
        }

        function quickFilter(position, type, value) {
            const state = tableState[position];
            if (state.filters[type] === value) {
                delete state.filters[type];
            } else {
                state.filters[type] = value;
            }
            state.page = 1;
            refreshTable(position);
            updateFilterButtons(position);
        }

        function setFilter(position, type, value) {
            const state = tableState[position];
            if (state.filters[type] === value) {
                delete state.filters[type];
            } else {
                state.filters[type] = value;
            }
            state.page = 1;
            refreshTable(position);
        }

        function applyRangeFilter(position, type) {
            const min = parseFloat(document.getElementById(`${type}Min-${position}`)?.value);
            const max = parseFloat(document.getElementById(`${type}Max-${position}`)?.value);
            const state = tableState[position];
            if (!isNaN(min)) state.filters[`${type}Min`] = min;
            else delete state.filters[`${type}Min`];
            if (!isNaN(max)) state.filters[`${type}Max`] = max;
            else delete state.filters[`${type}Max`];
            state.page = 1;
            refreshTable(position);
        }

        function clearFilters(position) {
            tableState[position].filters = {};
            tableState[position].search = '';
            tableState[position].page = 1;
            const searchInput = document.getElementById(`search-${position}`);
            if (searchInput) searchInput.value = '';
            refreshTable(position);
            updateFilterButtons(position);
        }

        function toggleColumn(position, colKey) {
            const state = tableState[position];
            const idx = state.visibleCols.indexOf(colKey);
            if (idx > -1) {
                state.visibleCols.splice(idx, 1);
            } else {
                state.visibleCols.push(colKey);
            }
            refreshTable(position);
        }

        function toggleFilters(position) {
            const panel = document.getElementById(`filtersPanel-${position}`);
            const btn = document.getElementById(`filterBtn-${position}`);
            panel?.classList.toggle('show');
            btn?.classList.toggle('active');
        }

        function toggleColumnDropdown(position) {
            const dropdown = document.getElementById(`colDropdown-${position}`);
            dropdown?.classList.toggle('show');
        }

        function goToPage(position, page) {
            tableState[position].page = page;
            refreshTable(position);
        }

        function refreshTable(position) {
            const head = document.getElementById(`tableHead-${position}`);
            const body = document.getElementById(`tableBody-${position}`);
            const pagination = document.getElementById(`pagination-${position}`);
            if (head) head.innerHTML = renderTableHeader(position);
            if (body) body.innerHTML = renderTableBody(position);
            if (pagination) pagination.innerHTML = renderPagination(position, tableData[position]?.length || 0);
            updateFilterButtons(position);
        }

        function updateFilterButtons(position) {
            const state = tableState[position];
            document.querySelectorAll(`#tableSection-${position} .filter-pill`).forEach(btn => {
                const text = btn.textContent.trim();
                let isActive = false;
                if (text.includes('Hot Form')) isActive = state.filters.form === 'hot';
                if (text.includes('Easy Fixtures')) isActive = state.filters.fixtures === 'easy';
                if (text.includes('High Value')) isActive = state.filters.value === 'high';
                if (text.includes('Nailed On')) isActive = state.filters.nailed === true;
                btn.classList.toggle('active', isActive);
            });
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.column-selector')) {
                document.querySelectorAll('.column-dropdown').forEach(d => d.classList.remove('show'));
            }
        });

        // ============================================
        // CHARTS - Full implementation
        // ============================================
        let chartInstances = {};
        let chartData = {};
        let activePositionFilters = { GK: true, DEF: true, MID: true, FWD: true };
        
        const POSITION_COLORS = {
            'GK': { bg: 'rgba(251, 191, 36, 0.8)', border: '#fbbf24' },
            'DEF': { bg: 'rgba(52, 211, 153, 0.8)', border: '#34d399' },
            'MID': { bg: 'rgba(96, 165, 250, 0.8)', border: '#60a5fa' },
            'FWD': { bg: 'rgba(248, 113, 113, 0.8)', border: '#f87171' }
        };
        
        const POSITION_STYLES = { 'GK': 'circle', 'DEF': 'rect', 'MID': 'triangle', 'FWD': 'rectRot' };

        function generateCharts(analyses) {
            const positionMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            
            const validPlayers = analyses
                .filter(p => p.l5 && p.l5.games >= 3 && p.season && p.season.games >= 5)
                .map(p => {
                    const pos = positionMap[p.position];

                    const seasonGames = p.season.games;
                    return {
                        ...p,
                        pos,
                        ptsPerGame: p.l5.points / l5Games,
                        xgiPerGame: p.l5.xGI / l5Games,
                        actualGI: (p.l5.goals + p.l5.assists) / l5Games,
                        minutesPerGame: p.l5.minutes / l5Games,
                        bonusPerGame: (p.l5.bonus || 0) / l5Games,
                        ownership: p.selectedBy || 0,
                        valueScore: (p.l5.points / l5Games) / p.price,
                        xPts: calculateExpectedPoints(p, pos),
                        actualPts: p.l5.points / l5Games,
                        seasonPtsPerGame: p.season.points / seasonGames
                    };
                });
            
            chartData.players = validPlayers;

            const html = `
                <div class="charts-section">
                    <div class="charts-header">
                        <h2>📊 Visual Analysis</h2>
                        <p>Interactive charts to identify value picks, underperformers, and differentials. Hover for details.</p>
                        <div class="position-toggles">
                            <span>Filter:</span>
                            ${['GK', 'DEF', 'MID', 'FWD'].map(pos => `
                                <label class="pos-toggle" style="--pos-color: ${POSITION_COLORS[pos].border}">
                                    <input type="checkbox" id="filter-${pos}" checked onchange="togglePositionFilter('${pos}')">
                                    <span>${pos}</span>
                                </label>

                    <div class="charts-grid">
                        <div class="chart-card">

                            <div class="chart-subtitle">Above line = Great value | Below = Overpriced</div>
                            <div class="chart-container"><canvas id="priceVsPointsChart"></canvas></div>
                        </div>
                        
                        <div class="chart-card">
                            <div class="chart-title" style="color: var(--color-warning);">🎯 xGI vs Actual G+A</div>
                            <div class="chart-subtitle">Below line = Due returns | Above = May regress</div>
                            <div class="chart-container"><canvas id="xgiVsActualChart"></canvas></div>
                        </div>
                        
                        <div class="chart-card">
                            <div class="chart-title" style="color: #10b981;">📈 Expected vs Actual Points</div>
                            <div class="chart-subtitle">Find lucky/unlucky players based on underlying stats</div>
                            <div class="chart-container"><canvas id="xPtsVsActualChart"></canvas></div>
                        </div>
                        
                        <div class="chart-card">
                            <div class="chart-title" style="color: #a855f7;">💎 Ownership vs Form</div>
                            <div class="chart-subtitle">Top-left = DIFFERENTIALS (low owned, high form)</div>
                            <div class="chart-container"><canvas id="ownershipVsFormChart"></canvas></div>
                        </div>
                        
                        <div class="chart-card">
                            <div class="chart-title" style="color: #f59e0b;">🏆 Bonus Magnets</div>
                            <div class="chart-subtitle">Players who consistently earn bonus points</div>
                            <div class="chart-container"><canvas id="bonusMagnetChart"></canvas></div>
                        </div>
                        
                        <div class="chart-card">
                            <div class="chart-title" style="color: #06b6d4;">📊 L5 Form vs Season Average</div>
                            <div class="chart-subtitle">Above line = Improving | Below = Declining</div>
                            <div class="chart-container"><canvas id="formVsSeasonChart"></canvas></div>
                        </div>
                        
                        <div class="chart-card">
                            <div class="chart-title" style="color: var(--color-success);">📈 Points by Position</div>
                            <div class="chart-subtitle">Where should you invest your budget?</div>
                            <div class="chart-container"><canvas id="positionDistChart"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
            
            // Create charts after DOM update
            setTimeout(() => createAllCharts(validPlayers), 100);
            
            return html;
        }
        
        function calculateExpectedPoints(p, pos) {
            const l5Games = p.l5.games;
            const xGI = p.l5.xGI / l5Games;
            const csRate = (p.l5.cleanSheets || 0) / l5Games;
            const mins = p.l5.minutes / l5Games;
            
            let xPts = 2;
            if (pos === 'GK' || pos === 'DEF') {
                xPts += csRate * 4 + xGI * 6;
            } else if (pos === 'MID') {
                xPts += xGI * 5.5;
            } else {
                xPts += xGI * 4.5;
            }
            xPts += Math.min(xGI * 1.5, 2);
            if (mins < 60) xPts *= 0.5;
            return xPts;
        }
        
        function togglePositionFilter(pos) {
            activePositionFilters[pos] = !activePositionFilters[pos];
            updateAllCharts();
        }
        
        function resetPositionFilters() {
            ['GK', 'DEF', 'MID', 'FWD'].forEach(pos => {
                activePositionFilters[pos] = true;
                const el = document.getElementById(`filter-${pos}`);
                if (el) el.checked = true;
            });
            updateAllCharts();
        }
        
        function updateAllCharts() {
            Object.keys(chartInstances).forEach(key => {
                const chart = chartInstances[key];
                if (chart?.data?.datasets) {
                    chart.data.datasets.forEach(ds => {
                        if (ds.position) ds.hidden = !activePositionFilters[ds.position];
                    });
                    chart.update();
                }
            });
        }
        
        function createAllCharts(players) {
            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(13, 17, 23, 0.95)',
                        titleColor: '#4ade80',
                        bodyColor: 'rgba(255,255,255,0.87)',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: false,
                        callbacks: {
                            title: ctx => ctx[0]?.raw ? `${ctx[0].raw.name} (${ctx[0].raw.team})` : '',
                            label: ctx => {
                                const p = ctx.raw;
                                if (!p) return '';
                                return [
                                    `Position: ${p.pos}`,
                                    `Price: £${p.price?.toFixed(1)}m`,
                                    `Pts/G: ${p.ptsPerGame?.toFixed(1)}`,
                                    `xGI/G: ${p.xgiPerGame?.toFixed(2)}`,
                                    `Owner: ${p.ownership?.toFixed(1)}%`
                                ];
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: 'rgba(255,255,255,0.6)', font: { size: 10 } } },
                    y: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: 'rgba(255,255,255,0.6)', font: { size: 10 } } }
                }
            };
            
            const createPositionDatasets = (data, xKey, yKey, includeGK = false) => {
                const positions = includeGK ? ['GK', 'DEF', 'MID', 'FWD'] : ['DEF', 'MID', 'FWD'];
                return positions.map(pos => ({
                    label: pos,
                    position: pos,
                    data: data.filter(p => p.pos === pos).map(p => ({
                        x: typeof xKey === 'function' ? xKey(p) : p[xKey],
                        y: typeof yKey === 'function' ? yKey(p) : p[yKey],
                        ...p
                    })),
                    backgroundColor: POSITION_COLORS[pos].bg,
                    borderColor: POSITION_COLORS[pos].border,
                    pointStyle: POSITION_STYLES[pos],
                    pointRadius: 6,
                    pointHoverRadius: 10,
                    hidden: !activePositionFilters[pos]
                }));
            };
            
            // 1. Price vs Points
            const ctx1 = document.getElementById('priceVsPointsChart')?.getContext('2d');
            if (ctx1) {
                chartInstances.priceVsPoints = new Chart(ctx1, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: 'Value Line', data: [{x: 4, y: 2}, {x: 15, y: 8}], type: 'line', borderColor: 'rgba(74, 222, 128, 0.3)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                            ...createPositionDatasets(players, 'price', 'ptsPerGame')
                        ]
                    },

                });
            }

            const ctx2 = document.getElementById('xgiVsActualChart')?.getContext('2d');

                chartInstances.xgiVsActual = new Chart(ctx2, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: 'Expected Line', data: [{x: 0, y: 0}, {x: 1.2, y: 1.2}], type: 'line', borderColor: 'rgba(74, 222, 128, 0.4)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                            ...createPositionDatasets(players, 'xgiPerGame', 'actualGI')
                        ]
                    },
                    options: { ...baseOptions, scales: { x: { ...baseOptions.scales.x, title: { display: true, text: 'xGI per Game', color: 'rgba(255,255,255,0.6)' }, min: 0 }, y: { ...baseOptions.scales.y, title: { display: true, text: 'Actual G+A per Game', color: 'rgba(255,255,255,0.6)' }, min: 0 } } }
                });
            }
            
            // 3. xPts vs Actual
            const ctx3 = document.getElementById('xPtsVsActualChart')?.getContext('2d');
            if (ctx3) {
                chartInstances.xPtsVsActual = new Chart(ctx3, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: 'Expected Line', data: [{x: 1, y: 1}, {x: 10, y: 10}], type: 'line', borderColor: 'rgba(74, 222, 128, 0.4)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                            ...createPositionDatasets(players, 'xPts', 'actualPts', true)
                        ]
                    },
                    options: { ...baseOptions, scales: { x: { ...baseOptions.scales.x, title: { display: true, text: 'Expected Points/Game', color: 'rgba(255,255,255,0.6)' }, min: 0 }, y: { ...baseOptions.scales.y, title: { display: true, text: 'Actual Points/Game', color: 'rgba(255,255,255,0.6)' }, min: 0 } } }
                });
            }
            
            // 4. Ownership vs Form
            const ctx4 = document.getElementById('ownershipVsFormChart')?.getContext('2d');
            if (ctx4) {
                chartInstances.ownershipVsForm = new Chart(ctx4, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: 'Own Threshold', data: [{x: 10, y: 0}, {x: 10, y: 12}], type: 'line', borderColor: 'rgba(168, 85, 247, 0.3)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                            { label: 'Form Threshold', data: [{x: 0, y: 4}, {x: 60, y: 4}], type: 'line', borderColor: 'rgba(168, 85, 247, 0.3)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                            ...createPositionDatasets(players, 'ownership', 'ptsPerGame', true)
                        ]
                    },
                    options: { ...baseOptions, scales: { x: { ...baseOptions.scales.x, title: { display: true, text: 'Ownership %', color: 'rgba(255,255,255,0.6)' } }, y: { ...baseOptions.scales.y, title: { display: true, text: 'Points/Game (L5)', color: 'rgba(255,255,255,0.6)' }, min: 0 } } }

            }
            
            // 5. Bonus Magnets

            if (ctx5) {
                chartInstances.bonusMagnet = new Chart(ctx5, {
                    type: 'scatter',
                    data: { datasets: createPositionDatasets(players, 'ptsPerGame', 'bonusPerGame', true) },
                    options: { ...baseOptions, scales: { x: { ...baseOptions.scales.x, title: { display: true, text: 'Points/Game (L5)', color: 'rgba(255,255,255,0.6)' }, min: 0 }, y: { ...baseOptions.scales.y, title: { display: true, text: 'Bonus Points/Game', color: 'rgba(255,255,255,0.6)' }, min: 0 } } }
                });
            }
            
            // 6. Form vs Season
            const ctx6 = document.getElementById('formVsSeasonChart')?.getContext('2d');
            if (ctx6) {
                chartInstances.formVsSeason = new Chart(ctx6, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: 'No Change', data: [{x: 0, y: 0}, {x: 10, y: 10}], type: 'line', borderColor: 'rgba(6, 182, 212, 0.4)', borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false },
                            ...createPositionDatasets(players, 'seasonPtsPerGame', 'ptsPerGame', true)
                        ]
                    },
                    options: { ...baseOptions, scales: { x: { ...baseOptions.scales.x, title: { display: true, text: 'Season Avg Pts/Game', color: 'rgba(255,255,255,0.6)' }, min: 0 }, y: { ...baseOptions.scales.y, title: { display: true, text: 'L5 Pts/Game', color: 'rgba(255,255,255,0.6)' }, min: 0 } } }
                });
            }
            
            // 7. Position Distribution
            const ctx7 = document.getElementById('positionDistChart')?.getContext('2d');
            if (ctx7) {
                const posStats = ['GK', 'DEF', 'MID', 'FWD'].map(pos => {
                    const pp = players.filter(p => p.pos === pos);
                    const pts = pp.map(p => p.ptsPerGame).sort((a, b) => a - b);
                    return {
                        avg: pts.length ? pts.reduce((a, b) => a + b, 0) / pts.length : 0,
                        max: pts.length ? Math.max(...pts) : 0,
                        top5: pts.length >= 5 ? pts.slice(-5).reduce((a, b) => a + b, 0) / 5 : 0
                    };
                });
                
                chartInstances.positionDist = new Chart(ctx7, {

                        labels: ['GK', 'DEF', 'MID', 'FWD'],

        // ============================================
        // FIXTURES
        // ============================================
        function generateFixtureTicker(analyses) {
            const teamData = {};
            analyses.forEach(p => {
                if (p.teamId && p.fixtures && !teamData[p.teamId]) {
                    teamData[p.teamId] = { id: p.teamId, name: p.team, fixtures: p.fixtures };
                }
            });

            const sorted = Object.values(teamData)
                .filter(t => t.fixtures?.next5?.length)
                .sort((a, b) => (a.fixtures.avgFDR5 || 5) - (b.fixtures.avgFDR5 || 5));

            return `
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th style="text-align: left; padding: 12px;">Team</th>
                                <th>GW1</th><th>GW2</th><th>GW3</th><th>GW4</th><th>GW5</th>
                                <th>Avg FDR</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sorted.map(t => {
                                const fixtures = t.fixtures.next5 || [];
                                return `
                                    <tr>
                                        <td style="padding: 12px; font-weight: 500;">${t.name}</td>
                                        ${fixtures.slice(0, 5).map(f => {
                                            const opp = teams[f.opponent]?.short_name || '???';
                                            const fdrClass = f.difficulty <= 2 ? 'fdr-1' : f.difficulty <= 2.5 ? 'fdr-2' : f.difficulty <= 3.5 ? 'fdr-3' : f.difficulty <= 4 ? 'fdr-4' : 'fdr-5';
                                            return `<td style="text-align: center;"><span class="fdr-badge ${fdrClass}">${opp} ${f.isHome ? 'H' : 'A'}</span></td>`;
                                        }).join('')}
                                        ${Array(5 - fixtures.length).fill('<td></td>').join('')}
                                        <td style="text-align: center;"><span class="fdr-badge fdr-${Math.round(t.fixtures.avgFDR5)}">${t.fixtures.avgFDR5.toFixed(1)}</span></td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
