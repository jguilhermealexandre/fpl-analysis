<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | FPL Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --surface-bg: #0A0E14;
            --surface-0: #0D1117;
            --surface-1: #161B22;
            --surface-2: #1C2128;
            --surface-3: #21262D;
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-secondary: rgba(255, 255, 255, 0.60);
            --text-muted: rgba(255, 255, 255, 0.45);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.10);
            --color-success: #4ADE80;
            --color-error: #F87171;
            --color-warning: #FBBF24;
            --color-info: #60A5FA;
            --fdr-1: #4ADE80; --fdr-2: #86EFAC; --fdr-3: #A3A3A3; --fdr-4: #FB923C; --fdr-5: #EF4444;
        }

        body {
            background: var(--surface-bg);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* NAV */
        .top-nav {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 32px;
        }
        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-logo span { color: var(--color-success); }
        .nav-links { display: flex; gap: 4px; }
        .nav-link {
            padding: 8px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 150ms;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-link:hover { color: var(--text-primary); background: var(--surface-1); }
        .nav-link.active { color: var(--color-success); background: rgba(74, 222, 128, 0.1); }

        /* HEADER */
        .page-header {
            background: var(--surface-1);
            border-bottom: 1px solid var(--border-default);
            padding: 20px 24px;
        }
        .page-header-inner {
            max-width: 1400px;
            margin: 0 auto;
        }
        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-subtitle { color: var(--text-muted); font-size: 14px; }

        /* TABS */
        .tabs-container {
            background: var(--surface-0);
            border-bottom: 1px solid var(--border-default);
        }
        .tabs {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
            transition: all 150ms;
        }
        .tab:hover { color: var(--text-primary); background: var(--surface-1); }
        .tab.active { color: var(--color-success); background: rgba(74, 222, 128, 0.1); }

        /* CONTENT */
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        .position-section { display: none; }
        .position-section.active { display: block; }

        /* RECOMMENDATIONS - Compact Grid */
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        @media (max-width: 1200px) { .rec-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .rec-grid { grid-template-columns: 1fr; } }

        .rec-box {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 16px;
        }
        .rec-box-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rec-box-title.captain { color: var(--color-warning); }
        .rec-box-title.transfer { color: var(--color-success); }
        .rec-box-title.setforget { color: var(--color-info); }
        .rec-box-title.diff { color: #C084FC; }

        .rec-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: var(--surface-2);
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .rec-player:last-child { margin-bottom: 0; }
        .rec-rank {
            width: 20px;
            height: 20px;
            background: var(--surface-3);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .rec-info { flex: 1; min-width: 0; }
        .rec-name {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rec-meta { font-size: 11px; color: var(--text-muted); }
        .rec-score {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--color-success);
        }

        /* POSITION RECOMMENDATIONS */
        .pos-rec-section { margin-bottom: 24px; }
        .pos-rec-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-default);
        }
        .pos-rec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (max-width: 800px) { .pos-rec-grid { grid-template-columns: 1fr; } }

        .pos-rec-col {
            background: var(--surface-1);
            border-radius: 12px;
            padding: 16px;
        }
        .pos-rec-col-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pos-rec-col-title.budget { color: var(--color-success); }
        .pos-rec-col-title.premium { color: var(--color-warning); }

        /* TABLES */
        .table-section {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            overflow: hidden;
        }
        .table-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-title { font-weight: 600; font-size: 15px; }
        .table-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-chip {
            padding: 6px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 150ms;
        }
        .filter-chip:hover { background: var(--surface-3); color: var(--text-primary); }
        .filter-chip.active { background: rgba(74, 222, 128, 0.15); color: var(--color-success); border-color: var(--color-success); }
        .filter-select {
            padding: 6px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
        }
        .search-input {
            padding: 6px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 12px;
            width: 160px;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { outline: none; border-color: var(--color-info); }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { background: var(--surface-2); }
        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
        }
        th:hover { color: var(--text-primary); }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            white-space: nowrap;
        }
        tr:hover td { background: var(--surface-2); }
        .player-cell { display: flex; align-items: center; gap: 10px; }
        .player-cell img { width: 24px; height: 24px; border-radius: 4px; }
        .player-cell .name { font-weight: 500; }
        .pos-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }
        .pos-badge.gk { background: rgba(252, 211, 77, 0.2); color: #FCD34D; }
        .pos-badge.def { background: rgba(52, 211, 153, 0.2); color: #34D399; }
        .pos-badge.mid { background: rgba(96, 165, 250, 0.2); color: #60A5FA; }
        .pos-badge.fwd { background: rgba(248, 113, 113, 0.2); color: #F87171; }
        .stat-good { color: var(--color-success); }
        .stat-bad { color: var(--color-error); }
        .fdr-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #000;
        }
        .fdr-1 { background: var(--fdr-1); }
        .fdr-2 { background: var(--fdr-2); }
        .fdr-3 { background: var(--fdr-3); }
        .fdr-4 { background: var(--fdr-4); }
        .fdr-5 { background: var(--fdr-5); }

        /* CHARTS */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-card {
            background: var(--surface-1);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 16px;
        }
        .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .chart-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

        /* LOADING */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 20, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms;
        }
        .loading-overlay.show { opacity: 1; pointer-events: all; }
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-3);
            border-top-color: var(--color-success);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HIDDEN ELEMENTS */
        .hidden { display: none !important; }

        /* Mobile nav */
        @media (max-width: 768px) {
            .nav-link span:not(.icon) { display: none; }
            .nav-link { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div style="text-align: center;">
            <div class="loader-spinner"></div>
            <div style="margin-top: 16px; color: var(--text-secondary);">Loading players...</div>
        </div>
    </div>

    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>⚡</span> FPL Analysis</a>
            <div class="nav-links">
                <a href="fpl-transfer-wizard.html" class="nav-link"><span class="icon">🧙</span><span>Wizard</span></a>
                <a href="fpl-my-team-analysis.html" class="nav-link"><span class="icon">⚽</span><span>My Team</span></a>
                <a href="fpl-players-analysis.html" class="nav-link active"><span class="icon">👤</span><span>Players</span></a>
                <a href="fpl-teams-analysis.html" class="nav-link"><span class="icon">📊</span><span>Teams</span></a>
                <a href="fpl-league-rivals.html" class="nav-link"><span class="icon">🏆</span><span>Rivals</span></a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="page-header-inner">
            <h1 class="page-title">Players Analysis</h1>
            <p class="page-subtitle">Stats, form trends, and recommendations for all Premier League players</p>
        </div>
    </header>

    <div class="tabs-container">
        <div class="tabs" id="tabs">
            <button class="tab active" data-position="RECOMMENDATIONS">⭐ Recommendations</button>
            <button class="tab" data-position="CHARTS">📊 Charts</button>
            <button class="tab" data-position="FIXTURES">📅 Fixtures</button>
            <button class="tab" data-position="GK">🧤 GK</button>
            <button class="tab" data-position="DEF">🛡️ DEF</button>
            <button class="tab" data-position="MID">⚡ MID</button>
            <button class="tab" data-position="FWD">🎯 FWD</button>
        </div>
    </div>

    <main class="content">
        <div class="position-section active" id="section-RECOMMENDATIONS"></div>
        <div class="position-section" id="section-CHARTS"></div>
        <div class="position-section" id="section-FIXTURES"></div>
        <div class="position-section" id="section-GK"></div>
        <div class="position-section" id="section-DEF"></div>
        <div class="position-section" id="section-MID"></div>
        <div class="position-section" id="section-FWD"></div>
    </main>

    <!-- Hidden elements for JS compatibility -->
    <div class="hidden">
        <div id="section-FORM"></div>
        <div id="status"></div>
        <div id="cacheInfo"></div>
    </div>

    <script>
        // ============================================
        // GLOBALS
        // ============================================
        let bootstrapData = null;
        let playerAnalyses = {};
        let teamFixtures = {};
        let teams = {};
        let currentGameweek = null;
        let currentPhase = 'mid';
        let allAnalyses = [];
        let currentPosition = 'RECOMMENDATIONS';

        // ============================================
        // TAB NAVIGATION
        // ============================================
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const pos = tab.dataset.position;
                currentPosition = pos;
                
                document.querySelectorAll('.position-section').forEach(s => s.classList.remove('active'));
                document.getElementById(`section-${pos}`)?.classList.add('active');
            });
        });

        // ============================================
        // LOADING
        // ============================================
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }
        function updateStatus(msg, type) { console.log(msg); }
        function showCacheInfo() {}

        // ============================================
        // DATA LOADING
        // ============================================
        async function loadData() {
            try {
                showLoading(true);
                
                const [playersRes, fixturesRes] = await Promise.all([
                    fetch('data/players-data.json'),
                    fetch('data/fixtures.json')
                ]);

                if (!playersRes.ok) throw new Error('Failed to load players data');
                
                const staticData = await playersRes.json();
                const fixturesData = fixturesRes.ok ? await fixturesRes.json() : [];

                // Build teams
                staticData.teams.forEach(team => {
                    teams[team.id] = {
                        id: team.id,
                        name: team.name,
                        short_name: team.short_name,
                        code: team.code,
                        strength: team.strength
                    };
                });

                // Process fixtures
                processFixtures(fixturesData);

                // Process players
                const analyses = [];
                for (const player of staticData.players) {
                    if (player.history && player.history.length > 0) {
                        const season = calculateStats(player.history, false);
                        const l5 = calculateStats(player.history, true);
                        
                        if (season && l5) {
                            const playerFixtures = teamFixtures[player.team] || [];
                            let fixtureData = null;
                            
                            if (playerFixtures.length > 0) {
                                const next3 = playerFixtures.slice(0, 3);
                                const next5 = playerFixtures.slice(0, 5);
                                const avgFDR3 = next3.reduce((s, f) => s + f.difficulty, 0) / next3.length;
                                const avgFDR5 = next5.reduce((s, f) => s + f.difficulty, 0) / next5.length;
                                
                                fixtureData = {
                                    avgFDR3, avgFDR5, next3, next5,
                                    fixtureString: next3.map(f => `${teams[f.opponent]?.short_name || '???'}(${f.is_home ? 'H' : 'A'})`).join(', ')
                                };
                            }
                            
                            analyses.push({
                                id: player.id,
                                name: player.name,
                                fullName: player.fullName || player.name,
                                position: player.position,
                                team: teams[player.team]?.short_name || '???',
                                teamId: player.team,
                                teamCode: teams[player.team]?.code,
                                price: player.price / 10,
                                form: parseFloat(player.form) || 0,
                                selectedBy: parseFloat(player.ownership) || 0,
                                totalPoints: player.totalPoints,
                                season, l5, fixtures: fixtureData
                            });
                        }
                    }
                }

                allAnalyses = analyses;
                currentGameweek = detectCurrentGameweek(analyses);
                currentPhase = getSeasonPhase(currentGameweek);

                // Render
                document.getElementById('section-RECOMMENDATIONS').innerHTML = generateRecommendations(analyses);
                document.getElementById('section-CHARTS').innerHTML = generateCharts(analyses);
                document.getElementById('section-FIXTURES').innerHTML = generateFixtureTicker(analyses);
                document.getElementById('section-GK').innerHTML = createTable('GK', analyses);
                document.getElementById('section-DEF').innerHTML = createTable('DEF', analyses);
                document.getElementById('section-MID').innerHTML = createTable('MID', analyses);
                document.getElementById('section-FWD').innerHTML = createTable('FWD', analyses);

                showLoading(false);
            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
            }
        }

        function processFixtures(fixtures) {
            const upcoming = fixtures.filter(f => !f.finished && f.event);
            upcoming.forEach(f => {
                if (!teamFixtures[f.team_h]) teamFixtures[f.team_h] = [];
                teamFixtures[f.team_h].push({ opponent: f.team_a, isHome: true, difficulty: f.team_h_difficulty, event: f.event });
                
                if (!teamFixtures[f.team_a]) teamFixtures[f.team_a] = [];
                teamFixtures[f.team_a].push({ opponent: f.team_h, isHome: false, difficulty: f.team_a_difficulty, event: f.event });
            });
            Object.keys(teamFixtures).forEach(id => teamFixtures[id].sort((a, b) => a.event - b.event));
        }

        function calculateStats(history, last5 = false) {
            const games = last5 ? history.slice(-5) : history;
            if (games.length === 0) return null;
            const sum = (arr, key) => arr.reduce((acc, g) => acc + (parseFloat(g[key]) || 0), 0);
            return {
                games: games.length,
                minutes: sum(games, 'minutes'),
                points: sum(games, 'total_points'),
                goals: sum(games, 'goals_scored'),
                assists: sum(games, 'assists'),
                cleanSheets: sum(games, 'clean_sheets'),
                goalsConceded: sum(games, 'goals_conceded'),
                saves: sum(games, 'saves'),
                bonus: sum(games, 'bonus'),
                xG: sum(games, 'expected_goals'),
                xA: sum(games, 'expected_assists'),
                xGI: sum(games, 'expected_goal_involvements'),
                xGC: sum(games, 'expected_goals_conceded')
            };
        }

        function detectCurrentGameweek(analyses) {
            const maxGames = Math.max(...analyses.map(a => a.season?.games || 0));
            return Math.min(38, Math.max(1, Math.ceil(maxGames / 10) * 10));
        }

        function getSeasonPhase(gw) {
            if (gw <= 10) return 'early';
            if (gw >= 30) return 'late';
            return 'mid';
        }

        // ============================================
        // RECOMMENDATIONS
        // ============================================
        const POSITIONS = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };

        function generateRecommendations(analyses) {
            const captains = getTopCaptains(analyses, 5);
            const transfers = getTopTransfers(analyses, 5);
            const setForget = getSetAndForget(analyses, 5);
            const diffs = getDifferentials(analyses, 5);

            let html = `
                <div class="rec-grid">
                    <div class="rec-box">
                        <div class="rec-box-title captain">👑 Captain Options</div>
                        ${captains.map((p, i) => renderRecPlayer(p, i + 1)).join('')}
                    </div>
                    <div class="rec-box">
                        <div class="rec-box-title transfer">🔄 Transfer Targets</div>
                        ${transfers.map((p, i) => renderRecPlayer(p, i + 1)).join('')}
                    </div>
                    <div class="rec-box">
                        <div class="rec-box-title setforget">🔒 Set & Forget</div>
                        ${setForget.map((p, i) => renderRecPlayer(p, i + 1)).join('')}
                    </div>
                    <div class="rec-box">
                        <div class="rec-box-title diff">💎 Differentials</div>
                        ${diffs.map((p, i) => renderRecPlayer(p, i + 1)).join('')}
                    </div>
                </div>
            `;

            // By position
            ['GK', 'DEF', 'MID', 'FWD'].forEach(pos => {
                const posPlayers = analyses.filter(a => POSITIONS[a.position] === pos && a.l5?.games >= 3);
                const budget = getTopByValue(posPlayers.filter(p => p.price <= getBudgetCap(pos)), 5);
                const premium = getTopByValue(posPlayers.filter(p => p.price > getBudgetCap(pos)), 5);

                html += `
                    <div class="pos-rec-section">
                        <h2 class="pos-rec-title">${pos === 'GK' ? '🧤' : pos === 'DEF' ? '🛡️' : pos === 'MID' ? '⚡' : '🎯'} ${pos === 'GK' ? 'Goalkeepers' : pos === 'DEF' ? 'Defenders' : pos === 'MID' ? 'Midfielders' : 'Forwards'}</h2>
                        <div class="pos-rec-grid">
                            <div class="pos-rec-col">
                                <div class="pos-rec-col-title budget">Budget (≤£${getBudgetCap(pos).toFixed(1)}m)</div>
                                ${budget.map((p, i) => renderRecPlayer(p, i + 1)).join('') || '<div style="color: var(--text-muted); font-size: 12px;">No players found</div>'}
                            </div>
                            <div class="pos-rec-col">
                                <div class="pos-rec-col-title premium">Premium (>£${getBudgetCap(pos).toFixed(1)}m)</div>
                                ${premium.map((p, i) => renderRecPlayer(p, i + 1)).join('') || '<div style="color: var(--text-muted); font-size: 12px;">No players found</div>'}
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function renderRecPlayer(p, rank) {
            const ptsPerGame = p.l5?.games > 0 ? (p.l5.points / p.l5.games).toFixed(1) : '0.0';
            return `
                <div class="rec-player">
                    <div class="rec-rank">${rank}</div>
                    <div class="rec-info">
                        <div class="rec-name">${p.name}</div>
                        <div class="rec-meta">${p.team} • £${p.price.toFixed(1)}m • ${ptsPerGame} pts/g</div>
                    </div>
                    <div class="rec-score">${p.score?.toFixed(0) || ptsPerGame}</div>
                </div>
            `;
        }

        function getBudgetCap(pos) {
            return { GK: 5.0, DEF: 5.5, MID: 7.0, FWD: 7.5 }[pos] || 6.0;
        }

        function getTopCaptains(analyses, limit) {
            return analyses
                .filter(p => POSITIONS[p.position] !== 'GK' && p.l5?.games >= 3 && (p.l5.minutes / p.l5.games) >= 70)
                .map(p => {
                    const l5xGI = p.l5.xGI / p.l5.games;
                    const l5Pts = p.l5.points / p.l5.games;
                    const fdr = p.fixtures?.avgFDR3 || 3;
                    const score = (l5xGI * 40) + (l5Pts * 3) + (fdr < 2.5 ? 20 : fdr < 3 ? 10 : 0);
                    return { ...p, score };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        function getTopTransfers(analyses, limit) {
            return analyses
                .filter(p => p.l5?.games >= 3 && (p.l5.minutes / p.l5.games) >= 70)
                .map(p => {
                    const l5xGI = p.l5.xGI / p.l5.games;
                    const l5Pts = p.l5.points / p.l5.games;
                    const fdr = p.fixtures?.avgFDR3 || 3;
                    const own = p.selectedBy || 0;
                    const score = (l5xGI * 30) + (l5Pts * 2) + (fdr < 2.5 ? 15 : 0) + (own < 10 ? 10 : 0);
                    return { ...p, score };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        function getSetAndForget(analyses, limit) {
            return analyses
                .filter(p => p.season?.games >= 10 && (p.season.minutes / p.season.games) >= 80)
                .map(p => {
                    const seasonPts = p.season.points / p.season.games;
                    const value = seasonPts / p.price;
                    const score = (seasonPts * 5) + (value * 15);
                    return { ...p, score };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        function getDifferentials(analyses, limit) {
            return analyses
                .filter(p => p.selectedBy < 5 && p.l5?.games >= 3 && (p.l5.minutes / p.l5.games) >= 60)
                .map(p => {
                    const l5Pts = p.l5.points / p.l5.games;
                    const score = l5Pts * 10 + (5 - p.selectedBy) * 2;
                    return { ...p, score };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        function getTopByValue(players, limit) {
            return players
                .filter(p => p.l5?.games >= 3 && (p.l5.minutes / p.l5.games) >= 70)
                .map(p => {
                    const l5Pts = p.l5.points / p.l5.games;
                    const value = l5Pts / p.price;
                    const score = value * 10 + l5Pts;
                    return { ...p, score };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, limit);
        }

        // ============================================
        // TABLES
        // ============================================
        function createTable(position, analyses) {
            const posMap = { GK: 1, DEF: 2, MID: 3, FWD: 4 };
            const players = analyses
                .filter(a => a.position === posMap[position] && a.l5?.games >= 1)
                .sort((a, b) => (b.l5?.points || 0) - (a.l5?.points || 0))
                .slice(0, 50);

            const cols = position === 'GK' 
                ? ['Player', 'Team', 'Price', 'Form', 'Pts', 'Pts/G', 'CS', 'Saves', 'FDR', 'Own%']
                : position === 'DEF'
                ? ['Player', 'Team', 'Price', 'Form', 'Pts', 'Pts/G', 'CS', 'xGI', 'FDR', 'Own%']
                : ['Player', 'Team', 'Price', 'Form', 'Pts', 'Pts/G', 'xGI', 'G', 'A', 'FDR', 'Own%'];

            return `
                <div class="table-section">
                    <div class="table-header">
                        <div class="table-title">${position === 'GK' ? 'Goalkeepers' : position === 'DEF' ? 'Defenders' : position === 'MID' ? 'Midfielders' : 'Forwards'}</div>
                        <div class="table-filters">
                            <input type="text" class="search-input" placeholder="Search..." oninput="filterTable('${position}', this.value)">
                            <select class="filter-select" onchange="sortTable('${position}', this.value)">
                                <option value="pts">Sort: Points</option>
                                <option value="form">Sort: Form</option>
                                <option value="xgi">Sort: xGI</option>
                                <option value="price">Sort: Price</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-container">
                        <table id="table-${position}">
                            <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                            <tbody>
                                ${players.map(p => renderTableRow(p, position)).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderTableRow(p, pos) {
            const l5 = p.l5 || {};
            const games = l5.games || 1;
            const ptsG = (l5.points / games).toFixed(1);
            const xGI = ((l5.xGI || 0) / games).toFixed(2);
            const fdr = p.fixtures?.avgFDR3 || 3;
            const fdrClass = fdr <= 2 ? 'fdr-1' : fdr <= 2.5 ? 'fdr-2' : fdr <= 3.5 ? 'fdr-3' : fdr <= 4 ? 'fdr-4' : 'fdr-5';

            const cells = pos === 'GK' ? [
                `<td><div class="player-cell"><span class="name">${p.name}</span></div></td>`,
                `<td>${p.team}</td>`,
                `<td>£${p.price.toFixed(1)}m</td>`,
                `<td class="${p.form >= 5 ? 'stat-good' : ''}">${p.form.toFixed(1)}</td>`,
                `<td>${l5.points || 0}</td>`,
                `<td class="${parseFloat(ptsG) >= 4 ? 'stat-good' : ''}">${ptsG}</td>`,
                `<td>${l5.cleanSheets || 0}</td>`,
                `<td>${l5.saves || 0}</td>`,
                `<td><span class="fdr-badge ${fdrClass}">${fdr.toFixed(1)}</span></td>`,
                `<td>${p.selectedBy.toFixed(1)}%</td>`
            ] : pos === 'DEF' ? [
                `<td><div class="player-cell"><span class="name">${p.name}</span></div></td>`,
                `<td>${p.team}</td>`,
                `<td>£${p.price.toFixed(1)}m</td>`,
                `<td class="${p.form >= 5 ? 'stat-good' : ''}">${p.form.toFixed(1)}</td>`,
                `<td>${l5.points || 0}</td>`,
                `<td class="${parseFloat(ptsG) >= 4 ? 'stat-good' : ''}">${ptsG}</td>`,
                `<td>${l5.cleanSheets || 0}</td>`,
                `<td class="${parseFloat(xGI) >= 0.3 ? 'stat-good' : ''}">${xGI}</td>`,
                `<td><span class="fdr-badge ${fdrClass}">${fdr.toFixed(1)}</span></td>`,
                `<td>${p.selectedBy.toFixed(1)}%</td>`
            ] : [
                `<td><div class="player-cell"><span class="name">${p.name}</span></div></td>`,
                `<td>${p.team}</td>`,
                `<td>£${p.price.toFixed(1)}m</td>`,
                `<td class="${p.form >= 5 ? 'stat-good' : ''}">${p.form.toFixed(1)}</td>`,
                `<td>${l5.points || 0}</td>`,
                `<td class="${parseFloat(ptsG) >= 5 ? 'stat-good' : ''}">${ptsG}</td>`,
                `<td class="${parseFloat(xGI) >= 0.5 ? 'stat-good' : ''}">${xGI}</td>`,
                `<td>${l5.goals || 0}</td>`,
                `<td>${l5.assists || 0}</td>`,
                `<td><span class="fdr-badge ${fdrClass}">${fdr.toFixed(1)}</span></td>`,
                `<td>${p.selectedBy.toFixed(1)}%</td>`
            ];

            return `<tr data-name="${p.name.toLowerCase()}">${cells.join('')}</tr>`;
        }

        function filterTable(pos, query) {
            const rows = document.querySelectorAll(`#table-${pos} tbody tr`);
            const q = query.toLowerCase();
            rows.forEach(row => {
                row.style.display = row.dataset.name.includes(q) ? '' : 'none';
            });
        }

        function sortTable(pos, by) {
            // Simple re-render on sort change would go here
            console.log(`Sort ${pos} by ${by}`);
        }

        // ============================================
        // CHARTS (Simplified)
        // ============================================
        function generateCharts(analyses) {
            return `
                <div class="charts-grid">
                    <div class="chart-card">
                        <div class="chart-title">💰 Value vs Points</div>
                        <div class="chart-subtitle">Find underpriced performers</div>
                        <div style="height: 300px;"><canvas id="valueChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">📈 Form vs Season</div>
                        <div class="chart-subtitle">Above line = improving</div>
                        <div style="height: 300px;"><canvas id="formChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">📊 xGI vs Actual</div>
                        <div class="chart-subtitle">Below line = due returns</div>
                        <div style="height: 300px;"><canvas id="xgiChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">👥 Ownership vs Form</div>
                        <div class="chart-subtitle">Find differentials</div>
                        <div style="height: 300px;"><canvas id="ownChart"></canvas></div>
                    </div>
                </div>
            `;
            // Note: Chart rendering would need Chart.js initialization after DOM ready
        }

        // ============================================
        // FIXTURES
        // ============================================
        function generateFixtureTicker(analyses) {
            const teamData = {};
            analyses.forEach(p => {
                if (p.teamId && p.fixtures && !teamData[p.teamId]) {
                    teamData[p.teamId] = { id: p.teamId, name: p.team, fixtures: p.fixtures };
                }
            });

            const sorted = Object.values(teamData)
                .filter(t => t.fixtures?.next5?.length)
                .sort((a, b) => (a.fixtures.avgFDR5 || 5) - (b.fixtures.avgFDR5 || 5));

            return `
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th style="text-align: left; padding: 12px;">Team</th>
                                <th>GW1</th><th>GW2</th><th>GW3</th><th>GW4</th><th>GW5</th>
                                <th>Avg FDR</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sorted.map(t => {
                                const fixtures = t.fixtures.next5 || [];
                                return `
                                    <tr>
                                        <td style="padding: 12px; font-weight: 500;">${t.name}</td>
                                        ${fixtures.slice(0, 5).map(f => {
                                            const opp = teams[f.opponent]?.short_name || '???';
                                            const fdrClass = f.difficulty <= 2 ? 'fdr-1' : f.difficulty <= 2.5 ? 'fdr-2' : f.difficulty <= 3.5 ? 'fdr-3' : f.difficulty <= 4 ? 'fdr-4' : 'fdr-5';
                                            return `<td style="text-align: center;"><span class="fdr-badge ${fdrClass}">${opp} ${f.isHome ? 'H' : 'A'}</span></td>`;
                                        }).join('')}
                                        ${Array(5 - fixtures.length).fill('<td></td>').join('')}
                                        <td style="text-align: center;"><span class="fdr-badge fdr-${Math.round(t.fixtures.avgFDR5)}">${t.fixtures.avgFDR5.toFixed(1)}</span></td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
