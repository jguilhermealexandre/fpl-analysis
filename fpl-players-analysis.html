         *      • formRating (0-100, recency-weighted) measures results momentum
         *      • xG trend: recent-6 xG/g vs season xG/g (rising = team creating more / conceding less)
         *      • xG regression: team underperforming xG (actual goals < xG) → positive reversion likely
         *      These are SEPARATE sub-signals because a team can have bad results but rising xG
         *      (unlucky) — that's actually a strong BUY signal.
         *
         *   2. FIXTURE SWING — fixtures getting easier or already easy
         *      • fixtureSwingData: compares GW1-3 FDR vs GW4-6 FDR (threshold ±0.3)
         *      • Currently easy: avg FDR of next 3 ≤ 2.5
         *      • Home-heavy: upcoming fixtures skewed home (≥60% of next 5)
         *
         *   3. PLAYER STATS — underlying xG / ICT improving recently
         *      • L3 vs season-excluding-L3 per-game rates for position-specific key metrics
         *      • FPL points trend: L3 avg vs prior-2 avg (within L5 window)
         *      • Minutes trend: gaining game time (rotation risk decreasing)
         *
         * Players need ≥2 signals and a minimum composite score to appear.
         * Window sizes: team xG uses 6-game (matches teams-analysis), player stats uses 3-game.
         */
        function generateRisingForm(analyses) {
            if (isPreseason) {
                return renderEmptyState(
                    'Rising Form needs this season’s data',
                    'This tracks week-to-week momentum, which isn’t available until gameweeks start being played. Check back after GW1.',
                    'trending-up'
                );
            }
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };

            const scored = analyses
                .filter(p => {
                    if ((p.l5?.games || 0) < 3) return false;
                    if ((p.season?.games || 0) < 6) return false; // need season baseline
                    // Minutes threshold: must have played 180+ minutes over L5
                    if ((p.l5?.minutes || 0) < 180) return false;
                    // Availability: must be currently available
                    if (p.status !== 'a') return false;
                    // True form: recent PPG must exceed season PPG by 15%
                    const l5PPG = (p.l5?.points || 0) / (p.l5?.games || 1);
                    const seasonPPG = (p.season?.points || 0) / (p.season?.games || 1);
                    if (l5PPG <= seasonPPG * 1.15) return false;
                    // Attacking output: MID/FWD must show xGI > 0.2 per 90
                    const pos = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' }[p.position];
                    if (pos === 'MID' || pos === 'FWD') {
                        const l5XGIper90 = (p.l5?.xGI || 0) / ((p.l5?.minutes || 1) / 90);
                        if (l5XGIper90 <= 0.2) return false;
                    }
                    return true;
                })
                .map(p => {
                    const pos = posMap[p.position];
                    const g5 = p.l5?.games || 1;
                    const gS = p.season?.games || 1;
                    const signals = [];
                    let risingScore = 0;
                    const isDefPos = (pos === 'GK' || pos === 'DEF');

                    // ─────────────────────────────────────────────
                    // PILLAR 1: TEAM PICKING UP FORM
                    // ─────────────────────────────────────────────
                    const ts = p.teamScores; // from computeTeamScores()
                    const seasonXg = getTeamSeasonXg(p.teamId);
                    const recent6Xg = getTeamXgWindow(p.teamId, 6); // 6-game window per teams-analysis

                    // 1a. Results momentum — recency-weighted W/D/L (formRating 0-100)
                    let teamFormSignal = 0;
                    if (ts && ts.formRating > 55) {
                        // Only fire when form is genuinely above average (55+)
                        // Scale: 55→0, 100→9
                        teamFormSignal = Math.min(9, ((ts.formRating - 55) / 45) * 9);
                        risingScore += teamFormSignal * 1.5;
                        signals.push({
                            icon: '<i data-lucide="trending-up" style="width:14px;height:14px;"></i>', label: 'Team in form',
                            detail: `${ts.wins}W ${ts.draws}D ${ts.losses}L (L5)`,
                            strength: Math.min(10, teamFormSignal),
                            color: '#4ADE80'
                        });
                    }

                    // 1b. Team xG quality trend — is the underlying process improving?
                    // Compare recent 6 xG/g (or xGC/g for defenders) to season average.
                    // Uses same 6-game window and thresholds as teams-analysis xgTrend/xgcTrend.
                    let xgTrendSignal = 0;
                    if (recent6Xg && seasonXg && seasonXg.games >= 10) {
                        if (isDefPos) {
                            // Defensive: team conceding less xG recently → improving
                            // Threshold ±0.20 per game (from teams-analysis xgcTrend)
                            const xgcDelta = seasonXg.xGCpg - recent6Xg.xGCpg; // positive = improving
                            if (xgcDelta > 0.10) {
                                xgTrendSignal = Math.min(10, (xgcDelta / 0.6) * 10);
                                risingScore += xgTrendSignal * 2;
                                signals.push({
                                    icon: '<i data-lucide="shield-check" style="width:14px;height:14px;"></i>', label: 'Team xGC improving',
                                    detail: `${recent6Xg.xGCpg.toFixed(2)} vs ${seasonXg.xGCpg.toFixed(2)} xGC/g`,
                                    strength: xgTrendSignal,
                                    color: '#34D399'
                                });
                            }
                        } else {
                            // Attacking: team creating more xG recently → rising
                            // Threshold ±0.25 per game (from teams-analysis xgTrend)
                            const xgDelta = recent6Xg.xGpg - seasonXg.xGpg; // positive = rising
                            if (xgDelta > 0.10) {
                                xgTrendSignal = Math.min(10, (xgDelta / 0.6) * 10);
                                risingScore += xgTrendSignal * 2;
                                signals.push({
                                    icon: '<i data-lucide="circle-dot" style="width:14px;height:14px;"></i>', label: 'Team xG rising',
                                    detail: `${recent6Xg.xGpg.toFixed(2)} vs ${seasonXg.xGpg.toFixed(2)} xG/g`,
                                    strength: xgTrendSignal,
                                    color: '#34D399'
                                });
                            }
                        }
                    }

                    // 1c. xG regression potential — team due positive mean reversion
                    // If team scored fewer goals than xG (underperforming), goals should
                    // increase to match underlying quality. Inverse for defense.
                    let regressionSignal = 0;
                    if (seasonXg && seasonXg.games >= 10) {
                        if (isDefPos) {
                            // Defense: conceding more goals than xGC → due to concede less
                            const xgcOverperf = (seasonXg.totalConceded - seasonXg.totalXgc);
                            if (xgcOverperf > 2) { // conceding 2+ more goals than xGC
                                regressionSignal = Math.min(8, (xgcOverperf / 6) * 8);
                                risingScore += regressionSignal * 1.5;
                                signals.push({
                                    icon: '<i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>', label: 'CS regression due',
                                    detail: `${seasonXg.totalConceded} GA vs ${seasonXg.totalXgc.toFixed(1)} xGC`,
                                    strength: Math.min(10, regressionSignal),
                                    color: '#C084FC'
                                });
                            }
                        } else {
                            // Attack: scoring fewer goals than xG → due to score more
                            const xgUnderperf = (seasonXg.totalXg - seasonXg.totalGoals);
                            if (xgUnderperf > 2) { // 2+ fewer goals than xG
                                regressionSignal = Math.min(8, (xgUnderperf / 6) * 8);
                                risingScore += regressionSignal * 1.5;
                                signals.push({
                                    icon: '<i data-lucide="refresh-cw" style="width:14px;height:14px;"></i>', label: 'Goals regression due',
                                    detail: `${seasonXg.totalGoals} G vs ${seasonXg.totalXg.toFixed(1)} xG`,
                                    strength: Math.min(10, regressionSignal),
                                    color: '#C084FC'
                                });
                            }
                        }
                    }

                    // ─────────────────────────────────────────────
                    // PILLAR 2: FIXTURE SWING / EASY RUN
                    // ─────────────────────────────────────────────
                    let fixtureSignal = 0;

                    // 2a. Fixture swing — FDR dropping from GW1-3 to GW4-6
                    const swing = fixtureSwingData[p.teamId];
                    if (swing && swing.direction === 'improving') {
                        fixtureSignal = Math.min(10, Math.abs(swing.swing) * 4);
                        risingScore += fixtureSignal * 2.5;
                        signals.push({
                            icon: '<i data-lucide="calendar" style="width:14px;height:14px;"></i>', label: 'Fixtures improving',
                            detail: `FDR ${swing.currentFdr} → ${swing.futureFdr} (GW${swing.swingGW}+)`,
                            strength: fixtureSignal,
                            color: '#60A5FA'
                        });
                    }

                    // 2b. Currently easy fixtures (avg FDR3 ≤ 2.5)
                    const avgFdr = p.fixtures?.avgFDR3 || 3;
                    if (avgFdr <= 2.5) {
                        const easyBonus = Math.min(8, (3 - avgFdr) * 6);
                        fixtureSignal = Math.max(fixtureSignal, easyBonus);
                        risingScore += easyBonus * 1.2;
                        if (!swing || swing.direction !== 'improving') {
                            signals.push({
                                icon: '<i data-lucide="circle-check" style="width:14px;height:14px;"></i>', label: 'Easy run now',
                                detail: `FDR ${avgFdr.toFixed(1)}`,
                                strength: Math.min(10, easyBonus * 1.5),
                                color: '#4ADE80'
                            });
                        }
                    }

                    // 2c. Home-heavy upcoming stretch (≥3 of next 5 at home)
                    const next5 = p.fixtures?.next5 || [];
                    const homeCount = next5.filter(f => f.isHome).length;
                    if (next5.length >= 4 && homeCount >= 3) {
                        const homeRatio = homeCount / next5.length;
                        const homeBonus = Math.min(5, (homeRatio - 0.5) * 15);
                        if (homeBonus > 1) {
                            risingScore += homeBonus;
                            signals.push({
                                icon: '<i data-lucide="landmark" style="width:14px;height:14px;"></i>', label: 'Home-heavy run',
                                detail: `${homeCount}/${next5.length} at home`,
                                strength: Math.min(10, homeBonus * 2),
                                color: '#60A5FA'
                            });
                        }
                    }

                    // ─────────────────────────────────────────────
                    // PILLAR 3: PLAYER UNDERLYING STATS IMPROVING
                    // ─────────────────────────────────────────────

                    // 3a. Key metric uplift — L3 per-game vs rest-of-season per-game
                    // Exclude L3 from season baseline to avoid circular comparison
                    let statUplift = 0;
                    const history = p.history || [];
                    if (history.length >= 6) {
                        const last3 = history.slice(-3);
                        const restOfSeason = history.slice(0, -3);
                        const rosGames = restOfSeason.length || 1;

                        const computePerGame = (games, n) => ({
                            xGI: games.reduce((s, g) => s + (parseFloat(g.expected_goal_involvements) || 0), 0) / n,
                            xG: games.reduce((s, g) => s + (parseFloat(g.expected_goals) || 0), 0) / n,
                            xA: games.reduce((s, g) => s + (parseFloat(g.expected_assists) || 0), 0) / n,
                            bps: games.reduce((s, g) => s + (parseFloat(g.bps) || 0), 0) / n,
                            creativity: games.reduce((s, g) => s + (parseFloat(g.creativity) || 0), 0) / n,
                            threat: games.reduce((s, g) => s + (parseFloat(g.threat) || 0), 0) / n,
                            influence: games.reduce((s, g) => s + (parseFloat(g.influence) || 0), 0) / n,
                            xGC: games.reduce((s, g) => s + (parseFloat(g.expected_goals_conceded) || 0), 0) / n,
                            saves: games.reduce((s, g) => s + (parseFloat(g.saves) || 0), 0) / n
                        });

                        const baselinePerGame = computePerGame(restOfSeason, rosGames);
                        const l3PerGame = computePerGame(last3, 3);

                        // Position-specific key metrics with FPL-appropriate weights
                        let keyMetrics;
                        const detailParts = [];
                        if (pos === 'GK') {
                            keyMetrics = [
                                { key: 'xGC', weight: 3, invert: true, label: 'xGC' },
                                { key: 'saves', weight: 2, invert: false, label: 'Saves' }
                            ];
                        } else if (pos === 'DEF') {
                            keyMetrics = [
                                { key: 'xGC', weight: 2.5, invert: true, label: 'xGC' },
                                { key: 'xGI', weight: 2, invert: false, label: 'xGI' },
                                { key: 'bps', weight: 1, invert: false, label: 'BPS' }
                            ];
                        } else if (pos === 'MID') {
                            keyMetrics = [
                                { key: 'xGI', weight: 3, invert: false, label: 'xGI' },
                                { key: 'creativity', weight: 1.5, invert: false, label: 'Creativity' },
                                { key: 'threat', weight: 1.5, invert: false, label: 'Threat' }
                            ];
                        } else { // FWD
                            keyMetrics = [
                                { key: 'xG', weight: 3, invert: false, label: 'xG' },
                                { key: 'xA', weight: 1.5, invert: false, label: 'xA' },
                                { key: 'threat', weight: 1.5, invert: false, label: 'Threat' }
                            ];
                        }

                        keyMetrics.forEach(m => {
                            const baseVal = baselinePerGame[m.key] || 0.001;
                            const recentVal = l3PerGame[m.key] || 0;
                            let pctChange;
                            if (m.invert) {
                                // For xGC: lower is better, so improvement = baseline - recent
                                pctChange = baseVal > 0.01 ? (baseVal - recentVal) / baseVal : 0;
                            } else {
                                pctChange = baseVal > 0.01 ? (recentVal - baseVal) / baseVal : 0;
                            }
                            // Only credit improvements, not declines
                            const contribution = Math.max(0, pctChange) * m.weight * 5;
                            statUplift += contribution;
                            if (pctChange > 0.10) { // 10% threshold to show in detail
                                detailParts.push(`${m.label} +${(pctChange * 100).toFixed(0)}%`);
                            }
                        });

                        statUplift = Math.min(15, statUplift);
                        risingScore += statUplift * 2;

                        if (statUplift >= 2 && detailParts.length > 0) {
                            signals.push({
                                icon: '<i data-lucide="zap" style="width:14px;height:14px;"></i>', label: 'Stats improving',
                                detail: detailParts.slice(0, 2).join(', '),
                                strength: Math.min(10, statUplift),
                                color: '#FBBF24'
                            });
                        }
                    }

                    // 3b. FPL points trend — L3 avg vs prior-2 avg (within L5)
                    if (history.length >= 5) {
                        const last5Pts = history.slice(-5).map(g => parseFloat(g.total_points) || 0);
                        const last3Pts = last5Pts.slice(-3);
                        const prior2Pts = last5Pts.slice(0, 2);
                        const l3Avg = last3Pts.reduce((s, v) => s + v, 0) / 3;
                        const p2Avg = prior2Pts.reduce((s, v) => s + v, 0) / 2;
                        if (l3Avg > p2Avg + 1) {
                            const ptsTrend = Math.min(8, (l3Avg - p2Avg) * 1.5);
                            risingScore += ptsTrend;
                            signals.push({
                                icon: '<i data-lucide="flame" style="width:14px;height:14px;"></i>', label: 'Points trending up',
                                detail: `${p2Avg.toFixed(1)} → ${l3Avg.toFixed(1)} pts/g`,
                                strength: Math.min(10, ptsTrend * 1.5),
                                color: '#FB923C'
                            });
                        }
                    }

                    // 3c. Minutes trending up (rotation risk decreasing)
                    if (history.length >= 5) {
                        const last5Mins = history.slice(-5).map(g => parseFloat(g.minutes) || 0);
                        const last3MinsAvg = last5Mins.slice(-3).reduce((s, v) => s + v, 0) / 3;
                        const prior2MinsAvg = last5Mins.slice(0, 2).reduce((s, v) => s + v, 0) / 2;
                        if (last3MinsAvg > prior2MinsAvg + 10 && prior2MinsAvg < 75) {
                            const minsTrend = Math.min(5, (last3MinsAvg - prior2MinsAvg) / 15);
                            risingScore += minsTrend * 1.5;
                            signals.push({
                                icon: '<i data-lucide="clock" style="width:14px;height:14px;"></i>', label: 'More minutes',
                                detail: `${prior2MinsAvg.toFixed(0)} → ${last3MinsAvg.toFixed(0)} mpg`,
                                strength: Math.min(10, minsTrend * 2),
                                color: '#A78BFA'
                            });
                        }
                    }

                    return {
                        ...p, pos, signals, risingScore, statUplift,
                        teamFormSignal, xgTrendSignal, regressionSignal, fixtureSignal,
                        signalCount: signals.length
                    };
                })
                .filter(p => p.signalCount >= 2 && p.risingScore >= 6) // need ≥2 converging signals, lowered threshold
                .sort((a, b) => b.risingScore - a.risingScore);

            // Split by position
            const byPos = { GK: [], DEF: [], MID: [], FWD: [] };
            scored.forEach(p => byPos[p.pos]?.push(p));

            const posConfigs = [
                { pos: 'GK', icon: '<i data-lucide="hand" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Goalkeepers' },
                { pos: 'DEF', icon: '<i data-lucide="shield-check" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Defenders' },
                { pos: 'MID', icon: '<i data-lucide="zap" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Midfielders' },
                { pos: 'FWD', icon: '<i data-lucide="crosshair" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Forwards' }
            ];

            const tabs = posConfigs.map((cfg, i) =>
                `<button class="sub-tab ${i === 0 ? 'active' : ''}" onclick="switchRisingTab('${cfg.pos}', this)">${cfg.icon} ${cfg.name}</button>`
            ).join('');

            const panels = posConfigs.map((cfg, i) => {
                const posPlayers = byPos[cfg.pos].slice(0, 15);
                return `
                    <div class="sub-tab-panel ${cfg.pos === activeGlobalPosition ? 'active' : ''}" id="rising-panel-${cfg.pos}">
                        ${posPlayers.length > 0
                            ? `<div class="rising-grid">${posPlayers.map((p, j) => renderRisingCard(p, j + 1)).join('')}</div>`
                            : (seasonTooYoungNotice(6, 'Rising Form',
                                'It compares a player\u2019s last five gameweeks against their own season average to spot form turning upward.')
                                || '<div class="no-players">No players currently picking up form at this position</div>')
                        }
                    </div>
                `;
            }).join('');

            return `
                <div class="rising-section">
                    <div class="section-toolbar">
                        <div class="section-toolbar-left">
                            <div class="sub-tabs" id="risingSubTabs">${tabs}</div>
                        </div>
                        <div class="section-toolbar-right">
                            <button class="legend-toggle" onclick="this.classList.toggle('active'); document.getElementById('risingLegend').classList.toggle('show')">
                                <span><i data-lucide="info" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i> Signals</span><span class="legend-caret">▾</span>
                            </button>
                        </div>
                    </div>
                    <div class="legend-panel" id="risingLegend">
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#4ADE80"></span> Team Form</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#34D399"></span> xG Trend</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#C084FC"></span> Regression Due</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#60A5FA"></span> Fixture Swing</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#FBBF24"></span> Stats Improving</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#FB923C"></span> Points Trend</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#A78BFA"></span> Minutes Rising</span>
                    </div>
                    ${panels}
                </div>
            `;
        }

        function renderRisingCard(p, rank) {
            const g = p.l5?.games || 1;
            const ptsPerGame = ((p.l5?.points || 0) / g).toFixed(1);
            const fdr = p.fixtures?.avgFDR3 || 3;
            const fdrClass = fdr <= 2 ? 'fdr-1' : fdr <= 2.5 ? 'fdr-2' : fdr <= 3.5 ? 'fdr-3' : fdr <= 4 ? 'fdr-4' : 'fdr-5';
            const posColors = { GK: '#FBBF24', DEF: '#34D399', MID: '#60A5FA', FWD: '#F87171' };

            return `
                <div class="rising-card" onclick="openPlayerModal(${p.id})">
                    ${getStarHtml(p.id, 'shortlist-star-card')}
                    <div class="rising-card-top">
                        <div class="rising-card-rank">${rank}</div>
                        <div class="rising-card-player">
                            <div class="rising-card-name">${escHTML(p.name)}</div>
                            <div class="rising-card-meta">
                                <span class="route-pos-badge" style="background: ${posColors[p.pos]}20; color: ${posColors[p.pos]}">${p.pos}</span>
                                ${escHTML(p.team)} \u00b7 \u00a3${p.price.toFixed(1)}m
                            </div>
                        </div>
                        <div class="rising-card-score">
                            <div class="rising-score-number">${p.signalCount}</div>
                            <div class="rising-score-label">signals</div>
                        </div>
                    </div>
                    <div class="rising-signals">
                        ${p.signals.map(s => `
                            <div class="rising-signal">
                                <span class="rising-signal-icon">${s.icon}</span>
                                <span class="rising-signal-label">${s.label}</span>
                                <div class="rising-signal-bar">
                                    <div class="rising-signal-bar-fill" style="width: ${s.strength * 10}%; background: ${s.color}"></div>
                                </div>
                                <span class="rising-signal-value positive">${s.detail}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="rising-card-footer">
                        <span>${ptsPerGame} pts/g</span>
                        <span>${(p.selectedBy || 0).toFixed(1)}% owned</span>
                        <span class="fdr-badge ${fdrClass}" style="font-size:10px;padding:2px 6px;">FDR ${fdr.toFixed(1)}</span>
                    </div>
                </div>
            `;
        }

        // ============================================
        // PURPLE PATCH DETECTOR
        // ============================================

        /**
         * Detects whether a player is on a "purple patch" — a sustained hot streak.
         * Returns null if not on a patch, or a patch descriptor object.
         */
        function detectPurplePatch(p) {
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            const pos = posMap[p.position];
            const l5Games = p.l5?.games || 0;
            const seasonGames = p.season?.games || 0;
            const l5Mins = p.l5?.minutes || 0;

            // Must have played meaningfully: ≥4 L5 games, ≥270 mins, ≥8 season games
            if (l5Games < 4 || l5Mins < 270 || seasonGames < 8) return null;
            // Must be available
            if (p.status !== 'a') return null;

            const l5PPG = (p.l5?.points || 0) / l5Games;
            const seasonPPG = (p.season?.points || 0) / seasonGames;

            // Position-specific minimum PPG thresholds
            const minPPG = { GK: 4.0, DEF: 4.5, MID: 5.0, FWD: 5.0 };

            // Uplift test: L5 PPG ≥ season × 1.35 AND above position minimum
            const upliftPass = l5PPG >= seasonPPG * 1.35 && l5PPG >= (minPPG[pos] || 5.0);
            // Absolute elite test: L5 PPG ≥ 7.0 regardless
            const elitePass = l5PPG >= 7.0;

            if (!upliftPass && !elitePass) return null;

            const uplift = seasonPPG > 0 ? ((l5PPG - seasonPPG) / seasonPPG) : 0;

            return {
                pos,
                uplift,
                l5PPG,
                seasonPPG,
                patchGames: l5Games,
                isElite: elitePass
            };
        }

        /**
         * Calculates a sustainability score (0-100) across 6 transparent dimensions.
         * Each dimension is scored independently so users can see WHY a patch is sustainable or not.
         */
        function calculateSustainability(p, patch) {
            const history = p.history || [];
            const l5 = history.slice(-5);
            const l5Games = l5.length || 1;
            const seasonGames = p.season?.games || 1;
            const pos = patch.pos;
            const isDefPos = (pos === 'GK' || pos === 'DEF');

            const dimensions = {};
            const signals = [];

            // ── A. xG Alignment (0-25) ──────────────────────────────
            let dimA = 0;
            if (isDefPos) {
                // Defensive: low xGC per game = sustainable CS returns
                const l5xGCpg = l5.reduce((s, g) => s + (parseFloat(g.expected_goals_conceded) || 0), 0) / l5Games;
                const l5GCpg = l5.reduce((s, g) => s + (parseFloat(g.goals_conceded) || 0), 0) / l5Games;
                if (l5xGCpg <= 1.0) dimA += 15;
                else if (l5xGCpg <= 1.3) dimA += 10;
                else dimA += 5;
                // Actual vs expected alignment
                const gcRatio = l5GCpg > 0.01 ? l5xGCpg / l5GCpg : 1;
                if (gcRatio >= 0.8 && gcRatio <= 1.2) { dimA += 10; signals.push({ text: '✓ xGC-aligned clean sheets', positive: true }); }
                else if (gcRatio < 0.8) { dimA += 3; signals.push({ text: '⚠ Conceding less than xGC (lucky)', positive: false }); }
                else { dimA += 6; }
            } else {
                // Attacking: goals/assists vs xG/xA ratio
                const l5Goals = l5.reduce((s, g) => s + (parseFloat(g.goals_scored) || 0), 0);
                const l5xG = l5.reduce((s, g) => s + (parseFloat(g.expected_goals) || 0), 0);
                const l5Assists = l5.reduce((s, g) => s + (parseFloat(g.assists) || 0), 0);
                const l5xA = l5.reduce((s, g) => s + (parseFloat(g.expected_assists) || 0), 0);

                const goalRatio = l5xG > 0.1 ? l5Goals / l5xG : 1;
                const assistRatio = l5xA > 0.1 ? l5Assists / l5xA : 1;

                // Goals alignment (0-13)
                if (goalRatio <= 1.2) { dimA += 13; signals.push({ text: '✓ xG-backed goals', positive: true }); }
                else if (goalRatio <= 1.5) { dimA += 8; }
                else { dimA += 3; signals.push({ text: '⚠ Goals outpacing xG', positive: false }); }

                // Assists alignment (0-12)
                if (assistRatio <= 1.2) { dimA += 12; signals.push({ text: '✓ xA-backed assists', positive: true }); }
                else if (assistRatio <= 1.5) { dimA += 7; }
                else { dimA += 2; signals.push({ text: '⚠ Assists outpacing xA', positive: false }); }
            }
            dimensions.xgAlignment = { score: Math.min(25, dimA), max: 25, label: 'xG Alignment' };

            // ── B. Underlying Quality (0-20) ────────────────────────
            let dimB = 0;
            const l5BPSpg = l5.reduce((s, g) => s + (parseFloat(g.bps) || 0), 0) / l5Games;
            const seasonBPSpg = (p.season?.bps || 0) / seasonGames;

            // BPS trend (0-10)
            if (seasonBPSpg > 0) {
                const bpsRatio = l5BPSpg / seasonBPSpg;
                if (bpsRatio >= 1.15) { dimB += 10; signals.push({ text: '✓ BPS trending up', positive: true }); }
                else if (bpsRatio >= 1.0) dimB += 7;
                else if (bpsRatio >= 0.85) dimB += 4;
                else { dimB += 1; signals.push({ text: '⚠ BPS declining', positive: false }); }
            }

            // ICT position-specific (0-10)
            const l5ICTpg = isDefPos
                ? l5.reduce((s, g) => s + (parseFloat(g.influence) || 0), 0) / l5Games
                : l5.reduce((s, g) => s + (parseFloat(g.threat) || 0), 0) / l5Games;
            const seasonICTpg = isDefPos
                ? (p.season?.influence || 0) / seasonGames
                : (p.season?.threat || 0) / seasonGames;

            if (seasonICTpg > 0) {
                const ictRatio = l5ICTpg / seasonICTpg;
                if (ictRatio >= 1.15) dimB += 10;
                else if (ictRatio >= 1.0) dimB += 7;
                else if (ictRatio >= 0.85) dimB += 4;
                else dimB += 1;
            }
            dimensions.quality = { score: Math.min(20, dimB), max: 20, label: 'Underlying Quality' };

            // ── C. Minutes Stability (0-15) ─────────────────────────
            let dimC = 0;
            const l5AvgMins = l5.reduce((s, g) => s + (parseFloat(g.minutes) || 0), 0) / l5Games;
            const allStarts = l5.every(g => (parseFloat(g.starts) || 0) >= 1);

            if (l5AvgMins >= 85) { dimC = 15; signals.push({ text: '✓ Nailed on', positive: true }); }
            else if (l5AvgMins >= 70) dimC = 10;
            else if (l5AvgMins >= 60) { dimC = 5; signals.push({ text: '⚠ Rotation risk', positive: false }); }
            else { dimC = 0; signals.push({ text: '⚠ Low minutes', positive: false }); }

            if (allStarts && dimC < 15) dimC = Math.min(15, dimC + 3);
            dimensions.minutes = { score: dimC, max: 15, label: 'Minutes Stability' };

            // ── D. Fixture Context (0-15) ───────────────────────────
            let dimD = 0;
            const l5FDR = l5.map(g => {
                const oppTeam = parseInt(g.opponent_team);
                const teamData = teamAnalysis[oppTeam];
                return teamData ? (parseFloat(g.was_home) ? (teamData.attackPowerAway || 50) : (teamData.attackPower || 50)) / 50 * 3 : 3;
            });
            const avgL5FDR = l5FDR.reduce((s, v) => s + v, 0) / l5FDR.length;
            const upcomingFDR = p.fixtures?.avgFDR3 || 3;

            // Did it the hard way? High L5 FDR = sustainable
            if (avgL5FDR >= 3.2) { dimD += 10; signals.push({ text: '✓ Delivered in tough fixtures', positive: true }); }
            else if (avgL5FDR >= 2.8) dimD += 7;
            else if (avgL5FDR >= 2.3) dimD += 4;
            else { dimD += 1; signals.push({ text: '⚠ Soft fixtures inflated', positive: false }); }

            // Upcoming fixtures bonus/penalty
            if (upcomingFDR <= 2.5) dimD += 5;
            else if (upcomingFDR <= 3.0) dimD += 3;
            else if (upcomingFDR >= 4.0 && avgL5FDR < 2.5) { dimD = Math.max(0, dimD - 2); signals.push({ text: '⚠ Hard fixtures ahead', positive: false }); }
            dimensions.fixtures = { score: Math.min(15, dimD), max: 15, label: 'Fixture Context' };

            // ── E. Team Alignment (0-10) ─────────────────────────────
            let dimE = 0;
            const ts = p.teamScores;
            if (ts) {
                if (ts.formRating > 60) {
                    dimE += 8;
                    // Team xG trend bonus
                    const seasonXg = getTeamSeasonXg(p.teamId);
                    const recent6Xg = getTeamXgWindow(p.teamId, 6);
                    if (recent6Xg && seasonXg && seasonXg.games >= 10) {
                        const xgDelta = isDefPos
                            ? (seasonXg.xGCpg - recent6Xg.xGCpg)
                            : (recent6Xg.xGpg - seasonXg.xGpg);
                        if (xgDelta > 0.05) dimE += 2;
                    }
                    signals.push({ text: '✓ Team momentum aligned', positive: true });
                } else if (ts.formRating > 40) {
                    dimE += 5;
                } else {
                    dimE += 3;
                    signals.push({ text: '⚠ Excelling despite poor team form', positive: false });
                }
            } else {
                dimE += 5;
            }
            dimensions.team = { score: Math.min(10, dimE), max: 10, label: 'Team Alignment' };

            // ── F. Consistency Profile (0-15) ────────────────────────
            let dimF = 0;

            // Season PPG baseline (0-6): higher baseline = more sustainable
            if (patch.seasonPPG >= 5.0) dimF += 6;
            else if (patch.seasonPPG >= 4.0) dimF += 4;
            else if (patch.seasonPPG >= 3.0) dimF += 2;

            // L5 points variance (0-5): low std dev = consistent
            const l5Pts = l5.map(g => parseFloat(g.total_points) || 0);
            const l5Mean = l5Pts.reduce((s, v) => s + v, 0) / l5Pts.length;
            const l5Variance = l5Pts.reduce((s, v) => s + (v - l5Mean) ** 2, 0) / l5Pts.length;
            const l5StdDev = Math.sqrt(l5Variance);
            const cv = l5Mean > 0 ? l5StdDev / l5Mean : 1;
            if (cv <= 0.4) { dimF += 5; signals.push({ text: '✓ Consistent returns', positive: true }); }
            else if (cv <= 0.6) dimF += 3;
            else dimF += 1;

            // One-haul detection (0-4): any GW > 40% of L5 total = flag
            const l5Total = l5Pts.reduce((s, v) => s + v, 0);
            const maxGW = Math.max(...l5Pts);
            const oneHaul = l5Total > 0 && maxGW > l5Total * 0.4;
            if (!oneHaul) { dimF += 4; }
            else { signals.push({ text: '⚠ One big haul inflating avg', positive: false }); }

            dimensions.consistency = { score: Math.min(15, dimF), max: 15, label: 'Consistency Profile' };

            // ── Total score & verdict ─────────────────────────────────
            const totalScore = Object.values(dimensions).reduce((s, d) => s + d.score, 0);
            let verdict, verdictColor;
            if (totalScore >= 70) { verdict = 'SUSTAINABLE'; verdictColor = '#4ADE80'; }
            else if (totalScore >= 50) { verdict = 'MONITOR'; verdictColor = '#FBBF24'; }
            else { verdict = 'FADING'; verdictColor = '#F87171'; }

            // Generate verdict text from strongest signals
            const positiveSignals = signals.filter(s => s.positive);
            const negativeSignals = signals.filter(s => !s.positive);
            let verdictText = '';
            if (verdict === 'SUSTAINABLE') {
                verdictText = positiveSignals.length > 0
                    ? `Returns backed by ${positiveSignals.slice(0, 2).map(s => s.text.replace('✓ ', '').toLowerCase()).join(' and ')}. Strong buy at £${p.price.toFixed(1)}m.`
                    : `Solid underlying process supports continued returns at this level.`;
            } else if (verdict === 'MONITOR') {
                verdictText = negativeSignals.length > 0
                    ? `Watch for: ${negativeSignals.slice(0, 2).map(s => s.text.replace('⚠ ', '').toLowerCase()).join(', ')}. Hold if owned, wait for more data before buying.`
                    : `Mixed signals — form may persist but sustainability isn't certain.`;
            } else {
                verdictText = negativeSignals.length > 0
                    ? `Regression likely: ${negativeSignals.slice(0, 2).map(s => s.text.replace('⚠ ', '').toLowerCase()).join(', ')}. Sell/avoid at £${p.price.toFixed(1)}m.`
                    : `Hot streak not backed by underlying process — expect regression.`;
            }

            return { totalScore, verdict, verdictColor, verdictText, dimensions, signals, oneHaul };
        }

        /**
         * Pre-computes purple patch scores for cross-wiring into recommendations.
         */
        function precomputePurplePatchScores(analyses) {
            window._purplePatchScores = {};
            analyses.forEach(p => {
                const patch = detectPurplePatch(p);
                if (!patch) return;
                const sust = calculateSustainability(p, patch);
                window._purplePatchScores[p.id] = {
                    score: sust.totalScore,
                    verdict: sust.verdict,
                    l5PPG: patch.l5PPG
                };
            });
        }

        function switchPurplePatchTab(pos, btn) {
            switchGlobalPosition(pos);
        }

        /**
         * Generates the Purple Patch tab content.
         */
        function generatePurplePatch(analyses) {
            if (isPreseason) {
                return renderEmptyState(
                    'Purple Patch needs this season’s data',
                    'Hot-streak detection relies on recent-game trends, which don’t exist until gameweeks start being played. Check back after GW1.',
                    'flame'
                );
            }
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };

            const scored = analyses
                .map(p => {
                    const patch = detectPurplePatch(p);
                    if (!patch) return null;
                    const sustainability = calculateSustainability(p, patch);
                    return { ...p, pos: patch.pos, patch, sustainability };
                })
                .filter(Boolean)
                .sort((a, b) => b.sustainability.totalScore - a.sustainability.totalScore);

            const byPos = { GK: [], DEF: [], MID: [], FWD: [] };
            scored.forEach(p => byPos[p.pos]?.push(p));

            const posConfigs = [
                { pos: 'GK', icon: '<i data-lucide="hand" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Goalkeepers' },
                { pos: 'DEF', icon: '<i data-lucide="shield-check" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Defenders' },
                { pos: 'MID', icon: '<i data-lucide="zap" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Midfielders' },
                { pos: 'FWD', icon: '<i data-lucide="crosshair" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i>', name: 'Forwards' }
            ];

            const tabs = posConfigs.map((cfg, i) =>
                `<button class="sub-tab ${i === 0 ? 'active' : ''}" onclick="switchPurplePatchTab('${cfg.pos}', this)">${cfg.icon} ${cfg.name}</button>`
            ).join('');

            const panels = posConfigs.map(cfg => {
                const posPlayers = byPos[cfg.pos].slice(0, 15);
                return `
                    <div class="sub-tab-panel ${cfg.pos === activeGlobalPosition ? 'active' : ''}" id="pp-panel-${cfg.pos}">
                        ${posPlayers.length > 0
                            ? `<div class="pp-grid">${posPlayers.map((p, j) => renderPurplePatchCard(p, j + 1)).join('')}</div>`
                            : (seasonTooYoungNotice(8, 'Purple Patch',
                                'It looks for players scoring well above their own baseline, then rates how sustainable the run is.')
                                || '<div class="no-players">No players currently on a purple patch at this position</div>')
                        }
                    </div>
                `;
            }).join('');

            return `
                <div class="pp-section">
                    <div class="section-toolbar">
                        <div class="section-toolbar-left">
                            <div class="sub-tabs" id="ppSubTabs">${tabs}</div>
                        </div>
                        <div class="section-toolbar-right">
                            <button class="legend-toggle" onclick="this.classList.toggle('active'); document.getElementById('ppLegend').classList.toggle('show')">
                                <span><i data-lucide="info" style="width:14px;height:14px;display:inline-block;vertical-align:middle;"></i> Dimensions</span><span class="legend-caret">▾</span>
                            </button>
                        </div>
                    </div>
                    <div class="legend-panel" id="ppLegend">
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#A78BFA"></span> xG Alignment (0-25)</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#60A5FA"></span> Underlying Quality (0-20)</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#34D399"></span> Minutes Stability (0-15)</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#FBBF24"></span> Fixture Context (0-15)</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#FB923C"></span> Team Alignment (0-10)</span>
                        <span class="legend-panel-item"><span class="legend-panel-dot" style="background:#F87171"></span> Consistency (0-15)</span>
                    </div>
                    ${panels}
                </div>
            `;
        }

        function renderPurplePatchCard(p, rank) {
            const g = p.l5?.games || 1;
            const s = p.sustainability;
            const patch = p.patch;
            const posColors = { GK: '#FBBF24', DEF: '#34D399', MID: '#60A5FA', FWD: '#F87171' };
            const dimColors = {
                xgAlignment: '#A78BFA', quality: '#60A5FA', minutes: '#34D399',
                fixtures: '#FBBF24', team: '#FB923C', consistency: '#F87171'
            };

            // Sparkline: L5 points as small bars
            const history = p.history || [];
            const last5 = history.slice(-5);
            const maxPts = Math.max(...last5.map(g => parseFloat(g.total_points) || 0), 1);
            const sparkline = last5.map(g => {
                const pts = parseFloat(g.total_points) || 0;
                const h = Math.max(4, (pts / maxPts) * 28);
                const opacity = pts >= patch.l5PPG ? '1' : '0.5';
                return `<div class="pp-spark-bar" style="height:${h}px;opacity:${opacity}" title="GW${g.round}: ${pts}pts"></div>`;
            }).join('');

            // Fixture chips (next 3)
            const fixtureChips = (p.fixtures?.next5 || []).slice(0, 3).map(f => {
                const opp = teams[f.opponent]?.short_name || '???';
                const fdrClass = f.difficulty <= 2 ? 'fdr-1' : f.difficulty <= 2.5 ? 'fdr-2' : f.difficulty <= 3.5 ? 'fdr-3' : f.difficulty <= 4 ? 'fdr-4' : 'fdr-5';
                return `<span class="fixture-chip ${fdrClass}">${opp} (${f.isHome ? 'H' : 'A'})</span>`;
            }).join('');

            // Dimension bars
            const dimBars = Object.entries(s.dimensions).map(([key, dim]) => {
                const pct = (dim.score / dim.max) * 100;
                const color = dimColors[key] || '#A78BFA';
                return `
                    <div class="pp-dim-row">
                        <span class="pp-dim-label">${dim.label}</span>
                        <div class="pp-dim-bar">
                            <div class="pp-dim-bar-fill" style="width:${pct}%;background:${color}"></div>
                        </div>
                        <span class="pp-dim-score">${dim.score}/${dim.max}</span>
                    </div>
                `;
            }).join('');

            // Signal pills (top 5)
            const signalPills = s.signals.slice(0, 5).map(sig =>
                `<span class="pp-signal ${sig.positive ? 'pp-signal-pos' : 'pp-signal-neg'}">${sig.text}</span>`
            ).join('');

            const upliftPct = patch.uplift > 0 ? `+${(patch.uplift * 100).toFixed(0)}%` : '';

            return `
                <div class="pp-card" onclick="openPlayerModal(${p.id})">
                    ${getStarHtml(p.id, 'shortlist-star-card')}
                    <div class="pp-card-top">
                        <div class="pp-card-rank">${rank}</div>
                        <div class="pp-card-player">
                            <div class="pp-card-name">${escHTML(p.name)}</div>
                            <div class="pp-card-meta">
                                <span class="route-pos-badge" style="background:${posColors[p.pos]}20;color:${posColors[p.pos]}">${p.pos}</span>
                                ${escHTML(p.team)} \u00b7 \u00a3${p.price.toFixed(1)}m
                            </div>
                        </div>
                        <div class="pp-sparkline">${sparkline}</div>
                    </div>

                    <div class="pp-stats-row">
                        <div class="pp-stat">
                            <span class="pp-stat-value">${patch.l5PPG.toFixed(1)}</span>
                            <span class="pp-stat-label">L5 pts/g</span>
                        </div>
                        <div class="pp-stat">
                            <span class="pp-stat-value">${patch.seasonPPG.toFixed(1)}</span>
                            <span class="pp-stat-label">Season pts/g</span>
                        </div>
                        ${upliftPct ? `<div class="pp-uplift-badge">${upliftPct}</div>` : ''}
                    </div>

                    <div class="pp-gauge-row">
                        <div class="pp-gauge">
                            <div class="pp-gauge-track">
                                <div class="pp-gauge-fill" style="width:${s.totalScore}%;background:${s.verdictColor}"></div>
                            </div>
                            <span class="pp-gauge-score">${s.totalScore}</span>
                        </div>
                        <span class="pp-verdict" style="background:${s.verdictColor}20;color:${s.verdictColor}">${s.verdict}</span>
                    </div>

                    <div class="pp-dimensions">${dimBars}</div>

                    <div class="pp-signals">${signalPills}</div>

                    <div class="pp-fixtures">${fixtureChips}</div>

                    <div class="pp-verdict-text">${s.verdictText}</div>
                </div>
            `;
        }

    </script>
    <script src="scripts/error-monitor.js?v=150"></script>
    <script src="scripts/players-tables.js?v=150"></script>
    <script src="scripts/compare-report.js?v=150"></script>
    <script>
        // calculateStats / recencyWeightedAvg / calculateExpectedPoints / generateComparisonReport /
        // generateSituationalPicks / generatePlayerNarrative / getRadarAxes / getBudgetContext /
        // showCompareModal / closeCompareModal / reportRadarChart / compareList / MAX_COMPARE /
        // toggleComparePlayer / removeFromCompare / clearCompare / updateCompareBar now live in
        // scripts/compare-report.js (shared with My Team's Squad Analysis).

        // ============================================
        // CHART EXPAND MODAL
        // ============================================
        let expandedChartInstance = null;
        
        // Metrics offered in the expanded view. Keys match the fields computed in
        // generateCharts, so no accessor can drift from what the small charts use.
        const SCATTER_METRICS = [
            { key: 'price',            label: 'Price (£m)' },
            { key: 'ptsPerGame',       label: 'Points per game (L5)' },
            { key: 'seasonPtsPerGame', label: 'Points per game (season)' },
            { key: 'xPts',             label: 'Expected points' },
            { key: 'xgiPerGame',       label: 'xGI per game' },
            { key: 'xgPerGame',        label: 'xG per game' },
            { key: 'xaPerGame',        label: 'xA per game' },
            { key: 'actualGI',         label: 'Actual G+A per game' },
            { key: 'ownership',        label: 'Ownership (%)' },
            { key: 'valueScore',       label: 'Points per £m' },
            { key: 'bonusPerGame',     label: 'Bonus per game' },
            { key: 'minutesPerGame',   label: 'Minutes per game' },
            { key: 'xgcPerGame',       label: 'xGC per game' },
            { key: 'csPerGame',        label: 'Clean sheet rate' },
            { key: 'savesPerGame',     label: 'Saves per game' },
            { key: 'reliabilityPct',   label: 'Reliability (%)' },
            { key: 'explosivenessPct', label: 'Explosiveness (%)' }
        ];

        let expandedChartKey = null;

        function fillMetricSelect(el, selected) {
            if (!el) return;
            el.innerHTML = SCATTER_METRICS.map(m =>
                `<option value="${m.key}"${m.key === selected ? ' selected' : ''}>${escHTML(m.label)}</option>`).join('');
        }

        // Reads the axis titles off the source chart so the pickers open on the
        // metrics that chart is already showing rather than on an arbitrary pair.
        function guessMetricFromTitle(title) {
            if (!title) return null;
            const t = String(title).toLowerCase();
            const hit = SCATTER_METRICS.find(m => m.label.toLowerCase() === t);
            if (hit) return hit.key;
            if (t.includes('price')) return 'price';
            if (t.includes('xgi')) return 'xgiPerGame';
            if (t.includes('ownership')) return 'ownership';
            if (t.includes('expected')) return 'xPts';
            if (t.includes('actual')) return 'actualGI';
            if (t.includes('points')) return 'ptsPerGame';
            return null;
        }

        function rebuildExpandedChart() {
            const canvas = document.getElementById('expandedChart');
            const xSel = document.getElementById('expandX');
            const ySel = document.getElementById('expandY');
            const pool = (chartData && chartData.players) || [];
            if (!canvas || !xSel || !ySel || !pool.length) return;

            const xKey = xSel.value, yKey = ySel.value;
            const xMeta = SCATTER_METRICS.find(m => m.key === xKey) || SCATTER_METRICS[0];
            const yMeta = SCATTER_METRICS.find(m => m.key === yKey) || SCATTER_METRICS[1];

            if (expandedChartInstance) { expandedChartInstance.destroy(); expandedChartInstance = null; }
            registerScatterPlugins();
            const ct = getChartTheme();

            const datasets = ['GK', 'DEF', 'MID', 'FWD'].map(pos => ({
                label: pos,
                position: pos,
                data: pool.filter(p => p.pos === pos).map(p => {
                    const x = parseFloat(p[xKey]), y = parseFloat(p[yKey]);
                    return Number.isFinite(x) && Number.isFinite(y) ? { ...p, x, y } : null;
                }).filter(Boolean),
                backgroundColor: POSITION_COLORS[pos].bg,
                borderColor: POSITION_COLORS[pos].border,
                pointStyle: POSITION_STYLES[pos],
                pointRadius: cx => (shortlistedPlayerIds.has(cx.raw?.id) ? 10 : 7),
                pointHoverRadius: cx => (shortlistedPlayerIds.has(cx.raw?.id) ? 14 : 11),
                pointBorderWidth: cx => (shortlistedPlayerIds.has(cx.raw?.id) ? 2 : 1),
                hidden: !activePositionFilters[pos]
            }));

            // The expanded canvas borrows the source chart's quadrant labels.
            canvas.dataset.quadKey = expandedChartKey ? `${expandedChartKey}Chart` : '';

            expandedChartInstance = new Chart(canvas.getContext('2d'), {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onHover: (evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
                    onClick: (evt, els, chart) => {
                        if (!els.length) return;
                        const raw = chart.data.datasets[els[0].datasetIndex].data[els[0].index];
                        if (raw && raw.id != null && typeof openPlayerModal === 'function') openPlayerModal(raw.id);
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false, position: 'nearest', external: scatterTooltipHandler }
                    },
                    scales: {
                        x: { grid: { color: ct.grid }, ticks: { color: ct.text, font: { size: 12 } },
                             title: { display: true, text: xMeta.label, color: ct.text } },
                        y: { grid: { color: ct.grid }, ticks: { color: ct.text, font: { size: 12 } },
                             title: { display: true, text: yMeta.label, color: ct.text } }
                    }
                }
            });
        }

        function expandChart(chartKey, title, subtitle) {
            const modal = document.getElementById('chartModal');
            const titleEl = document.getElementById('chartModalTitle');
            const subtitleEl = document.getElementById('chartModalSubtitle');
            const canvas = document.getElementById('expandedChart');
            const playersGrid = document.getElementById('chartPlayersGrid');
            
            if (!modal || !canvas) return;
            
            titleEl.textContent = title;
            subtitleEl.textContent = subtitle;
            
            // Destroy previous instance if exists
            if (expandedChartInstance) {
                expandedChartInstance.destroy();
                expandedChartInstance = null;
            }
            
            // Get the original chart instance
            const originalChart = chartInstances[chartKey];
            if (!originalChart) return;
            
            // Clone the chart configuration
            const config = {
                type: originalChart.config.type,
                data: JSON.parse(JSON.stringify(originalChart.config.data)),
                options: {
                    ...JSON.parse(JSON.stringify(originalChart.config.options)),
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(13, 17, 23, 0.95)',
                            titleColor: '#4ade80',
                            bodyColor: 'rgba(255,255,255,0.87)',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            padding: 16,
                            displayColors: true,
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            callbacks: {
                                title: ctx => {
                                    const raw = ctx[0]?.raw;
                                    if (raw?.name) return `${raw.name} (${raw.team})`;
                                    return '';
                                },
                                label: ctx => {
                                    const p = ctx.raw;
                                    if (!p || !p.name) return '';
                                    return [
                                        `Position: ${p.pos}`,
                                        `Price: £${p.price?.toFixed(1)}m`,
                                        `Pts/G: ${p.ptsPerGame?.toFixed(1)}`,
                                        `xGI/G: ${p.xgiPerGame?.toFixed(2)}`,
                                        `Ownership: ${p.ownership?.toFixed(1)}%`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            ticks: { color: 'rgba(255,255,255,0.7)', font: { size: 12 } },
                            title: originalChart.config.options?.scales?.x?.title || { display: false }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            ticks: { color: 'rgba(255,255,255,0.7)', font: { size: 12 } },
                            title: originalChart.config.options?.scales?.y?.title || { display: false }
                        }
                    }
                }
            };
            
            // Make points larger in expanded view
            if (config.data.datasets) {
                config.data.datasets.forEach(ds => {
                    if (ds.pointRadius) ds.pointRadius = 8;
                    if (ds.pointHoverRadius) ds.pointHoverRadius = 12;
                });
            }
            
            // Show modal first so canvas has dimensions
            modal.classList.add('show');

            expandedChartKey = chartKey;
            const srcScales = originalChart.config.options?.scales || {};
            fillMetricSelect(document.getElementById('expandX'),
                guessMetricFromTitle(srcScales.x?.title?.text) || 'price');
            fillMetricSelect(document.getElementById('expandY'),
                guessMetricFromTitle(srcScales.y?.title?.text) || 'ptsPerGame');

            // Built from the metric pickers rather than cloned, so changing an
            // axis rebuilds from the same code path that drew it the first time.
            setTimeout(() => {
                rebuildExpandedChart();
                populateChartPlayers(chartKey, playersGrid);
            }, 50);
        }

                },

                    statValue: p => p.savesPerGame?.toFixed(1) || '-',
                    statLabel: 'Sav/G',
                    reason: p => `${p.savesPerGame?.toFixed(1)} saves/g — busy keeper behind a porous defense = save point gold`
                },
                reliability: {
                    title: 'Most Reliable Assets',
                    subtitle: 'Consistent returns + explosive ceiling',
                    sort: (a, b) => (b.reliabilityPct + b.explosivenessPct) - (a.reliabilityPct + a.explosivenessPct),
                    statValue: p => (p.reliabilityPct + p.explosivenessPct).toFixed(0),
                    statLabel: 'Score',
                    reason: p => `${p.reliabilityPct.toFixed(0)}% reliability + ${p.explosivenessPct.toFixed(0)}% explosiveness — ${p.reliabilityPct > 60 ? 'set and forget' : 'high ceiling play'}`
                },
                valueVsOwnership: {
                    title: 'Hidden Gems',
                    subtitle: 'Great value at low ownership',
                    filter: p => p.ownership < 15,
                    sort: (a, b) => b.valueScore - a.valueScore,
                    statValue: p => p.valueScore.toFixed(2),
                    statLabel: 'Val',
                    reason: p => `${p.valueScore.toFixed(2)} value score at only ${p.ownership.toFixed(1)}% owned — under the radar`
                }
            };

            const config = chartConfig[chartKey] || {
                title: 'Top Performers',
                subtitle: 'Best recent points output',
                sort: (a, b) => b.ptsPerGame - a.ptsPerGame,
                statValue: p => p.ptsPerGame.toFixed(1),
                statLabel: 'Pts/G',
                reason: p => `Averaging ${p.ptsPerGame.toFixed(1)} points per game in the last 5`
            };

            // Update panel header
            const titleEl = document.getElementById('chartPlayersTitle');
            const subtitleEl = document.getElementById('chartPlayersSubtitle');
            if (titleEl) titleEl.textContent = config.title;
            if (subtitleEl) subtitleEl.textContent = config.subtitle;

            let filtered = config.filter ? players.filter(config.filter) : [...players];
            filtered.sort(config.sort);
            const top = filtered.slice(0, 10);

            const posColors = { GK: '#fbbf24', DEF: '#34d399', MID: '#60a5fa', FWD: '#f87171' };

            container.innerHTML = top.map((p, i) => {
                const sv = config.statValue(p);
                const reason = config.reason(p);
                return `
                    <div class="chart-player-card">
                        <div class="chart-player-rank">${i + 1}</div>
                        <div class="chart-player-info">
                            <div class="chart-player-name-row">
                                <span class="chart-player-name">${escHTML(p.name)}</span>
                                <span class="chart-player-pos-badge" style="background: ${posColors[p.pos]}20; color: ${posColors[p.pos]}">${p.pos}</span>
                            </div>
                            <div class="chart-player-meta">${escHTML(p.team)} · £${p.price.toFixed(1)}m · ${p.ownership.toFixed(1)}% owned</div>
                            <div class="chart-player-reason">${reason}</div>
                        </div>
                        <div class="chart-player-stat-badge">
                            <div class="chart-player-stat-value">${sv}</div>

                    </div>

        }
        
        function closeChartModal() {
            const modal = document.getElementById('chartModal');
            modal?.classList.remove('show');
            
            // Destroy chart instance when closing
            if (expandedChartInstance) {
                expandedChartInstance.destroy();
                expandedChartInstance = null;
            }
        }

        // ============================================
        // PLAYER DETAIL MODAL
        // ============================================
        let playerModalCharts = [];
        let currentPlayerData = null;
        let currentPlayerTab = 'season';
        
        // Generate sparkline HTML
        function generateSparkline(history, metric) {
            if (!history || history.length === 0) {
                return '<span style="color: var(--text-muted); font-size: 10px;">-</span>';
            }
            
            const last5 = history.slice(-5);
            const values = last5.map(h => h[metric] || 0);
            const max = Math.max(...values, 1);
            
            return values.map(v => {
                const height = Math.max(2, (v / max) * 20);
                const cls = v >= 6 ? 'high' : v >= 3 ? 'mid' : 'low';
                return `<div class="spark-bar ${cls}" style="height: ${height}px;"></div>`;
            }).join('');
        }
        
        // Find player by ID across all positions
        function findPlayerById(playerId, position) {
            // First check the specified position in tableData
            if (position && tableData[position]) {
                const player = tableData[position].find(p => p.id === playerId);
                if (player) return player;
            }
            // Search all positions in tableData
            for (const pos of ['GK', 'DEF', 'MID', 'FWD']) {
                if (tableData[pos]) {
                    const player = tableData[pos].find(p => p.id === playerId);
                    if (player) return player;
                }
            }
            // Fallback to allAnalyses (for rec/route card clicks before tables load)
            return allAnalyses.find(p => p.id === playerId) || null;
        }
        
        function openPlayerModal(playerId, position) {
            const player = findPlayerById(playerId, position);
            if (!player) return;
            
            currentPlayerData = player;
            currentPlayerTab = 'season';
            
            const modal = document.getElementById('playerModal');
            const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
            const pos = posMap[player.position] || position;
            
            // Update header info
            document.getElementById('playerModalAvatar').textContent = player.name.split(' ').map(n => n[0]).join('').slice(0, 2);
            document.getElementById('playerModalName').textContent = player.name;
            document.getElementById('playerModalTeam').textContent = player.team;
            document.getElementById('playerModalPrice').textContent = `£${player.price.toFixed(1)}m`;
            
            const posEl = document.getElementById('playerModalPos');
            posEl.textContent = pos;
            posEl.className = 'player-modal-pos';
            posEl.style.background = pos === 'GK' ? 'rgba(251, 191, 36, 0.2)' : 
                                     pos === 'DEF' ? 'rgba(52, 211, 153, 0.2)' : 
                                     pos === 'MID' ? 'rgba(96, 165, 250, 0.2)' : 'rgba(248, 113, 113, 0.2)';
            posEl.style.color = pos === 'GK' ? '#FCD34D' : 
                                pos === 'DEF' ? '#34D399' : 
                                pos === 'MID' ? '#60A5FA' : '#F87171';
            
            // Update stats boxes
            updatePlayerStats(player, pos);
            
            // Update fixtures
            updatePlayerFixtures(player);
            
            // Reset tab state
            document.querySelectorAll('.player-modal-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === 0);
            });
            
            modal.classList.add('show');
            
            // Create charts after modal is visible
            setTimeout(() => createPlayerTrendCharts(player, pos, 'season'), 100);
        }
        
        function updatePlayerStats(player, pos) {
            const l5 = player.l5 || {};
            const games = l5.games || 1;
            
            let stats = [];
            
            // Common stats
            stats.push({ value: player.totalPoints || 0, label: 'Total Pts' });
            stats.push({ value: (l5.points / games).toFixed(1), label: 'Pts/Game' });
            stats.push({ value: `${player.selectedBy?.toFixed(1) || 0}%`, label: 'Ownership' });
            
            // Position-specific stats
            if (pos === 'GK') {
                stats.push({ value: l5.saves || 0, label: 'Saves (L5)' });
                stats.push({ value: l5.cleanSheets || 0, label: 'CS (L5)' });
            } else if (pos === 'DEF') {
                stats.push({ value: l5.cleanSheets || 0, label: 'CS (L5)' });
                stats.push({ value: (l5.xGI / games).toFixed(2), label: 'xGI/G' });
            } else {
                stats.push({ value: `${l5.goals || 0}G ${l5.assists || 0}A`, label: 'G+A (L5)' });
                stats.push({ value: (l5.xGI / games).toFixed(2), label: 'xGI/G' });
            }
            
            document.getElementById('playerModalStats').innerHTML = stats.map(s => `
                <div class="player-stat-box">
                    <div class="player-stat-value">${s.value}</div>
                    <div class="player-stat-label">${s.label}</div>
                </div>
            `).join('');
        }
        
        function updatePlayerFixtures(player) {
            const fixtures = player.fixtures?.next5 || player.fdrNext || [];
            const container = document.getElementById('playerFixturesGrid');
            
            if (fixtures.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">No fixture data available</div>';
                return;
            }
            
            container.innerHTML = fixtures.slice(0, 6).map(f => {
                const opp = teams[f.opponent]?.short_name || f.opponent || '???';
                const fdr = f.difficulty || 3;
                const fdrClass = fdr <= 2 ? 'fdr-1' : fdr <= 2.5 ? 'fdr-2' : fdr <= 3.5 ? 'fdr-3' : fdr <= 4 ? 'fdr-4' : 'fdr-5';
                return `
                    <div class="player-fixture-item ${fdrClass}">
                        <div class="player-fixture-opp">${opp}</div>
                        <div class="player-fixture-venue">${f.isHome ? 'Home' : 'Away'}</div>
                    </div>
                `;
            }).join('');
        }
        
        function switchPlayerTab(tab) {
            currentPlayerTab = tab;
            
            document.querySelectorAll('.player-modal-tab').forEach(t => {
                t.classList.toggle('active', t.textContent.toLowerCase().includes(tab === 'season' ? 'season' : 'last'));
            });
            
            if (currentPlayerData) {
                const posMap = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
                const pos = posMap[currentPlayerData.position];
                createPlayerTrendCharts(currentPlayerData, pos, tab);
            }
        }
        
        function createPlayerTrendCharts(player, pos, mode) {
            // Destroy existing charts
            playerModalCharts.forEach(c => c.destroy());
            playerModalCharts = [];
            
            const container = document.getElementById('playerChartsGrid');
            const history = player.history || [];

            if (history.length === 0) {
                const ls = player.lastSeason;
                container.innerHTML = renderEmptyState(
                    'No gameweek data yet this season',
                    ls
                        ? `Trend charts need this season's per-gameweek data, not available until GW1. Last season (2025/26): ${ls.totalPoints || 0} pts, ${ls.goals || 0} goals, ${ls.assists || 0} assists.`
                        : 'Trend charts need this season’s per-gameweek data, which isn’t available until GW1.',
                    'bar-chart-3'
                );
                return;
            }

            let chartHistory = history;

            // Limit based on mode
            if (mode === 'last5') {
                chartHistory = chartHistory.slice(-5);
            }
            
            // Define metrics based on position
            let metrics = [];
            
            if (pos === 'GK') {
                metrics = [
                    { key: 'total_points', label: 'Points', color: '#4ade80' },
                    { key: 'minutes', label: 'Minutes', color: '#60a5fa' },
                    { key: 'saves', label: 'Saves', color: '#fbbf24' },
                    { key: 'clean_sheets', label: 'Clean Sheets', color: '#34d399' }
                ];
            } else if (pos === 'DEF') {
                metrics = [
                    { key: 'total_points', label: 'Points', color: '#4ade80' },
                    { key: 'minutes', label: 'Minutes', color: '#60a5fa' },
                    { key: 'clean_sheets', label: 'Clean Sheets', color: '#34d399' },
                    { key: 'expected_goal_involvements', label: 'xGI', color: '#a855f7' }
                ];
            } else if (pos === 'MID') {
                metrics = [
                    { key: 'total_points', label: 'Points', color: '#4ade80' },
                    { key: 'minutes', label: 'Minutes', color: '#60a5fa' },
                    { key: 'expected_goal_involvements', label: 'xGI', color: '#a855f7' },
                    { key: 'goals_scored', label: 'Goals + Assists', color: '#f59e0b', combine: 'assists' }
                ];
            } else { // FWD
                metrics = [
                    { key: 'total_points', label: 'Points', color: '#4ade80' },
                    { key: 'minutes', label: 'Minutes', color: '#60a5fa' },
                    { key: 'expected_goals', label: 'xG', color: '#f87171' },
                    { key: 'goals_scored', label: 'Goals', color: '#fbbf24' }
                ];
            }
            
            // Create chart cards
            container.innerHTML = metrics.map((m, i) => `
                <div class="player-chart-card">
                    <div class="player-chart-title">${m.label}</div>
                    <div class="player-chart-container">
                        <canvas id="playerChart${i}"></canvas>
                    </div>
                </div>
            `).join('');
            
            // Create charts
            metrics.forEach((m, i) => {
                const canvas = document.getElementById(`playerChart${i}`);
                if (!canvas) return;
                
                const labels = chartHistory.map((h, idx) => mode === 'last5' ? `GW${idx + 1}` : `GW${h.round || idx + 1}`);
                let data = chartHistory.map(h => {
                    let val = h[m.key] || 0;
                    if (m.combine) {
                        val += h[m.combine] || 0;
                    }
                    return val;
                });
                
                const chart = new Chart(canvas.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            data,
                            borderColor: m.color,
                            backgroundColor: m.color + '20',
                            fill: true,
                            tension: 0.3,
                            pointRadius: mode === 'last5' ? 6 : 3,
                            pointHoverRadius: 8,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(13, 17, 23, 0.95)',
                                titleColor: m.color,
                                bodyColor: '#fff',
                                padding: 10,
                                displayColors: false
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }
                            },
                            y: {
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } },
                                beginAtZero: true
                            }
                        }
                    }
                });
                
                playerModalCharts.push(chart);
            });
        }
